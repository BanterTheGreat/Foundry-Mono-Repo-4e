<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#ddd);font:14px system-ui}h2{font-size:21px;margin:0 0 6px}p{color:var(--muted-foreground,#aaa);line-height:1.5;margin:6px 0 16px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}select,button{font:inherit;background:var(--secondary,#272c32);color:inherit;border:1px solid var(--border,#555);padding:7px 10px;border-radius:7px}canvas{width:100%;display:block;border-radius:10px;cursor:crosshair}.stage{position:relative}.hint{position:absolute;bottom:12px;left:12px;background:#111c;color:#eee;padding:7px 10px;border-radius:6px;font-size:12px;pointer-events:none}.switch{position:sticky;bottom:12px;width:max-content;max-width:100%;margin:18px auto 10px;display:flex;gap:10px;align-items:center;padding:7px;background:#171e28;color:white;border:1px solid #586171;border-radius:30px;box-shadow:0 5px 22px #0006}.switch button{border-radius:50%;background:#303c4c}.note{min-height:65px;margin-top:14px}.state{font:12px monospace;color:var(--muted-foreground,#aaa);margin-bottom:12px}label{display:flex;align-items:center;gap:6px}
</style></head><body>
<h2>Make range readable without covering the battlefield</h2>
<p>Three throwaway treatments. Move over the map to inspect a target square. All boundaries preserve square-grid range.</p>
<div class="controls"><label>Ability <select id="mode"><option value="weapon">Weapon · 4 / 8 squares</option><option value="power">Power · 4 squares</option></select></label><label>Map <select id="map"><option value="busy">Busy floor</option><option value="plain">Plain grid</option></select></label></div>
<div class="stage"><canvas id="c" width="1000" height="660"></canvas><div class="hint">Hover to inspect range · actor at centre</div></div>
<div class="note"><strong id="title"></strong><p id="desc"></p></div><div id="state" class="state"></div>
<div class="switch"><button id="prev" aria-label="Previous variation">←</button><span id="variant"></span><button id="next" aria-label="Next variation">→</button></div>
<script>
const names=['A · Cartographic','B · Range bands','C · Target first'];
const descriptions=[
['Crisp edges + attached labels','A dark under-stroke keeps the line visible over artwork. Solid gold marks normal range; dashed blue marks long range. Small edge labels identify both, even when the actor is far away. Best conservative upgrade.'],
['Soft zones + explicit penalty','A very light gold wash distinguishes normal range. The long-range band uses cool tint and sparse hatching, with a persistent −2 label. Strongest at explaining the two zones; adds more visual weight.'],
['Corners + cursor readout','Open corners replace the full perimeter, leaving the map quieter. A line to the hovered square and a compact range readout carry the detail. Best when targeting is the focus; less useful for scanning the entire boundary.']];
let v=Math.max(0,['A','B','C'].indexOf(new URLSearchParams(location.search).get('variant')||'A')),hover={x:5,y:-2};
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),s=34,cx=500,cy=330;
const mode=document.querySelector('#mode'),map=document.querySelector('#map');
function rect(r){return [cx-(r+.5)*s,cy-(r+.5)*s,(2*r+1)*s,(2*r+1)*s]}
function box(r,color,dash=[]){let a=rect(r);ctx.setLineDash(dash);ctx.strokeStyle='#15191bd9';ctx.lineWidth=5;ctx.strokeRect(...a);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.strokeRect(...a);ctx.setLineDash([])}
function tag(x,y,t,color){ctx.font='bold 14px system-ui';let w=ctx.measureText(t).width+20;ctx.fillStyle='#151d26';ctx.fillRect(x,y,w,28);ctx.fillStyle=color;ctx.fillText(t,x+10,y+19)}
function corners(r,color){let [x,y,w,h]=rect(r),l=25;ctx.strokeStyle='#14191c';ctx.lineWidth=6;for(let pass=0;pass<2;pass++){if(pass){ctx.strokeStyle=color;ctx.lineWidth=2}for(let [px,py,dx,dy] of [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]]){ctx.beginPath();ctx.moveTo(px+dx*l,py);ctx.lineTo(px,py);ctx.lineTo(px,py+dy*l);ctx.stroke()}}}
function draw(){
let ranged=mode.value==='weapon',busy=map.value==='busy';
ctx.clearRect(0,0,1000,660);ctx.fillStyle=busy?'#675744':'#343b40';ctx.fillRect(0,0,1000,660);
if(busy){ctx.save();ctx.strokeStyle='#392f2580';ctx.lineWidth=2;for(let i=-700;i<1200;i+=26){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+660,660);ctx.stroke()}ctx.fillStyle='#45292b';ctx.fillRect(70,150,180,240);ctx.strokeStyle='#997152';ctx.lineWidth=9;ctx.strokeRect(70,150,180,240);ctx.fillStyle='#392e25';ctx.fillRect(790,0,15,660);ctx.fillStyle='#8c724c';ctx.beginPath();ctx.ellipse(930,480,110,145,0,0,7);ctx.fill();ctx.restore()}
ctx.strokeStyle=busy?'#211c1933':'#ffffff14';ctx.lineWidth=1;for(let x=cx-s/2;x<1000;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,660);ctx.stroke()}for(let x=cx-s/2;x>0;x-=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,660);ctx.stroke()}for(let y=cy-s/2;y<660;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1000,y);ctx.stroke()}for(let y=cy-s/2;y>0;y-=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1000,y);ctx.stroke()}
const gold='#f5d787',blue='#9fc5e4';
if(v===0){if(ranged){box(8,blue,[8,6]);tag(rect(8)[0],rect(8)[1]-28,'LONG 8 · −2',blue)}box(4,gold);tag(rect(4)[0],rect(4)[1]-28,'NORMAL 4',gold)}
if(v===1){if(ranged){ctx.fillStyle='#8abbe422';ctx.fillRect(...rect(8));ctx.fillStyle=busy?'#675744':'#343b40';ctx.fillRect(...rect(4));ctx.save();ctx.beginPath();ctx.rect(...rect(8));ctx.rect(...rect(4));ctx.clip('evenodd');ctx.strokeStyle='#c5ddf329';for(let x=-660;x<1000;x+=22){ctx.beginPath();ctx.moveTo(x,660);ctx.lineTo(x+660,0);ctx.stroke()}ctx.restore();box(8,blue,[4,5]);tag(rect(8)[0]+12,rect(8)[1]+12,'LONG RANGE · −2',blue)}ctx.fillStyle='#f7d78018';ctx.fillRect(...rect(4));box(4,gold);tag(rect(4)[0]+12,rect(4)[1]+12,'NORMAL · 4 squares',gold)}
if(v===2){if(ranged)corners(8,blue);corners(4,gold)}
// illustrative tokens
for(let [x,y,fill,letter] of [[0,0,'#d3bc85','◆'],[3,2,'#803e48','E'],[-3,-1,'#3b586c','A']]){ctx.fillStyle='#101820';ctx.fillRect(cx+x*s-15,cy+y*s-15,30,30);ctx.fillStyle=fill;ctx.fillRect(cx+x*s-13,cy+y*s-13,26,26);ctx.fillStyle='#fff';ctx.font='bold 19px system-ui';ctx.textAlign='center';ctx.fillText(letter,cx+x*s,cy+y*s+7);ctx.textAlign='left'}
let d=Math.max(Math.abs(hover.x),Math.abs(hover.y)),status=d<=4?'NORMAL':ranged&&d<=8?'LONG · −2':'OUT OF RANGE',color=d<=4?gold:ranged&&d<=8?blue:'#f0a2a2';
let hx=cx+hover.x*s,hy=cy+hover.y*s;ctx.strokeStyle=color;ctx.lineWidth=2;ctx.strokeRect(hx-s/2+2,hy-s/2+2,s-4,s-4);
if(v===2){ctx.strokeStyle=color;ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(hx,hy);ctx.stroke();ctx.setLineDash([])}
tag(Math.min(760,Math.max(5,hx+24)),Math.min(615,Math.max(45,hy-35)),d+' sq · '+status,color);
document.querySelector('#state').textContent='State: '+(ranged?'weapon 4/8':'power 4')+' · target '+d+' squares · '+status+' · illustrative geometry';
}
function update(){document.querySelector('#variant').textContent=names[v];document.querySelector('#title').textContent=descriptions[v][0];document.querySelector('#desc').textContent=descriptions[v][1];try{let u=new URL(location.href);u.searchParams.set('variant',['A','B','C'][v]);history.replaceState({},'',u)}catch{}draw()}
function cycle(d){v=(v+d+3)%3;update()}
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}});
mode.onchange=draw;map.onchange=draw;c.onpointermove=e=>{let b=c.getBoundingClientRect();hover={x:Math.round(((e.clientX-b.left)*1000/b.width-cx)/s),y:Math.round(((e.clientY-b.top)*660/b.height-cy)/s)};draw()};update();
</script></body></html>

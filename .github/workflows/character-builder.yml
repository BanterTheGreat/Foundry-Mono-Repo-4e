name: Character Builder
on:
  push:
    paths: ["src/modern4e/content/creation/**", "src/modern4e/helpers/creation_content.typ", "src/modern4e/glossary/creation_&_advancement.typ", "src/modern4e/glossary/techniques.typ", "src/modern4e/scripts/*creation*.py", "src/modern4e/scripts/fixtures/creation-source-golden.json", "src/character-builder/**", "src/modern4e/content/feat*", "src/modern4e/content/classes/**", "src/modern4e/content/equipment/**", "src/modern4e/glossary/equipment.typ", "src/modern4e/helpers/equipment.typ", "src/modern4e/scripts/equipment_content.py", "src/modern4e/classes/fighter.typ", "src/modern4e/helpers/class*.typ", "src/modern4e/scripts/class_content.py", "src/modern4e/content/feats/**", "src/modern4e/scripts/feats.py", "src/modern4e/scripts/entry_selection.py", "src/modern4e/helpers/feat_requirements.typ", "src/modern4e/helpers/feat_selection.typ", "src/modern4e/helpers/theme.typ", "src/modern4e/content/ancestries/**", "src/modern4e/content/themes/**", "src/modern4e/content/utilities/**", "src/modern4e/content/class-utilities/**", "src/modern4e/content/*utilities*.json", "src/modern4e/scripts/ancestry_content.py", "src/modern4e/scripts/theme_content.py", "src/modern4e/scripts/utility_content.py", "src/modern4e/scripts/power_content.py", ".github/workflows/character-builder.yml"]
  pull_request:
    paths: ["src/modern4e/content/creation/**", "src/modern4e/helpers/creation_content.typ", "src/modern4e/glossary/creation_&_advancement.typ", "src/modern4e/glossary/techniques.typ", "src/modern4e/scripts/*creation*.py", "src/modern4e/scripts/fixtures/creation-source-golden.json", "src/character-builder/**", "src/modern4e/content/feat*", "src/modern4e/content/classes/**", "src/modern4e/content/equipment/**", "src/modern4e/glossary/equipment.typ", "src/modern4e/helpers/equipment.typ", "src/modern4e/scripts/equipment_content.py", "src/modern4e/classes/fighter.typ", "src/modern4e/helpers/class*.typ", "src/modern4e/scripts/class_content.py", "src/modern4e/content/feats/**", "src/modern4e/scripts/feats.py", "src/modern4e/scripts/entry_selection.py", "src/modern4e/helpers/feat_requirements.typ", "src/modern4e/helpers/feat_selection.typ", "src/modern4e/helpers/theme.typ", "src/modern4e/content/ancestries/**", "src/modern4e/content/themes/**", "src/modern4e/content/utilities/**", "src/modern4e/content/class-utilities/**", "src/modern4e/content/*utilities*.json", "src/modern4e/scripts/ancestry_content.py", "src/modern4e/scripts/theme_content.py", "src/modern4e/scripts/utility_content.py", "src/modern4e/scripts/power_content.py", ".github/workflows/character-builder.yml"]
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s src/character-builder/content -p 'test_*.py' -v
      - run: python src/character-builder/content/build.py --check
      - run: python src/character-builder/content/build.py --config src/character-builder/content/proof.json --check
      - run: python src/character-builder/content/samples.py --check
      - run: python src/character-builder/content/build.py --modern-feats
      - run: python src/character-builder/content/build.py --modern-feats --check
      - run: python -m unittest discover -s src/modern4e/scripts -p test_creation_content.py -v
      - run: python src/modern4e/scripts/creation_content.py
      - run: python src/modern4e/scripts/class_content.py
      - run: python src/character-builder/content/build.py --modern-equipment
      - run: python src/character-builder/content/build.py --modern-equipment --check
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/character-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: src/character-builder/web/package-lock.json
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew :shared:jvmTest :shared:jsNodeTest :shared:jsBrowserProductionLibraryDistribution :android:assembleDebug :android:assembleDebugAndroidTest --console=plain
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: npm exec --prefix web -- playwright install --with-deps chromium
      - run: npm run test:browser --prefix web
      - uses: actions/upload-artifact@v4
        with:
          name: character-builder-debug
          path: src/character-builder/android/build/outputs/apk/debug/*.apk
  android-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: src/character-builder
          script: bash ./gradlew :android:connectedDebugAndroidTest --console=plain

<!doctype html>
<!-- Throwaway prototype: three badge-only treatments in the existing chat card, switchable with ?variant=A|B|C. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat badge styles — prototype</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--foreground,#e8e6e0);padding-bottom:12px}
.controls{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}button{font:12px Arial;cursor:pointer;border:1px solid var(--border,#53565c);border-radius:6px;padding:8px 10px;background:var(--secondary,#292c31);color:var(--foreground,#e8e6e0)}button[aria-pressed=true]{border-color:#b8aa8a;background:#4e4637;color:#fff0cf}.intro,.state{font-size:12px;line-height:1.55;color:var(--muted-foreground,#a8a8a8);margin:0 0 14px}.state{margin-top:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(298px,1fr));gap:24px 20px;align-items:start}.variant{min-width:0}.variant h3{font-size:14px;margin:0 0 7px;font-weight:600}.variant p{font-size:12px;line-height:1.5;color:var(--muted-foreground,#aaa);margin:8px 0 0;max-width:320px}
.chat{background:#242122;border:1px solid #817767;border-radius:5px;padding:7px;width:298px;max-width:100%;color:#d9d5c8;box-shadow:0 3px 10px #0002}.meta{font-size:10px;display:flex;justify-content:space-between;color:#cfbea0;font-weight:bold;margin-bottom:4px}.power{font-size:10px;line-height:11px;font-weight:bold;padding:3px;background:#512333;margin-bottom:6px}.target{font-size:12px;font-weight:bold}.outcome{font-size:12px;color:#b45221;font-weight:bold;margin-bottom:2px}.hit .outcome{color:#93d791}.dice{background:#353228;border-radius:2px;text-align:center}.formula{font-size:13px;font-weight:bold;padding:5px 0 4px;white-space:nowrap}.total{font-size:22px;font-weight:bold;border-top:1px dashed #918b7b;line-height:26px}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.badge{--ink:#dfcca6;--edge:#8c7959;--fill:#39332b;color:#e6dfcf;display:inline-flex;align-items:center;font-size:9.5px;line-height:1.2;cursor:help;font-family:Arial,sans-serif;max-width:100%;letter-spacing:0}
.badge.buff{--ink:#a9dcd1;--edge:#598c80;--fill:#283c37}.badge.penalty{--ink:#edb6a2;--edge:#a47765;--fill:#41312b}.badge strong{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}.badge:focus-visible{outline:2px solid white;outline-offset:3px}
.A .badge{padding:0;border:1px solid var(--edge);border-left:3px solid var(--edge);border-radius:4px;background:var(--fill);gap:0;box-shadow:inset 0 1px #ffffff09}.A .name{padding:5px 6px}.A strong{padding:5px 6px;border-left:1px solid var(--edge);background:#0002;font-size:11px}.A .symbol{display:none}
.B .badge{padding:4px 7px 4px 4px;border:1px solid var(--edge);border-radius:16px;background:linear-gradient(#ffffff05,#0002),var(--fill);gap:5px}.B .symbol{order:-1;display:grid;place-items:center;color:var(--ink);background:#0003;border:1px solid var(--edge);width:17px;height:17px;flex:0 0 17px;border-radius:50%;font-size:11px}.B .name{max-width:104px}.B strong{font-size:12px;padding-left:1px}
.C .badges{display:grid;grid-template-columns:1fr 1fr;gap:5px}.C .badge{display:grid;grid-template-columns:1fr auto;gap:4px;padding:6px 7px;border-radius:4px;border:1px solid var(--edge);border-top:2px solid var(--edge);background:var(--fill);text-align:left}.C .name{grid-column:1/-1;font-size:9.5px;white-space:nowrap}.C .symbol{color:var(--ink);font-size:8px;letter-spacing:1px;text-transform:uppercase}.C strong{font-size:15px;line-height:16px}
.badge.decisive{--ink:#d2ffc1;--edge:#a0da77;--fill:#30492a;box-shadow:0 0 8px #8ee25455,inset 0 0 8px #8ee25412!important;color:#e2ffd8}.badge.costly{--ink:#ffe2d9;--edge:#ee9282;--fill:#552d2b;box-shadow:0 0 8px #f56c6255,inset 0 0 8px #f56c6212!important;color:#ffe4dd}.verdict{font-size:9px;margin:6px 0 0;color:#b6aa94;min-height:12px}.details{font-size:12px;line-height:1.5;min-height:36px;margin:18px 0 10px;color:var(--muted-foreground,#aaa)}.switcher{position:sticky;bottom:12px;display:flex;align-items:center;gap:12px;padding:6px;background:#1c2027;color:#efeeea;border:1px solid #727c8c;border-radius:24px;width:max-content;max-width:100%;margin:16px auto 0;box-shadow:0 4px 15px #0006;z-index:3}.switcher button{border-radius:50%;border:0;background:#343a45;color:white;width:30px;height:30px;padding:0}.switcher span{font-size:12px;min-width:170px;text-align:center}.hide{display:none}.single .variant{display:flex;flex-direction:column;align-items:center}.single .variant p{max-width:298px;width:100%}.single .variant h3{width:298px}.mode{font-size:11px;color:var(--muted-foreground,#aaa);margin:8px 0 0}
@media(max-width:340px){.grid{grid-template-columns:1fr}.chat{width:100%}.single .variant h3{width:100%}}
</style></head><body>
<p class="intro">Same chat card. Three badge treatments with stronger contrast and clearer numbers. Only a decisive modifier gets a glow.</p>
<div class="controls" aria-label="Example outcome"><button data-state="original">Your screenshot</button><button data-state="hit">Buff saves the hit</button><button data-state="miss">Penalty causes the miss</button></div>
<div class="controls" aria-label="Badge design"><button data-variant="all">Compare all</button><button data-variant="A">A · Split chips</button><button data-variant="B">B · Icon pills</button><button data-variant="C">C · Mini tiles</button></div>
<p id="state" class="state"></p><main class="grid" id="grid"></main>
<p class="details" id="details" aria-live="polite">Hover, focus, or tap a badge for its explanation.</p>
<p class="mode">Throwaway visual prototype · No Foundry changes · All previews use the same four modifiers.</p>
<nav class="switcher" aria-label="Cycle prototype variants"><button id="previous" aria-label="Previous variant">←</button><span id="variant-label"></span><button id="next" aria-label="Next variant">→</button></nav>
<script>
const variants={A:['Split chips','Closest to your current badges. A coloured edge identifies the modifier; a separate number segment makes its value stand out.'],B:['Icon pills','Round badges with a small source icon and a larger, bright number. More character, while keeping the compact badge shape.'],C:['Mini tiles','Two compact rows of tiles. The name gets its own line; source type and a larger number sit beneath it.']};
const bonuses=[{name:'Weapon enhancement',value:2,type:'item',symbol:'◇'},{name:'Hellsworn Blessing',value:2,type:'buff',symbol:'✧'},{name:'vs Superior Cover',value:-5,type:'penalty',symbol:'▥'},{name:'vs Total Concealment',value:-5,type:'penalty',symbol:'◐'}];
const params=new URLSearchParams(location.search);let variant=params.get('variant')||'all';if(!['all','A','B','C'].includes(variant))variant='all';let state='original';
function writeURL(){try{const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url)}catch{}}
function render(){
const total=state==='original'?12:state==='hit'?21:18;const hit=total>=20;
document.querySelector('#state').textContent=(state==='original'?'Screenshot state: 12 vs AC 20. Removing either −5 still leaves a miss, so neither glows.':state==='hit'?'Hit state: 21 vs AC 20. Without Hellsworn Blessing: 19 — miss.':'Miss state: 18 vs AC 20. Removing either −5 gives 23 — hit.');
document.querySelector('#grid').classList.toggle('single',variant!=='all');
document.querySelector('#grid').innerHTML=Object.entries(variants).filter(([key])=>variant==='all'||variant===key).map(([key,[title,description]])=>'<section class="variant '+key+'"><h3>'+key+' · '+title+'</h3><div class="chat '+(hit?'hit':'')+'"><div class="meta"><span>IDRANI FULLHORN</span><span>12S AGO ▱</span></div><div class="power">ATTACK ROLL: STEEL SERPENT STRIKE<br>THORNED SPEAR +2</div><div class="target">Target: Kell-Guild Blade (Str vs. AC)</div><div class="outcome">'+(hit?'✓ Probable Hit!':'⊗ Probable Miss!')+'</div><div class="dice"><div class="formula">1d20 + (0 + (2)) + 5 + 5 + 0 + -5 + -5 + 2 + 2</div><div class="total">'+total+'</div></div><div class="badges">'+bonuses.map(b=>{
const decisive=b.type==='buff'&&state==='hit';const costly=b.type==='penalty'&&state==='miss';const mark=decisive||costly?'✦ ':'';const tip=decisive?'Without Hellsworn Blessing, this attack would miss (19 vs AC 20).':costly?'Without '+b.name+', this attack would hit (23 vs AC 20).':b.type==='item'?'Thorned Spear +2: listed weapon enhancement +2.':b.type==='penalty'?b.name+' applies −5; removing it alone would '+(hit?'still leave a hit.':'still leave a miss.'):'Hellsworn Blessing adds +2 to this attack.';
return '<button type="button" class="badge '+b.type+' '+(decisive?'decisive':costly?'costly':'')+'" title="'+tip+'" data-detail="'+tip+'"><span class="name">'+mark+b.name+'</span><span class="symbol" aria-hidden="true">'+(key==='C'?(decisive?'made hit':costly?'caused miss':b.type):b.symbol)+'</span><strong>'+(b.value>0?'+':'−')+Math.abs(b.value)+'</strong></button>';
}).join('')+'</div><div class="verdict">'+(hit?'✦ Green: this bonus made the hit.':state==='miss'?'✦ Red: either penalty was enough to cause the miss.':'No single modifier changed the outcome.')+'</div></div><p>'+description+'</p></section>').join('');
document.querySelector('#variant-label').textContent=variant==='all'?'All three designs':variant+' · '+variants[variant][0];
document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===variant)));document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)));
document.querySelectorAll('[data-detail]').forEach(b=>{const show=()=>document.querySelector('#details').textContent=b.dataset.detail;b.onclick=show;b.onfocus=show;b.onmouseenter=show;});
}
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;writeURL();render()});
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;document.querySelector('#details').textContent='Hover, focus, or tap a badge for its explanation.';render()});
function cycle(delta){const keys=['A','B','C'];const current=keys.indexOf(variant);variant=keys[current===-1?(delta>0?0:2):(current+delta+3)%3];writeURL();render()}
document.querySelector('#previous').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});render();
</script></body></html>

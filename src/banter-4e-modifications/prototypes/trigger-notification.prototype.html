10px 35px #000a;border-radius:8px;padding:15px}.prompt strong{font:600 19px Georgia,serif}.eyebrow{font-size:10px;letter-spacing:1.4px;color:#e5cc8e;margin-bottom:8px}.detail{font-size:12px;line-height:1.5;color:#cfc6b2;margin:9px 0 13px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button,.expand{border:1px solid #74613b;border-radius:4px;background:#0d0c09;color:#e5cc8e;padding:9px 11px}.actions .primary{background:#d6bb7e;color:#19160f;border-color:#e5cc8e;font-weight:bold}.timer{height:3px;background:#493c26;margin:13px -1px 7px}.fill{height:3px;background:#e5cc8e;width:100%;transition:width .2s}.remaining{font-size:10px;color:#bfb49b;display:flex;justify-content:space-between}.A{left:25px;right:190px;bottom:64px}.B{right:178px;top:65px;width:245px;bottom:67px}.B .actions{display:grid;margin-top:26px}.B .detail{margin-top:20px}.B .timer{margin-top:26px}.C{left:18px;right:183px;bottom:65px;padding:11px}.C.compact{display:flex;align-items:center;gap:10px}.C.compact strong{font-size:15px}.C.compact .eyebrow{margin:0 0 4px;font-size:9px}.C.compact .expand{margin-left:auto;white-space:nowrap}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}.controls button,.switcher button{padding:8px 11px;background:var(--secondary,#292929);color:var(--foreground);border:1px solid var(--border,#555);border-radius:6px}.switcher{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px auto 0;padding:7px;border:1px solid var(--border,#555);background:var(--card,#222);border-radius:30px;width:fit-content;box-shadow:0 4px 18px #0003}.state{font-size:12px;color:var(--muted-foreground,#999);margin-top:10px;line-height:1.5}.status{position:absolute;bottom:80px;left:25px;right:190px;background:#191914;border:1px solid #756641;padding:17px;border-radius:7px}.note{font-size:12px;color:var(--muted-foreground,#999);margin-bottom:10px}@media(max-width:500px){.sidebar{width:110px;padding:8px}.map{right:110px}.A,.C,.status{right:120px;left:10px}.B{right:120px;width:210px}.hero{left:65px}.enemy{left:150px}.name{left:65px}.trail{left:115px}.prompt{padding:11px}.prompt strong{font-size:16px}.actions button{padding:8px}.scene{height:540px}}
.C.compact{display:block;padding:9px 11px 12px;overflow:visible}.drain-track{position:absolute;bottom:0;left:0;right:0;height:3px;overflow:hidden;border-radius:0 0 7px 7px;background:#493c26}.drain-bar{height:100%;background:#e5cc8e;transform-origin:left;animation:drain 10s linear forwards;box-shadow:0 0 6px #e5cc8e88}@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}.compact-line{display:flex;align-items:center;gap:10px}.compact-copy{flex:1;min-width:0}.C.compact .cause{font:600 13px/1.35 Georgia,serif;margin:3px 0 0}.C.compact .reaction-row{flex-shrink:0;gap:5px}.C.compact .reaction-row button{padding:7px 9px;font-size:11px}.C.compact .reaction-row .expand{margin-left:0}.C.compact .eyebrow{font-size:8px;letter-spacing:.8px}@media(max-width:500px){.compact-line{flex-wrap:wrap;gap:7px}.C.compact .reaction-row{width:100%}}.cause{font:600 16px/1.4 Georgia,serif;margin:6px 0 10px}.reaction-row{display:flex;align-items:center;gap:8px}.power-preview{position:absolute;bottom:calc(100% + 12px);left:0;width:min(350px,100%);background:#151410;border:1px solid #ac915a;border-radius:7px;padding:16px;box-shadow:0 8px 30px #000b;opacity:0;visibility:hidden;transform:translateY(5px);transition:opacity .15s,transform .15s;pointer-events:none}.C.compact:hover .power-preview,.C.compact:focus-within .power-preview,.C.show-preview .power-preview{opacity:1;visibility:visible;transform:translateY(0)}.power-preview h3{font:600 20px Georgia,serif;margin:0 0 8px}.power-preview p{font-size:12px;line-height:1.5;margin:9px 0}.power-meta{color:#e5cc8e;font-size:11px;border-bottom:1px solid #493c26;padding-bottom:10px}.power-hint{font-size:10px;color:#beb39b}.C button:focus-visible{outline:2px solid #e9dfce;outline-offset:3px}
</style></head><body>
<div class="note">Throwaway prototype · C revised: visible cause, power details on hover or focus</div>
<div class="scene"><div class="map"><div class="wall"></div><div class="wall two"></div><div class="encounter">OLD QUARRY · ROUND 3</div><div class="token hero">♜</div><div class="name">Your character</div><div class="trail">↗ · ·</div><div class="token enemy">♟</div><div class="hotbar"><div class="slot">1</div><div class="slot">2</div><div class="slot">3</div><div class="slot">4</div><div class="slot">5</div></div></div><div class="sidebar"><div class="tabs">▣ ⚔ ☷</div><div class="chat"><strong>Goblin skirmisher</strong>Scimitar<br><span class="roll">18</span> vs. AC<hr><strong>Your character</strong>Opportunity attack available<br><span style="color:#e5cc8e">Private trigger prompt</span></div></div><div id="surface"></div></div>
<div class="controls"><button onclick="reset()">Replay trigger</button><button id="pause" onclick="toggleCountdown(this)">Run countdown</button><button onclick="remaining=0;status='expired';render()">Simulate expiry</button></div>
<div class="switcher"><button aria-label="Previous variant" onclick="switchVariant(-1)">←</button><span id="variantLabel"></span><button aria-label="Next variant" onclick="switchVariant(1)">→</button></div><div class="state" id="state"></div>
<script>
const variants=['A','B','C'],names={A:'Floating action card',B:'Reaction tray',C:'Expandable alert'};
let variant=new URLSearchParams(location.search).get('variant')||'C';if(!variants.includes(variant))variant='C';
let remaining=10,status='pending',paused=true,expanded=false;
function toggleCountdown(button){paused=!paused;button.textContent=paused?'Run countdown':'Pause countdown';const bar=document.querySelector('.drain-bar');if(bar)bar.style.animationPlayState=paused?'paused':'running'}
function reset(){remaining=10;status='pending';expanded=false;render()}
function choose(power){status='used';window.selectedPower=power;render()}
function switchVariant(n){variant=variants[(variants.indexOf(variant)+n+3)%3];try{const u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState({},'',u)}catch{}reset()}
function render(){document.getElementById('variantLabel').textContent=variant+' · '+names[variant];
const surface=document.getElementById('surface');
if(status!=='pending'){surface.innerHTML='<div class="status">'+(status==='used'?'✓ '+window.selectedPower+' selected<br><small>The real interface would open the power.</small>':status==='expired'?'Response window ended':'Prompt ignored')+'</div>'}
else if(variant==='C'&&!expanded){surface.innerHTML='<div class="prompt C compact" tabindex="0" aria-describedby="power-tooltip"><div class="compact-line"><div class="compact-copy"><div class="eyebrow">⚡ OPPORTUNITY ATTACK</div><div class="cause">Goblin skirmisher moved out of your reach.</div></div><div class="reaction-row"><button class="expand" style="margin-left:0" onclick="choose(\'Melee basic attack\')">⚔ Melee basic attack</button><button class="expand" onclick="status=\'ignored\';render()">Ignore</button></div></div><div class="drain-track" role="progressbar" aria-label="Time remaining to respond" aria-valuemin="0" aria-valuemax="10" aria-valuenow="'+remaining+'"><div class="drain-bar" style="animation-play-state:'+(paused?'paused':'running')+'"></div></div><div class="power-preview" id="power-tooltip" role="tooltip"><div class="eyebrow">AVAILABLE POWER · EXAMPLE</div><h3>Melee basic attack</h3><div class="power-meta">At-Will ♦ Weapon &nbsp; | &nbsp; Melee weapon</div><p><b>Target:</b> One creature<br><b>Attack:</b> Strength vs. AC</p><p><b>Hit:</b> 1[W] + Strength modifier damage.</p><p style="color:#bfb49b">Use this power as an opportunity attack against the goblin. Selecting it opens the power.</p></div></div>'}

else{surface.innerHTML='<div class="prompt '+variant+'"><div class="eyebrow">⚡ YOUR CHARACTER · REACTION AVAILABLE</div><strong>Opportunity attack</strong><p class="detail">The goblin moved out of your reach.<br>Choose a power to respond.</p><div class="actions"><button class="primary" onclick="choose(\'Melee basic attack\')">⚔ Melee basic attack</button><button onclick="choose(\'Other assigned power\')">Other assigned power</button><button onclick="status=\'ignored\';render()">Ignore</button></div><div class="timer"><div class="fill" style="width:'+remaining*10+'%"></div></div><div class="remaining"><span>'+remaining+' seconds remaining</span><span>Only you can see this</span></div></div>'}
document.getElementById('state').textContent='Variant '+variant+' · State: '+status+' · Time: '+remaining+'s · Countdown '+(paused?'paused for inspection':'running')+(variant==='C'?' · '+(expanded?'expanded':'collapsed'):'')}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowRight')switchVariant(1);if(e.key==='ArrowLeft')switchVariant(-1)});
setInterval(()=>{if(!paused&&status==='pending'){remaining=Math.max(0,remaining-1);if(!remaining){status='expired';render()}else if(variant==='C'&&!expanded){const progress=document.querySelector('.drain-track');if(progress)progress.setAttribute('aria-valuenow',remaining);document.getElementById('state').textContent='Variant C · State: pending · Time: '+remaining+'s · Countdown running'}else{render()}}},1000);render();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font:14px Arial,sans-serif}p{line-height:1.5}.intro{margin:0 0 14px;color:var(--muted-foreground)}.stage{background:#191a20;border-radius:12px;padding:20px;max-width:460px;margin:auto;color:#eee6d9}.top{display:flex;justify-content:space-between;color:#bdb7ad;font-size:12px;margin-bottom:20px}.speaker{font-size:12px;margin:16px 4px 6px;color:#d1c6b4}.speaker small{float:right;color:#888}.card{border:1px solid #719b7e;border-left:4px solid #9dd5b0;border-radius:5px;background:linear-gradient(115deg,#2e4035,#292a30 70%);overflow:hidden;margin-bottom:7px}.row{display:grid;grid-template-columns:78px 1fr 10px;gap:10px;align-items:center;padding:11px 10px;min-height:82px;cursor:pointer}.score{text-align:center;border-right:1px solid #ffffff35;padding-right:10px}.score strong{display:block;font-size:19px;color:#b7e9c7}.score small{display:block;font-size:11px;color:#bcb9b1;margin-top:6px}.subject{font-size:12px;font-weight:bold;color:#b7e9c7}.source{font-size:11px;color:#c4bbae;margin-top:4px}.chevron{color:#c4bbae}.footer{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-top:1px solid #ffffff20;gap:12px}.formula{font-size:11px;color:#c4bbae}button{cursor:pointer;font:12px Arial;border:1px solid #897b63;color:#eee6d9;background:#393730;border-radius:4px;padding:7px 12px}button:hover{background:#504936;border-color:#d5bd8e}button:focus-visible{outline:2px solid #e5cc8e;outline-offset:2px}.inline{margin-top:9px;padding:5px 10px}.wide{width:100%;background:#50432f;border-color:#ad9365}.damage{background:linear-gradient(110deg,#383632,#292a30);border-color:#8b8275;border-left-color:#e9dfce}.damage .score strong,.damage .subject{color:#e9dfce}.calc{font:11px/1.5 Arial;color:#c4bbae;padding:10px;border-top:1px solid #ffffff20}.note{font-size:12px;color:var(--muted-foreground);margin:14px auto;max-width:460px;min-height:36px}.switch{position:sticky;bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:fit-content;max-width:100%;margin:20px auto 8px;background:var(--card,#25252b);color:var(--foreground);border:1px solid var(--border,#555);border-radius:30px;padding:6px;box-shadow:0 4px 20px #0003}.switch button{border:0;background:transparent;color:inherit;font-size:18px;padding:6px 12px}.switch span{font-size:12px;min-width:170px;text-align:center}.state{font:11px var(--font-mono,monospace);color:var(--muted-foreground);margin:12px auto;max-width:460px}.reset{display:block;margin:auto;background:transparent;color:var(--muted-foreground);border-color:var(--border)}
.row.side{grid-template-columns:68px minmax(0,1fr) 66px 10px;gap:8px}.side-action{padding:8px 5px;text-align:center;background:#50432f;border-color:#ad9365;line-height:1.4}.side-action small{display:block;font-size:10px;color:#d4c6ae}.row.icon-row{grid-template-columns:68px minmax(0,1fr) 32px 10px;gap:8px}.icon-button{padding:6px;width:32px;height:32px;display:grid;place-items:center}.icon-button svg{width:18px;height:18px}.damage-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;background:#292a30;border:0;border-top:1px solid #ffffff20;border-radius:0;padding:9px 12px;color:#d9c5a0;text-align:left}.tray{padding:12px;background:#202126;border-top:1px solid #ffffff20}.tray p{margin:0 0 10px;font-size:11px;color:#c4bbae}.tray button{width:100%}.tiny-detail{display:block;border:0;background:transparent;color:#bcb9b1;font-size:10px;padding:5px 0 0;text-align:left}.calc[hidden]{display:none}.collapse-button{border:0;background:transparent;color:#c4bbae;padding:0;width:10px;min-width:10px;height:32px;font:21px Arial;display:grid;place-items:center;align-self:center}.collapse-button:hover{background:transparent;color:#fff}.collapse-button[aria-expanded="true"]{transform:rotate(90deg)}.tiny-detail{display:none}.group{border:1px solid #62534d;border-radius:6px;overflow:hidden;background:#25262c}.group .card{margin:0;border-radius:0;border-right:0;border-top:0;border-bottom:1px solid #ffffff18}.group-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:#303138;border-bottom:1px solid #62534d}.group-head strong{font-size:12px}.group-head small{display:block;font-size:10px;color:#c4bbae;margin-top:4px}.group .row{grid-template-columns:62px minmax(0,1fr) 10px;min-height:66px;gap:8px}.miss{background:linear-gradient(115deg,#412f34,#292a30 70%);border-left-color:#ed9b9b}.miss .score strong,.miss .subject{color:#ffb6b6}.target-status{font-size:10px;color:#c4bbae;margin-top:4px}.shared-note{font-size:10px;color:#c4bbae;padding:8px 12px;background:#202126}.done{font-size:11px;color:#e9dfce;border:1px solid #8b8275;padding:7px;border-radius:4px;white-space:nowrap}.mode{display:flex;justify-content:center;gap:6px;margin-bottom:12px}.mode button{background:var(--card);color:var(--foreground);border-color:var(--border)}.mode button[aria-pressed=true]{border-color:#ad9365}.row{cursor:default}.text-action{height:32px;white-space:nowrap;padding:6px 10px}.group-head>div{min-width:0}.group-head{gap:8px}.icon-button{flex-shrink:0}.choice{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0 0 12px}.choice button{background:var(--card);color:var(--foreground);border-color:var(--border)}.choice button[aria-pressed=true]{border-color:#ad9365}</style></head><body>
<p class="intro">E · Four button treatments in the shared attack header. All roll damage once for the group; target chevrons stay independent.</p><div class="choice"><button id="choice0" onclick="choose(0)">Broken heart</button><button id="choice1" onclick="choose(1)">Sword</button><button id="choice2" onclick="choose(2)">Damage</button><button id="choice3" onclick="choose(3)">Roll Damage</button></div><div class="mode"><button id="multi" onclick="setCount(3)">3 targets</button><button id="single" onclick="setCount(1)">1 target</button></div>
<div class="stage"><div class="top"><span>CHAT LOG</span><span>Illustrative data</span></div><div class="speaker">Aric <small>just now</small></div><div id="attack"></div><div id="result" aria-live="polite"></div></div><p class="note" id="note"></p><div class="state" id="state"></div><button class="reset" onclick="reset()">Reset demo</button><div class="switch"><button aria-label="Previous variant" onclick="cycle(-1)">←</button><span id="label"></span><button aria-label="Next variant" onclick="cycle(1)">→</button></div>
<script>


const names=['E1 · Broken heart','E2 · Sword','E3 · Damage','E4 · Roll Damage'];
const notes=['Broken heart: emphasizes damage dealt. Hover or focus for “Roll shared damage”.','Sword: emphasizes the attack’s damage action. Hover or focus for “Roll shared damage”.','Damage: a short, explicit label that keeps the header compact.','Roll Damage: spells out the action most clearly.'];
const targets=[{name:'Dockside Enforcer',hit:true,total:24,natural:16,ac:19},{name:'Dockside Lookout',hit:true,total:22,natural:14,ac:18},{name:'Dockside Captain',hit:false,total:17,natural:9,ac:21}];
let v=['heart','sword','damage','roll-damage'].indexOf(new URLSearchParams(location.search).get('variant'));if(v<0)v=0;
let rolled=false,opened=false,count=3;const expanded=new Set();
const heart='<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M10.1 3.8C5.2.2.2 5.8 3.4 10.6L12 20.5l8.6-9.9C23.8 5.8 18.8.2 13.9 3.8l-2.1 4.3 3 3.1-4.1 5.5 1.1-5.1-3-3.2z"/></svg>';
const sword='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="m8 14 11-11 2 0 0 2-11 11z" fill="currentColor"/><path d="m5 12 7 7M8.5 15.5 3 21M2 19l3 3"/></svg>';
function render(){
const active=targets.slice(0,count),hits=active.filter(t=>t.hit).length;
const action=rolled?'<span class="done">Damage: 11</span>':'<button class="'+(v<2?'icon-button':'text-action')+'" aria-label="Roll shared damage: 1d8 plus 6" title="Roll shared damage · 1d8 + 6" onclick="roll()">'+[heart,sword,'Damage','Roll Damage'][v]+'</button>';
let content='<div class="group"><div class="group-head"><div><strong>Sweeping Strike</strong><small>Longsword · '+count+' target'+(count===1?'':'s')+'</small></div>'+action+'</div>';
active.forEach((t,i)=>{content+='<div class="card '+(t.hit?'':'miss')+'"><div class="row"><div class="score"><strong>'+(t.hit?'Hit':'Miss')+'</strong><small>Total '+t.total+'</small></div><div><div class="subject">vs. '+t.name+'</div></div><button class="collapse-button" aria-label="Toggle attack calculation for '+t.name+'" aria-expanded="'+expanded.has(i)+'" onclick="toggle('+i+')">›</button></div>'+(expanded.has(i)?'<div class="calc">D20 '+t.natural+' + 8 = '+t.total+' · vs. AC '+t.ac+'</div>':'')+'</div>';});

content+='<div class="shared-note">'+hits+' hit'+(hits===1?'':'s')+' · One shared damage roll</div></div>';
document.getElementById('attack').innerHTML=content;
document.getElementById('result').innerHTML=rolled?'<div class="card damage" style="margin-top:10px"><div class="row"><div class="score"><strong>11</strong><small>DAMAGE</small></div><div><div class="subject">Sweeping Strike · Shared damage</div><div class="source">1d8 [5] + 6 · Physical</div></div><span></span></div><div class="calc">Same roll for all targets hit. Applying damage is a separate action. This demo changes no HP.</div></div>':'';
for(let i=0;i<4;i++)document.getElementById('choice'+i).setAttribute('aria-pressed',i===v);document.getElementById('label').textContent=names[v];document.getElementById('note').textContent=notes[v];
document.getElementById('state').textContent=count+' target'+(count===1?'':'s')+' · '+hits+' hit'+(hits===1?'':'s')+' · damage rolls: '+(rolled?'1':'0')+' · expanded targets: '+expanded.size;
document.getElementById('multi').setAttribute('aria-pressed',count===3);document.getElementById('single').setAttribute('aria-pressed',count===1);
}
function roll(){if(rolled)return;rolled=true;render()}
function reset(){rolled=false;opened=false;expanded.clear();render()}
function toggle(i){expanded.has(i)?expanded.delete(i):expanded.add(i);render()}
function setCount(n){count=n;reset()}
function choose(n){cycle(n-v)}
function cycle(d){v=(v+d+4)%4;try{const u=new URL(location.href);u.searchParams.set('variant',['heart','sword','damage','roll-damage'][v]);history.replaceState(null,'',u)}catch(e){}reset()}
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></body></html>

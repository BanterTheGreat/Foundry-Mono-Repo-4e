<!doctype html>
<html><head><meta charset="utf-8"><title>Attack follow-through prototype</title><style>
*{box-sizing:border-box}body{margin:0;font:13px Arial;color:#eee4cc}button,select{font:inherit}button{cursor:pointer}.intro{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;color:var(--foreground,#eee)}.intro small{display:block;opacity:.65;margin-top:5px}.demo{position:relative;height:640px;overflow:hidden;background:#060606;border-radius:8px}.backdrop{position:absolute;width:100%;height:100%;object-fit:cover;object-position:46% 42%;opacity:.9}.panel{position:absolute;right:18%;top:70px;width:290px;background:#10100fee;border:1px solid #8f794e;border-radius:5px;box-shadow:0 12px 35px #0009;overflow:hidden}.head{padding:14px 16px;background:linear-gradient(110deg,#292318,#101010);border-bottom:1px solid #655433}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:9px;color:#baa67b;margin-bottom:6px}.title{font:600 19px Georgia}.sub{font-size:11px;color:#b9b09e;margin-top:6px}.rows{padding:4px 16px}.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #493c26}.row:last-child{border:0}.name{display:flex;gap:9px;align-items:center}.avatar{width:26px;height:26px;border:1px solid #655433;background:#29213c;display:grid;place-items:center;color:#b3a1d4}.verdict{font-weight:bold;font-size:11px}.hit{color:#aaca91}.miss{color:#e4aa98}.crit{color:#efd27e}.foot{padding:12px 16px;background:#0d0c09;border-top:1px solid #493c26}.primary{background:linear-gradient(#4c4026,#302919);color:#f5e3b7;border:1px solid #9c824b;border-radius:3px;padding:11px 18px;font-weight:bold}.wide{width:100%}.secondary{background:transparent;border:1px solid #655433;color:#d9c8a2;padding:7px 10px;border-radius:3px}.hint{font-size:10px;color:#afa48d;margin-bottom:10px;line-height:1.5}.tray{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);width:520px;max-width:94%;background:#10100ff5;border:1px solid #8f794e;border-radius:5px;box-shadow:0 8px 30px #000a;display:flex;align-items:center;gap:16px;padding:16px}.tray .info{flex:1}.tray .title{font-size:17px}.tray .primary{white-space:nowrap}.badge{position:absolute;padding:5px 8px;background:#10100fee;border:1px solid currentColor;border-radius:3px;font-size:11px;font-weight:bold;box-shadow:0 3px 9px #000}.b1{left:31%;top:23%}.b2{left:41%;top:32%}.b3{left:36%;top:39%}.switcher{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#e9e5db;color:#24231f;padding:6px;border-radius:30px;box-shadow:0 3px 12px #0007;white-space:nowrap}.switcher button{border:0;background:transparent;padding:7px 10px;color:#24231f}.switcher strong{font-size:11px;min-width:178px;text-align:center}.status{padding:10px 0;color:var(--muted-foreground,#999);font-size:11px}.flash{position:absolute;left:18px;top:18px;background:#111e;border:1px solid #655433;padding:10px 14px;border-radius:4px;font-size:11px}.controls{display:flex;gap:8px;align-items:center}.controls select{padding:7px;background:#181714;color:#eee4cc;border:1px solid #655433;border-radius:3px}@media(max-width:550px){.demo{height:600px}.panel{right:12px;top:85px;width:265px}.intro{align-items:flex-start;flex-direction:column}.tray{bottom:100px;gap:10px;padding:13px}.tray .primary{padding:12px}.backdrop{object-position:43% 45%}}
</style></head><body>
<div class="intro"><div><b>Attack follow-through</b><small>Interactive UI study · simulated rolls · no Foundry changes</small></div><div class="controls"><select id="scenario" aria-label="Attack outcome scenario"><option value="mixed">Mixed results</option><option value="miss">All miss</option><option value="crit">Critical hit</option></select><button class="secondary" id="reset">Reset</button></div></div>
<div class="demo"><img class="backdrop" src="C:/Users/Imre/.t3/userdata/attachments/ea182885-1c7b-44cb-afad-aeb03d540998-8ab6753f-207f-4bc5-9650-a1858adc190c.png" alt="Foundry battlefield screenshot supplied as prototype background"><div id="surface"></div><div class="switcher"><button id="prev" aria-label="Previous prototype">←</button><strong id="variantLabel"></strong><button id="next" aria-label="Next prototype">→</button></div></div><div class="status" id="status"></div>
<script>
// Throwaway prototype: compare an in-place panel transition with a floating attack tray.
let variant=new URLSearchParams(location.search).get('variant')==='B'?'B':'A',stage='target',scenario='mixed',rolls=0;
const names=['Shadow wolf 1','Shadow wolf 2','Shadow wolf 3'];
function outcomes(){return scenario==='miss'?['miss','miss','miss']:scenario==='crit'?['crit','hit','miss']:['hit','miss','hit']}
function label(v){return v==='crit'?'CRITICAL':v.toUpperCase()}
function summary(){return scenario==='miss'?'3 misses':scenario==='crit'?'1 critical · 1 hit · 1 miss':'2 hits · 1 miss'}
function rows(){return names.map((n,i)=>{let v=outcomes()[i];return '<div class="row"><span class="name"><span class="avatar">◆</span>'+n+'</span>'+(stage==='target'?'<input type="checkbox" checked aria-label="Target '+n+'">':'<span class="verdict '+v+'">'+(stage==='done'?(v==='miss'?'9 damage':v==='crit'?'30 damage':'18 damage'):label(v)+' '+(v==='miss'?'12':v==='crit'?'32':'26'))+'</span>')+'</div>'}).join('')}
function action(){stage=stage==='target'?'results':'done';if(stage==='done')rolls++;render()}
function render(){
document.getElementById('variantLabel').textContent=variant==='A'?'A · Transforming panel':'B · Floating attack tray';
let title=stage==='target'?'Choose targets':stage==='results'?'Attack resolved':'Damage rolled';
let button=stage==='target'?'Confirm & roll attack':stage==='results'?'Roll Damage':'Roll Again';
let hint=stage==='target'?'3 targets selected · vs. Reflex':stage==='results'?(scenario==='miss'?'All targets missed. This example power deals half damage on a miss.':'One damage roll for the whole attack.'):'18 necrotic · half on miss · critical 30';
let panel='<section class="panel"><div class="head"><div class="eyebrow">'+title+'</div><div class="title">Dread Star</div><div class="sub">Ozyn Valder · '+(stage==='target'?'Daily ✦ Arcane, Necrotic':summary())+'</div></div><div class="rows">'+rows()+'</div><div class="foot"><div class="hint">'+hint+'</div><button class="primary wide" id="action">'+button+'</button>'+(stage==='done'?'<div class="sub">Roll complete · damage application is separate</div>':'')+'</div></section>';
let tray='<section class="tray"><div class="info"><div class="eyebrow">'+title+'</div><div class="title">Dread Star</div><div class="sub">'+(stage==='results'?summary():'18 necrotic · 9 on miss · 30 critical')+'</div></div><button class="primary" id="action">'+button+'</button></section>';
let badges=stage!=='target'?outcomes().map((v,i)=>'<div class="badge b'+(i+1)+' '+v+'">'+(stage==='done'?(v==='miss'?'9':v==='crit'?'30':'18')+' damage':label(v))+'</div>').join(''):'';
document.getElementById('surface').innerHTML=badges+(variant==='A'||stage==='target'?panel:tray)+(stage==='done'?'<div class="flash">✓ Damage result posted to chat</div>':'');
document.getElementById('action').onclick=action;
document.querySelectorAll('input[type=checkbox]').forEach(e=>e.onclick=()=>{e.checked=true});
document.getElementById('status').textContent='State: '+(variant==='A'?'transforming panel':'floating tray')+' / '+stage+' / '+scenario+' · Damage rolls: '+rolls+' · Fixed example damage; no HP is changed.';
}
function change(){variant=variant==='A'?'B':'A';try{let u=new URL(location);u.searchParams.set('variant',variant);history.replaceState({},'',u)}catch(e){}render()}
document.getElementById('prev').onclick=change;document.getElementById('next').onclick=change;
document.getElementById('reset').onclick=()=>{stage='target';rolls=0;render()};
document.getElementById('scenario').onchange=e=>{scenario=e.target.value;stage='target';rolls=0;render()};
document.onkeydown=e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight')change()};
render();
</script></body></html>

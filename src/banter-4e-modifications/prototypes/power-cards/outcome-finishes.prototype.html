<!doctype html><html><head><meta charset="utf-8"><style>/* Consecutive speakers share a header when compact chat rolls are enabled. */
.chat-message.message.banter-message-continuation > .message-header {
  display: none;
}
/* The native actor header floats above the card, outside its bordered surface. */
.chat-message.message:has(.banter-roll),
.chat-message.message:has(.banter-power) {
  background: transparent;
  border: 0;
  border-radius: 0;
  padding: 0;
  box-shadow: none;
  overflow: visible;
}
.chat-message.message:has(.banter-roll) > .message-header,
.chat-message.message:has(.banter-power) > .message-header {
  margin: 0 0 5px;
  padding: 0 4px;
  background: transparent;
  border: 0;
}
.chat-message.message:has(.banter-roll) > .message-content,
.chat-message.message:has(.banter-power) > .message-content {
  margin: 0;
  padding: 0;
  background: linear-gradient(#2d2e35, #23242b);
  border: 1px solid #62534d;
  border-radius: 5px;
  overflow: clip;
}
.chat-message.message .banter-roll {
  margin: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
}
.chat-message.message .dnd4e.chat-card.item-card.banter-power {
  border-right: 0;
  border-bottom: 0;
  border-left: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}
.banter-roll {
  color: #f1e8d8;
  background: linear-gradient(#2d2e35, #23242b);
  border: 1px solid #62534d;
  border-radius: 5px;
  margin: 4px 0;
  overflow: clip;
}
/* Match the stored verdict, including when the chat wrapper owns the surface. */
.banter-roll.banter-roll--attack {
  --banter-attack-outcome-color: #8d8580;
  border-left: 4px solid var(--banter-attack-outcome-color);
}
.banter-roll.banter-roll--attack.banter-roll--miss,
.banter-roll.banter-roll--attack.banter-roll--fumble {
  --banter-attack-outcome-color: #ed9b9b;
}
.banter-roll.banter-roll--attack.banter-roll--hit {
  --banter-attack-outcome-color: #9dd5b0;
}
.banter-roll.banter-roll--attack.banter-roll--critical {
  --banter-attack-outcome-color: #f5d080;
}
.chat-message.message .banter-roll.banter-roll--attack {
  border-left: 4px solid var(--banter-attack-outcome-color);
}
.banter-roll--damage { border-left: 1px solid #826452; }
.banter-roll .banter-roll__summary {
  display: grid;
  /* Keep totals aligned regardless of the TOTAL/DAMAGE label width. */
  grid-template-columns: minmax(0, 1fr) 40px 10px;
  grid-template-rows: auto auto;
  align-items: center;
  gap: 4px 10px;
  padding: 10px;
  cursor: pointer;
  list-style: none;
}
.banter-roll__summary::-webkit-details-marker { display: none; }
.banter-roll__main { grid-column: 1; grid-row: 1; min-width: 0; }
.banter-roll .banter-roll__sentence {
  font-family: var(--font-body, sans-serif);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
  overflow-wrap: break-word;
  text-transform: none;
}
.banter-roll--damage .banter-roll__sentence { font-size: 15px; }
.banter-roll__source { font-size: 11px; color: #c4bbae; line-height: 1.4; margin-top: 2px; overflow-wrap: anywhere; }
.banter-roll__score { grid-column: 2; grid-row: 1 / 3; text-align: center; font-variant-numeric: tabular-nums; }
.banter-roll__score strong { display: block; font: 30px/1.1 var(--font-h1, Georgia, serif); }
.banter-roll__score small { display: block; font-size: 8px; letter-spacing: .12em; color: #c4bbae; }
.banter-roll__chevron { grid-column: 3; grid-row: 1 / 3; font-size: 21px; color: #c4bbae; }
.banter-roll__disclosure[open] > summary .banter-roll__chevron { transform: rotate(90deg); }
.banter-roll__chips { grid-column: 1; grid-row: 2; display: flex; flex-wrap: wrap; gap: 4px; }
.banter-roll__chips:empty { display: none; }
.banter-roll__chip { font-size: 10px; padding: 2px 5px; border: 1px solid #766055; border-radius: 3px; cursor: inherit; text-decoration: none; }
.banter-roll__chip.is-positive { border-color: #689b6c; box-shadow: 0 0 5px #68ab6044; }
.banter-roll__chip.is-negative { border-color: #b76363; box-shadow: 0 0 5px #cc555544; }
.banter-roll__calculation { border-top: 1px solid #63564a; padding: 8px 10px; font-size: 11px; }
.banter-roll__modifier { margin: 0; padding: 5px 0; border-bottom: 1px solid #ffffff0d; font: 12px/1.4 var(--font-body, sans-serif); font-weight: normal; }
.banter-roll__modifier.is-positive { color: #a5dca8; }
.banter-roll__modifier.is-negative { color: #f0a0a0; }
.banter-roll__equation { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 4px 0 10px; font: 14px/1.4 var(--font-body, sans-serif); }
.banter-roll__equation strong { margin-left: auto; font-size: 22px; font-variant-numeric: tabular-nums; }
.banter-roll__natural { padding: 4px 7px; background: #ffffff09; border: 1px solid #766756; border-radius: 3px; }
.banter-roll__original { margin-top: 10px; }
.banter-roll__original > summary { cursor: pointer; color: #c4bbae; font: 11px/1.5 var(--font-body, sans-serif); }
.banter-roll__original .target, .banter-roll__original .hit-prediction, .banter-roll__original .dice-flavor { display: none; }
.banter-roll__original .dice-formula { white-space: normal; overflow-wrap: anywhere; height: auto; border: 0; box-shadow: none; background: transparent; font: 12px/1.5 var(--font-body, sans-serif); padding: 5px 0; }
.banter-roll__original .dice-total { display: none; }
.banter-roll__calculation .dice-tooltip { display: block !important; }
.banter-roll__calculation .dice-total { font-size: 18px; }
.banter-roll__calculation .dice-roll { background: transparent; color: inherit; }
.banter-roll__actions { display: flex; }
.banter-roll button.banter-roll__apply {
  flex: 1;
  min-width: 0;
  display: block;
  width: 100%; height: 24px; min-height: 24px;
  padding: 0; margin: 0;
  border: 0; border-top: 1px solid #e0a07c;
  border-radius: 0;
  background: linear-gradient(#945846, #783e33);
  color: #fff7ed; font-size: 12px; font-weight: bold; line-height: 23px;
  box-shadow: none;
}
.banter-roll__actions > button + button { border-left: 3px solid #e0a07c; }
.banter-roll button.banter-roll__apply:hover { background: linear-gradient(#b16f55, #94513f); }
.banter-roll button.banter-roll__apply:active { background: #783e33; }
.banter-roll__summary:focus-visible, .banter-roll__score:focus-visible { outline: 2px solid #e0bc83; outline-offset: -2px; }
.banter-roll button.banter-roll__apply:focus-visible { outline: 2px solid #f5d2a1; outline-offset: -3px; }
.banter-roll__popup {
  position: fixed; z-index: 10000; width: 210px; padding: 12px;
  border: 1px solid #bb9c6e; border-radius: 4px;
  background: #17181d; color: #f1e8d8; font-size: 16px;
  box-shadow: 0 4px 15px #0009; pointer-events: none;
}
.banter-roll__popup[hidden] { display: none; }

/* Power-card design A: a compact coloured header, narration, and native actions. */
.dnd4e.chat-card.item-card.banter-power {
  --banter-power-ink: #bcb5a9;
  --banter-power-edge: #69625b;
  --banter-power-tint: #333136;
  color: #f1e8d8;
  background: linear-gradient(130deg, #2d2e35, #23242b);
  border: 1px solid var(--banter-power-edge);
  border-top: 2px solid var(--banter-power-ink);
  border-radius: 5px;
  padding: 0;
  overflow: hidden;
  box-shadow: inset 0 1px #ffffff05;
  cursor: pointer;
}
.dnd4e.chat-card.item-card.banter-power--atwill {
  --banter-power-ink: #93d4a1;
  --banter-power-edge: #65916e;
  --banter-power-tint: #243b2b;
}
.dnd4e.chat-card.item-card.banter-power--encounter {
  --banter-power-ink: #f0a1a6;
  --banter-power-edge: #b36570;
  --banter-power-tint: #482832;
}
.dnd4e.chat-card.item-card.banter-power--daily {
  --banter-power-ink: #d0d0d2;
  --banter-power-edge: #83838a;
  --banter-power-tint: #36363d;
}
.banter-power .banter-power__header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 8px;
  padding: 8px 11px;
  border: 0;
  border-bottom: 1px solid var(--banter-power-edge);
  background: linear-gradient(110deg, var(--banter-power-tint), #27292e);
}
.banter-power h3.banter-power__heading {
  flex: 1;
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
  color: #f1e8d8;
  font: 400 16px/1.35 var(--font-h1, Georgia, serif);
  text-transform: none;
  text-shadow: none;
  overflow-wrap: anywhere;
}
.banter-power__heading .banter-power__speaker { font-weight: 700; }
.banter-power__heading .banter-power__name { font-weight: 600; }
.banter-power .banter-power__narrative {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px 9px 12px;
}
.banter-power .banter-power__flavor {
  flex: 1;
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: #ded4c7;
  font: italic 13px/1.45 Georgia, serif;
}
.banter-power .banter-power__flavor p { margin: 0 0 5px; font: inherit; }
.banter-power .banter-power__flavor p:last-child { margin-bottom: 0; }
.banter-power button.banter-power__toggle {
  flex: 0 0 24px;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  min-height: 24px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 3px;
  background: transparent;
  box-shadow: none;
  color: #c9b99d;
  line-height: 1;
  cursor: pointer;
}
.banter-power__chevron { font: 19px/1 sans-serif; transition: transform .15s; }
.banter-power__toggle[aria-expanded="true"] .banter-power__chevron { transform: rotate(90deg); }
.banter-power button.banter-power__toggle:hover { background: #ffffff0a; color: #f1dfbd; }
.banter-power .banter-power__rules { border-top: 1px solid #62584d; padding: 10px 11px; }
.banter-power .banter-power__rules[hidden] { display: none !important; }
.banter-power .banter-power__rules .card-content {
  display: block;
  margin: 0;
  padding: 0;
  color: #d9d1ca;
  font: 12px/1.55 var(--font-body, sans-serif);
}
.banter-power .banter-power__rules .item-details { margin: 0; padding: 0; }
.banter-power .card-footer { margin: 0; padding: 0; border: 0; }
.banter-power .card-footer:empty { display: none; }
.banter-power .card-buttons {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0;
  margin: 0;
  padding: 0;
  border-top: 1px solid #776354;
  background: #201f25;
}
.banter-power .card-buttons:empty { display: none; }
.banter-power .card-buttons button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  min-width: 0;
  min-height: 25px;
  margin: 0;
  padding: 3px 7px;
  border: 0;
  border-radius: 0;
  background: linear-gradient(#38353b, #2b2a31);
  box-shadow: inset 0 1px #ffffff08;
  color: #f5e9d8;
  font: 650 12px/1.5 var(--font-body, sans-serif);
  text-transform: none;
  cursor: pointer;
}
.banter-power .card-buttons button:nth-child(even) { border-left: 1px solid #756151; }
.banter-power .card-buttons button:only-child,
.banter-power .card-buttons button:nth-child(n+3) { grid-column: 1 / -1; }
.banter-power .card-buttons button:nth-child(n+3) { border: 0; border-top: 1px solid #756151; }
.banter-power .card-buttons button[data-action="damage"] {
  background: linear-gradient(#774335, #57302c);
  color: #fff0de;
}
/* The pinned system handler reads event.target, including when an icon is clicked. */
.banter-power .card-buttons button * { pointer-events: none; }
.banter-power .card-buttons .dnd4e-button-icon { width: 14px; height: 14px; }
.banter-power .card-buttons .dnd4e-button-icon img { width: 14px; height: 14px; border: 0; }
.banter-power .card-buttons button:not(:disabled):hover { filter: brightness(1.2); }
.banter-power .card-buttons button:not(:disabled):active { filter: brightness(.9); }
.banter-power .card-buttons button:disabled { opacity: .5; cursor: default; }
.banter-power button:focus-visible { outline: 2px solid #e5c695; outline-offset: -3px; }
@media (prefers-reduced-motion: reduce) {
  .banter-power__chevron { transition: none; }
}


*{box-sizing:border-box}body{margin:0;padding-bottom:70px;color:var(--foreground,#eee);font:13px/1.5 system-ui,sans-serif}h2{font-size:18px;margin:0 0 6px}p{font-size:12px;color:var(--muted-foreground,#aaa);margin:0 0 16px}.feed{max-width:338px;margin:auto;padding:16px;background:#191a20;border-radius:10px;--font-body:Arial,sans-serif;--font-h1:Georgia,serif}.chat-message{margin-bottom:6px}.chat-message:last-child{margin-bottom:0}.message-header{font-size:11px;color:#b5ab9f;margin-bottom:7px}.message-content{--ink:#ffb6b6;--edge:#a56d73;--wash:#412f34;--shine:#ed9b9b25;--banner:#653e46;--banner-end:#392a30;color:#f1e8d8}.message-content.hit{--ink:#b7e9c7;--edge:#719b7e;--wash:#2e4035;--shine:#9dd5b025;--banner:#3c6049;--banner-end:#28382e}.message-content.critical{--ink:#ffe0a1;--edge:#b99a62;--wash:#423a2c;--shine:#f8c85b30;--banner:#69502c;--banner-end:#3b3024}.finish .message-content{border-color:var(--edge)!important;background:linear-gradient(115deg,var(--wash),#292a30 70%)!important;box-shadow:inset 0 0 16px var(--shine)}.finish .banter-roll__sentence,.finish .banter-roll__score strong{color:var(--ink)}.finish .banter-roll__score strong{text-shadow:0 0 12px var(--shine)}.banner .message-content{border-color:var(--edge)!important}.banner .banter-roll::before{content:attr(data-banner);display:block;padding:5px 10px;background:linear-gradient(90deg,var(--banner),var(--banner-end));border-bottom:1px solid var(--edge);color:var(--ink);font:bold 10px/1.4 Arial,sans-serif;letter-spacing:2px;text-align:center}.banner .banter-roll__score strong{color:var(--ink)}.banter-roll__chevron{display:block}.note{max-width:338px;margin:14px auto 0}.switcher{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#eee5d6;color:#25242b;display:flex;align-items:center;gap:10px;padding:6px;border-radius:30px;box-shadow:0 4px 24px #0005;white-space:nowrap}.switcher button{border:0;border-radius:50%;background:#d7cebf;width:30px;height:30px;cursor:pointer}.switcher span{font-size:11px;min-width:172px;text-align:center}
</style></head><body><!-- Throwaway static comparison using production chat-roll structure and CSS. ?variant=combined|finish|banner. No animations. -->
<h2 id="title"></h2><p>The same finish treatment, adapted to red for misses, green for hits, and gold for critical hits.</p><div class="feed" id="feed"><div class="message-header"><b>Ozyn Valder</b></div><div id="cards"></div></div><p class="note" id="note"></p><div class="switcher"><button onclick="cycle(-1)" aria-label="Previous treatment">←</button><span id="label"></span><button onclick="cycle(1)" aria-label="Next treatment">→</button></div>
<script>
const keys=['combined','finish','banner'];const names=['Gilded finish + banners','Gilded finish only','Banners only'];let current=keys.indexOf(new URLSearchParams(location.search).get('variant'));if(current<0)current=0;
const rolls=[['miss','Ozyn Valder Missed Rogal','×  MISS  ×',24,12],['hit','Ozyn Valder Hit Rogal','✓  HIT  ✓',28,16],['critical','Ozyn Valder Critically Hit Rogal','✦  CRITICAL HIT  ✦',34,20]];
function render(){document.getElementById('title').textContent=names[current];document.getElementById('label').textContent=names[current];document.getElementById('feed').className='feed '+(current===0?'finish banner':keys[current]);document.getElementById('note').textContent='Static prototype only. Existing sentence, power, modifier, total, and disclosure remain. Theme fonts use Arial / Georgia fallbacks.';document.getElementById('cards').innerHTML=rolls.map(([outcome,sentence,banner,total,natural])=>'<article class="chat-message message"><div class="message-content '+outcome+'"><section class="banter-roll banter-roll--attack banter-roll--'+outcome+'" data-banner="'+banner+'"><details class="banter-roll__disclosure"><summary class="banter-roll__summary"><div class="banter-roll__main"><div class="banter-roll__sentence">'+sentence+'</div><div class="banter-roll__source">Eldritch Strike</div></div><span class="banter-roll__score"><strong>'+total+'</strong><small>TOTAL</small></span><span class="banter-roll__chevron">›</span><div class="banter-roll__chips">'+(outcome==='miss'?'<span class="banter-roll__chip is-negative">−2 Prone</span>':'')+'</div></summary><div class="banter-roll__calculation"><div class="banter-roll__equation"><span class="banter-roll__natural">D20 '+natural+'</span><span>+ '+(total-natural)+' =</span><strong>'+total+'</strong></div>Sample calculation</div></details></section></div></article>').join('');}
function cycle(n){current=(current+n+3)%3;try{const url=new URL(location.href);url.searchParams.set('variant',keys[current]);history.replaceState(null,'',url)}catch(e){}render()}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></body></html>

<!doctype html>
<!-- Throwaway UI prototype: three new power-card layouts in a mock chat sequence, switchable with ?variant=A/B/C. Open this file directly. -->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;padding-bottom:80px;font-family:Arial,sans-serif;color:var(--foreground,#eee)}h2{font-size:18px;margin:0 0 8px}p{font-size:12px;line-height:1.6;color:var(--muted-foreground,#aaa);margin:8px 0 14px}.tag{font-size:9px;letter-spacing:1px;color:var(--muted-foreground,#aaa);margin-bottom:10px}.layout{display:flex;gap:24px;align-items:flex-start}.chat{width:324px;flex-shrink:0;padding:16px;background:#191a1c;border-radius:10px}.speaker{font-size:11px;color:#c3bdb2;padding:0 4px 7px}.speaker strong{color:#e5ddcd}.speaker span{float:right;font-size:9px;color:#928d84}.power{--usage:#bc9297;--edge:#79666b;--wash:#393037;color:#e9e2d7;border:1px solid var(--edge);border-left:4px solid var(--usage);border-radius:5px;background:linear-gradient(110deg,var(--wash),#292a30 75%);overflow:hidden;margin-bottom:6px}.power.atwill{--usage:#9db8a4;--edge:#687e70;--wash:#303a34}.power.daily{--usage:#c5c1ca;--edge:#85818b;--wash:#36353d}.power.other{--usage:#c2b798;--edge:#81775f;--wash:#38362f}.head{display:flex;align-items:center;gap:9px;padding:11px 10px}.title{font-size:14px;line-height:1.35;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}.usage{font-size:9px;font-weight:400;color:var(--usage);margin-top:4px;line-height:1.4}.flavour{font:italic 12px/1.5 Georgia,serif;color:#cac2b6;padding:0 10px 10px;margin:0}.disclose{cursor:pointer}.head button{background:transparent;border:0;color:#c4bbae;font-size:20px;padding:0 1px;min-width:15px}.meta{font-size:10px;color:#bcb9b1;line-height:1.5;margin-top:4px}.rules{border-top:1px solid #ffffff23;padding:10px;font-size:11px;color:#d5cec2;line-height:1.6}.rules p{font:inherit;color:inherit;margin:0 0 7px}.rules p:last-child{margin-bottom:0}.rules strong{color:#e8e1d6}.rules[hidden]{display:none}.footer{display:flex;flex-wrap:wrap;border-top:1px solid #ffffff25;background:#24252a}.footer button{flex:1 1 40%;border:0;border-right:1px solid #ffffff1a;border-bottom:1px solid #ffffff15;padding:9px 5px;color:#e1dacf;background:transparent;font-size:11px;font-weight:600;line-height:1.4;cursor:pointer}.footer button:hover,.action-row:hover{background:#ffffff0d}.footer button:only-child{flex-basis:100%}.effectbox{border-top:1px solid #ffffff25}.effectbox summary{padding:8px 10px;font-size:11px;color:#cdc4b8;cursor:pointer;list-style:none;display:flex;justify-content:space-between}.effectbox summary::after{content:'›';color:#bcb9b1}.effectbox[open] summary::after{content:'⌄'}.effect-row{display:flex;gap:7px;align-items:center;padding:8px 10px;border-top:1px solid #ffffff12;font-size:11px}.effect-row .effectname{flex:1;line-height:1.35}.duration{font-size:9px;color:#b9b1a5;margin-top:3px}.effect-row button{border:1px solid #7a7266;border-radius:3px;background:#ffffff06;color:#e2dbcf;font-size:10px;padding:5px 8px;cursor:pointer}.usage-block{flex:0 0 78px;padding-right:10px;border-right:1px solid #ffffff35;text-align:center;color:var(--usage);font:600 15px/1.2 'Arial Narrow',Arial,sans-serif}.usage-block small{display:block;font:400 10px/1.4 Arial,sans-serif;color:#bcb9b1;margin-top:6px}.left-power .head{align-items:center;min-height:82px}.left-power .title{font-size:12px}.utility{display:flex;gap:0;border-top:1px solid #ffffff23;background:#ffffff03}.utility button{flex:1;padding:8px 5px;border:0;border-right:1px solid #ffffff20;background:transparent;color:#c7beb1;font-size:10px;cursor:pointer}.action-row{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border:0;border-top:1px solid #ffffff20;background:transparent;color:#e6dfd3;text-align:left;cursor:pointer}.action-row b{font-size:12px;font-weight:600}.action-row small{margin-left:auto;font-size:9px;color:#b5aea4}.action-row .arrow{font-size:15px;color:#bcb4a7}.list-power .head{padding-bottom:6px}.list-power .usage{margin:0 0 4px}.section-label{font-size:9px;color:#9d978e;letter-spacing:.8px;margin:13px 0 6px}.result{border:1px solid #719b7e;border-left:4px solid #9dd5b0;border-radius:5px;background:linear-gradient(115deg,#2e4035,#292a30 70%);color:#b7e9c7;margin-bottom:4px}.result-row{display:grid;grid-template-columns:78px minmax(0,1fr) 10px;gap:10px;align-items:center;min-height:72px;padding:11px 10px}.result-block{border-right:1px solid #ffffff35;text-align:center;padding-right:10px}.primary{font:600 19px/1.2 'Arial Narrow',Arial,sans-serif;text-transform:none}.secondary{font:400 11px/1.4 Arial,sans-serif;color:#bcb9b1;margin-top:6px}.context{font-size:12px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}.source{font-size:10px;font-weight:400;line-height:1.4;color:#c4bbae;margin-top:4px}.chev{font-size:18px;color:#bcb5aa}.damage{margin-top:6px;border-color:#8b8275;border-left-color:#e9dfce;color:#e9dfce;background:linear-gradient(110deg,#383632,#292a30)}.damage .secondary{font-size:10px}.damage .footer{background:#2d2b29}.notes{flex:1;min-width:180px}.notes strong{font-size:13px}.control{margin:0 0 13px}.control label{display:block;font-size:11px;margin-bottom:5px;color:var(--muted-foreground,#aaa)}select{width:100%;border:1px solid var(--border,#555);border-radius:4px;padding:7px;background:var(--card,#292a30);color:var(--foreground,#eee);font-size:12px}.toggles{display:flex;flex-wrap:wrap;gap:6px 12px}.toggles label{font-size:11px;color:var(--foreground,#ddd);display:flex;gap:4px;align-items:center}.state{font-size:10px;line-height:1.6;border-top:1px solid var(--border,#555);padding-top:9px;margin-top:14px;color:var(--muted-foreground,#aaa)}.switch{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:5px;border-radius:30px;background:#e9e5db;color:#202323;box-shadow:0 4px 20px #0006;white-space:nowrap}.switch button{width:32px;height:32px;border:0;border-radius:50%;background:#272d2c;color:white;cursor:pointer}.switch span{font-size:12px;min-width:185px;text-align:center}button:focus-visible,summary:focus-visible{outline:2px solid #e9dfce;outline-offset:-3px}.log{font-size:10px;line-height:1.5;color:#bcb5aa;margin-top:10px}a{color:inherit}.sources{font-size:10px;line-height:1.6;margin-top:12px;color:var(--muted-foreground,#aaa)}@media(max-width:590px){.layout{flex-direction:column;gap:18px}.chat{width:100%}.notes{width:100%}} 
</style></head><body><div class="tag">THROWAWAY PROTOTYPE · INVENTED EXAMPLE POWERS · SIMULATED ACTIONS</div><h2 id="heading"></h2><p>A new power card in the same chat as the approved attack and damage results.</p><div class="layout"><div class="chat" id="chat"></div><aside class="notes"><div class="control"><label for="scenario">Power example</label><select id="scenario"><option value="area">Area attack + effects</option><option value="simple">Simple at-will attack</option><option value="heal">Healing + effect</option><option value="effect">Effect only</option><option value="npc">NPC / custom description</option><option value="all">All optional controls</option><option value="none">Description only</option></select></div><div id="explanation"></div><div class="control"><label>Optional controls · toggle to inspect combinations</label><div class="toggles" id="toggles"></div></div><div class="control"><label for="effect-target">Effect application setting</label><select id="effect-target"><option value="selected">Selected tokens</option><option value="targeted">Targeted tokens</option></select></div><div class="state" id="state"></div><div class="sources">Based on DnD4e 0.9.3: <a href="https://github.com/EndlesNights/dnd4eBeta/blob/0.9.3/templates/chat/item-card.hbs" target="_blank">card template</a> · <a href="https://github.com/EndlesNights/dnd4eBeta/blob/0.9.3/module/documents/item.mjs" target="_blank">item rendering and action handlers</a>.<br>Rules and flavor here are layout samples, not published power text.</div></aside></div><nav class="switch" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><span id="variant"></span><button id="next" aria-label="Next variant">→</button></nav><script>
const variants=['A','B','C'],names=['A · Compact power card','B · Shared left column','C · Action list'];
const examples={
area:{name:'Icy End of the Earth',usage:'Encounter',type:'encounter',action:'Standard action',range:'Close burst 3',flavor:'Winter gathers at your feet, then breaks outward in a ring of ice.',attack:true,damage:true,healing:false,template:true,effects:true},
simple:{name:'Dire Radiance',usage:'At-will',type:'atwill',action:'Standard action',range:'Ranged 10',flavor:'A pale star catches your enemy in its cold light.',attack:true,damage:true,healing:false,template:false,effects:false},
heal:{name:'Light Through the Storm',usage:'Encounter',type:'encounter',action:'Minor action',range:'Close burst 5',flavor:'A steady voice cuts through the chaos and brings an ally back to their feet.',attack:false,damage:false,healing:true,template:false,effects:true},
effect:{name:'Mantle of Winter',usage:'Daily',type:'daily',action:'Minor action',range:'Personal',flavor:'A thin mantle of frost settles across your shoulders.',attack:false,damage:false,healing:false,template:false,effects:true},
npc:{name:'Winter Takes Its Due',usage:'Recharge',type:'other',action:'Standard action',range:'Melee 2',flavor:'',custom:true,attack:true,damage:true,healing:false,template:false,effects:true},
all:{name:'Icy End of the Earth',usage:'Daily',type:'daily',action:'Standard action',range:'Close burst 3',flavor:'The storm breaks around friend and foe alike.',attack:true,damage:true,healing:true,template:true,effects:true},
none:{name:'A Word Before Winter',usage:'At-will',type:'atwill',action:'Free action',range:'Personal',flavor:'You whisper a promise to the coming frost.',attack:false,damage:false,healing:false,template:false,effects:false}
};
const controls=[['template','Template'],['effects','Effects'],['attack','Attack'],['damage','Damage'],['healing','Healing']];
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants.includes(variant))variant='A';
let chosen='area',power={...examples.area},expanded=false,effectsOpen=false,last='No actions taken',targetMode='selected';
const button=(key,label)=>'<button type="button" data-action="'+key+'">'+label+'</button>';
function effects(){if(!power.effects)return '';return '<details class="effectbox" '+(effectsOpen?'open':'')+'><summary>Effects · '+(chosen==='area'||chosen==='all'?2:1)+'</summary>'+[chosen==='heal'?'Bolstered':chosen==='effect'?'Winter mantle':'Slowed',...(chosen==='area'||chosen==='all'?['Winter’s grasp']:[])].map((name,i)=>'<div class="effect-row"><div class="effectname">'+name+'<div class="duration">'+(i?'Save ends':'Until end of next turn')+'</div></div><button type="button" data-action="effect:'+name+'" title="Apply to '+targetMode+' tokens">Apply</button></div>').join('')+'</details>'}
function rules(){return '<section class="rules" '+(expanded?'':'hidden')+'>'+(power.custom?'<p><strong>Winter Takes Its Due</strong> · Standard action; melee 2.</p><p><strong>Attack:</strong> +14 vs. Fortitude. <strong>Hit:</strong> 2d8 + 6 cold damage, and the target is slowed until the end of its next turn.</p>':'<p><strong>'+power.action+'</strong> · '+power.range+'</p><p><strong>Keywords:</strong> '+(power.healing?'Divine, Healing':'Arcane, Cold, Implement')+'</p>'+(power.attack?'<p><strong>Target:</strong> Each enemy in the burst.<br><strong>Attack:</strong> Intelligence vs. Fortitude.</p>':'')+(power.damage?'<p><strong>Hit:</strong> 2d8 + Intelligence modifier cold damage, and the target is slowed.<br><strong>Miss:</strong> Half damage.</p>':'')+(power.healing?'<p><strong>Effect:</strong> One ally can spend a healing surge and regain additional hit points.</p>':'')+(!power.attack&&!power.damage&&!power.healing?'<p><strong>Effect:</strong> You gain a protective mantle until the end of your next turn.</p>':''))+'</section>'}
function disclosure(){return '<button type="button" data-details aria-label="'+(expanded?'Collapse':'Expand')+' power details" aria-expanded="'+expanded+'">'+(expanded?'⌄':'›')+'</button>'}
function footer(includeTemplate=true){let buttons=(power.attack?button('attack','Attack'):'')+(power.damage?button('damage','Damage'):'')+(power.healing?button('healing','Heal'):'')+(includeTemplate&&power.template?button('template','Place Template'):'');return buttons?'<div class="footer">'+buttons+'</div>':''}
function VariantA(){return '<div class="head"><div class="title">'+power.name+'<div class="usage">'+power.usage+' · '+power.action+'</div></div>'+disclosure()+'</div>'+(power.flavor?'<p class="flavour">'+power.flavor+'</p>':'')+rules()+effects()+footer()}
function VariantB(){return '<div class="head"><div class="usage-block">'+power.usage+'<small>Power</small></div><div class="title">'+power.name+'<div class="meta">'+power.action+'<br>'+power.range+'</div></div>'+disclosure()+'</div>'+(power.flavor?'<p class="flavour">'+power.flavor+'</p>':'')+rules()+(power.template?'<div class="utility">'+button('template','Place Template')+'</div>':'')+effects()+footer(false)}
function VariantC(){return '<div class="head"><div class="title"><div class="usage">'+power.usage+' · '+power.action+'</div>'+power.name+'<div class="meta">'+power.range+'</div></div>'+disclosure()+'</div>'+(power.flavor?'<p class="flavour">'+power.flavor+'</p>':'')+rules()+(power.template?'<button class="action-row" data-action="template"><b>Place Template</b><small>'+power.range+'</small><span class="arrow">›</span></button>':'')+effects()+[['attack','Attack','Roll to hit'],['damage','Damage','Roll damage'],['healing','Heal','Roll healing']].filter(([k])=>power[k]).map(([k,label,hint])=>'<button class="action-row" data-action="'+k+'"><b>'+label+'</b><small>'+hint+'</small><span class="arrow">›</span></button>').join('')}
function result(){if(!power.attack&&!power.damage&&!power.healing)return '';return '<div class="section-label">RESULTS IN CONTEXT</div>'+(power.attack?'<div class="result"><div class="result-row"><div class="result-block"><div class="primary">Hit</div><div class="secondary">Total 22</div></div><div class="context">Ozyn Valder → Ekossiggan Of Winter<div class="source">'+power.name+'</div></div><span class="chev">›</span></div></div>':'')+(power.damage?'<div class="result damage"><div class="result-row"><div class="result-block"><div class="primary">10</div><div class="secondary">DAMAGE</div></div><div class="context">Ozyn Valder<div class="source">'+power.name+'</div></div><span class="chev">›</span></div><div class="footer">'+button('applyDamage','Apply Damage')+button('halfDamage','Half Damage')+'</div></div>':'')}
function state(){document.getElementById('state').textContent='Variant '+variant+' · '+power.usage+' · details '+(expanded?'open':'closed')+' · effects '+(effectsOpen?'open':'closed')+' · available: '+controls.filter(([k])=>power[k]).map(([,l])=>l).join(', ')+' · effect target: '+targetMode+'. Last action: '+last+'.'}
function render(){
document.getElementById('scenario').value=chosen;
document.getElementById('heading').textContent=names[variants.indexOf(variant)];document.getElementById('variant').textContent=names[variants.indexOf(variant)];
document.getElementById('chat').innerHTML='<div class="speaker"><strong>Ozyn Valder</strong><span>just now</span></div><article class="power '+power.type+'">'+({A:VariantA,B:VariantB,C:VariantC}[variant]())+'</article>'+result()+'<div class="log" id="log">'+last+' · preview only</div>';
document.getElementById('explanation').innerHTML=[
'<strong>Compact card, integrated actions</strong><p>The power name leads. Flavor stays visible, rules expand, and optional actions share the restrained footer used by damage cards. Effects remain individually named and applicable.</p>',
'<strong>The same left-to-right rhythm</strong><p>Usage occupies the same 78px column as Hit and damage. The power name stays vertically centered beside it. Template placement sits separately above the roll actions.</p>',
'<strong>A short list of things you can do</strong><p>Each action has its own row. This gives long labels room and avoids awkward button grids when many actions are present. It uses more vertical space.</p>'
][variants.indexOf(variant)];
document.getElementById('toggles').innerHTML=controls.map(([k,label])=>'<label><input type="checkbox" data-control="'+k+'" '+(power[k]?'checked':'')+'>'+label+'</label>').join('');
document.querySelectorAll('[data-control]').forEach(input=>input.onchange=()=>{power[input.dataset.control]=input.checked;render()});
document.querySelector('[data-details]').onclick=()=>{expanded=!expanded;render()};
const tray=document.querySelector('.effectbox');if(tray)tray.addEventListener('toggle',()=>{effectsOpen=tray.open;state()});
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{last=b.dataset.action.startsWith('effect:')?'Simulated: '+b.dataset.action.slice(7)+' applied to '+targetMode+' tokens':'Simulated: '+b.textContent.trim();document.getElementById('log').textContent=last+' · preview only';state()});state();console.log('Power prototype',variant,chosen);
}
document.getElementById('scenario').onchange=e=>{chosen=e.target.value;power={...examples[chosen]};expanded=false;effectsOpen=false;last='No actions taken';render()};
document.getElementById('effect-target').onchange=e=>{targetMode=e.target.value;render()};
function cycle(d){variant=variants[(variants.indexOf(variant)+d+3)%3];try{history.replaceState(null,'','?variant='+variant)}catch(e){}render()}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></body></html>

<!doctype html>
<!-- Throwaway: which of three layouts makes 23 trigger choices manageable? Open directly; ?variant=A/B/C. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trigger menu — three prototypes</title>
<style>
:root{color-scheme:dark;--background:#171715;--foreground:#eee4cc;--muted:#aaa390;--card:#23221f;--secondary:#303029;--border:#514938;--primary:#dfc386;--radius:8px;--font-sans:Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font:14px/1.4 var(--font-sans);padding-bottom:76px}button,input,select{font:inherit;color:inherit}button,select,input[type=search],input[type=number]{background:var(--secondary);border:1px solid var(--border);border-radius:5px;padding:8px}button{cursor:pointer}button:hover,button.active{border-color:var(--primary);color:var(--primary)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}input[type=checkbox]{accent-color:var(--primary)}input[type=search]{width:100%}h1{font:600 23px Georgia,serif;margin:3px 0}h2{font:600 19px Georgia,serif;margin:0 0 8px}h3{font-size:14px;margin:0}p{margin:7px 0}.muted,small{color:color-mix(in srgb, var(--foreground) 65%, transparent)}.shell{max-width:760px;margin:0 auto}.context{padding:12px 0;color:color-mix(in srgb, var(--foreground) 65%, transparent);display:flex;justify-content:space-between;font-size:12px}.window{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}.title{padding:15px 18px;border-bottom:1px solid var(--border)}.eyebrow{color:var(--primary);font-size:11px;letter-spacing:1px;text-transform:uppercase}.reference{border-left:2px solid var(--primary);padding-left:10px;margin-top:12px}.toolbar,.footer,.line{display:flex;align-items:center;gap:10px;justify-content:space-between}.toolbar{margin-bottom:12px;flex-wrap:wrap}.body{padding:16px}.footer{padding:12px 16px;border-top:1px solid var(--border)}.primary{background:var(--primary);color:var(--background);font-weight:bold}.primary:hover{color:var(--background)}.badge{font-size:11px;border:1px solid var(--border);border-radius:20px;padding:2px 7px;color:var(--primary)}.card{border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px}.card p{font-size:12px}.row{padding:9px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.group{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.group button{font-size:12px;padding:5px 9px}.scroll{max-height:270px;overflow:auto;padding-right:6px}.options{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}.options label{display:inline-flex;gap:5px;align-items:center;margin:3px 10px 3px 0;font-size:12px}.options input[type=number]{width:65px}.options fieldset{border:1px solid var(--border);margin:9px 0;padding:7px}.options legend{font-size:11px;color:color-mix(in srgb, var(--foreground) 65%, transparent)}.options input[type=checkbox]{margin:0}.split{display:grid;grid-template-columns:43% 1fr;min-height:365px}.catalog{padding:12px;border-right:1px solid var(--border)}.catalog .scroll{max-height:315px}.pick{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);background:transparent;border-radius:0;padding:10px 6px;font-size:12px}.pick.active{background:var(--secondary)}.editor{padding:16px;max-height:440px;overflow:auto}.steps{display:flex;gap:6px;margin-bottom:16px}.steps button{flex:1;font-size:12px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tiles button{text-align:left;padding:14px}.tiles small{display:block;margin-top:5px}.state{margin:12px 0;font-size:11px;color:color-mix(in srgb, var(--foreground) 65%, transparent)}.state pre{white-space:pre-wrap;max-height:140px;overflow:auto;font-family:monospace}.switcher{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;z-index:5;padding:7px;background:var(--card);border:1px solid var(--primary);border-radius:30px;box-shadow:0 4px 16px #0005;white-space:nowrap}.switcher button{border-radius:25px;padding:6px 13px}.switcher span{font-size:12px;min-width:155px;text-align:center}.notice{color:var(--primary);min-height:20px}.limit select{max-width:200px}.limit small{display:block;margin:7px 0}.empty{padding:22px;text-align:center;color:color-mix(in srgb, var(--foreground) 65%, transparent)}[hidden]{display:none!important}@media(max-width:520px){.split{grid-template-columns:40% 1fr}.body,.editor,.title{padding:12px}.tiles{grid-template-columns:1fr}.footer{flex-wrap:wrap}.limit select{max-width:170px}}
</style>
<div class="shell"><div class="context"><span>Character sheet / Powers / Example power</span><span>THROWAWAY PROTOTYPE</span></div><div id="app"></div><details class="state"><summary>Prototype state · in memory only</summary><pre id="state"></pre></details><p class="muted" id="tradeoff"></p></div>
<nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><span id="variant"></span><button id="next" aria-label="Next variant">→</button></nav>
<script>
const triggers = [{"id":"you-hit-with-opportunity-attack","label":"You hit with an opportunity attack","description":"Your opportunity attack hits an enemy.","on":"attack-resolved"},{"id":"marked-enemy-attacks-other","label":"A marked enemy attacks without targeting you","description":"An enemy marked by you makes an attack whose full target list excludes you. Add the adjacency restriction for Combat Challenge.","on":"attack-targeted"},{"id":"enemy-enters-range","label":"An enemy enters a square within range","description":"An enemy enters any square within the configured distance, including moves entirely within range and paths that finish outside it.","on":"movement-committed","defaultRangeSquares":2},{"id":"you-take-damage","label":"You take damage","description":"You lose HP or temporary HP to damage. Optional damage-type filters require recorded typed damage; manual HP edits have no type.","on":"hp-changed","damageRequired":true},{"id":"you-make-saving-throw","label":"You make a saving throw","description":"You finish a saving throw, whether it succeeds or fails (excluding death saves).","on":"save-resolved"},{"id":"you-or-ally-fails-save","label":"You or an ally fails a saving throw","description":"You or an allied combatant within range fails a saving throw.","on":"save-resolved","defaultRangeSquares":10},{"id":"ranged-ac-reflex-hits-you","label":"A ranged attack against AC or Reflex hits you","description":"A ranged attack hits your AC or Reflex. Other attack triggers also offer attack-type and defense filters.","on":"attack-resolved"},{"id":"companion-targeted","label":"Your companion is targeted","description":"The selected companion is targeted by an attack. Prompts its owner, even when the companion has no initiative slot.","on":"attack-targeted","companion":true},{"id":"companion-hit","label":"Your companion is hit","description":"The selected companion is hit by an attack. Use the melee filter for Infectious Spark.","on":"attack-resolved","companion":true},{"id":"you-bloody-enemy","label":"You bloody an enemy","description":"Your recorded damage takes an enemy from above its bloodied threshold to that threshold or below.","on":"hp-changed"},{"id":"ally-reduced-to-zero","label":"An ally is reduced to 0 HP or below","description":"Another allied combatant drops from positive HP to 0 HP or below.","on":"hp-changed"},{"id":"you-reduce-enemy-to-zero","label":"You reduce an enemy to 0 HP","description":"Your recorded damage reduces an enemy from positive HP to 0 HP or fewer.","on":"hp-changed"},{"id":"adjacent-enemy-reduced-to-zero","label":"An enemy adjacent to you is reduced to 0 HP","description":"An adjacent enemy drops from positive HP to 0 HP or fewer, whoever caused it.","on":"hp-changed"},{"id":"enemy-misses-you","label":"Enemy misses you","description":"An enemy misses this actor.","on":"attack-resolved"},{"id":"enemy-misses-ally","label":"Enemy misses you or an ally","description":"An enemy misses this actor or an allied combatant within the configured range.","on":"attack-resolved","defaultRangeSquares":10},{"id":"enemy-hits-you","label":"Enemy hits you","description":"An enemy within the configured range hits this actor.","on":"attack-resolved","defaultRangeSquares":10},{"id":"attack-against-ac-or-reflex-misses-you","label":"An attack against AC or Reflex misses you","description":"An enemy misses this actor with an attack against AC or Reflex.","on":"attack-resolved"},{"id":"you-miss","label":"You miss","description":"This actor misses an enemy with an attack.","on":"attack-resolved"},{"id":"marked-creature-bloodied","label":"Creature marked by you becomes bloodied","description":"A creature marked by this actor becomes bloodied.","on":"hp-changed"},{"id":"you-become-bloodied","label":"You become bloodied","description":"This actor becomes bloodied.","on":"hp-changed"},{"id":"you-are-hit-by-melee-attack","label":"You are hit by a melee attack","description":"An enemy hits this actor with a Weapon or Melee X attack.","on":"attack-resolved"},{"id":"marked-creature-moves-adjacent","label":"Adjacent creature marked by you shifts","description":"A creature marked by this actor shifts while adjacent to the actor.","on":"movement-committed"},{"id":"fails-saving-throw","label":"Fails Saving Throw","description":"This actor fails a saving throw.","on":"save-resolved"}];
const names={A:'Assigned first',B:'List + editor',C:'Guided setup'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';
let selected='enemy-hits-you', assigned={'enemy-hits-you':{rangeSquares:5}},limit='none',query='',category='All',adding=false,editing=null,step=1,message='';
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
const get=id=>triggers.find(t=>t.id===id);
const family=t=>t.companion?'Companion':t.on.startsWith('attack')?'Attacks':t.on==='hp-changed'?'HP & damage':t.on==='save-resolved'?'Saving throws':'Movement';
const categories=['All','Attacks','HP & damage','Saving throws','Movement','Companion'];
const limits=[['none','No shared limit'],['turn','Once per turn'],['firstEncounter','First time per encounter'],['day','Once per day']];
const header=()=>`<header class="title"><div class="eyebrow">Example power · Trigger prompts</div><h1>When should this power appear?</h1><p class="reference"><small>POWER TRIGGER</small><br>An enemy within 5 squares of you hits you.</p><button data-act="suggest">Suggest from trigger text</button> <small>Review before saving</small></header>`;
const shared=()=>`<div class="limit"><label>Shared limit <select data-field="limit">${limits.map(([v,n])=>`<option value="${v}" ${limit===v?'selected':''}>${n}</option>`).join('')}</select></label><small>${limit==='firstEncounter'?'Only the first qualifying event offers this power, even if ignored.':limit==='day'?'Spent when selected. Resets on Extended Rest.':limit==='turn'?'Spent when selected. Refreshes on the next creature’s turn.':'Applies across every trigger assigned to this power.'}</small></div>`;
const footer=()=>`<footer class="footer"><span>${Object.keys(assigned).length} assigned <small>· Unsaved prototype</small></span><div><button data-act="reset">Reset</button> <button class="primary" data-act="save">Save preview</button></div></footer>`;
function options(t){let p=assigned[t.id]||{};const check=(key,label)=>`<label><input type="checkbox" data-param="${key}" data-id="${t.id}" ${p[key]?'checked':''}>${label}</label>`;const filter=(key,label,values)=>`<fieldset><legend>${label} · any if none selected</legend>${values.map(v=>`<label><input type="checkbox" data-filter="${key}" data-value="${v}" data-id="${t.id}" ${(p[key]||[]).includes(v)?'checked':''}>${v.toUpperCase()}</label>`).join('')}</fieldset>`;return `<div class="options">${t.defaultRangeSquares!==undefined?`<label>Range <input type="number" min="0" data-param="rangeSquares" data-id="${t.id}" value="${p.rangeSquares??t.defaultRangeSquares}"> squares</label><br>`:''}${check('nonMinion','Non-minions only')}${check('meleeOnly','Melee attacks only')}${check('adjacentOnly','Adjacent only')}${t.on.startsWith('attack')||t.on==='hp-changed'?filter('attackTypes','Attack type',['melee','ranged','close','area']):''}${t.on.startsWith('attack')?filter('defenseTypes','Attacked defense',['ac','fort','ref','wil']):''}${t.damageRequired?filter('damageTypes','Damage type',['acid','cold','fire','force','lightning','necrotic','physical','poison','psychic','radiant','thunder']):''}${t.companion?`<label>Companion <select data-param="companionActorUuid" data-id="${t.id}"><option value="">Choose a companion</option>${['Spirit companion','Wolf companion'].map(n=>`<option ${p.companionActorUuid===n?'selected':''}>${n}</option>`).join('')}</select></label>`:''}</div>`}
function search(){return `<input aria-label="Search triggers" type="search" data-field="search" placeholder="Search ${triggers.length} triggers…" value="${esc(query)}"><div class="group">${categories.map(c=>`<button data-category="${c}" class="${category===c?'active':''}">${c}</button>`).join('')}</div>`}
const filtered=()=>triggers.filter(t=>(category==='All'||family(t)===category)&&`${t.label} ${t.description}`.toLowerCase().includes(query.toLowerCase()));
function summary(t){const p=assigned[t.id]||{};return [p.rangeSquares!==undefined?`Within ${p.rangeSquares} squares`:null,...['nonMinion','meleeOnly','adjacentOnly'].filter(k=>p[k]).map(k=>({nonMinion:'Non-minions',meleeOnly:'Melee only',adjacentOnly:'Adjacent only'})[k]),...['attackTypes','defenseTypes','damageTypes'].flatMap(k=>p[k]||[]),p.companionActorUuid].filter(Boolean).join(' · ')||'No extra conditions'}
function VariantA(){return `<div class="body"><div class="toolbar"><h2>Assigned triggers <span class="badge">${Object.keys(assigned).length}</span></h2><button data-act="add">${adding?'Close picker':'+ Add trigger'}</button></div>${Object.keys(assigned).map(id=>{const t=get(id);return `<article class="card"><div class="line"><h3>${esc(t.label)}</h3><button data-remove="${id}" aria-label="Remove ${esc(t.label)}">×</button></div><p class="muted">${summary(t)}</p><button data-edit="${id}">${editing===id?'Hide conditions':'Edit conditions'}</button>${editing===id?`<p>${esc(t.description)}</p>${options(t)}`:''}</article>`}).join('')||'<p class="empty">No triggers assigned. Add one to begin.</p>'}${adding?`<section class="card"><h3>Add a trigger</h3>${search()}<div class="scroll">${filtered().filter(t=>!assigned[t.id]).map(t=>`<div class="row line"><span>${esc(t.label)}</span><button data-add="${t.id}">Add</button></div>`).join('')||'<p class="empty">No unassigned matches.</p>'}</div></section>`:''}${shared()}</div>`}
function VariantB(){const t=get(selected);return `<div class="split"><aside class="catalog">${search()}<div class="scroll">${filtered().map(t=>`<button class="pick ${selected===t.id?'active':''}" data-select="${t.id}">${assigned[t.id]?'✓ ':''}${esc(t.label)}</button>`).join('')||'<p class="empty">No matching triggers.</p>'}</div></aside><section class="editor"><span class="eyebrow">${family(t)}</span><h2>${esc(t.label)}</h2><p class="muted">${esc(t.description)}</p><label><input type="checkbox" data-assign="${t.id}" ${assigned[t.id]?'checked':''}> Assigned to this power</label>${assigned[t.id]?options(t):'<p class="empty">Assign this trigger to configure its conditions.</p>'}</section></div><div class="body">${shared()}</div>`}
function VariantC(){const t=get(selected);return `<div class="body"><nav class="steps">${['Choose event','Set conditions','Review'].map((n,i)=>`<button data-step="${i+1}" class="${step===i+1?'active':''}">${i+1}. ${n}</button>`).join('')}</nav>${step===1?`<h2>What happens?</h2><p class="muted">Choose an event, then narrow down when it should count.</p><div class="tiles">${categories.slice(1).map(c=>`<button data-category="${c}" class="${category===c?'active':''}">${c}<small>${triggers.filter(t=>family(t)===c).length} available events</small></button>`).join('')}</div><div style="margin-top:12px"><input aria-label="Search events" type="search" data-field="search" placeholder="Search events" value="${esc(query)}"></div><div class="scroll" style="max-height:150px">${filtered().map(t=>`<button class="pick ${selected===t.id?'active':''}" data-select="${t.id}">${selected===t.id?'● ':''}${esc(t.label)}</button>`).join('')||'<p class="empty">No matching triggers.</p>'}</div><div class="toolbar"><small>Selected: ${esc(t.label)}</small><button class="primary" data-act="conditions">Next →</button></div>`:step===2?`<span class="eyebrow">Selected event</span><h2>${esc(t.label)}</h2><p class="muted">${esc(t.description)}</p>${options(t)}<div class="toolbar"><button data-step="1">← Back</button><button class="primary" data-act="review">Add & review →</button></div>`:`<h2>Ready to prompt</h2><p class="muted">This power will be offered when any assigned event qualifies.</p>${Object.keys(assigned).map(id=>`<article class="card"><h3>${esc(get(id).label)}</h3><p>${summary(get(id))}</p><button data-guide-edit="${id}">Edit</button> <button data-remove="${id}">Remove</button></article>`).join('')||'<p class="empty">No triggers assigned.</p>'}<button data-act="another">+ Add another event</button><div style="margin-top:16px">${shared()}</div>`}</div>`}
function render(){document.getElementById('app').innerHTML=`<section class="window">${header()}${({A:VariantA,B:VariantB,C:VariantC})[variant]()}${footer()}</section><p class="notice" role="status">${message}</p>`;document.getElementById('variant').textContent=`${variant} · ${names[variant]}`;document.getElementById('state').textContent=JSON.stringify({variant,selected,step,sharedLimit:limit,assignments:assigned},null,2);document.getElementById('tradeoff').textContent=({A:'A · Minimizes the everyday view. Browsing the catalog is an explicit Add action.',B:'B · Fastest for comparing many triggers. Only one set of conditions occupies space.',C:'C · Explains the setup one decision at a time. More clicks for experienced users.'})[variant]}
function add(id){assigned[id]??=get(id).defaultRangeSquares!==undefined?{rangeSquares:get(id).defaultRangeSquares}:{}}
document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.category){category=d.category}if(d.select){selected=d.select}if(d.add){add(d.add);editing=d.add;adding=false}if(d.remove){delete assigned[d.remove]}if(d.edit){editing=editing===d.edit?null:d.edit}if(d.step){step=+d.step;if(step===2)add(selected)}if(d.guideEdit){selected=d.guideEdit;step=2}if(d.act==='add'){adding=!adding}if(d.act==='suggest'){add('enemy-hits-you');assigned['enemy-hits-you'].rangeSquares=5;selected='enemy-hits-you';editing=selected;message='Matched “enemy within 5 squares hits you”. Review before saving.'}if(d.act==='conditions'){add(selected);step=2}if(d.act==='review'){step=3}if(d.act==='another'){step=1;query='';category='All'}if(d.act==='save'){message=Object.keys(assigned).some(id=>get(id).companion&&!assigned[id].companionActorUuid)?'Choose a companion for each companion event before saving.':'Preview saved in memory. No Foundry documents were changed.'}if(d.act==='reset'){assigned={'enemy-hits-you':{rangeSquares:5}};limit='none';query='';category='All';editing=null;adding=false;step=1;message='Reset to sample configuration.'}render()});
document.getElementById('app').addEventListener('input',e=>{const d=e.target.dataset;if(d.field==='search'){query=e.target.value;const start=e.target.selectionStart;render();const el=document.querySelector('[data-field="search"]');el.focus();el.setSelectionRange(start,start)}});
document.getElementById('app').addEventListener('change',e=>{const d=e.target.dataset;if(d.field==='limit')limit=e.target.value;if(d.assign){if(e.target.checked)add(d.assign);else delete assigned[d.assign]}if(d.param){add(d.id);assigned[d.id][d.param]=e.target.type==='checkbox'?e.target.checked:e.target.type==='number'?Math.max(0,Number(e.target.value)):e.target.value}if(d.filter){add(d.id);const list=new Set(assigned[d.id][d.filter]||[]);if(e.target.checked)list.add(d.value);else list.delete(d.value);assigned[d.id][d.filter]=[...list]}render()});
function cycle(delta){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+delta+3)%3];const url=new URL(location);url.searchParams.set('variant',variant);history.replaceState(null,'',url);message='';render()}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});render();
</script></html>

<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font:14px Arial,sans-serif}p{line-height:1.5}.intro{margin:0 0 14px;color:var(--muted-foreground)}.stage{background:#191a20;border-radius:12px;padding:20px;max-width:460px;margin:auto;color:#eee6d9}.top{display:flex;justify-content:space-between;color:#bdb7ad;font-size:12px;margin-bottom:20px}.speaker{font-size:12px;margin:16px 4px 6px;color:#d1c6b4}.speaker small{float:right;color:#888}.card{border:1px solid #719b7e;border-left:4px solid #9dd5b0;border-radius:5px;background:linear-gradient(115deg,#2e4035,#292a30 70%);overflow:hidden;margin-bottom:7px}.row{display:grid;grid-template-columns:78px 1fr 10px;gap:10px;align-items:center;padding:11px 10px;min-height:82px;cursor:pointer}.score{text-align:center;border-right:1px solid #ffffff35;padding-right:10px}.score strong{display:block;font-size:19px;color:#b7e9c7}.score small{display:block;font-size:11px;color:#bcb9b1;margin-top:6px}.subject{font-size:12px;font-weight:bold;color:#b7e9c7}.source{font-size:11px;color:#c4bbae;margin-top:4px}.chevron{color:#c4bbae}.footer{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-top:1px solid #ffffff20;gap:12px}.formula{font-size:11px;color:#c4bbae}button{cursor:pointer;font:12px Arial;border:1px solid #897b63;color:#eee6d9;background:#393730;border-radius:4px;padding:7px 12px}button:hover{background:#504936;border-color:#d5bd8e}button:focus-visible{outline:2px solid #e5cc8e;outline-offset:2px}.inline{margin-top:9px;padding:5px 10px}.wide{width:100%;background:#50432f;border-color:#ad9365}.damage{background:linear-gradient(110deg,#383632,#292a30);border-color:#8b8275;border-left-color:#e9dfce}.damage .score strong,.damage .subject{color:#e9dfce}.calc{font:11px/1.5 Arial;color:#c4bbae;padding:10px;border-top:1px solid #ffffff20}.note{font-size:12px;color:var(--muted-foreground);margin:14px auto;max-width:460px;min-height:36px}.switch{position:sticky;bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;width:fit-content;max-width:100%;margin:20px auto 8px;background:var(--card,#25252b);color:var(--foreground);border:1px solid var(--border,#555);border-radius:30px;padding:6px;box-shadow:0 4px 20px #0003}.switch button{border:0;background:transparent;color:inherit;font-size:18px;padding:6px 12px}.switch span{font-size:12px;min-width:170px;text-align:center}.state{font:11px var(--font-mono,monospace);color:var(--muted-foreground);margin:12px auto;max-width:460px}.reset{display:block;margin:auto;background:transparent;color:var(--muted-foreground);border-color:var(--border)}
.row.side{grid-template-columns:68px minmax(0,1fr) 66px 10px;gap:8px}.side-action{padding:8px 5px;text-align:center;background:#50432f;border-color:#ad9365;line-height:1.4}.side-action small{display:block;font-size:10px;color:#d4c6ae}.row.icon-row{grid-template-columns:68px minmax(0,1fr) 32px 10px;gap:8px}.icon-button{padding:6px;width:32px;height:32px;display:grid;place-items:center}.icon-button svg{width:18px;height:18px}.damage-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;background:#292a30;border:0;border-top:1px solid #ffffff20;border-radius:0;padding:9px 12px;color:#d9c5a0;text-align:left}.tray{padding:12px;background:#202126;border-top:1px solid #ffffff20}.tray p{margin:0 0 10px;font-size:11px;color:#c4bbae}.tray button{width:100%}.tiny-detail{display:block;border:0;background:transparent;color:#bcb9b1;font-size:10px;padding:5px 0 0;text-align:left}.calc[hidden]{display:none}.collapse-button{border:0;background:transparent;color:#c4bbae;padding:0;width:10px;min-width:10px;height:32px;font:21px Arial;display:grid;place-items:center;align-self:center}.collapse-button:hover{background:transparent;color:#fff}.collapse-button[aria-expanded="true"]{transform:rotate(90deg)}.tiny-detail{display:none}</style></head><body>
<p class="intro">Revised D / E / F · The attack chevron stays at the far right, centered vertically. Damage controls work separately.</p>
<div class="stage"><div class="top"><span>CHAT LOG</span><span>Illustrative data</span></div><div class="speaker">Aric <small>just now</small></div><div id="attack"></div><div id="result" aria-live="polite"></div></div><p class="note" id="note"></p><div class="state" id="state"></div><button class="reset" onclick="reset()">Reset demo</button><div class="switch"><button aria-label="Previous variant" onclick="cycle(-1)">←</button><span id="label"></span><button aria-label="Next variant" onclick="cycle(1)">→</button></div>
<script>

const names=['D · Verdict companion','E · Dice shortcut','F · Damage drawer'];
const notes=['D: a labeled damage button beside the result, followed by the original collapse chevron. The card stays a single row.','E: a dice shortcut immediately before the collapse chevron. Compact, with a tooltip and accessible label to distinguish the controls.','F: the attack keeps its original summary layout and chevron. A separate Damage drawer opens below it, independently of the calculation.'];
let v='DEF'.indexOf(new URLSearchParams(location.search).get('variant'));if(v<0)v=0;let rolled=false,opened=false,expanded=false;
function render(){
const verdict='<div class="score"><strong>Hit</strong><small>Total 24</small></div>';
const identity='<div><div class="subject">vs. Dockside Enforcer</div><div class="source">Tide of Iron · Longsword</div><button class="tiny-detail" onclick="toggle()">Attack details ›</button></div>';
const chevron='<button class="collapse-button" aria-label="Toggle attack calculation" aria-expanded="'+expanded+'" onclick="toggle()">›</button>';let content='';
if(v===0){content='<div class="row side">'+verdict+identity+'<button class="side-action" onclick="roll()">Damage<small>1d8 + 6</small></button>'+chevron+'</div>';}
if(v===1){content='<div class="row icon-row">'+verdict+identity+'<button class="icon-button" aria-label="Roll Damage: 1d8 plus 6" title="Roll Damage · 1d8 + 6" onclick="roll()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1" fill="currentColor"/><circle cx="16" cy="8" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8" cy="16" r="1" fill="currentColor"/><circle cx="16" cy="16" r="1" fill="currentColor"/></svg></button>'+chevron+'</div>';}
if(v===2){content='<div class="row">'+verdict+identity+chevron+'</div><button class="damage-toggle" aria-expanded="'+opened+'" onclick="opened=!opened;render()"><span>Damage</span><span>'+(opened?'⌃':'1d8 + 6 ⌄')+'</span></button>'+(opened?'<div class="tray"><p>Longsword · Physical<br>1d8 weapon damage + 6</p><button onclick="roll()">Roll Damage</button></div>':'');}
document.getElementById('attack').innerHTML='<div class="card">'+content+'<div class="calc" id="calc" '+(expanded?'':'hidden')+'>D20 16 + 8 = 24 · vs. AC 19</div></div>';
document.getElementById('result').innerHTML=rolled?'<div class="card damage"><div class="row"><div class="score"><strong>11</strong><small>DAMAGE</small></div><div><div class="subject">Physical damage</div><div class="source">Tide of Iron · Longsword</div></div><span class="chevron">›</span></div><div class="calc">1d8 [5] + 6 = 11 · Simulated result</div></div>':'';
document.getElementById('label').textContent=names[v];document.getElementById('note').textContent=notes[v];document.getElementById('state').textContent='Variant '+'DEF'[v]+' · damage: '+(rolled?'rolled (11)':'pending')+(v===2?' · drawer: '+(opened?'open':'closed'):'')+' · attack details: '+(expanded?'open':'closed')+' · HP changes: none';
}
function roll(){rolled=true;render()}function reset(){rolled=false;opened=false;expanded=false;render()}function toggle(){expanded=!expanded;render()}
function cycle(d){v=(v+d+3)%3;rolled=false;opened=false;expanded=false;try{const u=new URL(location.href);u.searchParams.set('variant','DEF'[v]);history.replaceState(null,'',u)}catch(e){}render()}
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></body></html>

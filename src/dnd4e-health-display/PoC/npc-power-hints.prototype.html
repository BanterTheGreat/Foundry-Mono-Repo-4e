<!doctype html>
<!-- THROWAWAY: Three fresh NPC power-list designs; ?variant=A/B/C. Sample data only. -->
<html lang="en"><meta charset="utf-8"><title>NPC power list exploration</title>
<style>
:root{font-family:Arial,sans-serif;color:var(--foreground,#e6dfc9);color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #e6ca83;outline-offset:2px}.tools{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-bottom:14px;align-items:center;color:var(--muted-foreground,#aaa)}select{background:#24241d;border:1px solid #695b36;color:#dfd2aa;padding:5px}.sheet{background:linear-gradient(100deg,#181915,#0f100f);border:1px solid #796b43;border-radius:5px;overflow:hidden;color:#e4dfcd}.header{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(100deg,#2a271c,#171712);padding:13px 12px;border-bottom:1px solid #655735;font-size:11px}.header strong{font:small-caps bold 14px Georgia}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:6px;gap:12px;min-height:340px}.powers{min-width:0;border-right:1px solid #5c5134;padding-right:10px}.traits{min-width:0}.traits details{margin-bottom:7px;border:1px solid #655936;border-radius:3px;background:#25241c;color:#d9c990;font-size:12px}.traits summary{padding:6px;cursor:pointer;font-weight:bold}.traits p{padding:0 8px;line-height:1.5;color:#bcb49d}.section{display:flex;justify-content:space-between;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#b9aa7c;padding:10px 5px 6px}.count{color:#777864}.power{border-left:3px solid #638459;border-bottom:1px solid #292b22;padding:9px 7px}.power.encounter{border-left-color:#a35a49}.titleline{display:flex;align-items:flex-start;gap:6px}.name{font-weight:bold;font-size:12px;line-height:1.4;flex:1;min-width:0}.chat{background:#191a13;border:1px solid #554a2b;border-radius:3px;color:#dfcd8c;font-size:12px;padding:2px 5px;flex-shrink:0}.meta{font-size:11px;color:#a9aa94;line-height:1.6}.effect{color:#dfc28a}.targets{color:#e0af9e}.hint{display:flex;gap:7px;font-size:11px;line-height:1.6;margin-top:4px;align-items:baseline}.label{color:#898d7c;font-size:9px;text-transform:uppercase;letter-spacing:.5px;min-width:37px}.action{font-size:10px;color:#bcc8bc;white-space:nowrap}.summary{margin-top:5px;font-size:11px;line-height:1.65;color:#aaa995}.summary b{font-weight:normal;color:#e0c388}.summary em{font-style:normal;color:#e0af9e}.tile{margin:5px 0 9px;background:#20211b;border:1px solid #3b3d2d;border-left:3px solid #638459;border-radius:3px;padding:9px}.tile .titleline{margin-bottom:5px}.actionline{font-size:10px;color:#b7bca5;margin-bottom:5px}.tile .hint{border-top:1px solid #36382b;padding-top:5px;margin-top:5px}.compact{width:100%;text-align:left;display:flex;align-items:center;gap:6px;border:0;border-bottom:1px solid #303126;border-left:3px solid #638459;background:transparent;color:#e4dfcd;padding:10px 6px}.compact.selected{background:#313021;border-left-color:#d6bd76}.compact .name{font-size:12px}.mini{font-size:10px;color:#d7bb80;white-space:nowrap}.detail{margin:10px 0 4px;padding:11px;background:#25261d;border:1px solid #68603d;border-radius:3px}.detail .name{margin-bottom:4px}.detail .hint{margin-top:8px}.explanation,.state{font-size:12px;line-height:1.6;color:var(--muted-foreground,#aaa);margin-top:12px}.state{font-size:11px;border-top:1px solid var(--border,#454239);padding-top:8px}.switcher{position:sticky;bottom:8px;margin:20px auto 8px;width:max-content;max-width:100%;display:flex;align-items:center;gap:12px;background:#eee4ca;color:#26241a;border:1px solid #9c8954;border-radius:24px;padding:6px 9px;font-size:12px;box-shadow:0 3px 16px #0005}.switcher button{background:none;border:0;color:inherit;padding:5px 8px}.prototype{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted-foreground,#aaa);margin-bottom:9px}@media(max-width:500px){.split{gap:6px}.powers{padding-right:5px}.power,.tile{padding:7px 4px}.traits summary{font-size:10px}.name,.compact .name{font-size:11px}.mini{white-space:normal}.label{min-width:28px;font-size:8px}.compact{flex-wrap:wrap}.action{font-size:9px}}
.powers{max-height:370px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#625838 #191a15}.split{align-items:start}.switcher{position:relative;bottom:auto}.dense{padding:7px 6px;border-left:3px solid #638459;border-bottom:1px solid #303126}.dense.encounter{border-left-color:#a35a49}.dense-top{display:flex;gap:7px;align-items:baseline}.dense-top .name{flex:1}.dense-top .action{margin-left:auto;text-align:right}.dense-bottom{display:flex;justify-content:space-between;gap:5px 9px;align-items:baseline;flex-wrap:wrap;font-size:10px;line-height:1.5;margin-top:2px}.dense-bottom .targets{margin-left:auto;text-align:right}.dense .defense{color:#919880;font-size:9px}.dense .name{font-size:12px}.dense-bottom .effect:empty{display:none}.dense-bottom:empty{display:none}.dense-hint{font-size:10px;color:#939781;margin:10px 5px;line-height:1.5}</style>
<div class="prototype">Design exploration &middot; sample NPC / powers / PCs</div>
<div class="tools"><label>Disposition <select id="disposition"><option>Hostile</option><option>Neutral</option><option>Friendly</option></select></label><label>Scene <select id="scene"><option value="party">Three PCs</option><option value="empty">No PCs</option></select></label></div>
<div class="sheet"><header class="header"><strong>Sheet</strong><span>Stormcaller &middot; NPC &nbsp; &times;</span></header><div class="split"><section class="powers" id="powers" aria-label="Powers"></section><aside class="traits" aria-label="NPC Traits"><details><summary>Storm Aura (Aura 2)</summary><p>Sample trait description: enemies feel the gathering storm.</p></details><details><summary>Stormborn</summary><p>Sample passive trait description.</p></details><details><summary>Windborne Step</summary><p>Sample movement trait description.</p></details></aside></div></div>
<div class="explanation" id="explanation"></div><div class="state" id="state"></div>
<nav class="switcher" aria-label="Design options"><button id="prev" aria-label="Previous design">&#8592;</button><span id="variant"></span><button id="next" aria-label="Next design">&#8594;</button></nav>
<script>
const data=[{name:'Chain Lightning',action:'Standard',def:'Reflex',condition:'Dazed',weak:['Mira','Thorn']},{name:'Touch of Summer Storms',action:'Standard',def:'AC',condition:'Prone',weak:[]},{name:'Cloudwood Fog',action:'Standard',def:'Will',condition:'Blinded',weak:['Mira']},{name:'Wind Bolts',action:'Minor',def:'Fortitude',condition:'',weak:['Gale']},{name:'Warding Vortex',action:'Reaction',def:'Reflex',condition:'Slowed',weak:['Mira','Thorn'],encounter:true},{name:'Four Winds Defense',action:'Other',def:'',condition:'',weak:[]}];
const labels={A:'Compact shared line',B:'Power summaries',C:'Select to inspect'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!labels[variant]){variant='A';}let selected=0;
function weak(p){return document.querySelector('#disposition').value!=='Friendly'&&document.querySelector('#scene').value==='party'&&p.def&&p.def!=='AC'?p.weak:[];}
function chat(){return '<button class="chat" aria-label="Post power to chat (prototype placeholder)" title="Chat placeholder">&#9679;</button>';}
function hints(p){const names=weak(p);return (p.condition?'<div class="hint"><span class="label">Applies</span><span class="effect">'+p.condition+'</span></div>':'')+(names.length?'<div class="hint"><span class="label">Weak</span><span class="targets">'+names.join(', ')+'</span></div>':'');}
function VariantA(){return data.map(p=>{const names=weak(p);return '<div class="dense '+(p.encounter?'encounter':'')+'"><div class="dense-top"><span class="name">'+p.name+'</span><span class="action">'+p.action+'</span></div>'+(p.condition||names.length?'<div class="dense-bottom">'+(p.condition?'<span class="effect">'+p.condition+'</span>':'')+(names.length?'<span class="targets" title="vs '+p.def+'; tied for lowest non-AC defense">Weak: '+names.join(', ')+'</span>':'')+'</div>':'')+'</div>';}).join('')+'<p class="dense-hint">Condition below the title; weak PCs share that line on the right. Long names wrap instead of widening the power column.</p>';}
function VariantB(){return data.map(p=>'<article class="tile '+(p.encounter?'encounter':'')+'"><div class="actionline">'+p.action+' / '+(p.def?'vs '+p.def:'Utility')+'</div><div class="titleline"><span class="name">'+p.name+'</span>'+chat()+'</div>'+hints(p)+'</article>').join('');}
function VariantC(){return data.map((p,i)=>'<button class="compact '+(i===selected?'selected':'')+'" data-select="'+i+'" aria-pressed="'+(i===selected)+'"><span class="name">'+p.name+'</span><span class="action">'+p.action+'</span><span class="mini" title="'+(p.condition||'No condition')+'">'+(p.condition||'')+'</span></button>').join('')+'<div class="detail"><div class="titleline"><div class="name">'+data[selected].name+'</div>'+chat()+'</div><div class="meta">'+data[selected].action+' / '+(data[selected].def?'vs '+data[selected].def:'Utility')+'</div>'+hints(data[selected])+(weak(data[selected]).length?'':'<div class="hint meta">'+(data[selected].def==='AC'?'AC attack - no weakness hints.':document.querySelector('#disposition').value==='Friendly'?'Friendly NPC - weakness hints hidden.':document.querySelector('#scene').value==='empty'?'No PCs on scene.':'No weak PCs for this power.')+'</div>')+'</div>';}
function render(){document.querySelector('#powers').innerHTML=({A:VariantA,B:VariantB,C:VariantC}[variant])();document.querySelectorAll('[data-select]').forEach(el=>el.onclick=()=>{selected=Number(el.dataset.select);render();});document.querySelector('#variant').textContent=variant+' / '+labels[variant];document.querySelector('#explanation').textContent={A:'A - Two lines when needed: title and right-aligned action above; condition and right-aligned weak PC names below. Powers without extra information use one line. Chat buttons are omitted here to explore the minimum-height layout.',B:'B - Read each power as a small summary: action and defense above its name, then explicitly labeled effects and weak PCs. More height, less decoding.',C:'C - Keep a short power index with action and condition visible. Select a power to see its defense and weak PCs below. This trades always-visible PC names for a shorter list.'}[variant];document.querySelector('#state').innerHTML='State: '+document.querySelector('#disposition').value+' / '+(document.querySelector('#scene').value==='party'?'Mira, Thorn, Gale on scene':'No PCs on scene')+' / Selected: '+data[selected].name+'<br>Sample lowest defenses: Mira - Reflex / Will (tie); Thorn - Reflex; Gale - Fortitude.<br>Weak = targeted defense is tied for the PC’s lowest non-AC defense. AC attacks and friendly NPCs hide weakness hints. Traits always retain the right half.';}
function cycle(d){variant='ABC'[('ABC'.indexOf(variant)+d+3)%3];const url=new URL(location.href);url.searchParams.set('variant',variant);try{history.replaceState(null,'',url);}catch{}render();}
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.querySelectorAll('select').forEach(el=>el.onchange=render);document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]')){return;}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1);}});render();
</script></html>

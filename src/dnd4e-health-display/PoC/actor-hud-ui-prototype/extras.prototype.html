<!doctype html>
<!-- THROWAWAY: Which Extras structure stays usable as actions grow? Three variants in the same mock HUD, ?variant=A|B|C. No Foundry mutations. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extras prototype</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--foreground,#e8dfcc)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #dfc482;outline-offset:2px}.controls{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-bottom:12px}.hud{max-width:680px;margin:auto;background:linear-gradient(120deg,#151611,#252219);color:#e8dfcc;border:1px solid #776540;border-radius:6px;overflow:hidden;font-size:13px}.head{padding:12px;border-bottom:1px solid #554a32;display:flex;justify-content:space-between;align-items:center}.head strong{font-family:Georgia,serif;font-size:19px}.head small,.muted{color:#b5aa91}.health{height:4px;background:#792e32;margin-top:7px;width:80%}.popup{margin:12px;border:1px solid #685938;border-radius:5px;background:#161712}.title{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #554a32}.title span{color:#b5aa91}.workspace{height:330px;overflow:auto;padding:12px;scrollbar-color:#776540 #171713}h3{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#c8b27a;margin:12px 0 7px}h3:first-child{margin-top:0}button{color:inherit;background:#29281e;border:1px solid #655737;border-radius:4px;padding:8px}button:hover{background:#373324;border-color:#c3aa6a}button:disabled{opacity:.4;cursor:default}.action{display:flex;width:100%;align-items:center;text-align:left;gap:10px;margin:5px 0;padding:9px 10px}.action .icon{color:#c8b27a;width:20px;text-align:center;font-size:18px}.action .copy{flex:1}.action strong{display:block;font-size:12px}.action small{display:block;color:#b5aa91;font-size:11px;margin-top:3px}.action .arrow{color:#b5aa91}.grouped{display:grid;grid-template-columns:1fr 1fr;gap:12px}.split{display:grid;grid-template-columns:125px 1fr;gap:14px}.side{border-right:1px solid #554a32;padding-right:10px}.side button{display:block;width:100%;text-align:left;margin-bottom:7px;background:transparent;border-color:transparent}.side button.active{background:#393222;border-color:#9e8550}.search{width:100%;background:#25251c;color:inherit;border:1px solid #74623e;border-radius:4px;padding:9px;margin-bottom:8px}.compact .action{background:transparent;border:0;border-bottom:1px solid #403c2c;border-radius:0;margin:0;padding:10px 3px}.compact .tag{font-size:10px;color:#b5aa91}.dock{display:flex;gap:5px;align-items:center;padding:10px;flex-wrap:wrap}.dock button{padding:6px;font-size:11px}.dock .spacer{flex:1}.active{border-color:#c3aa6a;background:#393222}.state{font-size:12px;line-height:1.5;color:var(--muted-foreground,#a89f8b);min-height:42px;margin:12px 0}.switcher{position:sticky;bottom:8px;display:flex;width:max-content;max-width:100%;align-items:center;gap:12px;padding:7px;margin:12px auto;background:#302b20;color:#eee1bd;border:1px solid #a58b50;border-radius:24px;box-shadow:0 4px 12px #0008;font-size:12px}.switcher button{border:0;border-radius:50%}.note{font-size:12px;margin:0 0 12px;line-height:1.5;color:var(--muted-foreground,#b5aa91)}@media(max-width:450px){.grouped{grid-template-columns:1fr}.split{grid-template-columns:95px 1fr;gap:8px}.workspace{padding:9px}.action{padding:8px}.head strong{font-size:16px}.title span{font-size:11px}}
/* Match the production Extras footprint; grow by scrolling, not panel size. */
.hud{max-width:365px;background:transparent;border:0;overflow:visible}.head{display:none}.popup{width:345px;max-width:100%;margin:0 0 8px auto;background:linear-gradient(180deg,#101011fa,#0d0d0efc)}.title{padding:10px;font-size:14px}.title span{font-size:10px}.workspace{height:auto;max-height:310px;min-height:150px;padding:5px}.grouped{display:block}.grouped section+section{margin-top:10px}h3{font-size:11px;letter-spacing:0;text-transform:none;margin:8px 4px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.action{min-height:32px;margin:0;padding:6px 8px;gap:6px}.action small,.action .arrow{display:none}.action strong{font-size:12px;font-weight:400}.action .icon{font-size:14px;width:16px}.pair .action{justify-content:center;text-align:center}.pair .copy{flex:initial}.pair .action:only-child{grid-column:1/-1}.split{grid-template-columns:88px 1fr;gap:7px;min-height:180px}.split .action{margin-bottom:5px}.side{padding-right:5px}.side button{font-size:11px;padding:7px 3px}.compact .action{padding:6px 4px;min-height:30px}.compact .tag{font-size:9px}.search{padding:6px 8px;font-size:12px;margin-bottom:5px}.dock{background:#191813;border:1px solid #776540;border-radius:4px;justify-content:flex-end;padding:5px;gap:4px}.dock button{font-size:11px;padding:5px}.dock button:nth-child(-n+4){display:none}.note{max-width:520px}.controls{font-size:11px}.switcher{font-size:11px}.wide .popup{width:365px}
.labeled section{display:grid;grid-template-columns:68px 1fr;gap:5px;align-items:center;padding:6px 2px;border-bottom:1px solid #65543366}.labeled h3{margin:0 3px;font-size:10px}.labeled .pair{gap:4px}.labeled .action{padding:5px 3px;min-height:32px}.labeled .icon{display:none}.labeled .action strong{font-size:11px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.columns section{border-top:1px solid #655433;padding-top:2px}.columns .action{margin-bottom:4px}.columns h3{margin:5px 3px 7px}.columns .action strong{font-size:11px}
</style></head><body>
<p class="note">Throwaway · actual-size Extras popup: 345px wide, scrolling content capped at 310px. Actions simulate selection only.</p>
<div class="controls"><label><input id="wide" type="checkbox"> Slightly wider (365px)</label><label><input id="future" type="checkbox"> Add 6 future actions</label><label><input id="caster" type="checkbox" checked> Wizard (show spellbook)</label></div>
<div class="hud"><header class="head"><div><strong>Elaria Voss</strong><div class="health"></div></div><small>Level 8 wizard · 42 / 52 HP</small></header><section class="popup"><div class="title"><strong>Extras</strong><span>Elaria Voss</span></div><main id="workspace" class="workspace"></main></section><nav class="dock"><button>Standard 6</button><button>Minor 3</button><button>Reaction 2</button><button>Other 4</button><span class="spacer"></span><button>Skills</button><button>Items</button><button class="active">Extras</button></nav></div>
<p class="state" id="state" aria-live="polite"></p><div class="switcher"><button id="prev" aria-label="Previous variant">←</button><strong id="label"></strong><button id="next" aria-label="Next variant">→</button></div>
<script>
const names={A:'Grouped rows',B:'Labeled rows',C:'Section columns'},explanations={A:'Paired buttons, compact headings. New actions add rows; overflow scrolls within the existing height cap.',B:'Group labels sit beside paired actions. Every action is visible without opening categories.',C:'Two columns of groups with vertically stacked actions. Every action takes one click.'};
let variant=new URLSearchParams(location.search).get('variant')||'A',category='Healing',query='';if(!names[variant]){variant='A';}
const base=[['Healing','Second Wind','Use your second wind','✚'],['Healing','Heal','Open healing controls','♡'],['Saves','Saving Throw','Roll a saving throw','◇'],['Saves','Death Save','Available while dying','◇',true],['Rests','Short Rest','Open short-rest options','☾'],['Rests','Extended Rest','Open extended-rest options','☾']];
const future=[['Preparation','Choose Rituals','Example future action','▤'],['Preparation','Manage Companions','Example future action','♧'],['Resources','Manage Action Points','Example future action','☆'],['Resources','Manage Surges','Example future action','♡'],['Resources','Recharge Items','Example future action','◆'],['Resources','Track Consumables','Example future action','▣']];
function items(){return [...base,...(document.querySelector('#caster').checked?[['Preparation','Prepare Spellbook','Choose prepared spells · proposed','▤']]:[]),...(document.querySelector('#future').checked?future:[])];}
function action(a,tag=false){return `<button class="action" data-name="${a[1]}" ${a[4]?'disabled title="Unavailable: actor is not dying"':''}><span class="icon" aria-hidden="true">${a[3]}</span><span class="copy"><strong>${a[1]}</strong><small>${a[2]}</small></span>${tag?`<span class="tag">${a[0]}</span>`:'<span class="arrow" aria-hidden="true">›</span>'}</button>`;}
function VariantA(data){return '<div class="grouped">'+[...new Set(data.map(a=>a[0]))].map(g=>`<section><h3>${g}</h3><div class="pair">${data.filter(a=>a[0]===g).map(a=>action(a)).join('')}</div></section>`).join('')+'</div>';}
function VariantB(data){return '<div class="labeled">'+[...new Set(data.map(a=>a[0]))].map(g=>`<section><h3>${g}</h3><div class="pair">${data.filter(a=>a[0]===g).map(a=>action(a)).join('')}</div></section>`).join('')+'</div>';}
function VariantC(data){return '<div class="columns">'+[...new Set(data.map(a=>a[0]))].map(g=>`<section><h3>${g}</h3>${data.filter(a=>a[0]===g).map(a=>action(a)).join('')}</section>`).join('')+'</div>';}
function results(data){return data.filter(a=>(a[0]+' '+a[1]).toLowerCase().includes(query.toLowerCase())).map(a=>action(a,true)).join('')||'<p class="muted">No matching actions.</p>';}
function render(){const data=items();document.querySelector('.hud').classList.toggle('wide',document.querySelector('#wide').checked);document.querySelector('#workspace').innerHTML=({A:VariantA,B:VariantB,C:VariantC})[variant](data);document.querySelector('#label').textContent=variant+' · '+names[variant];document.querySelector('#state').textContent=`${data.length} actions · ${document.querySelector('#caster').checked?'Wizard':'Non-caster'} · ${explanations[variant]}`;}

function cycle(delta){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+delta+3)%3];try{const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);}catch{}render();}
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.querySelectorAll('.controls input').forEach(el=>el.onchange=render);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')){return;}if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1);}});document.addEventListener('click',e=>{const group=e.target.closest('[data-group]'),action=e.target.closest('[data-name]');if(group){category=group.dataset.group;render();}if(action){document.querySelector('#state').textContent=`Preview selected: ${action.dataset.name}. No roll or document change.`;}});render();
</script></body></html>

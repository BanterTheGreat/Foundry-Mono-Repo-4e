function hp(d){return '<div class="readout"><span class="eyebrow">'+(d.hp===0?'Unconscious':d.hp<=35?'Bloodied':'Health')+'</span><span class="hpnum">'+d.hp+' <small>/ '+d.max+'</small></span></div>'+bars(d)}
function metrics(d){return '<div class="metrics"><span class="temp">TEMP HP <strong>'+d.temp+'</strong></span><span class="surges">SURGES <strong>'+d.surges+'/8</strong></span></div>'}
function team(d){return d.party.map(([name,h,m])=>'<div class="member"><header><span>'+name+'</span><b>'+h+'/'+m+'</b></header><div class="bar" style="--hp:'+h/m*100+'%"><span class="fill"></span></div>'+(h===0?'<small>Unconscious</small>':h<=m/2?'<small>Bloodied</small>':'')+'</div>').join('')}
function VariantA(d){return '<div class="hud a panel"><div class="identity">'+portrait()+'<div><h2 class="name">Ozyn<br>Valder</h2><small>Level 10<br>Warlock</small></div></div>'+tabs()+'<div class="core">'+hp(d)+metrics(d)+'</div><section class="team"><div class="eyebrow">Party health</div>'+team(d)+'</section>'+actions()+'</div>'}
function VariantB(d){return '<div class="hud b panel"><h2 class="name">Ozyn Valder</h2>'+tabs()+'<div class="hero">'+portrait()+'<div class="surgerail" aria-label="'+d.surges+' of 8 surges">'+Array.from({length:8},(_,i)=>'<i class="'+(i>=d.surges?'spent':'')+'"></i>').join('')+'</div><div class="overlay"><span class="hpnum">'+d.hp+' <small>/ 71 HP</small></span>'+bars(d)+'</div></div><div class="status">'+(d.hp===0?'Unconscious':d.hp<=35?'Bloodied':'Health stable')+'</div>'+metrics(d)+'<section class="team"><div class="eyebrow">Party health</div>'+team(d)+'</section>'+actions()+'</div>'}
function VariantC(d){return '<div class="hud c panel"><div class="top">'+portrait()+'<div class="core"><h2 class="name">Ozyn Valder</h2>'+hp(d)+'</div></div><div class="resources"><div class="resource temp">TEMPORARY HP<b>'+d.temp+'</b></div><div class="resource surges">HEALING SURGES<b>'+d.surges+' / 8</b></div></div>'+tabs()+'<section class="team"><div class="eyebrow">Party health</div>'+team(d)+'</section>'+actions()+'</div>'}

const entries={
Skills:[['Arcana','+14','Knowledge of magic, arcane lore and the planes.'],['Bluff','+13','Misdirection, convincing lies and clever distractions.'],['Endurance','+8','Withstand fatigue, harsh conditions and physical strain.'],['Insight','+10','Read intentions and recognize deception.'],['Intimidate','+13','Influence others through threats or force of presence.'],['Perception','+10','Notice hidden creatures, objects and subtle details.']],
Feats:[['Improved Initiative','Passive','Gain a bonus to initiative. Sample feat for layout review.'],['Implement Expertise','Passive','Improve attacks made with your chosen implement.'],['Hellfire Blood','Passive','A sample ancestry feat with fire-themed benefits.'],['Toughness','Passive','Additional resilience and maximum hit points.']],
Items:[['Pact blade +2','Equipped','A dark steel blade etched with the terms of an old bargain.'],['Rod of dark reward','Implement','A blackened rod with a silver raven at its crown.'],['Leather armor +2','Worn','Supple, rune-stitched leather with a deep burgundy lining.'],['Potion of healing','×3','Three stoppered vials of ruby-colored restorative liquid.'],['Adventurer’s kit','Gear','Rope, bedroll, flint, rations and other travel essentials.']]
};
function drawer(){if(!activeTab)return '';const rows=entries[activeTab].filter(e=>e[0].toLowerCase().includes(query.toLowerCase()));return '<section class="drawer" id="hud-drawer" aria-label="'+activeTab+' list"><div class="drawerhead"><span>'+activeTab+' <small>· '+rows.length+'</small></span><button class="close" data-close aria-label="Close list">×</button></div><input class="search" aria-label="Filter '+activeTab.toLowerCase()+'" placeholder="Find '+activeTab.toLowerCase()+'…" value="'+query.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')+'"><div class="entrylist">'+(rows.length?rows.map(e=>'<article class="entry"><button data-entry="'+e[0]+'" aria-expanded="'+(expanded===e[0])+'"><span>'+e[0]+'</span><b>'+e[1]+'</b></button>'+(expanded===e[0]?'<p>'+e[2]+'</p>':'')+'</article>').join(''):'<p class="empty">No matching entries.</p>')+'</div></section>'}
function VariantA(d){return '<div class="hud a panel"><div class="ornament">— ◇ —</div>'+portrait()+'<h2 class="name">Ozyn Valder</h2><div class="subtitle">Level 10 · Warlock</div>'+hp(d)+metrics(d)+'<section class="team"><div class="eyebrow">Sworn companions</div>'+team(d)+'</section>'+tabs()+drawer()+'</div>'}
function VariantB(d){return '<div class="hud b panel"><div class="ornament">✧</div><div class="bookhead">'+portrait()+'<div><h2 class="name">Ozyn<br>Valder</h2><div class="subtitle">Level 10<br>Warlock</div></div></div>'+hp(d)+metrics(d)+'<section class="team"><div class="eyebrow">The company</div>'+team(d)+'</section>'+tabs()+drawer()+'</div>'}
function VariantC(d){return '<div class="hud c panel"><h2 class="name">Ozyn Valder</h2><div class="crestrow">'+portrait()+'<div class="vital">'+hp(d)+'<div class="subtitle" style="text-align:left;margin:8px 0 0">Level 10 · Warlock</div></div></div><div class="resources"><div class="resource temp">TEMPORARY HP<b>'+d.temp+'</b></div><div class="resource surges">HEALING SURGES<b>'+d.surges+' / 8</b></div></div><section class="team"><div class="eyebrow">The warband</div>'+team(d)+'</section>'+tabs()+drawer()+'</div>'}

function render(){let d=data();document.getElementById('mount').innerHTML=[VariantA,VariantB,VariantC][variant](d);document.getElementById('choices').innerHTML=names.map((n,i)=>'<button data-variant="'+i+'" aria-pressed="'+(i===variant)+'">'+n+'</button>').join('');document.getElementById('title').textContent=names[variant];document.getElementById('size').textContent=['236 px wide','224 px wide','244 px wide'][variant];document.getElementById('description').textContent=descriptions[variant];document.getElementById('current').textContent=names[variant];document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.state===scenario));document.getElementById('state').textContent='THROWAWAY · '+scenario+' · HP '+d.hp+'/71 · Temp '+d.temp+' · Surges '+d.surges+'/8 · Party '+d.party.map(p=>p[0]+' '+p[1]+'/'+p[2]).join(' · ')+' · Open list: '+(activeTab||'none')+' · Sample entries; no Foundry connection.';console.log({variant:'ABC'[variant],scenario,...d})}
function choose(i){variant=(i+3)%3;try{let u=new URL(location);u.searchParams.set('variant','ABC'[variant]);history.replaceState(null,'',u)}catch{}render()}
document.getElementById('mount').addEventListener('click',e=>{const tab=e.target.closest('[data-tab]'),entry=e.target.closest('[data-entry]');if(tab){activeTab=activeTab===tab.dataset.tab?'':tab.dataset.tab;query='';expanded='';render()}else if(e.target.closest('[data-close]')){activeTab='';render()}else if(entry){expanded=expanded===entry.dataset.entry?'':entry.dataset.entry;render()}});
document.getElementById('mount').addEventListener('input',e=>{if(!e.target.matches('.search'))return;const pos=e.target.selectionStart;query=e.target.value;render();const field=document.querySelector('.search');field.focus();field.setSelectionRange(pos,pos)});
document.getElementById('choices').onclick=e=>{if(e.target.dataset.variant!==undefined)choose(Number(e.target.dataset.variant))};document.getElementById('prev').onclick=()=>choose(variant-1);document.getElementById('next').onclick=()=>choose(variant+1);document.querySelector('.scenario').onclick=e=>{if(e.target.dataset.state){scenario=e.target.dataset.state;render()}};document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();choose(variant-1)}if(e.key==='ArrowRight'){e.preventDefault();choose(variant+1)}});render();
</script></body></html>

<!doctype html>
<!-- Throwaway: compare three NPC sheet layouts via ?variant=A|B|C. Open this file directly. Mock data read from Actor.Lor7hHwN44EKYkQ2 through Foundry MCP; no live writes. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NPC traits prototype</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;color:var(--foreground,#e7dfc8);--brass:#99834d;--ink:#171713;--paper:#e7dfc8}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit;background:#28271e;border:1px solid var(--brass);border-radius:4px;padding:7px;cursor:pointer}button:focus-visible,summary:focus-visible{outline:2px solid #d7bd73} .controls{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:12px;flex-wrap:wrap}.controls span{opacity:.7}.hud{background:linear-gradient(120deg,#11120f,#201e17);border:1px solid var(--brass);border-radius:5px;color:var(--paper);overflow:hidden;font-size:13px}.head{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--brass)}.head small{color:#bbae89}.workspace{height:410px;padding:10px;overflow:auto;scrollbar-color:var(--brass) #171713}.layoutA{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:100%;overflow:hidden}.layoutA>section{overflow:auto;padding-right:5px;scrollbar-color:var(--brass) #171713}h3{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;margin:0 0 9px;color:#c3ae77}.feature{border:1px solid #655936;border-radius:4px;background:#24231b;margin-bottom:8px;padding:10px;line-height:1.4}.feature strong{color:#dfcd94}.feature p{margin:7px 0 0}.tag{font-size:10px;text-transform:uppercase;color:#b6aa86;display:block;margin-bottom:4px}.trigger{border-left:3px solid #bc9257}.power{border-left:3px solid #6d9560;background:#1a1c17;margin-bottom:8px;padding:10px;line-height:1.4}.power summary{cursor:pointer;font-weight:bold}.power small{display:block;color:#bcb59e;margin:6px 0}.power p{margin:7px 0}.power button{float:right;font-size:11px;padding:3px 8px}.flavour{margin-top:8px;color:#aaa18a;font-size:12px}.flavour summary{cursor:pointer}.dock{display:flex;gap:8px;align-items:center;padding:10px;border-top:1px solid #655936}.dock .spacer{flex:1}.reminders{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.reminders .feature{margin:0}.layoutB .feature{border:0;border-radius:0;border-bottom:1px solid #514b35;background:transparent;margin:0;padding:10px 5px}.layoutB h3{margin-top:12px}.notice{font-size:11px;color:#b9ad8c;margin:0 0 9px}.switcher{position:sticky;bottom:8px;margin:15px auto 0;width:max-content;max-width:100%;display:flex;gap:10px;align-items:center;padding:7px;background:#302b20;border:1px solid #a38d56;border-radius:24px;box-shadow:0 4px 12px #0008;font-size:12px}.state{font-size:11px;opacity:.7;margin:9px 0 0;min-height:28px}@media(max-width:500px){.layoutA{grid-template-columns:1fr 1.15fr;gap:7px}.feature,.power{padding:7px}.reminders{grid-template-columns:1fr}.head{gap:10px}}
</style></head><body>
<div class="controls"><strong>Lorcan Kell</strong><span>3 traits · 6 powers · snapshot from Foundry MCP</span></div>
<div class="hud"><header class="head"><strong>Sheet</strong><small>Lorcan Kell · Level 14 elite brute</small></header><main class="workspace" id="main"></main><nav class="dock"><button>Sheet</button><span class="spacer"></span><button>Skills</button><button>Items</button><button>Extras</button></nav></div>
<p class="state" id="state"></p><div class="switcher"><button id="prev" aria-label="Previous variant">←</button><strong id="label"></strong><button id="next" aria-label="Next variant">→</button></div>
<script>
const variants=['A','B','C'],names={A:'Parallel reference',B:'Stat-block flow',C:'Reminder strip'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants.includes(variant))variant='A';
const items=[{"name":"Distinguished Top Hat","type":"feature","system":{"description":{"value":"\u003cp>\u003cem>You deliver an attack that should send any man reeling, but all it does is bloody his mouth and knock his hat off.\u003c/em>\u003c/p>\u003cp>While Kell is wearing his distinguished top hat, if an effect would daze, stun, or dominate him or knock him prone, he can make a saving throw to avoid that condition; if he fails, he can choose to have the hat knocked off and avoid the condition. He can pick the hat back up and put it on as a move action, but not if he’s grabbing anyone.\u003c/p>","chat":"","unidentified":"","gm":""}}},{"name":"Master Grappler","type":"feature","system":{"description":{"value":"\u003cp>\u003cem>You try to escape, but Kell just chuckles and shakes his head.\u003c/em>\u003c/p>\u003cp>Kell gains combat advantage against creatures grabbed by him. He can maintain one grab at a time without having to spend an action (additional grabs each require a minor action, as normal). He can use his off hand to make attacks on his turn without ending the grab.\u003cbr>A creature grabbed by him cannot be affected by forced movement that would move the creature out of his grab unless Kell allows it.\u003c/p>","chat":"","unidentified":"","gm":""}}},{"name":"Sticking Knives into People Who Need Knives Stuck in Them","type":"feature","system":{"description":{"value":"\u003cp>\u003cem>As his brutal machete attacks draw up your guard, he slams a short knife into your forearm and leaves the blade in.\u003c/em>\u003c/p>\u003cp>Whenever Kell hits a creature with a weapon attack, he impales that creature with a knife, dagger, or other sharp implement. Whenever that creature ends its turn, if it took any standard actions on its turn, it takes 5 damage for each weapon stuck in it. The creature can spend a minor action to take 2 damage and remove one of these weapons. Kell has enough knives, daggers, and sharp implements to benefit from this trait every time he attacks.\u003c/p>","chat":"","unidentified":"","gm":""}}},{"name":"Man-Killing Machete","type":"power","system":{"description":{"value":"\u003cp>\u003cem>He hacks three times with a bloody machete at your chest and abdomen.\u003c/em>\u003c/p>","chat":"He hacks three times with a bloody machete at your chest and abdomen.","unidentified":"","gm":""},"useType":"atwill","actionType":"standard","rangeType":"melee","rangePower":"1","target":"One creature","attack":{"isAttack":true,"isBasic":true,"ability":"","def":"ac","formula":"19","shareAttackRoll":false,"isCharge":false,"isOpp":false,"canCharge":false,"canOpp":false,"abilityBonus":0,"defBonus":0,"detail":""},"hit":{"isDamage":true,"detail":"4d8+9 damage.","formula":"4d8 + 9","critFormula":"41","shareDamageRoll":true,"damageBonusNull":false,"isHealing":false,"healSurge":"","baseQuantity":"1","baseDiceType":"Base Weapon Damage","healFormula":""},"effect":{"detail":""},"rangeText":"","trigger":"","special":""}},{"name":"Throwing Knives","type":"power","system":{"description":{"value":"\u003cp>\u003cem>His fine coat parts to reveal an array of dozens of knives strapped to his abdomen. He grabs three and hurls them.\u003c/em>\u003c/p>","chat":"His fine coat parts to reveal an array of dozens of knives strapped to his abdomen. He grabs three and hurls them.","unidentified":"","gm":""},"useType":"atwill","actionType":"standard","rangeType":"range","rangePower":"6","rangeText":"Ranged 6/12","target":"One creature","special":"Kell has enough throwing knives to make this attack as many times as he likes.","attack":{"isAttack":true,"isBasic":true,"ability":"","def":"ac","formula":"19","shareAttackRoll":false,"isCharge":false,"isOpp":false,"canCharge":false,"canOpp":false,"abilityBonus":0,"defBonus":0,"detail":""},"hit":{"isDamage":true,"detail":"1d8+6 damage.","formula":"1d8 + 6","critFormula":"14","shareDamageRoll":true,"damageBonusNull":false,"isHealing":false,"healSurge":"","baseQuantity":"1","baseDiceType":"Base Weapon Damage","healFormula":""},"effect":{"detail":"Kell makes the following attack three times."},"trigger":""}},{"name":"Whirlwind of Slaughter","type":"power","system":{"description":{"value":"","chat":"","unidentified":"","gm":""},"useType":"atwill","actionType":"standard","rangeType":"personal","rangePower":"","target":"","attack":{"isAttack":false,"isBasic":false,"ability":"","def":"ac","formula":"","shareAttackRoll":false,"isCharge":false,"isOpp":false,"canCharge":false,"canOpp":false,"abilityBonus":0,"defBonus":0,"detail":""},"hit":{"isDamage":false,"detail":"","formula":"","critFormula":"","shareDamageRoll":true,"damageBonusNull":false,"isHealing":false,"healSurge":"","baseQuantity":"1","baseDiceType":"Base Weapon Damage","healFormula":""},"effect":{"detail":"Kell makes two basic attacks."},"rangeText":"","trigger":"","special":""}},{"name":"Bloody Kidnapping","type":"power","system":{"description":{"value":"\u003cp>\u003cem>He slams a dagger into your ribs and pulls you into his grasp.\u003c/em>\u003c/p>","chat":"He slams a dagger into your ribs and pulls you into his grasp.","unidentified":"","gm":""},"useType":"atwill","actionType":"minor","rangeType":"melee","rangePower":"1","target":"One creature","attack":{"isAttack":true,"isBasic":false,"ability":"","def":"ref","formula":"17","shareAttackRoll":false,"isCharge":false,"isOpp":false,"canCharge":false,"canOpp":false,"abilityBonus":0,"defBonus":0,"detail":""},"hit":{"isDamage":true,"detail":"2d8+9 damage and the target is grabbed (Escape DC 26). While the target is grabbed, Kell can use him as cover.","formula":"2d8 + 9","critFormula":"25","shareDamageRoll":true,"damageBonusNull":false,"isHealing":false,"healSurge":"","baseQuantity":"1","baseDiceType":"Base Weapon Damage","healFormula":""},"effect":{"detail":""},"rangeText":"","trigger":"","special":""}},{"name":"Butcher","type":"power","system":{"description":{"value":"\u003cp>\u003cem>As you reel from your wounds, Kell smiles and stabs at your eye.\u003c/em>\u003c/p>","chat":"As you reel from your wounds, Kell smiles and stabs at your eye.","unidentified":"","gm":""},"useType":"atwill","actionType":"free","rangeType":"melee","rangePower":"1","target":"Triggering creature","trigger":"A creature adjacent to Kell becomes bloodied for the first time in an encounter.","attack":{"isAttack":true,"isBasic":false,"ability":"","def":"ac","formula":"19","shareAttackRoll":false,"isCharge":false,"isOpp":false,"canCharge":false,"canOpp":false,"abilityBonus":0,"defBonus":0,"detail":""},"hit":{"isDamage":true,"detail":"3d4+6 damage and the target is blinded (save ends). After the target saves, it continues to take a −2 penalty to attack rolls that require it to see its target until it can have its eye regenerated.","formula":"3d4 + 6","critFormula":"18","shareDamageRoll":true,"damageBonusNull":false,"isHealing":false,"healSurge":"","baseQuantity":"1","baseDiceType":"Base Weapon Damage","healFormula":""},"effect":{"detail":""},"rangeText":"","special":""}},{"name":"Human Shield","type":"power","system":{"description":{"value":"\u003cp>\u003cem>Kell spins you in the way of an incoming attack.\u003c/em>\u003c/p>","chat":"Kell spins you in the way of an incoming attack.","unidentified":"","gm":""},"useType":"atwill","actionType":"interrupt","rangeType":"personal","rangePower":"","target":"","trigger":"An attack targets Kell while he has a creature grabbed.","attack":{"isAttack":false,"isBasic":false,"ability":"","def":"ac","formula":"","shareAttackRoll":false,"isCharge":false,"isOpp":false,"canCharge":false,"canOpp":false,"abilityBonus":0,"defBonus":0,"detail":""},"hit":{"isDamage":false,"detail":"","formula":"","critFormula":"","shareDamageRoll":true,"damageBonusNull":false,"isHealing":false,"healSurge":"","baseQuantity":"1","baseDiceType":"Base Weapon Damage","healFormula":""},"effect":{"detail":"Kell gains +4 to his defenses against the attack. If it misses, the attack instead targets the creature Kell has grabbed, using the original attack roll."},"rangeText":"","special":""}}];
const escapeText=s=>String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function splitDescription(html){const doc=new DOMParser().parseFromString(html||'','text/html');const flavour=[];doc.querySelectorAll('p').forEach(p=>{if(p.children.length===1&&p.firstElementChild.tagName==='EM'){flavour.push(p.textContent);p.remove()}});return {rules:doc.body.innerHTML,flavour:flavour.join(' ')}}
const traits=items.filter(i=>i.type==='feature'),powers=items.filter(i=>i.type==='power');
function feature(t){const desc=splitDescription(t.system.description.value);return `<article class="feature"><span class="tag">Trait</span><strong>${escapeText(t.name)}</strong>${desc.rules}${desc.flavour?`<details class="flavour"><summary>Flavour</summary>${escapeText(desc.flavour)}</details>`:''}</article>`}
function power(p){const s=p.system,a=s.attack,desc=splitDescription(s.description.value);const action={standard:'Standard',minor:'Minor',free:'Free action',interrupt:'Immediate interrupt'}[s.actionType]||s.actionType;const range=s.rangeText||([s.rangeType==='melee'?'Melee':s.rangeType==='personal'?'Personal':'Ranged',s.rangePower].filter(Boolean).join(' '));return `<details class="power ${s.trigger?'trigger':''}" open><summary>${escapeText(p.name)}</summary><small>${escapeText(action)} · At-will · ${escapeText(range)}${a.isAttack?' · +'+escapeText(a.formula)+' vs. '+escapeText(a.def.toUpperCase()):''}</small>${s.trigger?'<p><strong>Trigger:</strong> '+escapeText(s.trigger)+'</p>':''}${s.target?'<p><strong>Target:</strong> '+escapeText(s.target)+'</p>':''}${s.effect.detail?'<p><strong>Effect:</strong> '+escapeText(s.effect.detail)+'</p>':''}${s.hit.detail?'<p><strong>Hit:</strong> '+escapeText(s.hit.detail)+'</p>':''}${s.special?'<p><strong>Special:</strong> '+escapeText(s.special)+'</p>':''}${desc.rules}${desc.flavour?`<details class="flavour"><summary>Flavour</summary>${escapeText(desc.flavour)}</details>`:''}<p><button class="use" data-name="${escapeText(p.name)}">Use</button>${a.isBasic?'Basic attack':'Power'}</p></details>`}
function render(){const features=traits.map(feature).join('');const groups=[['standard','Standard actions'],['minor','Minor actions'],['free','Triggered actions'],['interrupt','Interrupts']];const actions=groups.map(([key,label])=>`<h3>${label}</h3>${powers.filter(p=>p.system.actionType===key).map(power).join('')}`).join('');document.querySelector('#main').innerHTML=variant==='A'?`<div class="layoutA"><section>${actions}</section><section><h3>Traits & feats · 3</h3>${features}</section></div>`:variant==='B'?`<div class="layoutB"><h3>Traits & feats · 3</h3>${features}${actions}</div>`:`<h3>Traits & feats · 3</h3><div class="reminders">${features}</div>${actions}`;document.querySelector('#label').textContent=variant+' · '+names[variant];document.querySelector('#state').textContent=`${variant} · 3 traits expanded · 6 powers expanded · ${variant==='A'?'Independent scrolling keeps traits beside powers.':variant==='B'?'One scroll: traits first, powers below.':'Two-column traits above powers; one shared scroll.'}`;}
function cycle(delta){variant=variants[(variants.indexOf(variant)+delta+3)%3];try{const u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u)}catch{}render()}
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.querySelectorAll('select').forEach(s=>s.onchange=render);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});document.addEventListener('click',e=>{if(e.target.matches('.use'))document.querySelector('#state').textContent='Preview only: '+e.target.dataset.name+' selected. No roll or resource change.'});render();
</script></body></html>

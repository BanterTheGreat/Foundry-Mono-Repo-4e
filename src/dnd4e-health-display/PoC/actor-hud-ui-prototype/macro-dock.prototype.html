6;border-radius:5px;padding:5px;color:#87918c;font:14px Georgia}.drawer{position:absolute;bottom:100%;margin-bottom:8px;right:0;width:420px;padding:16px;background:#10120ff5;border:1px solid #a1884d;border-radius:5px;box-shadow:0 8px 30px #000a}.drawer header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font:bold 17px Georgia}.entries{display:grid;grid-template-columns:1fr 1fr;gap:6px}.entries button{text-align:left;font:13px system-ui}.hint{font:11px system-ui;color:#a39b88;margin-top:10px}.B{left:380px;width:851px;flex-direction:row;align-items:end}.B .wing{display:flex;flex-direction:column;gap:5px;width:100px}.B .core{flex:1;display:flex;flex-direction:column;gap:5px}.B .drawer{right:106px;width:420px}.C .drawer{width:420px}.C .modes button{padding:7px}.switcher{position:sticky;bottom:12px;width:max-content;max-width:100%;margin:18px auto 0;padding:7px;display:flex;align-items:center;gap:12px;background:#252a35;border:1px solid #7482a0;border-radius:30px;box-shadow:0 4px 20px #0006;color:#fff}.switcher button{border:0;background:#414a5e;color:#fff;border-radius:20px;font:16px system-ui}.switcher span{min-width:180px;text-align:center}.status{font:12px ui-monospace;color:var(--muted-foreground,#aaa);margin-top:12px}.details{margin-top:16px} .tags{display:flex;gap:6px;flex-wrap:wrap}.tags button{font:12px system-ui;padding:7px 10px}
.C .modes{gap:8px}.C .power-tabs,.C .library-tabs,.C .quick-tabs{display:flex;gap:3px}.C .power-tabs{flex:1}.C .power-tabs button{flex:1;white-space:nowrap}.C .modes button{font-size:12px;padding:7px 6px}.C .quick-tabs button{width:28px;padding:5px}.C .library-tabs{border-left:1px solid #6f603e;padding-left:8px}.C .quick-tabs{border-left:1px solid #6f603e;padding-left:8px}.dock .drawer{right:auto;left:var(--anchor-x,50%);transform:translateX(-50%);bottom:var(--anchor-y,100%)}.drawer::after{content:"";position:absolute;left:var(--pointer-x,50%);bottom:-6px;width:10px;height:10px;background:#10120f;border-right:1px solid #a1884d;border-bottom:1px solid #a1884d;transform:translateX(-50%) rotate(45deg)}.C .drawer{width:420px}</style></head><body><h2 id="title"></h2><p id="description"></p><div class="screen"><div class="world"><div class="erase-top"></div><div class="erase-side"></div><div id="dock" class="dock"></div></div></div><div class="details"><div class="tags"><button onclick="openPanel('Skills')">Try Skills</button><button onclick="openPanel('Heals')">Try Heals</button><button onclick="openPanel(null)">Close drawer</button></div><p id="tradeoff"></p><div class="status" id="state"></div></div><nav class="switcher" aria-label="Prototype variants"><button onclick="cycle(-1)" aria-label="Previous variant">←</button><span id="label"></span><button onclick="cycle(1)" aria-label="Next variant">→</button></nav><script>
const variants={A:['Two-row dock','Powers keep their current row. Skills, Feats and Items sit beneath them, with the four quick actions grouped at the right.','Recommended starting point: everything stays visible and the existing power categories remain one click away. Cost: one extra row above the macros.'],B:['Flanking wings','Skills, Feats and Items form a left wing; Action Point, Heals, Saves and Rests form a right wing. Powers remain directly above the macro slots.','The strongest separation between browsing and quick actions. Cost: a wider footprint and narrower macro slots; less suitable when the right sidebar is open.'],C:['Direct-access command dock','Click any tab: its panel opens upward with its bottom center anchored to that button. Power labels have no counts.','Each panel follows its own button. Click Skills, then Reaction or Items to compare the alignment. Only one panel opens at a time.']};
let variant=new URLSearchParams(location.search).get('variant')||'C';if(!variants[variant])variant='A';let panel=null;const dock=document.querySelector('#dock');
const btn=(s)=>`<button class="${panel===s?'active':''}" onclick="openPanel('${s}')">${s}</button>`;
const powers=()=>`<div class="row">${['Standard · 16','Minor · 8','Reaction · 1','Other · 3'].map(btn).join('')}</div>`;
const macro=()=>`<div class="macros">${'1234567890'.split('').map(s=>`<div class="macro">${s}</div>`).join('')}</div>`;
const quick=()=>['ϟ AP','♥ Heals','★ Saves','☾ Rests'].map(btn).join('');
function render(){dock.className='dock '+variant;if(variant==='A')dock.innerHTML=powers()+`<div class="row quick">${['Skills','Feats','Items'].map(btn).join('')}<div class="spacer"></div>${quick()}</div>`+macro();if(variant==='B')dock.innerHTML=`<div class="wing">${['Skills','Feats','Items'].map(btn).join('')}</div><div class="core">${powers()}${macro()}</div><div class="wing">${quick()}</div>`;if(variant==='C')dock.innerHTML=`<div class="row modes"><div class="power-tabs">${['Standard','Minor','Reaction','Other'].map(btn).join('')}</div><div class="library-tabs">${['Skills','Feats','Items'].map(btn).join('')}</div><div class="quick-tabs">${[['\u03df','AP','Action Point'],['\u2665','Heals','Heals'],['\u2605','Saves','Saves'],['\u263e','Rests','Rests']].map(([icon,key,label])=>`<button title="${label}" aria-label="${label}" class="${panel===key?'active':''}" onclick="openPanel('${key}')">${icon}</button>`).join('')}</div></div>`+macro();
if(panel){const key=panel.replace(/^[ϟ♥★☾] /,'');const samples={Skills:['Acrobatics +9','Arcana +17','Athletics +8','Diplomacy +12','Insight +14','Perception +14'],Feats:['Improved Initiative','Ritual Caster','Implement Expertise','Toughness'],Items:['Staff of Ruin','Adventurer’s Kit','Healing Potion','Magic Cloth Armor'],Heals:['Second Wind','Spend a Healing Surge'],Saves:['Saving Throw','Death Saving Throw'],Rests:['Short Rest','Extended Rest'],AP:['Spend Action Point']};let entries=samples[key]||[key.split(' \u00b7 ')[0]+' at-will power',key.split(' \u00b7 ')[0]+' encounter power',key.split(' \u00b7 ')[0]+' daily power',key.split(' \u00b7 ')[0]+' utility power'];dock.innerHTML+=`<section class="drawer"><header>${panel}<button onclick="openPanel(null)" aria-label="Close drawer">×</button></header>${key==='Powers'?powers():''}<div class="entries">${entries.map(s=>`<button onclick="demo(this)">${s}</button>`).join('')}</div><div class="hint">Illustrative content · clicks only simulate an action</div></section>`;}
document.querySelector('#title').textContent=variant+' — '+variants[variant][0];document.querySelector('#description').textContent=variants[variant][1];document.querySelector('#tradeoff').textContent=variants[variant][2];document.querySelector('#label').textContent=variant+' · '+variants[variant][0];document.querySelector('#state').textContent='Variant: '+variant+' | Open drawer: '+(panel||'none')+' | Mock data · no game changes';}
function anchorPanel(){const drawer=dock.querySelector('.drawer');if(!drawer)return;const trigger=[...dock.querySelectorAll('button')].find(b=>!b.closest('.drawer')&&b.classList.contains('active'));if(!trigger)return;const d=dock.getBoundingClientRect(),r=trigger.getBoundingClientRect();const scale=d.width/dock.offsetWidth;const world=dock.closest('.world').getBoundingClientRect();const available=2*Math.min(r.left+r.width/2-world.left,world.right-r.left-r.width/2)/scale-20;if(!trigger.closest('.quick-tabs')){drawer.style.width=Math.min(420,available)+'px'}else{drawer.style.width='240px';const shift=Math.max(0,120-(world.right-r.left-r.width/2)/scale+10);drawer.style.marginLeft=-shift+'px';drawer.style.setProperty('--pointer-x',(120+shift)+'px')}drawer.style.setProperty('--anchor-x',((r.left+r.width/2-d.left)/scale)+'px');drawer.style.setProperty('--anchor-y',((d.bottom-r.top)/scale)+'px')}
function openPanel(s){panel=panel===s?null:s;render()}function demo(b){document.querySelector('#state').textContent='Simulated: '+b.textContent+' | No game changes'}function cycle(n){const keys=Object.keys(variants);variant=keys[(keys.indexOf(variant)+n+3)%3];panel=null;try{const u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u)}catch{}render()}document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1);if(e.key==='Escape')openPanel(null)});function resize(){document.querySelector('.world').style.transform='scale('+document.querySelector('.screen').clientWidth/1248+')';anchorPanel()}new ResizeObserver(resize).observe(document.querySelector('.screen'));render();resize();anchorPanel();
</script></body></html>

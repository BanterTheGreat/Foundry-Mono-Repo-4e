<!doctype html>
<!-- THROWAWAY: Three Basic Attack indicators in the current NPC Sheet; ?variant=A/B/C. Sample flags, no Foundry writes. Open this file directly. -->
<html lang="en"><meta charset="utf-8"><title>Basic Attack indicator prototype</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;color:var(--foreground,#e8e0cb)}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #e6ca83;outline-offset:2px}.tools{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted-foreground,#aaa);margin:0 0 14px}.tag{font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;color:var(--muted-foreground,#aaa)}.sheet{width:50%;min-width:340px;background:linear-gradient(110deg,#1a1b17,#101110);border:1px solid #7c6a40;border-radius:5px;overflow:hidden;color:#e6dfca}.sheet.full{width:100%}.head{display:flex;gap:8px;align-items:center;padding:10px 8px;background:linear-gradient(110deg,#29261b,#161610);border-bottom:1px solid #67572f;font-size:10px;color:#c9bb98}.head strong{margin-right:auto;color:#e7dfc6;font:bold small-caps 14px Georgia}.close,.btn{border:1px solid #594b27;border-radius:4px;background:#12130d;color:#e1cf91;line-height:1;padding:4px 5px}.close{font-size:18px}.cols{padding:6px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.full .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.powers{min-width:0}.row{display:flex;align-items:center;gap:6px;border-left:3px solid #6d9360;border-bottom:1px solid #343123;padding:6px 5px;min-height:35px;margin-top:5px}.row:first-child{margin-top:0}.row.encounter{border-left-color:#a45d47}.icon{flex:0 0 16px;color:#c8bd93;text-align:center;font-size:17px}.namegroup{flex:1;min-width:0}.nameline{display:flex;align-items:baseline;gap:5px}.name{font-weight:bold;font-size:12px;line-height:1.3;min-width:0}.condition{font-size:10px;color:#dbc282;line-height:1.4;margin-top:1px}.right{display:flex;flex-direction:column;align-items:flex-end;max-width:45%;font-size:9px;line-height:1.4;text-align:right;min-width:0}.action{color:#c8c7b4;white-space:nowrap}.pc{color:#d5af9a}.buttons{display:flex;gap:4px;flex-shrink:0}.btn{font-size:13px;padding:4px}.badge{font-size:8px;font-weight:bold;letter-spacing:.5px;color:#e6ce8b;border:1px solid #78622c;background:#322c1b;padding:2px 3px;border-radius:2px;white-space:nowrap;flex-shrink:0}.basic-action{color:#e6ce8b;white-space:nowrap;font-size:9px}.traits{border-left:1px solid #665633;padding-left:10px;min-width:0}.traits[hidden]{display:none}.trait{background:#24241b;border:1px solid #665a32;color:#d8c68c;border-radius:3px;padding:6px;margin-bottom:7px;font-weight:bold;font-size:12px;line-height:1.3}.group{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#d8bd7c;padding:7px 3px 6px;border-bottom:1px solid #5f512e;margin-bottom:5px}.group.other{color:#a59f85;margin-top:9px}.description,.state{font-size:12px;line-height:1.6;color:var(--muted-foreground,#aaa);margin-top:12px}.state{font-size:11px;border-top:1px solid var(--border,#454239);padding-top:8px}.switch{position:sticky;bottom:8px;margin:20px auto 8px;display:flex;align-items:center;gap:12px;width:max-content;max-width:100%;border:1px solid #a38c50;border-radius:24px;background:#ece2c7;color:#242219;padding:6px 10px;font-size:12px;box-shadow:0 4px 14px #0005}.switch button{border:0;background:none;color:inherit;padding:5px 8px}@media(max-width:520px){.sheet{width:100%;min-width:0}.full .cols{gap:6px}.full .name{font-size:10px}.full .buttons{gap:2px}.full .btn{font-size:10px;padding:2px}.full .row{gap:3px;padding:5px 3px}.full .icon{flex-basis:12px}.full .right{max-width:40%}.full .badge{font-size:7px}.full .nameline{flex-wrap:wrap}}
</style>
<div class="tag">Throwaway prototype &middot; Basic Attack indicator</div>
<div class="tools"><label><input id="traits-toggle" type="checkbox"> NPC has Traits</label></div>
<div class="sheet" id="sheet"><header class="head"><strong>Sheet</strong><span>Nick Reder, Kell's Bodyguard</span><button class="close" aria-label="Close placeholder">&times;</button></header><div class="cols"><section class="powers" id="powers" aria-label="Powers"></section><aside class="traits" id="traits" hidden><div class="trait">&#9656; Sample NPC Trait</div><div class="trait">&#9656; Another Trait</div></aside></div></div>
<div class="description" id="description"></div><div class="state" id="state"></div>
<nav class="switch" aria-label="Prototype designs"><button id="prev" aria-label="Previous design">&#8592;</button><span id="variant"></span><button id="next" aria-label="Next design">&#8594;</button></nav>
<script>
const powers=[{name:'Full Metal Grapple',condition:'Prone, Grabbed',basic:true,action:'Standard',icon:'&#9876;'}, {name:'Submission Hold',condition:'Unconscious',action:'Standard',icon:'&#9876;',pcs:["Mork'allande (75%)",'Sedridor Wardyn (55%)','Rogal (75%)']},{name:'Musket with Flaming Ammunition',action:'Standard',icon:'&#10163;',encounter:true},{name:'Stunning Fist',condition:'Weakened',action:'Standard',icon:'&#9876;'}];
const labels={A:'Title badge',B:'Action label',C:'Basic Attacks group'};let variant=new URLSearchParams(location.search).get('variant')||'A';if(!labels[variant]){variant='A';}
function VariantA(p){return '<div class="nameline"><span class="name">'+p.name+'</span>'+(p.basic?'<span class="badge" title="Basic Attack">BASIC</span>':'')+'</div>';}
function VariantB(p){return '<div class="nameline"><span class="name">'+p.name+'</span></div>';}
function VariantC(p){return VariantB(p);}
function row(p){const title=({A:VariantA,B:VariantB,C:VariantC}[variant])(p);return '<div class="row '+(p.encounter?'encounter':'')+'"><span class="icon" aria-hidden="true">'+p.icon+'</span><div class="namegroup">'+title+(p.condition?'<div class="condition">'+p.condition+'</div>':'')+'</div><div class="right">'+(variant==='B'&&p.basic?'<span class="basic-action" title="Basic Attack using a Standard action">Basic &middot; '+p.action+'</span>':'<span class="action">'+p.action+'</span>')+(p.pcs||[]).map(name=>'<span class="pc">'+name+'</span>').join('')+'</div><div class="buttons"><button class="btn" title="Chat placeholder" aria-label="Chat placeholder">&#9679;</button><button class="btn" title="Use power placeholder" aria-label="Use power placeholder">&#8853;</button></div></div>';}
function render(){document.querySelector('#powers').innerHTML=variant==='C'?'<div class="group">Basic Attacks</div>'+powers.filter(p=>p.basic).map(row).join('')+'<div class="group other">Other Powers</div>'+powers.filter(p=>!p.basic).map(row).join(''):powers.map(row).join('');const hasTraits=document.querySelector('#traits-toggle').checked;document.querySelector('#sheet').classList.toggle('full',hasTraits);document.querySelector('#traits').hidden=!hasTraits;document.querySelector('#variant').textContent=variant+' / '+labels[variant];document.querySelector('#description').textContent={A:'A - BASIC sits beside the power title. It is separate from action cost and conditions, with no extra line. Recommended: easiest to recognize without changing the row structure.',B:'B - Basic shares the action label on the right. No extra height, but it competes for width with the PC percentages and may be mistaken for an action type.',C:'C - Basic attacks get their own group above the other powers. Strongest separation, but introduces headers, changes ordering and uses more vertical space.'}[variant];document.querySelector('#state').textContent='Sample state: Full Metal Grapple is marked Basic; the other three powers are not. These flags are illustrative, not read from Foundry. '+(hasTraits?'Traits occupy the right half.':'No Traits: Sheet is half the normal desktop width.')+' Action costs, conditions, PC percentages and controls are retained. Nothing is saved to Foundry.';}
function cycle(d){variant='ABC'[('ABC'.indexOf(variant)+d+3)%3];const url=new URL(location.href);url.searchParams.set('variant',variant);try{history.replaceState(null,'',url);}catch{}render();}
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.querySelector('#traits-toggle').onchange=render;document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]')){return;}if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1);}});render();
</script></html>

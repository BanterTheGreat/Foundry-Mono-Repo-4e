<!doctype html>
<!--
  THROWAWAY UI PROTOTYPE — not Foundry production code.
  Question: Which shared Start Combat dialog best creates a tense, legible
  initiative reveal for both the GM and players?
  Three variants, switchable with ?variant=A|B|C.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start Combat Dialog Prototype</title>
  <style>
    :root { color-scheme:dark; --void:#08090b; --ink:#111114; --panel:#181519; --panel-hi:#272025; --edge:#876448; --brass:#e1b06d; --paper:#f3dec0; --muted:#aa9989; --blood:#b83e3d; --danger:#e86150; --hero:#5d9cae; --green:#6b9d65; --line:rgb(228 181 116 / .30); font-family:Signika,system-ui,sans-serif; }
    * { box-sizing:border-box; } body { min-width:900px; min-height:100vh; margin:0; overflow:hidden; background:radial-gradient(ellipse at 50% 43%,#4b3a35 0,#211d20 38%,#090a0c 84%); color:var(--paper); }
    body::before { position:fixed; inset:0; background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px); background-size:52px 52px; mask-image:radial-gradient(circle at center,#000 0 30%,transparent 77%); content:""; }
    button { color:inherit; font:inherit; cursor:pointer; } button:focus-visible { outline:2px solid #ffe0a4; outline-offset:2px; }
    .veil { position:fixed; inset:0; background:linear-gradient(90deg,#0009,#0002 40%,#000a); } .prototype-note { position:fixed; z-index:1; bottom:5.2rem; left:1.25rem; max-width:19rem; color:#c2b09c; font-size:.74rem; line-height:1.45; } .prototype-note b { color:#f1ce98; }
    .dialog { position:relative; z-index:2; width:min(68rem,calc(100vw - 4rem)); max-height:calc(100vh - 5.7rem); min-height:36rem; margin:2rem auto; overflow:hidden; border:1px solid var(--edge); border-radius:.55rem; background:linear-gradient(135deg,#241b1e,#111115 65%); box-shadow:0 1.5rem 5rem #000d,inset 0 0 0 1px #fff1; }
    .dialog-header { display:flex; align-items:center; min-height:4.5rem; padding:.75rem 1rem; border-bottom:1px solid var(--line); background:linear-gradient(90deg,#5a2d25,#261a1c 45%,#171418); } .eyebrow { display:block; color:#e6ae68; font-size:.62rem; font-weight:700; letter-spacing:.15em; text-transform:uppercase; } h1,h2,h3,p { margin:0; } h1 { margin-top:.12rem; font-family:Georgia,serif; font-size:1.65rem; font-weight:normal; letter-spacing:.02em; } .header-action { margin-left:auto; padding:.55rem .75rem; border:1px solid #99724e; border-radius:.25rem; background:#1a1517; color:#e6c999; font-size:.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    .footer { position:absolute; right:0; bottom:0; left:0; display:flex; align-items:center; gap:.7rem; min-height:4.5rem; padding:.7rem 1rem; border-top:1px solid var(--line); background:#100e11; } .footer small { flex:1; color:var(--muted); font-size:.66rem; line-height:1.35; } .button { min-height:2.5rem; padding:.5rem .85rem; border:1px solid #876448; border-radius:.25rem; background:#211a1c; color:#e7c99d; font-size:.72rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; } .button:hover { border-color:#f2c47f; background:#4a2d20; } .button.primary { border-color:#e0a65c; background:linear-gradient(#7b4027,#482316); color:#ffe0b0; box-shadow:inset 0 1px #ffe1a64d; } .button.primary:disabled { border-color:#534236; background:#292123; color:#827568; cursor:not-allowed; }
    .state { position:absolute; z-index:3; top:.8rem; right:5.6rem; max-width:24rem; color:#c2ad92; font-family:ui-monospace,monospace; font-size:.58rem; text-align:right; } .state b { color:#f0ca8f; }
    /* A — The curtain rises: a dramatic enemy reveal is the center of gravity. */
    .variant-a { display:grid; grid-template-columns:1.05fr .95fr; min-height:27rem; padding:1.15rem; gap:1.15rem; } .reveal { position:relative; display:grid; place-items:center; overflow:hidden; border:1px solid #9c513f; border-radius:.4rem; background:radial-gradient(circle at 50% 40%,#75352d 0,#2e1d21 42%,#120f13 78%); } .reveal::before { position:absolute; inset:0; background:repeating-linear-gradient(105deg,transparent 0 20px,#ffbf8a08 21px 23px); content:""; } .reveal-copy { position:relative; z-index:1; max-width:23rem; padding:1.2rem; text-align:center; } .reveal-copy .eyebrow { color:#ffc080; } .reveal h2 { margin:.38rem 0 .6rem; color:#ffe3bf; font-family:Georgia,serif; font-size:2rem; font-weight:normal; } .reveal p { color:#d6b9a2; font-size:.82rem; line-height:1.5; } .enemy-count { display:flex; justify-content:center; gap:.4rem; margin-top:1.1rem; } .enemy-count span { display:grid; place-items:center; width:2.5rem; height:2.5rem; border:1px solid #d0805b; border-radius:50%; background:#2b1c1f; color:#ffc592; box-shadow:0 0 1.2rem #dd53335c; font-size:1.25rem; } .initiative-side { display:flex; flex-direction:column; } .initiative-side h3 { color:#e9c995; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; } .initiative-side > p { margin:.3rem 0 .75rem; color:var(--muted); font-size:.7rem; } .roll-list { display:grid; gap:.42rem; } .roller { display:grid; grid-template-columns:2.4rem minmax(0,1fr) auto; align-items:center; gap:.55rem; padding:.48rem; border:1px solid #ffffff19; border-left:3px solid var(--hero); border-radius:.25rem; background:#111014; } .roller.foe { border-left-color:var(--blood); } .avatar { display:grid; place-items:center; width:2rem; height:2rem; border:1px solid #a28262; border-radius:50%; background:#4c392f; font-size:1rem; } .roller b,.roller small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .roller b { color:#eed6b7; font-size:.76rem; } .roller small { margin-top:.1rem; color:#a99a8a; font-size:.6rem; } .roll { min-width:4rem; border:0; background:transparent; color:#f4c77e; font-family:Georgia,serif; font-size:1.22rem; } .roll.ready { color:#ffedcc; text-shadow:0 0 .8rem #e7a654a8; }
    /* B — A raid briefing: opponents are intelligence, and the party chooses when to commit. */
    .variant-b { display:grid; grid-template-columns:16rem minmax(0,1fr); min-height:27rem; } .threat-board { padding:1rem; border-right:1px solid var(--line); background:linear-gradient(#21191b,#111014); } .threat-board h2 { margin:.25rem 0 .35rem; color:#f4d6ae; font-family:Georgia,serif; font-size:1.28rem; font-weight:normal; } .threat-board p { color:var(--muted); font-size:.7rem; line-height:1.45; } .threat-meter { display:flex; gap:.24rem; margin-top:.7rem; } .threat-meter i { flex:1; height:.28rem; background:#5d3c35; } .threat-meter i.hot { background:#d35645; box-shadow:0 0 .55rem #d35645aa; } .foe-cards { display:grid; gap:.45rem; margin-top:.85rem; } .foe-card { padding:.52rem; border:1px solid #8f5142; border-radius:.25rem; background:#27191c; } .foe-card b { display:block; color:#ffd3ac; font-size:.72rem; } .foe-card span { display:block; margin-top:.18rem; color:#d1a890; font-size:.59rem; } .party-board { padding:1rem 1.1rem; } .party-board > header { display:flex; align-items:end; justify-content:space-between; padding-bottom:.7rem; border-bottom:1px solid var(--line); } .party-board h2 { color:#f5d9b3; font-family:Georgia,serif; font-size:1.4rem; font-weight:normal; } .party-board header span { color:#a9bda9; font-size:.63rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; } .hero-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:.65rem; margin-top:.75rem; } .hero-card { position:relative; min-height:7.3rem; padding:.7rem; border:1px solid #436e78; border-radius:.32rem; background:linear-gradient(135deg,#182226,#111215); } .hero-card.waiting { border-color:#665447; background:linear-gradient(135deg,#292021,#151215); } .hero-card b { display:block; color:#e9dbc4; font-size:.85rem; } .hero-card small { display:block; margin-top:.16rem; color:#aebeba; font-size:.62rem; } .hero-card .big-roll { position:absolute; right:.7rem; bottom:.55rem; color:#f0ca83; font-family:Georgia,serif; font-size:1.7rem; } .hero-card .status { position:absolute; bottom:.68rem; left:.7rem; color:#9ab8b2; font-size:.57rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; } .hero-card.waiting .status { color:#bc9e80; } .personal-roll { grid-column:span 2; min-height:3.25rem; border:1px solid #bd9562; border-radius:.3rem; background:linear-gradient(90deg,#4c3023,#281b1a); color:#f9d4a0; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    /* C — A charging initiative track: every die roll visibly changes the whole room's order. */
    .variant-c { min-height:27rem; padding:1rem 1.2rem; } .track-intro { display:flex; justify-content:space-between; align-items:end; padding-bottom:.75rem; border-bottom:1px solid var(--line); } .track-intro h2 { margin-top:.2rem; color:#f5d7ae; font-family:Georgia,serif; font-size:1.45rem; font-weight:normal; } .track-intro p { color:var(--muted); font-size:.68rem; } .initiative-track { position:relative; display:grid; grid-template-columns:repeat(11,1fr); height:14.2rem; margin:1rem 1.5rem 0; } .initiative-track::before { position:absolute; top:7.7rem; right:0; left:0; height:2px; background:linear-gradient(90deg,#6a4c3a,#e6af65 48%,#6a4c3a); content:""; } .tick { position:relative; padding-top:8.3rem; color:#9f8c77; font-size:.62rem; text-align:center; } .tick::before { position:absolute; top:7.35rem; left:50%; width:.65rem; height:.65rem; border:2px solid #9c7859; border-radius:50%; background:#171216; content:""; transform:translateX(-50%); } .track-token { position:absolute; z-index:1; display:grid; place-items:center; width:5.9rem; min-height:3.2rem; padding:.36rem; border:1px solid #9b7252; border-radius:.32rem; background:#20191b; box-shadow:0 .35rem .85rem #000a; font-size:.62rem; text-align:center; transform:translateX(-50%); } .track-token.foe { border-color:#a54d42; background:#351c1e; } .track-token.pending { border-style:dashed; opacity:.72; } .track-token b { display:block; color:#f2d5b2; font-size:.72rem; } .track-token span { display:block; margin-top:.12rem; color:#b8a18c; } .track-token strong { display:block; margin-top:.12rem; color:#ffc979; font-family:Georgia,serif; font-size:1.1rem; } .track-token.foe strong { color:#ff9b85; } .track-token[data-row="1"] { top:1rem; } .track-token[data-row="2"] { top:10.2rem; } .rolling-message { margin:1rem auto 0; color:#ddc5a6; font-size:.73rem; text-align:center; } .rolling-message b { color:#ffca7d; }
    .switcher { position:fixed; z-index:5; bottom:1rem; left:50%; display:flex; align-items:center; gap:.55rem; padding:.42rem; border:1px solid #bd9360; border-radius:2rem; background:#151216; box-shadow:0 .35rem 1.2rem #000c; transform:translateX(-50%); } .switcher button { width:2rem; height:2rem; border:1px solid #745a43; border-radius:50%; background:#2a211c; color:#f4d39e; font-size:1rem; } .switcher button:hover { border-color:#f0c879; background:#4b3522; } .switcher output { min-width:18rem; color:#ecd3b2; font-size:.7rem; font-weight:700; text-align:center; }
  </style>
</head>
<body>
  <div class="veil" aria-hidden="true"></div>
  <aside class="prototype-note"><b>Throwaway design study.</b> Roll an initiative to see the shared state update; use the bottom control or ←/→ to compare structures. This models a player-facing dialog: enemy information is intentionally visible.</aside>
  <main id="app"></main>
  <nav class="switcher" aria-label="Prototype variant selector"><button id="previous" aria-label="Previous variant">←</button><output id="label"></output><button id="next" aria-label="Next variant">→</button></nav>
  <script>
    const combatants = [
      { name:'Beltane', detail:'Human ranger · Level 3', icon:'♝', side:'hero', roll:null },
      { name:'Ilyra', detail:'Eladrin wizard · Level 3', icon:'♜', side:'hero', roll:null },
      { name:'Durn', detail:'Dwarf fighter · Level 3', icon:'♞', side:'hero', roll:null },
      { name:'Goblin Hexer', detail:'Level 3 Controller', icon:'☠', side:'foe', roll:22 },
      { name:'Goblin Cutters × 4', detail:'Level 1 Minions', icon:'⚔', side:'foe', roll:16 },
      { name:'Hobgoblin Warcaster', detail:'Level 4 Artillery', icon:'✦', side:'foe', roll:19 }
    ];
    let key = new URLSearchParams(location.search).get('variant')?.toUpperCase();
    let viewer = 'Beltane';
    const variants = { A:'A — Curtain-Rise Reveal', B:'B — Raid Briefing', C:'C — Initiative Collision' };
    if (!variants[key]) key = 'A';
    const rollText = p => p.roll === null ? '—' : p.roll;
    const heroes = () => combatants.filter(p => p.side === 'hero');
    const foes = () => combatants.filter(p => p.side === 'foe');
    const rolled = () => combatants.filter(p => p.roll !== null).length;
    const fullState = () => `${viewer} · ${rolled()}/${combatants.length} rolled · ${combatants.map(p => `${p.name}: ${rollText(p)}`).join(' | ')}`;
    const header = subtitle => `<header class="dialog-header"><div><span class="eyebrow">Encounter incoming · shared with the whole table</span><h1>${subtitle}</h1></div><button class="header-action" data-action="viewer">Viewing as: ${viewer}</button></header><output class="state"><b>Prototype state</b> · ${fullState()}</output>`;
    const roller = p => `<div class="roller ${p.side === 'foe' ? 'foe' : ''}"><span class="avatar">${p.icon}</span><span><b>${p.name}</b><small>${p.detail}</small></span><button class="roll ${p.roll !== null ? 'ready' : ''}" data-roll="${p.name}" aria-label="Roll initiative for ${p.name}">${p.roll === null ? 'ROLL' : p.roll}</button></div>`;
    const footer = () => `<footer class="footer"><small>${rolled() === combatants.length ? 'Everyone is ready. Lock the order and let the first turn hit the table.' : 'Initiative is shared live. Players can roll their own character while the GM prepares the encounter.'}</small><button class="button" data-action="roll-all">Roll all</button><button class="button primary" data-action="begin" ${rolled() === combatants.length ? '' : 'disabled'}>Begin encounter</button></footer>`;
    const variantA = () => `<section class="dialog">${header('The ambush is sprung')}<div class="variant-a"><section class="reveal"><div class="reveal-copy"><span class="eyebrow">A hostile force blocks the way</span><h2>Six blades in the torchlight.</h2><p>The goblins were waiting. A hexer raises a crooked staff behind a wall of cutters.</p><div class="enemy-count"><span>☠</span><span>⚔</span><span>⚔</span><span>⚔</span><span>⚔</span><span>✦</span></div></div></section><section class="initiative-side"><h3>Initiative</h3><p>Every roll lands here for all players to see.</p><div class="roll-list">${combatants.map(roller).join('')}</div></section></div>${footer()}</section>`;
    const variantB = () => `<section class="dialog">${header('A fight is about to begin')}<div class="variant-b"><aside class="threat-board"><span class="eyebrow">Threat assessment</span><h2>Goblin ambush</h2><p>A prepared force has the high ground and a controller in the back line.</p><div class="threat-meter"><i class="hot"></i><i class="hot"></i><i class="hot"></i><i class="hot"></i><i></i></div><div class="foe-cards">${foes().map(p => `<article class="foe-card"><b>${p.icon} ${p.name}</b><span>${p.detail} · Initiative ${rollText(p)}</span></article>`).join('')}</div></aside><section class="party-board"><header><div><span class="eyebrow">Your party</span><h2>Roll before the blades meet</h2></div><span>${rolled()}/6 ready</span></header><div class="hero-grid">${heroes().map(p => `<button class="hero-card ${p.roll === null ? 'waiting' : ''}" data-roll="${p.name}"><b>${p.icon} ${p.name}</b><small>${p.detail}</small><span class="status">${p.roll === null ? 'Awaiting player' : 'Initiative locked'}</span><strong class="big-roll">${p.roll === null ? 'ROLL' : p.roll}</strong></button>`).join('')}<button class="personal-roll" data-roll="${viewer}">Roll ${viewer}'s initiative</button></div></section></div>${footer()}</section>`;
    const position = p => p.roll === null ? 50 : Math.max(5,Math.min(95,100 - ((p.roll - 1) / 24 * 90)));
    const token = (p, index) => `<div class="track-token ${p.side === 'foe' ? 'foe' : ''} ${p.roll === null ? 'pending' : ''}" data-row="${index % 2 + 1}" style="left:${position(p)}%"><b>${p.icon} ${p.name}</b><span>${p.roll === null ? 'Waiting for roll' : p.detail}</span><strong>${p.roll === null ? '?' : p.roll}</strong></div>`;
    const variantC = () => `<section class="dialog">${header('Initiative breaks like thunder')}<div class="variant-c"><header class="track-intro"><div><span class="eyebrow">The order is forming</span><h2>Every die changes the first exchange.</h2></div><p>Enemies have already rolled. The table watches the line take shape.</p></header><section class="initiative-track">${[25,22,19,16,13,10,7,4,1].map(n => `<span class="tick">${n}</span>`).join('')}${combatants.map(token).join('')}</section><p class="rolling-message"><b>${rolled()}/6 combatants ready.</b> Click a hero's card in another variant, or use Roll all, to watch their place snap into the order.</p></div>${footer()}</section>`;
    function render() { document.getElementById('app').innerHTML = key === 'A' ? variantA() : key === 'B' ? variantB() : variantC(); document.getElementById('label').textContent = variants[key]; bind(); }
    function roll(name) { const p = combatants.find(c => c.name === name); if (p && p.roll === null) p.roll = 1 + Math.floor(Math.random() * 20) + (p.side === 'hero' ? 4 : 3); render(); }
    function bind() { document.querySelectorAll('[data-roll]').forEach(button => button.onclick = () => roll(button.dataset.roll)); document.querySelectorAll('[data-action="roll-all"]').forEach(button => button.onclick = () => { combatants.forEach(p => { if (p.roll === null) p.roll = 1 + Math.floor(Math.random() * 20) + (p.side === 'hero' ? 4 : 3); }); render(); }); document.querySelectorAll('[data-action="viewer"]').forEach(button => button.onclick = () => { const names = heroes().map(p => p.name); viewer = names[(names.indexOf(viewer) + 1) % names.length]; render(); }); document.querySelectorAll('[data-action="begin"]').forEach(button => button.onclick = () => { button.textContent = 'Encounter begun'; }); }
    function move(delta) { const keys = Object.keys(variants); key = keys[(keys.indexOf(key) + delta + keys.length) % keys.length]; const url = new URL(location); url.searchParams.set('variant', key); history.replaceState(null,'',url); render(); }
    document.getElementById('previous').onclick = () => move(-1); document.getElementById('next').onclick = () => move(1); window.addEventListener('keydown', event => { if (!/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { if (event.key === 'ArrowLeft') move(-1); if (event.key === 'ArrowRight') move(1); } }); render();
  </script>
</body>
</html>

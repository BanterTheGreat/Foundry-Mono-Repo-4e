const keys=['plinth','ledger','flank'],labels={plinth:'A · Radial plinth',ledger:'B · Combat ledger',flank:'C · Defence flank'},notes={plinth:'<b>Radial plinth:</b> combat values belong to the health core. Resources retain their familiar full-height left readouts.',ledger:'<b>Combat ledger:</b> the left column becomes an ordered record—defences first, consumable resources second, then initiative and speed.',flank:'<b>Defence flank:</b> AC becomes a clear badge; Fort, Ref, and Will form a single protected block. Resources become compact counters so the combat posture remains the focus.'};const polar=(r,a)=>[100+r*Math.cos(a*Math.PI/180),100+r*Math.sin(a*Math.PI/180)];const point=([x,y])=>`${x.toFixed(2)} ${y.toFixed(2)}`;const wedge=(r,w,a1,a2)=>{const outer=r+w/2,inner=r-w/2;return`M ${point(polar(outer,a1))} A ${outer} ${outer} 0 0 1 ${point(polar(outer,a2))} L ${point(polar(inner,a2))} A ${inner} ${inner} 0 0 0 ${point(polar(inner,a1))} Z`};const plateRing=(count,active,r,w,lit,dim,edge)=>{const step=360/count,gap=count===8?2.1:count===12?1.5:1.1,inset=Math.min(2,w*.27);return Array.from({length:count},(_,index)=>{const start=-90+index*step+gap,end=-90+(index+1)*step-gap;return`<path d="${wedge(r,w,start,end)}" fill="${edge}"/><path d="${wedge(r,w-inset*2,start+.45,end-.45)}" fill="${index<active?lit:dim}"/>`}).join('')};const radial=()=>`<div class="dial"><svg class="radial-svg" viewBox="0 0 200 200" aria-label="Hit points 70 of 93; healing surges 11 of 12; temporary hit points 0">${plateRing(16,0,96,4,'#4a8da2','#1d4553','#091519')}${plateRing(8,6,75,28,'#c65462','#472229','#210f13')}${plateRing(12,11,51,10,'#d9ad52','#49381d','#25180c')}<circle cx="100" cy="100" r="43" fill="#0d0b0c" stroke="#2c1c18" stroke-width="2"/></svg><div class="dial-content"><b>70</b><small>/ 93</small></div></div>`;const portrait=()=>`<section class="portrait-wrap"><div class="portrait"></div><div class="identity"><h1>Idrani Fullhorn</h1><p>Level 10 Fighter</p></div></section>`;const actions=()=>`<section class="action-grid">${[['Heal','♥'],['Second Wind','Ready'],['Saving Throw','+2'],['Death Save','+5'],['Short Rest','☾'],['Extended Rest','🛏']].map(([label,value])=>`<button class="action"><span class="label">${label}</span><span class="value">${value}</span></button>`).join('')}</section>`;const resources=()=>[['⌁','Healing Surges','11 / 12','#f2cf7c'],['◒','Temporary HP','0','var(--blue)'],['ϟ','Action Points','1','var(--paper)']];const plinth=()=>`<div class="resource-lines">${resources().map(([icon,label,value,color])=>`<div class="resource-line"><span><span class="label">${label}</span></span><span class="value" style="color:${color}">${value}</span></div>`).join('')}</div>`;const plinthStats=()=>`<div class="stat-plinth">${[['ac','⬟',25],['','✚',24],['','ϟ',23],['','✦',20],['tactical','♞',12],['tactical','↔',5]].map(([kind,icon,value])=>`<span class="mini-stat ${kind}"><i>${icon}</i><b>${value}</b></span>`).join('')}</div>`;const ledger=()=>`<div class="ledger-left"><div class="defence-ledger"><div class="ac-cell"><i>⬟</i><b>25</b></div>${[['24','Fort'],['23','Ref'],['20','Will']].map(([value,label])=>`<div class="def-cell"><b>${value}</b><small>${label}</small></div>`).join('')}</div><div class="ledger-resources">${resources().map(([icon,label,value,color])=>`<div class="ledger-resource"><i>${icon}</i><span class="label">${label}</span><span class="value" style="color:${color}">${value}</span></div>`).join('')}</div><div class="pace-line"><span><small>Initiative</small><b>12</b></span><span><small>Speed</small><b>5</b></span></div></div>`;const flank=()=>`<div class="flank-left"><div class="resource-counters">${resources().map(([icon,label,value,color])=>`<span class="counter"><i>${icon}</i><span class="label">${label}</span><span class="value" style="color:${color}">${value}</span></span>`).join('')}</div><div class="defence-flank"><div class="ac-badge"><i>⬟</i><b>25</b></div><div class="save-row">${[['24','Fort'],['23','Ref'],['20','Wil

/* Restore the original left-side rhythm: one resource per shared combat row. */
.resource-sidebar{align-self:stretch;grid-template-rows:repeat(3,minmax(0,1fr));align-content:stretch;border-right:0;background:transparent}.resource-sidebar .compass-stat{align-content:center;align-self:stretch;padding:.65rem .45rem;border-bottom:1px solid #ffffff20}.resource-sidebar .compass-stat .value{font-size:1.45rem}
.note{position:relative;z-index:1;margin-top:.8rem;padding:.68rem .8rem;border-left:3px solid var(--gold);background:#161413c8;color:#d8c2aa;font-size:.8rem;line-height:1.35}.note b{color:#f4d5aa}.switcher{position:fixed;z-index:5;bottom:15px;left:50%;display:flex;align-items:center;gap:.3rem;padding:.35rem;border:1px solid var(--gold);border-radius:999px;background:#0c0d0e;box-shadow:0 8px 24px #000c;transform:translateX(-50%)}.switcher button{width:32px;height:30px;border:0;border-radius:999px;background:transparent;color:var(--gold);font-size:1.15rem}.switcher button:hover{background:#3e2e20}.switcher output{min-width:190px;text-align:center;color:#f4dfc1;font-size:.77rem;font-weight:bold}@media(max-width:760px){.stage{margin-top:1rem}.dock{grid-template-columns:1fr}.compass,.ledger{grid-template-columns:1fr}.dock .portrait-wrap,.compass .portrait-wrap,.ledger .portrait-wrap{border:0;border-bottom:1px solid #72513b}.dock .dial-bay{min-height:180px;border:0;border-bottom:1px solid #72513b}.compass .right{padding:14px}.ledger .right{grid-template-columns:1fr;padding:14px}.ledger .ledger-head,.ledger .defenses{grid-column:auto}.ledger .dial-bay{min-height:180px}.tabs{gap:.3rem}.tab{font-size:.65rem}}
</style></head><body><main class="stage"><p class="intro"><b>Three dense compositions:</b> no reduction to the portrait, no 2×2 dashboard. Each version treats the radial dial and remaining information differently.</p><nav class="tabs"><button class="tab">⚔ Powers</button><button class="tab">◈ Skills</button><button class="tab">▤ Feats</button><button class="tab">▦ Items</button></nav><section id="app" aria-live="polite"></section></main><nav class="switcher"><button id="prev" aria-label="Previous">←</button><output id="label"></output><button id="next" aria-label="Next">→</button></nav><script>
const keys=['dock','compass','ledger'],labels={dock:'A · Radial dock',compass:'B · Combat compass',ledger:'C · Radial ledger'},notes={dock:'<b>Radial dock:</b> a three-column build. The dial is physically anchored to the portrait, while the remaining space acts like an operations board with long, scan-friendly lines.',compass:'<b>Combat compass:</b> the dial is the center of a four-way information field. It has the strongest visual rhythm and makes each resource feel related to current health.',ledger:'<b>Radial ledger:</b> keep exactly one graphic—the HP dial. Everything else becomes a compact, labeled grid, useful if you want the most information with the least visual noise.'};
const defs=[['⬟','AC',25],['✚','Fort',24],['ϟ','Ref',23],['✦','Will',20],['♞','Init',12],['↔','Speed',5]];const defense=()=>`<div class="defenses">${defs.map(d=>`<div class="def"><b>${d[0]} ${d[2]}</b><span>${d[1]}</span></div>`).join('')}</div>`;const combatProfile=()=>`<section class="combat-profile" aria-label="Combat statistics"><div class="profile-anchor"><span class="crest">⬟</span><span><span class="label">Armour class</span><b>25</b></span></div><div class="profile-group"><h3>Defences</h3><span class="profile-stat"><b>24</b><span>Fort</span></span><span class="profile-stat"><b>23</b><span>Ref</span></span><span class="profile-stat"><b>20</b><span>Will</span></span></div><i class="profile-divider" aria-hidden="true"></i><div class="profile-group tactical"><span class="profile-stat"><b>12</b><span>Init</span></span><span class="profile-stat"><b>5</b><span>Speed</span></span></div></section>`;const meter=()=>`<div class="meter">${Array.from({length:12},(_,i)=>`<i class="${i<11?'on':''}"></i>`).join('')}</div>`;const actions=()=>`<div class="actions"><button class="action" title="Action point">ϟ</button><button class="action" title="Saving throw">★</button><button class="action" title="Heal">＋</button><button class="action" title="Rest">▰</button></div>`;const commandReadouts=()=>`<div class="command-readouts">${[['heal','Heal','♥'],['second-wind','Second Wind','Ready'],['save','Saving Throw','+2'],['death-save','Death Save','+5'],['short-rest','Short Rest','☾'],['extended-rest','Extended Rest','🛏']].map(([key,label,value])=>`<button class="command-readout ${state.lastCommand===key?'selected':''}" data-command="${key}" title="${label}"><span class="label">${label}</span><span class="value">${value}</span></button>`).join('')}</div>`;const portrait=()=>`<section class="portrait-wrap"><div class="portrait"></div><div class="identity"><h1>Idrani Fullhorn</h1><p>Level 10 Fighter</p></div></section>`;const segmentRing=(count,active,radius,width,lit,dim,edge)=>Array.from({length:count},(_,index)=>{const dash='.82 '+(count-.82);const offset=-index;const color=index<active?lit:dim;return`<circle cx="100" cy="100" r="${radius}" pathLength="${count}" fill="none" stroke="${edge}" stroke-width="${width+3}" stroke-linecap="round" stroke-dasharray="${dash}" stroke-dashoffset="${offset}"/><circle cx="100" cy="100" r="${radius}" pathLength="${count}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-dasharray="${dash}" stroke-dashoffset="${offset}"/>`}).join('');const compassGauge=()=>`<svg class="radial-svg" viewBox="0 0 200 200" aria-label="Hit points 70 of 93; healing surges 11 of 12; temporary hit points 0"><g transform="rotate(-90 100 100)">${segmentRing(16,0,96,4,'#4a8da2','#1d4553','#091519')}${segmentRing(8,6,75,28,'#c65462','#472229','#210f13')}${segmentRing(12,11,51,10,'#d9ad52','#49381d','#25180c')}</g><circle cx="100" cy="100" r="43" fill="#0d0b0c" stroke="#2c1c18" stroke-width="2"/></svg>`;const dial=(withSurges=false)=>withSurges?`<div class="dial svg-gauge">${compassGauge()}<div class="dial-content"><b>70</b><small>/ 93</small></div></div>`:`<div class="dial"><div class="dial-content"><span class="label">HP</span><b>70</b><small>of 93 · bloodied 46</small></div></div>`;
function dock(){return`<div class="hud dock">${portrait()}<aside class="dial-bay">${dial()}<span class="label">75% health remaining</span></aside><section class="board"><div class="board-head"><h2>Battle condition</h2><div style="display:flex;align-items:center;gap:.75rem"><span class="label" style="color:var(--green)">● Conscious</span>${actions()}</div></div><div class="resource-line"><div class="resource"><span class="label">Temporary HP</span><span class="value" style="color:var(--blue)">0</span></div><div class="resource"><span class="label">Action points</span><span class="value">1</span></div><div class="resource-wide"><span><span class="label">Healing surges</span>${meter()}</span><span class="value">11 / 12</span></div><div class="resource-wide"><span class="label">Second wind · standard action</span><span class="value" style="color:var(--green)">Ready</span></div></div>${defense()}</section></div><p class="note">${notes.dock}</p>`}
function compass(){return`<div class="hud compass">${portrait()}<section class="right"><div class="compass-field">${resourceSidebar()}${radialCore()}${commandReadouts()}</div></section></div><p class="note">${notes.compass}<br><b>Displayed state:</b> Healing Surges are 11 / 12; Temp HP is 0; Action Points are 1; last selected action is ${state.lastCommand||'none'}.</p>`}
function ledger(){return`<div class="hud ledger">${portrait()}<section class="right"><div class="ledger-head"><h2>Battle record</h2><div style="display:flex;align-items:center;gap:.75rem"><span class="label" style="color:var(--green)">● Conscious</span>${actions()}</div></div><aside class="dial-bay">${dial()}</aside><div class="ledger-table"><div class="ledger-row"><span class="label">Temporary HP</span><span class="value" style="color:var(--blue)">0</span></div><div class="ledger-row"><span class="label">Healing surges</span><span class="value">11 / 12</span></div><div class="ledger-row"><span class="label">Action points</span><span class="value">1</span></div><div class="ledger-row"><span class="label">Second wind</span><span class="value" style="color:var(--green)">Ready</span></div><div class="ledger-row"><span class="label">Initiative</span><span class="value">12</span></div><div class="ledger-row"><span class="label">Speed</span><span class="value">5</span></div></div>${defense()}</section></div><p class="note">${notes.ledger}</p>`}
function resourceSidebar(){return`<aside class="resource-sidebar" aria-label="Combat resources"><div class="compass-stat"><span class="label">Healing surges</span><span class="value" style="color:#f2cf7c">11 / 12</span></div><div class="compass-stat"><span class="label">Temporary HP</span><span class="value" style="color:var(--blue)">0</span></div><div class="compass-stat"><span class="label">Action points</span><span class="value">1</span></div></aside>`}function radialCore(){const stats=[['ac','⬟','Armour Class',25],['defence','✚','Fortitude',24],['defence','ϟ','Reflex',23],['defence','✦','Will',20],['tactical','♞','Initiative',12],['tactical','↔','Speed',5]];return`<section class="radial-core">${dial(true)}<div class="radial-stat-strip" aria-label="Combat statistics">${stats.map(([kind,icon,label,value])=>`<span class="radial-stat ${kind}" title="${label}" aria-label="${label}: ${value}"><i class="icon" aria-hidden="true">${icon}</i><b>${value}</b></span>`).join('')}</div></section>`}const state={lastCommand:''};const views={dock,compass,ledger};function current(){const x=new URLSearchParams(location.search).get('variant');return keys.includes(x)?x:'dock'}function render(){const x=current();document.getElementById('app').innerHTML=views[x]();document.getElementById('label').textContent=labels[x];document.querySelectorAll('[data-command]').forEach(button=>button.addEventListener('click',()=>{state.lastCommand=button.dataset.command;render()}))}function change(n){const x=keys[(keys.indexOf(current())+n+keys.length)%keys.length],u=new URL(location);u.searchParams.set('variant',x);history.replaceState(null,'',u);render()}document.getElementById('prev').onclick=()=>change(-1);document.getElementById('next').onclick=()=>{state.lastCommand='';change(1)};document.addEventListener('keydown',e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName)&&!e.target.isContentEditable){if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1)}});render();
</script><script>
/* Prototype B: replace the Compass's rounded strokes with the approved armour-plate segments. */
(()=>{const polar=(r,a)=>[100+r*Math.cos(a*Math.PI/180),100+r*Math.sin(a*Math.PI/180)];const point=([x,y])=>`${x.toFixed(2)} ${y.toFixed(2)}`;const wedge=(r,w,a1,a2)=>{const outer=r+w/2,inner=r-w/2;return`M ${point(polar(outer,a1))} A ${outer} ${outer} 0 0 1 ${point(polar(outer,a2))} L ${point(polar(inner,a2))} A ${inner} ${inner} 0 0 0 ${point(polar(inner,a1))} Z`};const plateRing=(count,active,r,w,lit,dim,edge)=>{const step=360/count,gap=count===8?2.1:count===12?1.5:1.1,inset=Math.min(2,w*.27);return Array.from({length:count},(_,index)=>{const start=-90+index*step+gap,end=-90+(index+1)*step-gap;return`<path d="${wedge(r,w,start,end)}" fill="${edge}"/><path d="${wedge(r,w-inset*2,start+.45,end-.45)}" fill="${index<active?lit:dim}"/>`}).join('')};const plates=()=>`<g>${plateRing(16,0,96,4,'#4a8da2','#1d4553','#091519')}${plateRing(8,6,75,28,'#c65462','#472229','#210f13')}${plateRing(12,11,51,10,'#d9ad52','#49381d','#25180c')}</g><circle cx="100" cy="100" r="43" fill="#0d0b0c" stroke="#2c1c18" stroke-width="2"/>`;const apply=()=>document.querySelectorAll('.compass .radial-svg:not([data-plate-segments])').forEach(svg=>{svg.innerHTML=plates();svg.dataset.plateSegments='true'});new MutationObserver(apply).observe(document.getElementById('app'),{childList:true,subtree:true});apply()})();
</script></body></html>

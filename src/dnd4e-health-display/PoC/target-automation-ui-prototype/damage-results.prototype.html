<!doctype html><html><head><meta charset="utf-8"><title>Compact damage dialog prototype</title><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#eee);font:12px/1.35 system-ui;padding-bottom:62px}button{font:inherit;cursor:pointer;color:inherit;background:#292720;border:1px solid #746343;border-radius:3px;padding:4px 8px}button:hover{border-color:#e2c88b}button:focus-visible,summary:focus-visible{outline:2px solid #e2c88b;outline-offset:2px}.controls{display:flex;gap:5px;margin-bottom:10px}.active{background:#635332;color:#fff}.caption{font:11px system-ui;color:var(--muted-foreground,#aaa);margin:9px 0}.dialog{width:340px;max-width:100%;color:#e8dfcb;background:#1c1b19;border:1px solid #6c5b3e;border-radius:5px;box-shadow:0 3px 12px #0004}.title{background:#0b0b0d;border-bottom:1px solid #37332d;padding:8px 10px;display:flex;justify-content:space-between;font-weight:600;border-radius:5px 5px 0 0}.body{padding:10px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.heading b{font:small-caps bold 15px Georgia;color:#ebd09a}.heading button{font-size:11px;padding:2px 6px}.status{font-size:11px;color:#b6ae9e;margin-bottom:3px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #494131}.result{font:700 11px system-ui;color:#aac78e;white-space:nowrap}.miss{color:#d9a48d}.ref{margin:9px 0;padding:7px 8px;background:#28251e;border-left:2px solid #aa8b4e;font:12px/1.35 Georgia}.ref p{margin:0}.ref p+p{margin-top:4px}.ref b{color:#e2c78e}.damage{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:11px;color:#beb5a3}.damage strong{color:#ecd5a2;font:700 17px Georgia}.primary{width:100%;background:#55482c;border:1px solid #c6a968;color:#f2e4c6;padding:5px}.full{font:12px/1.4 Georgia;margin:8px 0;padding:8px;background:#26231e;border:1px solid #494131}.full p{margin:4px 0}.notes{width:340px;max-width:100%;margin-top:10px;color:var(--muted-foreground,#aaa);font-size:11px}.notes pre{white-space:pre-wrap}.switcher{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#111;color:#eedcba;padding:6px 9px;border:1px solid #937d50;border-radius:24px;white-space:nowrap}.inline{font:11px Georgia;color:#c8bdab;padding-top:3px}.pinned{margin-top:0}.notice{font-size:11px;color:#d5bb81;margin-top:5px}
</style></head><body><div class="controls"><button id="before">Roll Damage</button><button id="after">Damage Rolled</button></div><p class="caption">340px wide · actual-size dialog · illustrative power text</p><main id="app"></main><p id="description" class="caption"></p><details class="notes"><summary>Prototype state</summary><pre id="state"></pre><p>Damage values are sample display proposals. Damage and effects are applied manually. Full authored power text stays under Details. No Foundry actions.</p></details><nav class="switcher"><button id="prev" aria-label="Previous layout">←</button><span id="label"></span><button id="next" aria-label="Next layout">→</button></nav><script>
// Throwaway: three compact variants of the existing dialog, at its current width.
let variant=new URLSearchParams(location.search).get('variant')||'A',rolled=false,details=false,complete=false;
const names={A:'Rules below',B:'Rules with results',C:'Effect first'};
function reminder(){return '<div class="ref"><p><b>Hit:</b> Slowed until end of your next turn.</p><p><b>After attack:</b> You may shift 2 squares.</p></div>';}
function rows(){return '<div class="row"><div>Orc Savage (3)'+(variant==='B'?'<div class="inline">Slowed until end of your next turn.</div>':'')+'</div><span class="result">26 · HIT'+(rolled?' · 10 cold':'')+'</span></div><div class="row"><span>Orc Savage (2)</span><span class="result miss">15 · MISS'+(rolled?' · 5 cold':'')+'</span></div>';}
function render(){if(!names[variant])variant='A';document.getElementById('before').className=!rolled?'active':'';document.getElementById('after').className=rolled?'active':'';document.getElementById('label').textContent=variant+' · '+names[variant];document.getElementById('description').textContent={A:'A · One compact reminder under the target rows.',B:'B · Hit rider beside its target; shared effect below.',C:'C · Post-attack effect immediately below the power name.'}[variant];document.getElementById('app').innerHTML='<article class="dialog"><div class="title"><span>Select Targets</span><span aria-hidden="true">⋮　×</span></div><div class="body"><div class="heading"><b>Winter’s Reprisal</b><button id="details" aria-expanded="'+details+'">▣ Details</button></div>'+(details?'<div class="full"><b>Illustrative power · Encounter · Cold</b><p>Close burst 2 · Intelligence vs. Reflex</p><p><b>Hit:</b> 2d6 + 7 cold damage, and the target is slowed until the end of your next turn.</p><p><b>Miss:</b> Half damage.</p><p><b>Effect:</b> After the attack, you may shift 2 squares.</p></div>':'')+(variant==='C'?'<div class="ref pinned"><p><b>After attack:</b> You may shift 2 squares.</p></div>':'')+'<div class="status">'+(rolled?'Damage rolled':'Attack resolved')+'</div>'+rows()+(variant==='A'?reminder():variant==='B'?'<div class="ref"><p><b>After attack:</b> You may shift 2 squares.</p></div>':'<div class="inline" style="margin-top:7px"><b>Hit:</b> Slowed until end of your next turn.</div>')+'<div class="damage">'+(rolled?'<span><strong>10</strong> cold · 2d6 + 7</span><span>Apply manually</span>':'<span>2d6 + 7 cold · half on miss</span><span>One shared roll</span>')+'</div><button id="action" class="primary">'+(rolled?'✓ Complete':'⚄ Roll Damage')+'</button>'+(complete?'<div class="notice">Demo complete · no damage applied.</div>':'')+'</div></article>';document.getElementById('details').onclick=()=>{details=!details;render();};document.getElementById('action').onclick=()=>{if(rolled)complete=true;else rolled=true;render();};document.getElementById('state').textContent=JSON.stringify({variant,phase:rolled?'damageRolled':'rollDamage',details,complete,damageApplied:false,width:340},null,2);}
function cycle(d){variant='ABC'[('ABC'.indexOf(variant)+d+3)%3];try{let u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u);}catch{}render();}
document.getElementById('before').onclick=()=>{rolled=false;complete=false;render();};document.getElementById('after').onclick=()=>{rolled=true;complete=false;render();};document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1);});render();
</script></body></html>

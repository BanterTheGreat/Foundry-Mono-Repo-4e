<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm attack · three badgers</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;color:var(--foreground,#eadbc0)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #ebc271;outline-offset:3px}.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tools button{background:transparent;color:inherit;border:1px solid #79694e;padding:7px 12px;border-radius:5px}.tools button[aria-pressed=true]{background:#574326;color:#f3dfb6}.note{color:var(--muted-foreground,#bdb09a);font-size:12px;margin:0 0 12px}.dialog{max-width:650px;background:#1b1916;color:#eadfc9;border:1px solid #514635;border-radius:8px;overflow:hidden}.title{background:#09090c;padding:14px 18px;border-bottom:1px solid #38312b;font-size:19px;font-weight:650}.body{padding:18px;display:grid;gap:16px}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.heading strong{font:bold small-caps 23px Georgia;color:#e6cfa0}button{border:1px solid #9b816b;border-radius:5px;background:#141315;color:#ead9bb;padding:6px 10px}.before{color:#c3b393}.before summary{cursor:pointer}.before p{margin:8px 0;font-size:13px}.stage{display:flex;justify-content:space-between;align-items:center;gap:10px}.stage h2{font-size:19px;margin:0}.count{font-size:12px;color:#bfb098}.targets{border:1px solid #5a4b32;border-radius:6px;overflow:hidden;background:#25211b}.row{display:grid;grid-template-columns:minmax(90px,1fr) 100px 166px;gap:12px;align-items:center;min-height:66px;padding:12px 14px}.row+.row{border-top:1px solid #4a402f}.name{font-weight:650}.verdict{font-weight:750;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}.hit{color:#adce9f}.miss{color:#e5a197}.adjust{display:flex;gap:6px;justify-content:flex-end;align-items:center}.adjust input{width:53px;min-height:32px;border:1px solid #76644f;border-radius:4px;background:#302a35;color:#efdfc5;text-align:center}.adjust button{font-size:12px;min-height:32px}.confirmed{font-size:12px;color:#b9ad97;text-align:right}.help{margin:0;color:#c4b698;font-size:13px}.reference{border-left:3px solid #ae8e4c;background:#2a261d;padding:12px 14px;font-size:14px}.reference p{margin:0}.reference p+p{margin-top:9px}.reference b{color:#e4c88c}.primary{width:100%;padding:11px;background:#594426;border-color:#e2b65d;color:#f1dfbd;font-size:17px;font-weight:650;box-shadow:0 0 14px #d5a43b13}.details{background:#28231d;border:1px solid #5a4b32;padding:12px;font-size:13px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#c5b38d;margin-bottom:7px}.complete{color:#adce9f} @media(max-width:470px){.body{padding:14px;gap:14px}.row{grid-template-columns:minmax(80px,1fr) 86px;gap:7px;padding:10px 12px}.adjust,.confirmed{grid-column:1/-1;justify-content:flex-start;text-align:left;min-height:32px}.confirmed{display:flex;align-items:center}.heading strong{font-size:21px}.stage h2{font-size:17px}}
</style></head><body>
<nav class="tools" aria-label="Mock state"><button data-phase="review">Confirm attack</button><button data-phase="resolved">Attack resolved</button><button id="reset">Reset mock</button></nav><p class="note">Interactive mock · three badgers · modifier applies to that target’s total</p><main id="app"></main>
<script>
let phase='review',showDetails=false;
const targets=[{name:'Badger (1)',base:23,modifier:0},{name:'Badger (2)',base:15,modifier:0},{name:'Badger (3)',base:20,modifier:0}];
function render(){
 const reviewing=phase==='review';
 document.querySelectorAll('[data-phase]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.phase===phase));
 const rows=targets.map((target,index)=>{const total=target.base+target.modifier;const hit=total>=18;return `<div class="row"><span class="name">${target.name}</span><strong class="verdict ${hit?'hit':'miss'}">${total} · ${hit?'HIT':'MISS'}</strong>${reviewing?`<div class="adjust"><label class="label" for="mod-${index}" style="margin:0">Mod</label><input id="mod-${index}" type="number" step="1" value="${target.modifier}" aria-label="Attack modifier for ${target.name}"><button data-apply="${index}" aria-label="Apply modifier for ${target.name}">Apply</button></div>`:'<span class="confirmed">✓ Confirmed</span>'}</div>`;}).join('');
 document.getElementById('app').innerHTML=`<article class="dialog"><header class="title">Select Targets</header><div class="body"><div class="heading"><strong>Dire Radiance</strong><button id="details" aria-expanded="${showDetails}">▣ Details</button></div>${showDetails?'<div class="details">Illustrative multi-target mock. Each attack is checked against a mock defense of 18. Damage and effects are applied manually.</div>':''}<details class="before"><summary>Before attack</summary><p>Mock setup: three selected badgers. Attack rolls are already complete.</p></details><div class="stage"><h2>${reviewing?'Confirm attack':phase==='rolled'?'Damage rolled':'Attack resolved'}</h2><span class="count">3 targets</span></div><section class="targets" aria-label="Attack results">${rows}</section>${reviewing?'<p class="help">Adjust any attack total, then confirm all three results.</p>':'<div class="reference"><p><b>Hit:</b> 1d6 + Charisma modifier or Constitution modifier radiant damage. The first time the target moves closer to you on its next turn, it takes an extra 1d6 + Charisma modifier or Constitution modifier damage. This is a Fear effect.</p><p><b>Special:</b> Level 21: 2d6 + Charisma modifier or Constitution modifier damage.</p></div><p class="help">'+(phase==='rolled'?'Mock damage: 8 radiant · Apply damage and effects manually.':'One shared damage roll · Includes miss damage')+'</p>'}<button class="primary" id="continue">${reviewing?'Confirm Results':phase==='rolled'?'✓ Complete':'⚄ Roll Damage'}</button><div id="notice" role="status" hidden></div></div></article>`;
 document.getElementById('details').onclick=()=>{showDetails=!showDetails;render();};
 document.querySelectorAll('[data-apply]').forEach(button=>button.onclick=()=>{const index=Number(button.dataset.apply);const input=document.getElementById(`mod-${index}`);if(!input.reportValidity()){return;}targets[index].modifier=Number(input.value);render();});
 document.getElementById('continue').onclick=()=>{if(reviewing){const dirty=targets.findIndex((target,index)=>Number(document.getElementById(`mod-${index}`).value)!==target.modifier);if(dirty!==-1){const notice=document.getElementById('notice');notice.hidden=false;notice.textContent='Apply the changed modifier before confirming.';document.getElementById(`mod-${dirty}`).focus();return;}phase='resolved';}else if(phase==='resolved'){phase='rolled';}else{const notice=document.getElementById('notice');notice.hidden=false;notice.className='complete';notice.textContent='Mock complete. No game data changed.';return;}render();};
}
document.querySelectorAll('[data-phase]').forEach(button=>button.onclick=()=>{phase=button.dataset.phase;render();});
document.getElementById('reset').onclick=()=>{phase='review';showDetails=false;targets.forEach(target=>target.modifier=0);render();};render();
</script></body></html>

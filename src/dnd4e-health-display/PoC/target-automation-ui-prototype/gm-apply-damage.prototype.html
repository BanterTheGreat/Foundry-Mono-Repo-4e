<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GM damage approval prototype</title><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#eee4cc);font:12px/1.45 var(--font-sans,Arial,sans-serif);padding-bottom:72px}button{font:inherit;cursor:pointer;border:1px solid #75603c;background:#28251e;color:#eedcba;border-radius:4px;padding:7px 10px}button:hover:not(:disabled){background:#413723;border-color:#d1b477}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:2px solid #e7c980;outline-offset:3px}.caption{color:var(--muted-foreground,#aaa);font-size:11px;margin:8px 0}.dialog{max-width:576px;background:#151514;color:#eee4cc;border:1px solid #8f794e;border-radius:6px;overflow:hidden;box-shadow:0 8px 22px #0004}.title{padding:9px 14px;background:linear-gradient(110deg,#292318,#101010);border-bottom:1px solid #655433;display:flex;justify-content:space-between;align-items:center}.eyebrow{color:#c1ae87;font-size:10px;letter-spacing:.09em;text-transform:uppercase}h1{font:600 22px Georgia;margin:4px 0}p{margin:3px 0}.intro{padding:14px;border-bottom:1px solid #493c26}.sub{color:#bbaf97;font-size:11px}.list{max-height:345px;overflow:auto}.row{display:grid;grid-template-columns:minmax(140px,1.5fr) 1fr 64px 80px;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid #373126}.identity{display:flex;align-items:center;gap:9px}.token{width:34px;height:34px;border:1px solid #8b7650;background:#302b22;border-radius:50%;display:grid;place-items:center;color:#d5bd88;font:bold 13px Georgia;flex-shrink:0}.name{font-weight:600}.badge{font-size:10px;font-weight:bold;color:#b6d0a2}.crit{color:#efd084}.miss{color:#b6b2ac}.health{font-variant-numeric:tabular-nums}.health strong{font:600 18px Georgia}.after{color:#edbd9e}.bar{height:4px;background:#3f2825;margin-top:5px;position:relative}.bar span{position:absolute;height:4px;left:0;background:#9d6458}.bar i{position:absolute;height:4px;left:0;background:#b6c295}.damage{font:600 19px Georgia;color:#ebc28f}.done{color:#a7c695;font-size:11px}.applied{background:#1b2119}.footer{padding:13px 14px;background:#201e19;border-top:1px solid #655433}.primary{width:100%;padding:11px;background:#5d4c2b;border-color:#b4985f;font-weight:bold;font-size:14px}.summary{display:flex;justify-content:space-between;margin-bottom:9px;color:#c4b694;font-size:11px}.cols{display:grid;grid-template-columns:minmax(140px,1.5fr) 1fr 64px 80px;gap:12px;padding:7px 14px;background:#211e18;color:#c4b694;font-size:9px;text-transform:uppercase;letter-spacing:.05em}.cards .list{display:grid;grid-template-columns:1fr 1fr;padding:10px;gap:9px;max-height:440px}.cards .row{display:flex;flex-wrap:wrap;border:1px solid #53462e;border-radius:4px;padding:12px;gap:12px}.cards .identity{width:100%}.cards .health{flex:1}.cards .row button{width:100%}.cards .cols,.focus .cols{display:none}.focus .list{display:grid;grid-template-columns:170px 1fr;max-height:none}.rail{background:#201e19;padding:8px;display:grid;gap:6px;align-content:start}.rail button{text-align:left}.rail .selected{border-color:#d4b46e;background:#433824}.focus .row{display:flex;flex-direction:column;align-items:stretch;padding:20px;gap:18px;border:0}.focus .health strong{font-size:32px}.focus .identity .token{width:44px;height:44px}.focus .damage{font-size:25px}.switcher{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;border:1px solid #917b4f;background:#171715;color:#ebdcb9;padding:6px;border-radius:30px;white-space:nowrap}.switcher button{border-radius:50%;padding:4px 10px}.tools{display:flex;justify-content:space-between;max-width:576px;align-items:center}.state{max-width:576px;margin-top:12px;color:var(--muted-foreground,#aaa);font-size:11px}pre{white-space:pre-wrap} @media(max-width:480px){.row,.cols{grid-template-columns:minmax(105px,1fr) 88px 42px 65px;gap:6px;padding:10px 8px}.token{display:none}.cards .list{grid-template-columns:1fr}.focus .list{grid-template-columns:120px 1fr}.name{font-size:11px}}
.row.hovered{background:#302a1d;box-shadow:inset 3px 0 #d7bb79}.row.hovered .token{border-color:#f0d38f;box-shadow:0 0 0 2px #d7bb7955}.battlefield{max-width:576px;margin-top:12px;padding:10px 14px;border:1px dashed #655433;border-radius:4px;background:repeating-linear-gradient(0deg,transparent,transparent 39px,#806b4220 40px),repeating-linear-gradient(90deg,#1c201a,#1c201a 39px,#806b4220 40px);color:#c7baa0}.map-tokens{display:flex;justify-content:space-around;gap:10px;margin-top:10px}.map-token{text-align:center;font-size:10px}.map-token .token{margin:0 auto 5px;display:grid;transition:box-shadow .12s,border-color .12s}.map-token.highlighted .token{border-color:#ffe3a1;box-shadow:0 0 0 3px #d7bb79,0 0 18px #d7bb7988;background:#54452b}.hover-status{min-height:16px;margin-top:8px;font-size:11px;color:#e8d19c}</style></head><body>
<!-- Throwaway GM popup: compare ledger, token cards and focused review with mock damage only. -->
<div class="tools"><p class="caption">GM screen · prototype · mock data</p><button id="reset">Reset demo</button></div><main id="app"></main><aside class="battlefield" aria-label="Mock battlefield"><div class="eyebrow">Mock battlefield ? hover a target row</div><div id="map-tokens" class="map-tokens"></div><div id="hover-status" class="hover-status" aria-live="polite">No token highlighted</div></aside><details class="state"><summary>Prototype state</summary><pre id="state"></pre></details><nav class="switcher" aria-label="Prototype layouts"><button id="prev" aria-label="Previous layout">←</button><span id="label"></span><button id="next" aria-label="Next layout">→</button></nav>
<script>
const seed=[{name:'Orc Savage (3)',initials:'O3',hp:46,max:64,damage:18,result:'Hit'},{name:'Orc Savage (2)',initials:'O2',hp:12,max:64,damage:9,result:'Miss',note:'Half damage on miss'},{name:'Orc Chieftain',initials:'OC',hp:82,max:96,damage:31,result:'Crit'},{name:'Orc Archer',initials:'OA',hp:16,max:48,damage:18,result:'Hit',note:'Reduced to 0 HP'}];let targets=seed.map(t=>({...t,applied:false})),variant=new URLSearchParams(location.search).get('variant')||'A',selected=0;const names={A:'Compact ledger',B:'Token cards',C:'Focused review'};if(!names[variant])variant='A';
function row(t,i){const after=Math.max(0,t.hp-t.damage);return `<section data-token="${i}" class="row ${t.applied?'applied':''}"><div class="identity"><span class="token">${t.initials}</span><div><div class="name">${t.name}</div><span class="badge ${t.result.toLowerCase()}">${t.result.toUpperCase()}</span>${t.note?`<div class="sub">${t.note}</div>`:''}</div></div><div class="health"><div class="eyebrow">${t.applied?'Health now':'HP → after'}</div>${t.applied?`<strong>${after}</strong>`:`<strong>${t.hp}</strong> <span class="sub">→</span> <strong class="after">${after}</strong>`}<span class="sub"> / ${t.max}</span><div class="bar"><span style="width:${t.hp/t.max*100}%"></span><i style="width:${after/t.max*100}%"></i></div></div><div><div class="damage">−${t.damage}</div><div class="sub">cold</div></div><button data-apply="${i}" ${t.applied?'disabled':''}>${t.applied?'✓ Applied':'Apply'}</button></section>`;}
let hovered=null;
/** Preview token hover only; no Foundry canvas connection. */
function highlightToken(index){
 hovered=index;
 document.querySelectorAll('[data-token]').forEach(el=>el.classList.toggle('hovered',Number(el.dataset.token)===index));
 document.querySelectorAll('[data-map-token]').forEach(el=>el.classList.toggle('highlighted',Number(el.dataset.mapToken)===index));
 document.getElementById('hover-status').textContent=index===null?'No token highlighted':'Highlighted: '+targets[index].name;
}
function render(){const remaining=targets.filter(t=>!t.applied),count=targets.length-remaining.length;document.getElementById('label').textContent=variant+' · '+names[variant];document.getElementById('app').innerHTML=`<article class="dialog ${variant==='B'?'cards':variant==='C'?'focus':''}"><header class="title"><b>Apply Damage</b><span class="eyebrow">GM review</span></header><div class="intro"><div class="eyebrow">Elara · confirmed by Imre (Player)</div><h1>Winter’s Reprisal</h1><p class="sub">Damage confirmed · 4 affected tokens · Cold</p></div><div class="cols"><span>Target / result</span><span>Health</span><span>Damage</span><span>Action</span></div><div class="list">${variant==='C'?`<aside class="rail">${targets.map((t,i)=>`<button data-select="${i}" class="${selected===i?'selected':''}">${t.name}<br><span class="badge ${t.result.toLowerCase()}">${t.applied?'✓ Applied':t.result.toUpperCase()}</span></button>`).join('')}</aside>${row(targets[selected],selected)}`:targets.map(row).join('')}</div><footer class="footer"><div class="summary"><span aria-live="polite">${count} of 4 applied</span><span>${remaining.reduce((n,t)=>n+t.damage,0)} damage remaining</span></div><button class="primary" id="all" ${!remaining.length?'disabled':''}>${remaining.length?'Apply to '+(count?'Remaining':'All')+' · '+remaining.length+' Tokens':'✓ All Damage Applied'}</button><p class="sub" style="margin-top:8px">${remaining.length?'Each token can be applied once. Applied tokens are excluded from the footer action.':'Review complete. Reset the demo to try another layout.'}</p></footer></article>`;document.getElementById('map-tokens').innerHTML=targets.map((t,i)=>`<div class="map-token" data-map-token="${i}"><span class="token">${t.initials}</span>${t.name}</div>`).join('');
 document.querySelectorAll('[data-token]').forEach(el=>{
 el.onpointerenter=()=>highlightToken(Number(el.dataset.token));
 el.onpointerleave=()=>highlightToken(null);
 el.onfocusin=()=>highlightToken(Number(el.dataset.token));
 el.onfocusout=()=>highlightToken(null);
 });
 highlightToken(hovered);
 document.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>{targets[+b.dataset.apply].applied=true;render();});document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=+b.dataset.select;render();});document.getElementById('all').onclick=()=>{targets.forEach(t=>t.applied=true);render();};document.getElementById('state').textContent=JSON.stringify({variant,trigger:'PC confirms damage',recipient:'Logged-in GM',targets:targets.map(t=>({name:t.name,result:t.result,before:t.hp,after:Math.max(0,t.hp-t.damage),damage:t.damage,applied:t.applied})),foundryConnected:false},null,2);}
function cycle(d){variant='ABC'[('ABC'.indexOf(variant)+d+3)%3];try{const u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u);}catch{}render();}document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('reset').onclick=()=>{targets=seed.map(t=>({...t,applied:false}));render();};document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1);});render();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><title>Before attack · HUD prototype</title><style>
*{box-sizing:border-box}body{margin:0;padding-bottom:12px;font:12px/1.4 system-ui;color:var(--foreground,#eadbc0)}button,select{font:inherit;color:inherit;background:#27231d;border:1px solid #78603d;border-radius:3px;padding:3px 7px;cursor:pointer}button:hover{border-color:#ddbc79}button:focus-visible,summary:focus-visible{outline:2px solid #e0b96d;outline-offset:2px}.tools{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.tools .active{background:#574326;color:#f2dfb6}.note{font-size:11px;color:var(--muted-foreground,#aaa);max-width:340px;margin:9px 0}.dialog{width:340px;max-width:100%;background:#191817;color:#eadbc0;border:1px solid #554a35;border-radius:5px;overflow:hidden;box-shadow:0 4px 12px #0004}.titlebar{background:#09090c;padding:8px 10px;display:flex;justify-content:space-between;font-weight:600;border-bottom:1px solid #39332a}.body{padding:10px;display:grid;gap:7px}.heading{display:flex;align-items:center;justify-content:space-between}.heading strong{font:small-caps bold 15px Georgia;color:#ead2a1}.heading button{font-size:11px}.origin{display:flex;align-items:center;gap:12px;font-size:12px}.origin select{flex:1;min-width:0}.reference{border-left:2px solid #aa8b4e;background:#28251e;padding:7px 8px;font:12px/1.35 Georgia;max-height:208px;overflow-y:auto}.reference p{margin:0}.reference p+p{margin-top:5px}.reference b{color:#e2c78e}.section-label{font:700 10px system-ui;color:#cebb94;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}.facts{font:12px/1.4 system-ui;padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid #4b422f}.keywords{font-size:10px;color:#b9ad97;margin-top:2px}.status{font-size:12px}.muted{font-size:11px;color:#c7b99e}.row{display:flex;justify-content:space-between;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid #544735}.row button{padding:0 6px}.results{font:700 11px system-ui;color:#abd0a1}.miss{color:#e5a298}.manual{font-size:11px;color:#c7b99e}.manual summary{cursor:pointer}.manual p{margin:6px 0}footer{display:flex;gap:6px}footer button{flex:1;padding:5px}.primary{background:#574326;border-color:#e0b96d;color:#f0dfbf}.details{font:12px/1.4 Georgia;padding:8px;border:1px solid #78603d;background:#24211d;max-height:208px;overflow:auto}.details p{margin:5px 0}.details .flavor{font-style:italic;color:#c2b697}.collapsed-before{font-size:11px;color:#c8b994}.collapsed-before summary{cursor:pointer}.state{max-width:340px;font-size:11px;color:var(--muted-foreground,#aaa);margin-top:12px}.state pre{white-space:pre-wrap}.toggle{display:flex;gap:6px;align-items:center;max-width:340px;font-size:11px;margin-bottom:10px}
</style></head><body><div class="tools"><button data-phase="before">Before attack</button><button data-phase="damage">Roll Damage</button><button data-phase="rolled">Damage Rolled</button></div><p class="note">Prototype · 340px actual width · power text from your screenshot</p><main id="app"></main><details class="state"><summary>Prototype state</summary><pre id="state"></pre></details><script>
// Throwaway: add a compact Before attack reference to the current Rules Below dialog.
let phase='before',details=false,removed=false;
const hit='3[W] + Strength + Constitution modifier damage.';
const effect='Before the attack, you slide the target 1 square, and you shift into the square the target vacated.';
function setup(){return '<div class="reference" role="region" aria-label="Before attack" tabindex="0"><div class="section-label">Before attack</div><p><b>Target:</b> One creature.</p><p><b>Effect:</b> '+effect+'</p><p><b>Attack:</b> Strength vs. AC.</p></div>';}
function full(){return '<div class="details"><p class="flavor">Your enemy falls back beneath your savage attack, but you pursue to finish the job.</p><p><b>Daily &middot; Standard Action &middot; Melee Weapon</b></p><p>Martial, Physical, Weapon</p><p><b>Requirement:</b> You must be wielding a two-handed weapon.</p><p><b>Target:</b> One creature.</p><p><b>Effect:</b> '+effect+'</p><p><b>Attack:</b> Strength vs. AC.</p><p><b>Hit:</b> '+hit+'</p><p><b>Miss:</b> Half damage.</p></div>';}
function render(){const before=phase==='before';document.querySelectorAll('[data-phase]').forEach(b=>{b.className=b.dataset.phase===phase?'active':'';b.setAttribute('aria-pressed',b.dataset.phase===phase);});document.getElementById('app').innerHTML='<article class="dialog"><div class="titlebar"><span>Select Targets</span><span aria-hidden="true">⋮　×</span></div><div class="body"><div class="heading"><strong>Savage Advance</strong><button id="details" aria-expanded="'+details+'">▣ Details</button></div>'+(details?full():'')+(before?'<label class="origin">Origin <select aria-label="Origin"><option>Ozyn Valder</option></select></label>'+setup()+'<div class="muted">Use normal targeting controls to select or remove targets.</div><div class="status"><b>'+(removed?'0':'1')+' / exactly 1 targets</b> · '+(removed?'Select a target':'Ready')+'</div>'+(removed?'<div class="muted">No targets selected.</div>':'<div class="row"><span>Orc Savage (2)</span><button id="remove" aria-label="Remove Orc Savage (2)">×</button></div>')+'<details class="manual"><summary>Manual checks · cover, elevation and special rules</summary><p>Check cover, line of effect, elevation and special power requirements manually.</p></details><footer><button id="reset">Reset demo</button><button class="primary" id="attack" '+(removed?'disabled':'')+'>⚄ Attack…</button></footer>':'<details class="collapsed-before"><summary>Before attack</summary>'+setup()+'</details><div class="status">'+(phase==='rolled'?'Damage rolled':'Attack resolved')+'</div><div class="row"><span>Orc Savage (2)</span><strong class="results">21 · HIT</strong></div><div class="reference" role="region" aria-label="After attack" tabindex="0"><div class="section-label">After attack</div><p><b>Hit:</b> '+hit+'</p><p><b>Miss:</b> Half damage.</p></div><div class="muted">'+(phase==='rolled'?'Apply damage and effects manually':'One shared damage roll · Includes miss damage')+'</div><footer><button class="primary" id="action">'+(phase==='rolled'?'✓ Complete':'⚄ Roll Damage')+'</button></footer>')+'</div></article>';document.getElementById('details').onclick=()=>{details=!details;render();};if(before){document.getElementById('reset').onclick=()=>{removed=false;render();};document.getElementById('remove')?.addEventListener('click',()=>{removed=true;render();});document.getElementById('attack').onclick=()=>{phase='damage';render();};}else document.getElementById('action').onclick=()=>{phase=phase==='damage'?'rolled':'before';removed=false;render();};document.getElementById('state').textContent=JSON.stringify({phase,width:340,details,selectedTargets:removed?0:1,mutations:'demo only'},null,2);}
document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{phase=b.dataset.phase;render();});render();
</script></body></html>

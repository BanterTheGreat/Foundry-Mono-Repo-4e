<!-- PROTOTYPE — Three spatial Compass arrangements: ?variant=orbit|frame|lanes. -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compass spatial layouts</title><style>
:root{color-scheme:dark;--line:#9b7352;--gold:#e3ba81;--paper:#f4e4d2;--muted:#b9a08a;--blue:#91cfe6;font-family:Signika,"Segoe UI",sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(ellipse at 50% 8%,#39342b,#111316 48%,#08090a);color:var(--paper)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(90deg,transparent 0 49px,#fff 50px),repeating-linear-gradient(0deg,transparent 0 49px,#fff 50px)}main{position:relative;z-index:1;width:min(1080px,calc(100vw - 28px));margin:3.4rem auto 6rem}.intro{max-width:720px;margin:0 auto 1rem;text-align:center;color:#dac5ad;font-size:.85rem;line-height:1.4}.intro b{color:var(--gold)}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:.65rem;margin-bottom:.9rem}.tab{height:42px;border:1px solid var(--line);border-radius:10px;background:#151314ee;color:#bba083;box-shadow:0 4px 12px #0008;font-size:.78rem;font-weight:bold;letter-spacing:.05em;text-transform:uppercase}.tab:first-child{color:var(--gold);background:linear-gradient(#392b20,#191513)}.hud{display:grid;grid-template-columns:270px 1fr;min-height:324px;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#121113fa,#08090afa);box-shadow:0 16px 38px #000b,inset 0 0 0 3px #fff1}.portrait-wrap{position:relative;padding:14px;border-right:1px solid #72513b}.portrait{position:relative;height:294px;overflow:hidden;border:3px solid #735038;border-radius:10px;background:radial-gradient(circle at 45% 18%,#f1e3c4 0 18%,transparent 19%),linear-gradient(140deg,#e5d1ad,#b0a083 43%,#743844 44% 64%,#211719 65%)}.portrait:before{content:"";position:absolute;width:68px;height:145px;left:calc(50% - 34px);top:44px;border-radius:44% 48% 23% 23%;background:linear-gradient(100deg,#681d2c,#bd4a59 41%,#39121d 42%);transform:skew(-6deg)}.portrait:after{content:"";position:absolute;width:158px;height:100px;left:calc(50% - 75px);bottom:-30px;border-radius:55% 55% 0 0;background:#5a2639;transform:rotate(-5deg)}.identity{position:absolute;right:26px;bottom:25px;left:26px;padding:.7rem .75rem;border-top:1px solid #d5a36b;background:linear-gradient(90deg,#0b0b0ddd,#281b17cc)}.identity h1{margin:0;color:#f4d3aa;font:1.5rem Georgia,serif}.identity p{margin:.3rem 0 0;color:var(--muted);font-style:italic}.work{height:324px;padding:14px 18px}.label{display:block;color:var(--muted);font-size:.57rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.value{font:700 1.25rem Georgia,serif}.dial{position:relative;width:178px;height:178px}.radial-svg{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);overflow:visible;filter:drop-shadow(0 5px 12px #000a)}.dial-content{position:absolute;inset:67px 34px;z-index:2;display:grid;place-content:center;text-align:center}.dial-content b{color:#ffd177;font:700 1.8rem Georgia,serif}.dial-content small{color:var(--muted);font-size:.58rem}.read{min-width:0}.read .value{margin-top:.15rem}.action{border:0;background:transparent;color:inherit;font:inherit;text-align:inherit;cursor:pointer}.action:hover{color:#ffe0a7}.action .value{display:block}.note{margin:.8rem 0 0;padding:.68rem .8rem;border-left:3px solid var(--gold);background:#161413c8;color:#d8c2aa;font-size:.8rem;line-height:1.35}.note b{color:#f4d5aa}.switcher{position:fixed;z-index:5;bottom:15px;left:50%;display:flex;align-items:center;gap:.3rem;padding:.35rem;border:1px solid var(--gold);border-radius:999px;background:#0c0d0e;box-shadow:0 8px 24px #000c;transform:translateX(-50%)}button{font:inherit;color:inherit;cursor:pointer}.switcher button{width:32px;height:30px;border:0;border-radius:999px;background:transparent;color:var(--gold);font-size:1.15rem}.switcher button:hover{background:#3e2e20}.switcher output{min-width:205px;text-align:center;color:#f4dfc1;font-size:.77rem;font-weight:bold}
/* A: no panels — information forms a constellation around a clear centre. */.orbit{position:relative;display:grid;grid-template-columns:1fr 210px 1fr;grid-template-rows:1fr 1fr 1fr;height:294px}.orbit:before,.orbit:after{content:"";position:absolute;z-index:0;background:#ffffff16}.orbit:before{top:50%;right:7%;left:7%;height:1px}.orbit:after{top:8%;bottom:8%;left:50%;width:1px}.orbit .dial{z-index:1;grid-column:2;grid-row:1/4;align-self:center;justify-self:center}.orbit .read,.orbit .action{z-index:1;align-self:center;padding:.35rem .45rem;border-bottom:1px solid #ffffff24}.orbit .right{text-align:right}.orbit .defences{grid-column:1;grid-row:2;display:grid;grid-template-columns:1.25fr repeat(3,1fr);align-items:center;border-bottom:1px solid #ffffff24}.orbit .defences span{display:grid;place-content:center;text-align:center;border-left:1px solid #ffffff14}.orbit .defences b{font:700 1.08rem Georgia,serif}.orbit .pace{grid-column:3;grid-row:2;display:flex;justify-content:flex-end;gap:1rem;border-bottom:1px solid #ffffff24}.orbit .pace span{display:grid;grid-template-columns:auto auto;align-items:baseline;gap:.15rem}.orbit .pace b{font:700 1.05rem Georgia,serif}
.orbit .action:nth-of-type(odd){align-self:start}.orbit .action:nth-of-type(even){align-self:end}
/* B: information becomes a deliberately quiet perimeter; no central clutter. */.frame{position:relative;display:grid;grid-template-columns:1fr 210px 1fr;grid-template-rows:50px 1fr 55px;height:294px;border:1px solid #ffffff1c}.frame .dial{grid-column:2;grid-row:2;align-self:center;justify-self:center}.frame .top,.frame .bottom{grid-column:1/-1;display:grid;align-items:center}.frame .top{grid-row:1;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #ffffff1c}.frame .bottom{grid-row:3;grid-template-columns:1.4fr 1fr 1fr;border-top:1px solid #ffffff1c;background:#17131288}.frame .top .read,.frame .bottom section{padding:0 .65rem;border-left:1px solid #ffffff18}.frame .top .read:first-child,.frame .bottom section:first-child{border-left:0}.frame .top .read{display:grid;grid-template-columns:1fr auto;align-items:baseline}.frame .bottom section{display:grid;align-content:center}.frame .def-row{display:grid;grid-template-columns:1.3fr repeat(3,1fr);text-align:center}.frame .def-row span{border-left:1px solid #ffffff18}.frame .def-row b{font:700 1.05rem Georgia,serif}.frame .actions{grid-column:3;grid-row:2;display:grid;align-content:center;gap:.1rem}.frame .action{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.4rem;padding:.38rem .1rem;border-bottom:1px solid #ffffff18;text-align:left}.frame .action i{color:#d9b37d;font-style:normal}.frame .action small{color:var(--muted);font-size:.52rem;font-weight:800;text-transform:uppercase}
/* C: three horizontal combat lanes; every action sits beside the state it changes. */.lanes{display:grid;grid-template-rows:1fr 1fr 1fr;height:294px}.lane{display:grid;grid-template-columns:1fr 190px 1fr;align-items:center;border-bottom:1px solid #ffffff20}.lane:last-child{border-bottom:0}.lane .dial{grid-column:2;grid-row:1/4;align-self:center;justify-self:center}.lane .read{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:.45rem;padding:.3rem .55rem}.lane .read i{color:#d9b37d;font-style:normal}.lane .right-actions{display:flex;justify-content:flex-end;gap:.25rem;padding:.25rem}.lane .action{display:grid;grid-template-columns:auto auto;align-items:center;gap:.3rem;padding:.32rem .5rem;border:1px solid #72513b;border-radius:4px;background:#171312;text-align:left}.lane .action i{color:#d9b37d;font-style:normal}.lane .action small{color:var(--muted);font-size:.5rem;font-weight:800;text-transform:uppercase}.lane .def-read{display:grid;grid-template-columns:1.3fr repeat(3,1fr);margin-left:.5rem;text-align:center}.lane .def-read span{display:grid;place-content:center;border-left:1px solid #ffffff18}.lane .def-read b{font:700 1.1rem Georgia,serif}.lane .pace{display:flex;gap:.7rem;padding:.3rem .55rem}.lane .pace span{display:grid;grid-template-columns:auto auto;gap:.15rem;align-items:baseline}.lane .pace i{color:#bda484;font-style:normal}
</style></head><body><main><p class="intro"><b>Three spatial studies:</b> these avoid card piles entirely. The radial remains the only visual mass; the rest uses alignment, thin rules, and open space.</p><nav class="tabs"><button class="tab">⚔ Powers</button><button class="tab">◈ Skills</button><button class="tab">▤ Feats</button><button class="tab">▦ Items</button></nav><section id="app" aria-live="polite"></section></main><nav class="switcher"><button id="prev" aria-label="Previous variant">←</button><output id="label"></output><button id="next" aria-label="Next variant">→</button></nav><script>
const keys=['orbit','frame','lanes'],labels={orbit:'A · Status constellation',frame:'B · Perimeter frame',lanes:'C · Combat lanes'},notes={orbit:'<b>Status constellation:</b> use the radial as the origin; groups sit on its four axes and the unused space gives them air.',frame:'<b>Perimeter frame:</b> passive information belongs to the edge, leaving the combat core visually uninterrupted.',lanes:'<b>Combat lanes:</b> each horizontal line groups a state with the actions most likely to affect it, making the display read like a combat workflow.'};const polar=(r,a)=>[100+r*Math.cos(a*Math.PI/180),100+r*Math.sin(a*Math.PI/180)];const p=([x,y])=>`${x.toFixed(2)} ${y.toFixed(2)}`;const wedge=(r,w,a,b)=>{const o=r+w/2,i=r-w/2;return`M ${p(polar(o,a))} A ${o} ${o} 0 0 1 ${p(polar(o,b))} L ${p(polar(i,b))} A ${i} ${i} 0 0 0 ${p(polar(i,a))} Z`};const ring=(n,on,r,w,lit,dim,edge)=>Array.from({length:n},(_,x)=>{const s=360/n,g=n===8?2.1:n===12?1.5:1.1,a=-90+x*s+g,b=-90+(x+1)*s-g,k=Math.min(2,w*.27);return`<path d="${wedge(r,w,a,b)}" fill="${edge}"/><path d="${wedge(r,w-k*2,a+.45,b-.45)}" fill="${x<on?lit:dim}"/>`}).join('');const radial=()=>`<div class="dial"><svg class="radial-svg" viewBox="0 0 200 200">${ring(16,0,96,4,'#4a8da2','#1d4553','#091519')}${ring(8,6,75,28,'#c65462','#472229','#210f13')}${ring(12,11,51,10,'#d9ad52','#49381d','#25180c')}<circle cx="100" cy="100" r="43" fill="#0d0b0c" stroke="#2c1c18" stroke-width="2"/></svg><div class="dial-content"><b>70</b><small>/ 93</small></div></div>`;const portrait=()=>`<section class="portrait-wrap"><div class="portrait"></div><div class="identity"><h1>Idrani Fullhorn</h1><p>Level 10 Fighter</p></div></section>`;const rsrc=[['⌁','Surges','11 / 12','#f2cf7c'],['◒','Temp HP','0','var(--blue)'],['ϟ','Action Pts','1','var(--paper)']];const defs=[['⬟',25],['✚',24],['ϟ',23],['✦',20]];const acts=[['♥','Heal',''],['✦','Second Wind','Ready'],['★','Save','+2'],['☠','Death','+5'],['☾','Short Rest',''],['🛏','Extended Rest','']];const orbit=()=>`<div class="orbit"><div class="read" style="grid-column:1;grid-row:1"><span class="label">Healing Surges</span><span class="value" style="color:#f2cf7c">11 / 12</span></div><div class="read" style="grid-column:1;grid-row:3"><span class="label">Temporary HP</span><span class="value" style="color:var(--blue)">0</span></div>${radial()}<div class="defences">${defs.map(([i,v])=>`<span><i>${i}</i><b>${v}</b></span>`).join('')}</div><div class="pace">${[['♞',12],['↔',5]].map(([i,v])=>`<span><i>${i}</i><b>${v}</b></span>`).join('')}</div>${acts.map(([i,l,v],n)=>`<button class="action right" style="grid-column:3;grid-row:${n<2?1:n<4?2:3}"><span class="label">${l}</span><span class="value">${v||i}</span></button>`).join('')}</div>`;const frame=()=>`<div class="frame"><section class="top">${rsrc.map(([i,l,v,c])=>`<div class="read"><span class="label">${l}</span><span class="value" style="color:${c}">${v}</span></div>`).join('')}</section>${radial()}<section class="actions">${acts.map(([i,l,v])=>`<button class="action"><i>${i}</i><small>${l}</small><b>${v}</b></button>`).join('')}</section><section class="bottom"><section><span class="label">Defences</span><div class="def-row">${defs.map(([i,v])=>`<span><i>${i}</i><b>${v}</b></span>`).join('')}</div></section><section><span class="label">Initiative</span><b class="value">♞ 12</b></section><section><span class="label">Speed</span><b class="value">↔ 5</b></section></section></div>`;const lanes=()=>`<div class="lanes"><section class="lane"><div class="read"><i>⌁</i><span class="label">Healing Surges</span><span class="value" style="color:#f2cf7c">11 / 12</span></div>${radial()}<div class="right-actions">${acts.slice(0,2).map(([i,l,v])=>`<button class="action"><i>${i}</i><span><small>${l}</small><b>${v}</b></span></button>`).join('')}</div></section><section class="lane"><div class="def-read">${defs.map(([i,v])=>`<span><i>${i}</i><b>${v}</b></span>`).join('')}</div><div class="right-actions">${acts.slice(2,4).map(([i,l,v])=>`<button class="action"><i>${i}</i><span><small>${l}</small><b>${v}</b></span></button>`).join('')}</div></section><section class="lane"><div class="read"><i>◒</i><span class="label">Temporary HP</span><span class="value" style="color:var(--blue)">0</span></div><div class="pace">${[['ϟ','Action Points',1],['♞','Initiative',12],['↔','Speed',5]].map(([i,l,v])=>`<span><i>${i}</i><small>${l}</small><b>${v}</b></span>`).join('')}</div><div class="right-actions">${acts.slice(4).map(([i,l,v])=>`<button class="action"><i>${i}</i><span><small>${l}</small><b>${v}</b></span></button>`).join('')}</div></section></div>`;function view(k){return`<div class="hud">${portrait()}<section class="work">${{orbit,frame,lanes}[k]()}</section></div><p class="note">${notes[k]}<br><b>State:</b> HP 70 / 93 · Surges 11 / 12 · Temp HP 0 · AP 1 · AC 25 · Fort 24 · Ref 23 · Will 20 · Init 12 · Speed 5.</p>`}function current(){const k=new URLSearchParams(location.search).get('variant');return keys.includes(k)?k:'orbit'}function render(){const k=current();document.getElementById('app').innerHTML=view(k);document.getElementById('label').textContent=labels[k]}function change(d){const k=keys[(keys.indexOf(current())+d+keys.length)%keys.length],u=new URL(location);u.searchParams.set('variant',k);history.replaceState(null,'',u);render()}document.getElementById('prev').onclick=()=>change(-1);document.getElementById('next').onclick=()=>change(1);document.addEventListener('keydown',e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName)&&!e.target.isContentEditable){if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1)}});render();
</script></body></html>

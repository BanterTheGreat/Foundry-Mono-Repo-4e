<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;color:#eee4cc;font:14px Arial,sans-serif}.note{color:#aaa;font:13px Arial;margin:0 0 14px}.chat{max-width:430px;margin:auto;background:#252522;padding:18px;border-radius:8px}.speaker{display:flex;justify-content:space-between;color:#d9c5a4;margin:15px 2px 9px;font-size:14px}.speaker small{color:#aa9b85}.card{border:1px solid #8f794e;border-radius:6px;overflow:hidden;background:#0d0c09;margin-bottom:12px}.header{padding:14px 16px;background:linear-gradient(110deg,#292318,#101010);border-bottom:1px solid #655433;display:flex;align-items:center;gap:12px}.header strong{font-size:14px}.kind{display:block;font:700 10px Arial;letter-spacing:.15em;color:#b6a780;margin-bottom:6px}.icon{font-size:21px;color:#d3bd83}.row{display:flex;align-items:center;gap:15px;padding:17px 15px;border-bottom:1px solid #493c26;min-height:96px}.hit{background:linear-gradient(90deg,#28402a99,transparent 68%);--ink:#b4d8b5}.miss{background:linear-gradient(90deg,#532f3399,transparent 68%);--ink:#eab3b3}.verdict{width:76px;flex-shrink:0;text-align:center;border-right:1px solid #ffffff35;padding-right:13px}.verdict strong{font:600 25px/1.2 'Arial Narrow',Arial;color:var(--ink)}.verdict small{display:block;color:#bcb9b1;font-size:11px;margin-top:6px}.main{flex:1}.target{font-weight:bold;font-size:14px}.chip{display:inline-block;border:1px solid #6a8c65;border-radius:3px;padding:4px 6px;margin-top:7px;font-size:11px}.miss .chip{border-color:#a96a65}.chevron{font:26px Arial;color:#bcb5a6}.footer{padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;color:#baaf93;font-size:11px}button{font:600 12px Arial;color:#e5cc8e;border:1px solid #655433;background:#17140f;border-radius:4px;padding:10px 12px;cursor:pointer}button:hover{background:#332b1b}button:focus-visible{outline:2px solid #eee4cc}.amount{font:700 36px Georgia;color:#f2eddf}.unit{font:700 10px Arial;letter-spacing:.08em;margin-left:6px}.scope{font-size:11px;color:#bcb9b1;margin-top:4px}.bar{position:sticky;bottom:8px;margin:18px auto 0;max-width:430px;padding:8px;background:#eee4cc;border-radius:9px;display:flex;align-items:center;justify-content:space-between;color:#211d16;box-shadow:0 4px 16px #0008}.bar button{padding:8px 13px}.label{text-align:center;font:600 12px Arial}.label small{display:block;font-weight:400;margin-top:4px}#description{max-width:430px;margin:12px auto;color:#aaa;font:12px/1.5 Arial;min-height:36px}.inline .row{flex-wrap:wrap}.inline .row button{margin-left:auto}.inline .damage .verdict{width:60px}.inline .damage .main{min-width:115px}.ledger .damage .row{min-height:70px}.ledger .damage .verdict{border:0;width:55px;text-align:left;padding:0}.ledger .damage .verdict strong{font-size:17px}.ledger .damage .amount{font-size:29px}.ledger .damage .row .scope{display:none}.ledger .damage .row .main{display:flex;align-items:baseline;justify-content:space-between}.ledger .damage .unit{font-size:9px}.ledger .damage .footer{display:block}.ledger .damage .footer button{width:100%;margin-top:10px}.ledger .damage .header{background:#292318}.applied{color:#b4d8b5}
</style></head><body><p class="note">Throwaway prototype · buttons simulate actions only</p><main id="demo"></main><p id="description"></p><nav class="bar"><button id="prev" aria-label="Previous design">←</button><div class="label" id="label"></div><button id="next" aria-label="Next design">→</button></nav><script>
const names=['A · Shared footer','B · Apply beside each amount','C · Compact damage ledger'];
const descriptions=['One action per message. Attack and Damage labels establish identity; the damage footer applies both outcome groups together.','Separate Apply buttons sit beside their amounts. Useful when you want to resolve Hit and Miss groups independently.','Damage becomes a compact receipt: smaller outcome labels, prominent amounts, and one full-width footer action.'];
let current=Math.max(0,['A','B','C'].indexOf(new URLSearchParams(location.search).get('variant')));
function row(outcome,target,total,damage=false){return '<div class="row '+outcome.toLowerCase()+'"><div class="verdict"><strong>'+outcome+'</strong><small>'+(damage?'1 target':'Total '+total)+'</small></div><div class="main">'+(damage?'<div><span class="amount">'+total+'</span><span class="unit">DAMAGE</span></div><div class="scope">'+target+'</div>':'<div class="target">vs. '+target+'</div><span class="chip">'+(outcome==='Hit'?'−2 vs Cover':'+2 Combat Advantage')+'</span>')+'</div>'+(damage&&current===1?'<button class="apply">Apply</button>':'')+'<span class="chevron">›</span></div>'}
function render(){document.getElementById('demo').className=current===1?'inline':current===2?'ledger':'';document.getElementById('demo').innerHTML='<div class="chat"><div class="speaker">Ozyn Valder <small>just now</small></div><section class="card attack"><header class="header"><span class="icon">⌖</span><div><span class="kind">ATTACK</span><strong>Dire Radiance</strong></div></header>'+row('Miss','Orc Savage (3)',14)+row('Hit','Badger (2)',23)+'<footer class="footer"><span>2 targets · vs. FORT</span><button id="roll">Roll Damage →</button></footer></section><div class="speaker">Ozyn Valder <small>just now</small></div><section class="card damage"><header class="header"><span class="icon">✦</span><div><span class="kind">DAMAGE</span><strong>Dire Radiance</strong></div></header>'+row('Hit','Badger (2)',5,true)+row('Miss','Orc Savage (3)',2,true)+(current===1?'':'<footer class="footer"><span>2 targets · 2 outcomes</span><button class="apply">Apply Damage to Targets</button></footer>')+'</section><div id="status" aria-live="polite" class="scope">Review the outcomes, then apply damage.</div></div>';document.getElementById('label').innerHTML=names[current]+'<small>← → to compare</small>';document.getElementById('description').textContent=descriptions[current];document.querySelectorAll('.apply').forEach(b=>b.onclick=()=>{b.textContent='✓ Applied';b.disabled=true;document.getElementById('status').innerHTML='<span class="applied">Prototype: damage applied to '+(current===1?'this outcome’s targets.':'both outcome groups.')+'</span>'});document.getElementById('roll').onclick=()=>{document.getElementById('status').textContent='Prototype: damage results shown below the attack.'};}
function cycle(delta){current=(current+delta+3)%3;const u=new URL(location.href);u.searchParams.set('variant',['A','B','C'][current]);try{history.replaceState(null,'',u)}catch{}render()}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></body></html>

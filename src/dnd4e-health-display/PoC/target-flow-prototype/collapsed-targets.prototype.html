<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm Damage · collapsed targets prototype</title>
<!-- THROWAWAY iteration of selected Compact Ledger A. 408px, collapsed targets, outcome and damage-type emphasis. No Foundry connection. -->
<style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#eee4cc);font:12px/1.45 Arial,sans-serif}.intro{margin:0 0 12px;color:var(--muted-foreground,#baab8e);font-size:12px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}button,input,select{font:inherit}button,summary,select{cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid #e9dfce;outline-offset:2px}.tools select,.tools button{padding:6px;background:#171511;color:#eee4cc;border:1px solid #655433;border-radius:4px}.window{width:408px;max-width:100%;margin:0 auto;color:#eee4cc;background:#101011;border:1px solid #8f794e;border-radius:6px;box-shadow:0 8px 24px #0004}.native{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:linear-gradient(110deg,#292318,#101010);border-bottom:1px solid #655433;font-size:11px}.native button{border:0;color:#e5cc8e;background:transparent;font-size:17px;padding:0 3px}.body{padding:10px;display:grid;gap:9px}.heading{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid #493c26}.heading h1{font:600 18px/1.25 Georgia,serif;margin:0}.body button{background:#0d0c09;color:#e5cc8e;border:1px solid #493c26;border-radius:4px;padding:4px 7px;font-size:11px}.body button:hover{background:#ffffff0d;border-color:#8f794e}.damage{border:1px solid #655433;border-radius:4px;background:#181714;overflow:visible}.damage-main{display:grid;grid-template-columns:1fr auto;gap:5px 10px;padding:10px 12px;background:linear-gradient(110deg,#292318,#14130f);border-bottom:1px solid #493c26;align-items:center}.damage.critical .damage-main{background:linear-gradient(110deg,#29251b,#14130f)}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:bold;color:#dfc991}.meta{display:block;color:#b9aa8d;font-size:10px;margin-top:2px}.score{text-align:right;font:600 36px/1 Georgia,serif;color:#f0d393;min-width:56px}.unit{display:block;color:#b9aa8d;font:9px/1.2 Arial,sans-serif;margin-top:3px;text-transform:uppercase;letter-spacing:.07em}.breakdown{padding:6px 12px;display:grid;gap:4px}.component{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;font-size:12px}.component .formula{margin-left:7px;color:#9f937f;font-size:10px}.type{display:inline-flex;gap:6px;align-items:center}.type i{width:6px;height:6px;background:#dfc991;border-radius:50%}.type.fire i{background:#df9772}.component strong{font:600 16px/1.2 Georgia,serif;font-variant-numeric:tabular-nums}.modifier{display:flex;align-items:center;gap:7px;border-top:1px solid #493c26;padding:7px 12px}.modifier label{display:flex;align-items:center;gap:7px;flex:1;font-size:10px;color:#b9aa8d}.modifier input,.target-edit input{height:25px;min-width:0;background:#0d0c09;color:#eee4cc;border:1px solid #655433;border-radius:3px;padding:3px 5px;font-size:11px}.modifier input{flex:1;width:80px}.modifier button{height:25px}.miss-note{display:flex;justify-content:space-between;font-size:11px;color:#b9aa8d;padding:0 3px}.disclosure{border:1px solid #655433;border-radius:4px;background:#181714}.disclosure>summary{display:flex;align-items:center;gap:7px;list-style:none;padding:9px 10px}.disclosure>summary:before{content:'›';font-size:18px;line-height:1;color:#dfc991}.disclosure[open]>summary:before{transform:rotate(90deg)}.disclosure>summary b{font-size:12px}.disclosure>summary .counts{margin-left:auto;font-size:10px;color:#baab8e}.badge{color:#dfc991;font-size:10px}.roster{max-height:220px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#806b42 #20201c;border-top:1px solid #493c26}.columns,.row{display:grid;grid-template-columns:minmax(0,1fr) 75px 112px;gap:7px;padding:8px}.columns{font-size:9px;text-transform:uppercase;color:#baab8e;background:#292318}.row{align-items:center;border-top:1px solid #493c26;min-height:62px}.identity{display:flex;gap:6px;align-items:center;min-width:0}.portrait{display:grid;place-items:center;border:1px solid #806b42;background:#30291e;border-radius:50%;width:26px;height:26px;flex-shrink:0;font-size:9px;color:#d9c49b}.name{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:12px;line-height:1.3;font-weight:600;overflow-wrap:anywhere}.verdict{font-size:11px;font-weight:bold}.hit{color:#b9ddb5}.critical{color:#e5cc8e}.miss{color:#f0b4b4}.target-total{font:600 19px/1 Georgia,serif;color:#e5cc8e}.target-edit{display:flex;gap:4px;margin-top:5px}.target-edit input{width:62px;flex:1}.target-edit button{padding:3px 5px;font-size:10px}.rules{font-size:11px;color:#c8b99a}.rules summary{cursor:pointer}.after{padding:8px 10px;background:#222019;border-left:2px solid #aa8b4e}.after p{margin:4px 0 0;font-size:12px;color:#dbceb6}.after .eyebrow{font-size:9px}.footer{border-top:1px solid #493c26;padding-top:9px}.footer button{width:100%;padding:7px;border-color:#8f794e;background:linear-gradient(#443825,#27221b);font-size:12px}.error{color:#f0b4b4;font-size:11px}.state{margin-top:14px;font-size:11px;color:var(--muted-foreground,#baab8e)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:10px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
<p class="intro">THROWAWAY · Confirm Damage with targets collapsed. 408px. The pictured power deals radiant damage; the optional fire rider is illustrative mock data.</p>
<div class="tools"><label>Example <select id="example" onchange="example=this.value;confirmed=false;render()"><option value="radiant">Pictured power · radiant</option><option value="mixed">Radiant + fire rider (mock)</option><option value="half">Half on miss (mock)</option><option value="missroll">Separate miss roll (mock)</option></select></label><button onclick="reset()">Reset</button></div>
<div id="app"></div><details class="state"><summary>Inspect mock state</summary><pre id="state"></pre></details>
<script>
let example='radiant',expanded=false,confirmed=false,error='',details=false;
const shared={hit:{formula:'',value:0},crit:{formula:'',value:0},miss:{formula:'',value:0}};
const targets=[{name:'Iron Guard',portrait:'IG',outcome:'hit',attack:24,formula:'',bonus:0},{name:'Ash Cultist',portrait:'AC',outcome:'miss',attack:16,formula:'',bonus:0},{name:'Grave Hound of the Ashen Court',portrait:'GH',outcome:'crit',attack:31,formula:'',bonus:0},{name:'Bone Archer',portrait:'BA',outcome:'miss',attack:12,formula:'',bonus:0}];
function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}
function rollModifier(formula){if(!/^[\d+\-dD\s]*$/.test(formula))throw Error('Use a number or dice formula.');const resolved=formula.replace(/(\d*)d(\d+)/gi,(_,n,f)=>{n=Number(n||1);f=Number(f);if(n>20||f<1||f>100)throw Error('Use up to 20 dice with 1–100 faces.');return String(Array.from({length:n},()=>1+Math.floor(Math.random()*f)).reduce((a,b)=>a+b,0))});if(resolved&&!/^\s*[+-]?\s*\d+(\s*[+-]\s*\d+)*\s*$/.test(resolved))throw Error('Use a number or dice formula.');return (resolved.match(/[+-]?\s*\d+/g)||[]).reduce((a,b)=>a+Number(b.replace(/\s/g,'')),0)}
function applyShared(key){const formula=document.getElementById('shared-'+key).value.trim();try{if(shared[key].formula!==formula)shared[key]={formula,value:rollModifier(formula)};error=''}catch(e){error=e.message}render()}
function applyTarget(i){const formula=document.getElementById('target-'+i).value.trim();try{if(targets[i].formula!==formula){const total=rollModifier(formula);targets[i].formula=formula;targets[i].bonus=total}error=''}catch(e){error=e.message}render()}
function components(key){if(key==='miss')return [['radiant',3,'3']];return [['radiant',key==='crit'?10:8,key==='crit'?'6 + 4':'1d6 (4) + 4'],...(example==='mixed'?[['fire',key==='crit'?6:3,key==='crit'?'6':'1d6 (3)']]:[])]}
function total(key){return components(key).reduce((a,c)=>a+c[1],0)+shared[key].value}
function received(t){return t.bonus+(t.outcome==='hit'?total('hit'):t.outcome==='crit'?total('crit'):example==='half'?Math.floor(total('hit')/2):example==='missroll'?total('miss'):0)}
function damageCard(key,label,count){return `<section class="damage ${key==='crit'?'critical':''}" aria-label="${label} damage"><div class="damage-main"><div><div class="eyebrow">${label} damage</div><span class="meta">${count} ${count===1?'target':'targets'}</span></div><div class="score">${total(key)}<span class="unit">Total damage</span></div></div><div class="breakdown">${components(key).map(([type,value,formula])=>`<div class="component"><span><span class="type ${type}"><i aria-hidden="true"></i>${type[0].toUpperCase()+type.slice(1)}</span><span class="formula">${formula}</span></span><strong>${value}</strong></div>`).join('')}${shared[key].value?`<div class="component"><span>Modifier</span><strong>${shared[key].value>0?'+':''}${shared[key].value}</strong></div>`:''}</div>${confirmed?'':`<div class="modifier"><label>Modifier <input id="shared-${key}" value="${esc(shared[key].formula)}" placeholder="+0" aria-label="${label} shared damage modifier" onkeydown="if(event.key==='Enter')applyShared('${key}')"></label><button onclick="applyShared('${key}')">Apply</button></div>`}</section>`}
function render(){document.getElementById('example').value=example;const changed=targets.filter(t=>t.bonus).length;document.getElementById('app').innerHTML=`<main class="window"><div class="native"><span>Cold Starlight · ${confirmed?'Damage confirmed':'Confirm damage'}</span><button aria-label="Mock Foundry close" onclick="document.getElementById('app').innerHTML='<p>Mock dialog closed.</p>'">×</button></div><div class="body"><header class="heading"><h1>Cold Starlight</h1><button onclick="details=!details;render()">Details</button></header>${details?'<div class="rules">Ranged 10 · one creature · +11 vs. Fortitude.<br>Level 21: 2d6 + ability modifier. Four targets are retained for this mock.</div>':''}${error?'<div class="error" role="alert">'+esc(error)+'</div>':''}${damageCard('hit','Hit',1)}${damageCard('crit','Critical',1)}${example==='missroll'?damageCard('miss','Miss',2):`<div class="miss-note"><span>Miss damage</span><b>${example==='half'?Math.floor(total('hit')/2)+' · half Hit':'0'}</b></div>`}<details class="disclosure" id="targetDisclosure" ${expanded?'open':''}><summary><b>Targets · 4</b>${changed?'<span class="badge">'+changed+' modified</span>':''}<span class="counts">1 Hit · 1 Crit · 2 Miss</span></summary><div class="roster"><div class="columns"><span>Target</span><span>Attack</span><span>Damage</span></div>${targets.map((t,i)=>`<article class="row"><div class="identity"><span class="portrait">${t.portrait}</span><span class="name" title="${t.name}">${t.name}</span></div><div class="verdict ${t.outcome==='crit'?'critical':t.outcome}">${t.attack} · ${t.outcome.toUpperCase()}</div><div><strong class="target-total">${received(t)}</strong>${confirmed?'':`<div class="target-edit"><label class="sr" for="target-${i}">Damage modifier for ${t.name}</label><input id="target-${i}" value="${esc(t.formula)}" placeholder="+0" onkeydown="if(event.key==='Enter')applyTarget(${i})"><button onclick="applyTarget(${i})" aria-label="Apply modifier for ${t.name}">Apply</button></div>`}</div></article>`).join('')}</div></details><details class="rules"><summary>Before the Attack</summary><p>Ranged 10 · one creature · +11 vs. Fortitude.</p></details><section class="after"><div class="eyebrow">After the Attack</div><p><b>Hit:</b> 1d6 + Charisma or Constitution modifier radiant damage. The first time the target moves closer to you on its next turn, it takes an extra 1d6 + that modifier damage. This is a Feat effect.</p></section><footer class="footer"><button onclick="${confirmed?'reset()':'confirmed=true;render()'}">${confirmed?'Complete (restart mock)':'Confirm Damage'}</button></footer></div></main>`;document.getElementById('targetDisclosure').addEventListener('toggle',e=>{expanded=e.target.open;showState()});showState()}
function showState(){document.getElementById('state').textContent=JSON.stringify({example,expanded,confirmed,shared,targets:targets.map(t=>({name:t.name,outcome:t.outcome,modifier:t.formula,bonus:t.bonus,total:received(t)}))},null,2)}
function reset(){expanded=false;confirmed=false;error='';details=false;Object.values(shared).forEach(s=>{s.formula='';s.value=0});targets.forEach(t=>{t.formula='';t.bonus=0});render()}
render();console.log('Collapsed targets mock ready · 408px · damage types + outcome rolls');
</script></html>

<p class="intro">THROWAWAY · Three column-based damage layouts inside the same dialog. Switch A / B / C below, or use ← / →. Mixed damage adds an illustrative fire rider to the pictured radiant power.</p>
<div class="tools"><button onclick="variant='A';switchVariant(0)">A · Total first</button><button onclick="variant='B';switchVariant(0)">B · Score block</button><button onclick="variant='C';switchVariant(0)">C · Compact</button></div><div class="tools"><label>Example <select id="example" onchange="example=this.value;confirmed=false;render()"><option value="radiant">Pictured power · radiant</option><option value="mixed">Radiant + fire rider (mock)</option><option value="half">Half on miss (mock)</option><option value="missroll">Separate miss roll (mock)</option></select></label><button onclick="reset()">Reset</button></div>
<div id="app"></div><nav class="switcher" aria-label="Damage design"><button onclick="switchVariant(-1)" aria-label="Previous design">←</button><strong id="variant-label"></strong><button onclick="switchVariant(1)" aria-label="Next design">→</button></nav><details class="state"><summary>Inspect mock state</summary><pre id="state"></pre></details>
<script>

function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}
function rollModifier(formula){if(!/^[\d+\-dD\s]*$/.test(formula))throw Error('Use a number or dice formula.');const resolved=formula.replace(/(\d*)d(\d+)/gi,(_,n,f)=>{n=Number(n||1);f=Number(f);if(n>20||f<1||f>100)throw Error('Use up to 20 dice with 1–100 faces.');return String(Array.from({length:n},()=>1+Math.floor(Math.random()*f)).reduce((a,b)=>a+b,0))});if(resolved&&!/^\s*[+-]?\s*\d+(\s*[+-]\s*\d+)*\s*$/.test(resolved))throw Error('Use a number or dice formula.');return (resolved.match(/[+-]?\s*\d+/g)||[]).reduce((a,b)=>a+Number(b.replace(/\s/g,'')),0)}
function applyShared(key){const formula=document.getElementById('shared-'+key).value.trim();try{if(shared[key].formula!==formula)shared[key]={formula,value:rollModifier(formula)};error=''}catch(e){error=e.message}render()}
function applyTarget(i){const formula=document.getElementById('target-'+i).value.trim();try{if(targets[i].formula!==formula){const total=rollModifier(formula);targets[i].formula=formula;targets[i].bonus=total}error=''}catch(e){error=e.message}render()}
function components(key){if(key==='miss')return [['radiant',3,'3']];return [['radiant',key==='crit'?10:8,key==='crit'?'6 + 4':'1d6 (4) + 4'],...(example==='mixed'?[['fire',key==='crit'?6:3,key==='crit'?'6':'1d6 (3)']]:[])]}
function total(key){return components(key).reduce((a,c)=>a+c[1],0)+shared[key].value}
function received(t){return t.bonus+(t.outcome==='hit'?total('hit'):t.outcome==='crit'?total('crit'):example==='half'?Math.floor(total('hit')/2):example==='missroll'?total('miss'):0)}

function modifierEditor(key,label){return confirmed?`<span class="read-mod">${shared[key].value>=0?'+':''}${shared[key].value}</span>`:`<div class="inline-mod"><input id="shared-${key}" value="${esc(shared[key].formula)}" placeholder="+0" aria-label="${label} shared damage modifier" onkeydown="if(event.key==='Enter')applyShared('${key}')"><button onclick="applyShared('${key}')" aria-label="Apply ${label} modifier">Apply</button></div>`}
function DamageEquation(key,label,count){const rolled=components(key).reduce((a,c)=>a+c[1],0);return `<section class="damage equation outcome-${key}" aria-label="${label} damage"><div class="outcome-head"><b>${label} damage</b><span>${count} ${count===1?'target':'targets'}</span></div><div class="equation-grid"><div><small>Rolled</small><strong class="rolled-number">${rolled}</strong></div><span class="operator">+</span><div><small>Modifier</small>${modifierEditor(key,label)}</div><span class="operator">=</span><div><small>Total</small><strong class="final-number">${total(key)}</strong></div></div><div class="type-strip">${components(key).map(([type,value])=>`<span class="type ${type}"><i aria-hidden="true"></i>${value} ${type}</span>`).join('<span class="type-plus">+</span>')}</div></section>`}
function DamageScoreRail(key,label,count){return `<section class="damage score-rail outcome-${key}" aria-label="${label} damage"><div class="rail-content"><div class="eyebrow">${label} damage</div><div class="rail-types">${components(key).map(([type,value,formula])=>`<div class="component"><span><span class="type ${type}"><i aria-hidden="true"></i>${type[0].toUpperCase()+type.slice(1)}</span><small>${formula}</small></span><strong>${value}</strong></div>`).join('')}</div><div class="rail-mod"><small>Modifier</small>${modifierEditor(key,label)}</div></div><div class="score-side"><small>Total</small><strong>${total(key)}</strong><small>${count} ${count===1?'target':'targets'}</small></div></section>`}
function DamageLedger(outcomes){return `<section class="damage ledger" aria-label="Damage calculation">${outcomes.map(([key,label,count])=>{const parts=components(key);const rolled=key==='miss'?3:(key==='crit'?6:4)+(example==='mixed'?(key==='crit'?6:3):0);const base=key==='miss'?0:4;const mods=base+shared[key].value;return `<div class="ledger-row outcome-${key}"><div class="compact-heading"><b>${label}</b><span>${count} ${count===1?'target':'targets'}</span></div><strong class="ledger-total">${total(key)}</strong><div class="calculation"><div><strong>${rolled}</strong><div class="compact-formula" title="Roll formula">${key==='miss'?'3':key==='crit'?'Max + 3d6':'1d6 + 4'}${example==='mixed'&&key!=='miss'?(key==='crit'?'':' + 1d6'):''}${shared[key].value?' '+(shared[key].value>=0?'+ ':'− ')+Math.abs(shared[key].value):''}</div></div><span>+</span><div><strong>${mods}</strong><small>Mod</small></div><span>=</span><div><strong>${total(key)}</strong><small>Total</small></div></div><div class="compact-edit"><small>Adjust ${label.toLowerCase()} damage</small>${modifierEditor(key,label)}</div></div>`}).join('')}</section>`}

function damageSection(){const outcomes=[['hit','Hit',1],['crit','Critical',1],...(example==='missroll'?[['miss','Miss',2]]:[])];return '<div class="outcome-columns">'+outcomes.map(args=>(variant==='A'?DamageEquation:variant==='B'?DamageScoreRail:(key,label,count)=>DamageLedger([[key,label,count]]))(...args)).join('')+`${example==='missroll'?'':`<div class="miss-note outcome-miss"><span>Miss</span><span class="derived-count">2 targets</span><b class="miss-total">${example==='half'?Math.floor(total('hit')/2):'0'}</b><small>${example==='half'?'½ Hit · rounded down':'No damage on miss'}</small></div>`}`+'</div>'}
function switchVariant(step){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+step+3)%3];const url=new URL(location.href);url.searchParams.set('variant',variant);try{history.replaceState({},'',url)}catch{};render()}
document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowLeft')switchVariant(-1);if(event.key==='ArrowRight')switchVariant(1)});
function render(){document.getElementById('variant-label').textContent=variant+' · '+({A:'Total first columns',B:'Score block columns',C:'Compact columns'}[variant]);document.getElementById('example').value=example;const changed=targets.filter(t=>t.bonus).length;document.getElementById('app').innerHTML=`<main class="window"><div class="native"><span>Dire Radiance · ${confirmed?'Damage confirmed':'Confirm damage'}</span><button aria-label="Mock Foundry close" onclick="document.getElementById('app').innerHTML='<p>Mock dialog closed.</p>'">×</button></div><div class="body"><header class="heading"><h1>Dire Radiance</h1><button onclick="details=!details;render()">Details</button></header>${details?'<div class="rules">Ranged 10 · one creature · +11 vs. Fortitude.<br>Level 21: 2d6 + ability modifier. Four targets are retained for this mock.</div>':''}${error?'<div class="error" role="alert">'+esc(error)+'</div>':''}${damageSection()}<details class="disclosure" id="targetDisclosure" ${expanded?'open':''}><summary><b>Targets · 4</b>${changed?'<span class="badge">'+changed+' modified</span>':''}<span class="counts">1 Hit · 1 Crit · 2 Miss</span></summary><div class="roster"><div class="columns"><span>Target</span><span>Attack</span><span>Damage</span></div>${targets.map((t,i)=>`<article class="row"><div class="identity"><span class="portrait">${t.portrait}</span><span class="name" title="${t.name}">${t.name}</span></div><div class="verdict ${t.outcome==='crit'?'critical':t.outcome}">${t.attack} · ${t.outcome.toUpperCase()}</div><div><strong class="target-total">${received(t)}</strong>${confirmed?'':`<div class="target-edit"><label class="sr" for="target-${i}">Damage modifier for ${t.name}</label><input id="target-${i}" value="${esc(t.formula)}" placeholder="+0" onkeydown="if(event.key==='Enter')applyTarget(${i})"><button onclick="applyTarget(${i})" aria-label="Apply modifier for ${t.name}">Apply</button></div>`}</div></article>`).join('')}</div></details><details class="rules"><summary>Before the Attack</summary><p>Ranged 10 · one creature · +11 vs. Fortitude.</p></details><section class="after"><div class="eyebrow">After the Attack</div><p><b>Hit:</b> 1d6 + Charisma modifier or Constitution modifier radiant damage. The first time the target moves closer to you on its next turn, it takes an extra 1d6 + Charisma modifier or Constitution modifier damage. This is a Feat effect.</p><p><b>Special:</b> Level 21: 2d6 + Charisma modifier or Constitution modifier damage.</p></section><footer class="footer"><button onclick="${confirmed?'reset()':'confirmed=true;render()'}">${confirmed?'Complete (restart mock)':'Apply Damage'}</button></footer></div></main>`;document.getElementById('targetDisclosure').addEventListener('toggle',e=>{expanded=e.target.open;showState()});showState()}
function showState(){document.getElementById('state').textContent=JSON.stringify({variant,example,expanded,confirmed,shared,targets:targets.map(t=>({name:t.name,outcome:t.outcome,modifier:t.formula,bonus:t.bonus,total:received(t)}))},null,2)}
function reset(){expanded=false;confirmed=false;error='';details=false;Object.values(shared).forEach(s=>{s.formula='';s.value=0});targets.forEach(t=>{t.formula='';t.bonus=0});render()}
render();console.log('Collapsed targets mock ready · 640px · damage types + outcome rolls');
</script></html>

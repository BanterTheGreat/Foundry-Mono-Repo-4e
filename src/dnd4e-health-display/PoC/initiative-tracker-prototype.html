<!doctype html>
<!--
  THROWAWAY UI PROTOTYPE — not Foundry production code.
  Question: What should the Battle Briefing's bottom "Initiative Order" strip
  look like, given the combatant count swings from ~5 to ~16 (lots of
  same-type minions)? The current build places pins on a single fixed-width
  line, which crowds/overlaps badly at the high end.
  Three structurally different variants, switchable with ?variant=A|B|C.
  Use the "Encounter size" control (top-right) to stress-test each variant
  at 5, 10, and 16 combatants, and "Next Turn" to see how the current-turn
  indicator behaves as the round advances.
  Assumption: standard/minion monsters of the same statblock share one
  initiative roll (common 4e table practice), so they naturally land
  adjacent in turn order — this is what variant B's grouping relies on.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Initiative Tracker Prototype</title>
<style>
  :root {
    color-scheme: dark;
    --void: #08090b; --panel: #121116; --panel-hi: #1a171b; --edge: #4b3828; --brass: #c79b59;
    --brass-hi: #e4b96f; --paper: #f1e3d1; --muted: #9e958a; --blood: #a64a43; --hero: #5d829d;
    --gold: #e0c68f; --green: #3b914b;
    font-family: Signika, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    min-width: 960px; min-height: 100vh; margin: 0; overflow-x: hidden; padding-bottom: 4.5rem;
    background: radial-gradient(ellipse at 50% 0%, #241d1a 0%, #0c0d10 60%); color: var(--paper);
  }
  button { color: inherit; font: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }

  .prototype-note {
    position: fixed; z-index: 5; bottom: 5.4rem; left: 1rem; max-width: 21rem;
    color: #b8ac9a; font-size: 0.72rem; line-height: 1.45;
  }
  .prototype-note b { color: var(--brass-hi); }

  .devbar {
    position: fixed; z-index: 5; top: 0.8rem; right: 1rem; display: flex; align-items: center;
    gap: 0.5rem; padding: 0.4rem 0.6rem; border: 1px solid var(--edge); border-radius: 0.4rem;
    background: #17141688; backdrop-filter: blur(3px); font-size: 0.65rem;
  }
  .devbar span { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .devbar .sizes { display: flex; gap: 0.2rem; }
  .devbar .sizes button {
    padding: 0.25rem 0.5rem; border: 1px solid #5a4230; border-radius: 0.25rem; background: #201a1c;
    color: #cbb794; font-weight: 700;
  }
  .devbar .sizes button.is-active { border-color: var(--brass-hi); background: #4a2f1c; color: #ffe4b0; }
  .devbar .next {
    padding: 0.25rem 0.6rem; border: 1px solid #6b4f34; border-radius: 0.25rem; background: #2a1f1a;
    color: var(--gold); font-weight: 700;
  }
  .devbar .next:hover { border-color: var(--brass-hi); }

  .dialog {
    width: min(72rem, calc(100vw - 3rem)); margin: 1rem auto; border: 1px solid var(--edge);
    border-radius: 0.5rem; background: linear-gradient(#141216, #0e0d10 60%);
    box-shadow: 0 1.5rem 4rem #000c; overflow: hidden;
  }
  .dialog__heading {
    padding: 1rem 1.4rem 0.85rem; border-bottom: 1px solid var(--edge);
    background: radial-gradient(circle at 50% 0, rgb(112 38 34 / 20%), transparent 58%), #121216;
  }
  .dialog__heading .eyebrow {
    display: block; color: var(--brass); font-size: 0.6rem; font-weight: 800; letter-spacing: 0.13em;
    text-transform: uppercase;
  }
  .dialog__heading h1 { margin: 0.15rem 0 0.2rem; font-family: "Modesto Condensed", Georgia, serif; font-size: 1.6rem; font-weight: normal; }
  .dialog__heading p { margin: 0; color: var(--muted); font-size: 0.78rem; }

  .dialog__body { display: grid; grid-template-columns: 1.5fr 0.9fr; gap: 0; border-bottom: 1px solid var(--edge); }
  .side { padding: 0.85rem 1.2rem; }
  .side + .side { border-left: 1px solid var(--edge); }
  .side h2 { margin: 0 0 0.55rem; color: var(--brass); font-size: 0.62rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
  .roster-row {
    display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; font-size: 0.78rem;
  }
  .roster-row .mono {
    display: grid; place-items: center; flex: 0 0 auto; width: 1.7rem; height: 1.7rem; border-radius: 50%;
    font-size: 0.6rem; font-weight: 800; border: 1.5px solid var(--hero);
  }
  .side.enemies .mono { border-color: var(--blood); background: #2a1416; color: #f2b3ac; }
  .side.party .mono { background: #16242c; color: #cfe6f2; }
  .roster-row b { font-weight: 700; }
  .roster-row small { margin-left: auto; color: var(--muted); }

  /* ---- shared tracker chrome ---- */
  .tracker { padding: 0.6rem 1rem 0.75rem; background: linear-gradient(#111217, #0c0d10); min-height: 9.5rem; }
  .tracker > header {
    display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.55rem; color: var(--brass);
    font-size: 0.62rem; font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase;
  }
  .tier { color: var(--gold); }
  .avatar {
    display: grid; place-items: center; border-radius: 50%; font-weight: 800; flex: 0 0 auto;
    background: #201a1c; border: 2px solid var(--hero);
  }
  .avatar.hostile { border-color: var(--blood); background: #2a1416; color: #f2b3ac; }
  .avatar.friendly { background: #16242c; color: #cfe6f2; }
  .is-hidden-pin { border-style: dashed !important; opacity: 0.7; }

  /* ================= Variant A — Scrolling Ribbon ================= */
  .variant-a .ribbon-wrap { position: relative; }
  .variant-a .ribbon-wrap::before,
  .variant-a .ribbon-wrap::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 2.2rem; z-index: 2; pointer-events: none;
  }
  .variant-a .ribbon-wrap::before { left: 0; background: linear-gradient(90deg, #0c0d10, transparent); }
  .variant-a .ribbon-wrap::after { right: 0; background: linear-gradient(270deg, #0c0d10, transparent); }
  .variant-a .ribbon {
    display: flex; gap: 0.5rem; overflow-x: auto; scroll-snap-type: x proximity; padding: 0.3rem 0.5rem 0.6rem;
    scrollbar-width: thin;
  }
  .variant-a .chip {
    scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
    flex: 0 0 auto; width: 4.2rem; padding: 0.4rem 0.3rem 0.35rem; border: 1px solid #33292a;
    border-radius: 0.4rem; background: #17151a;
  }
  .variant-a .chip .avatar { width: 2rem; height: 2rem; font-size: 0.6rem; }
  .variant-a .chip .seq { color: #756c62; font-size: 0.58rem; font-weight: 700; }
  .variant-a .chip .init { color: var(--gold); font-size: 0.72rem; font-weight: 800; font-family: "Modesto Condensed", serif; }
  .variant-a .chip .name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.58rem; color: #cbbfa9; text-align: center; }
  .variant-a .chip.is-current {
    width: 4.8rem; padding-top: 0.5rem; border-color: var(--brass-hi); background: #2c2114;
    box-shadow: 0 0 0.9rem rgb(228 185 111 / 35%);
  }
  .variant-a .chip.is-current .avatar { width: 2.5rem; height: 2.5rem; font-size: 0.68rem; }

  /* ================= Variant B — Tiered Round Ladder ================= */
  .variant-b .rung {
    display: flex; align-items: center; gap: 0.55rem; padding: 0.4rem 0.55rem; margin-bottom: 0.3rem;
    border: 1px solid #2c2426; border-radius: 0.35rem; background: #151316; font-size: 0.74rem;
    cursor: pointer;
  }
  .variant-b .rung:hover { border-color: #4a3a2c; }
  .variant-b .rung .avatar { width: 1.9rem; height: 1.9rem; font-size: 0.58rem; }
  .variant-b .rung .stack { position: relative; width: 1.9rem; height: 1.9rem; flex: 0 0 auto; }
  .variant-b .rung .stack .avatar { position: absolute; width: 1.5rem; height: 1.5rem; font-size: 0.5rem; }
  .variant-b .rung .stack .avatar:nth-child(1) { top: 0; left: 0.4rem; z-index: 3; }
  .variant-b .rung .stack .avatar:nth-child(2) { top: 0.35rem; left: 0; z-index: 2; opacity: 0.85; }
  .variant-b .rung .stack .avatar:nth-child(3) { top: 0.35rem; left: 0.8rem; z-index: 1; opacity: 0.7; }
  .variant-b .rung b { font-weight: 700; }
  .variant-b .rung .count-badge {
    padding: 0.05rem 0.4rem; border-radius: 1rem; background: #3a2c1a; color: var(--gold);
    font-size: 0.62rem; font-weight: 800;
  }
  .variant-b .rung .init-badge {
    margin-left: auto; color: var(--gold); font-family: "Modesto Condensed", serif; font-size: 0.9rem; font-weight: 800;
  }
  .variant-b .rung.is-current { border-color: var(--brass-hi); background: #241a10; }
  .variant-b .rung.is-current .avatar { border-color: var(--brass-hi); }
  .variant-b .tier-label {
    margin: 0.5rem 0 0.25rem; color: #756c62; font-size: 0.58rem; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .variant-b .tier-label:first-child { margin-top: 0; }
  .variant-b .rung.is-expanded .members { display: flex; }
  .variant-b .members { display: none; flex-wrap: wrap; gap: 0.3rem; width: 100%; margin-top: 0.3rem; padding-left: 2.4rem; }
  .variant-b .members span {
    padding: 0.1rem 0.4rem; border: 1px solid #3a2c1a; border-radius: 0.8rem; font-size: 0.6rem; color: #cbbfa9;
  }
  .variant-b .ladder { max-height: 12rem; overflow-y: auto; padding-right: 0.3rem; }

  /* ================= Variant C — Radial Turn Wheel ================= */
  .variant-c { display: flex; align-items: center; justify-content: center; gap: 1.4rem; padding: 0.4rem 0.8rem 0.6rem; }
  .variant-c .wheel { position: relative; flex: 0 0 auto; width: 11.5rem; height: 11.5rem; }
  .variant-c .wheel::before {
    content: ""; position: absolute; inset: 0.9rem; border-radius: 50%; border: 1px dashed #3a3026;
  }
  .variant-c .node {
    position: absolute; top: 50%; left: 50%; display: grid; place-items: center; transform-origin: center;
  }
  .variant-c .node .avatar { font-size: 0.55rem; }
  .variant-c .node .seq {
    position: absolute; top: -0.35rem; right: -0.2rem; width: 0.95rem; height: 0.95rem; border-radius: 50%;
    background: #100d0e; border: 1px solid #4a3a2c; color: #a99a80; font-size: 0.5rem; font-weight: 800;
    display: grid; place-items: center;
  }
  .variant-c .node.is-current .avatar {
    border-color: var(--brass-hi); box-shadow: 0 0 0.7rem rgb(228 185 111 / 45%);
  }
  .variant-c .now-card {
    flex: 0 0 auto; width: 13rem; padding: 0.7rem 0.8rem; border: 1px solid var(--brass-hi); border-radius: 0.4rem;
    background: linear-gradient(#241c12, #17130f);
  }
  .variant-c .now-card .eyebrow2 { color: var(--brass); font-size: 0.58rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
  .variant-c .now-card h3 { margin: 0.2rem 0 0.15rem; font-family: "Modesto Condensed", Georgia, serif; font-size: 1.15rem; font-weight: normal; }
  .variant-c .now-card p { margin: 0; color: var(--muted); font-size: 0.68rem; }
  .variant-c .now-card .init-line { margin-top: 0.4rem; color: var(--gold); font-size: 0.85rem; font-weight: 800; }

  .switcher {
    position: fixed; z-index: 5; bottom: 1rem; left: 50%; display: flex; align-items: center; gap: 0.55rem;
    padding: 0.42rem; border: 1px solid #bd9360; border-radius: 2rem; background: #151216;
    box-shadow: 0 0.35rem 1.2rem #000c; transform: translateX(-50%);
  }
  .switcher button { width: 2rem; height: 2rem; border: 1px solid #745a43; border-radius: 50%; background: #2a211c; color: #f4d39e; font-size: 1rem; }
  .switcher button:hover { border-color: #f0c879; background: #4b3522; }
  .switcher output { min-width: 20rem; color: #ecd3b2; font-size: 0.7rem; font-weight: 700; text-align: center; }
</style>
</head>
<body>
  <aside class="prototype-note">
    <b>Throwaway design study — Initiative Order strip only.</b>
    The rest of the Battle Briefing is a static stand-in for context.
    Use the top-right size buttons to jump between 5 / 10 / 16 combatants,
    and "Next Turn" to step the current-turn marker through the round.
  </aside>

  <div class="devbar">
    <span>Encounter size</span>
    <div class="sizes">
      <button data-size="5">5</button>
      <button data-size="10">10</button>
      <button data-size="16">16</button>
    </div>
    <button class="next" id="nextTurn">Next Turn ▶</button>
  </div>

  <main id="app"></main>

  <nav class="switcher" aria-label="Prototype variant selector">
    <button id="previous" aria-label="Previous variant">←</button>
    <output id="label"></output>
    <button id="next" aria-label="Next variant">→</button>
  </nav>

<script>
  const PARTY = [
    { id: "p1", name: "Rogal", type: "Swordmage", icon: "RG", side: "friendly", initiative: 28 },
    { id: "p2", name: "Branwen", type: "Cleric", icon: "BR", side: "friendly", initiative: 14 },
    { id: "p3", name: "Tomas", type: "Rogue", icon: "TM", side: "friendly", initiative: 24 },
    { id: "p4", name: "Ilse", type: "Ranger", icon: "IL", side: "friendly", initiative: 19 },
  ];

  // Consecutive same-groupKey entries share an initiative, mirroring the common
  // 4e practice of one roll per monster type — this is what lets variant B
  // collapse them into a single row.
  const ENEMY_POOL = [
    { groupKey: "dragonshield", name: "Kobold Dragonshield", tier: "elite", icon: "DS", initiative: 21 },
    { groupKey: "wyrmpriest", name: "Kobold Wyrmpriest", tier: "leader", icon: "WP", initiative: 18, hidden: true },
    { groupKey: "slyblade", name: "Kobold Slyblade", tier: "standard", icon: "SB", initiative: 25 },
    { groupKey: "slyblade", name: "Kobold Slyblade", tier: "standard", icon: "SB", initiative: 25 },
    { groupKey: "trapmaster", name: "Kobold Trapmaster", tier: "standard", icon: "TR", initiative: 11, hidden: true },
    { groupKey: "skirmisher-std", name: "Kobold Skirmisher", tier: "standard", icon: "KS", initiative: 16 },
    { groupKey: "skirmisher-std", name: "Kobold Skirmisher", tier: "standard", icon: "KS", initiative: 16 },
    { groupKey: "quickclaw-min", name: "Kobold Quickclaw", tier: "minion", icon: "QC", initiative: 22 },
    { groupKey: "quickclaw-min", name: "Kobold Quickclaw", tier: "minion", icon: "QC", initiative: 22 },
    { groupKey: "skirmisher-min", name: "Kobold Skirmisher", tier: "minion", icon: "KS", initiative: 9 },
    { groupKey: "skirmisher-min", name: "Kobold Skirmisher", tier: "minion", icon: "KS", initiative: 9 },
    { groupKey: "skirmisher-min", name: "Kobold Skirmisher", tier: "minion", icon: "KS", initiative: 9 },
    { groupKey: "skirmisher-min", name: "Kobold Skirmisher", tier: "minion", icon: "KS", initiative: 9 },
    { groupKey: "slinger-min", name: "Kobold Slinger", tier: "minion", icon: "SL", initiative: 13 },
    { groupKey: "slinger-min", name: "Kobold Slinger", tier: "minion", icon: "SL", initiative: 13 },
    { groupKey: "slinger-min", name: "Kobold Slinger", tier: "minion", icon: "SL", initiative: 13 },
  ];

  let variant = (new URLSearchParams(location.search).get("variant") || "A").toUpperCase();
  const variants = { A: "A — Scrolling Ribbon", B: "B — Tiered Round Ladder", C: "C — Radial Turn Wheel" };
  if (!variants[variant]) { variant = "A"; }

  let size = 10;
  let currentIndex = 1;
  const expanded = new Set();

  function buildTurnOrder() {
    const enemies = ENEMY_POOL.slice(0, size).map((e, i) => ({ ...e, id: `e${i}`, side: "hostile" }));
    const all = [...PARTY.map((p) => ({ ...p, tier: "party" })), ...enemies];
    all.sort((a, b) => b.initiative - a.initiative);
    return all.map((c, index) => ({ ...c, index }));
  }

  function mergeAdjacent(order) {
    const rows = [];
    for (const entry of order) {
      const last = rows[rows.length - 1];
      if (last && last.groupKey && last.groupKey === entry.groupKey && last.initiative === entry.initiative) {
        last.members.push(entry);
      } else {
        rows.push({ ...entry, members: [entry] });
      }
    }
    return rows.map((row) => ({
      ...row,
      count: row.members.length,
      isCurrent: row.members.some((m) => m.index === currentIndex),
      isHidden: row.members.some((m) => m.hidden),
    }));
  }

  function avatar(entry, extraClass) {
    return `<div class="avatar ${entry.side} ${entry.hidden ? "is-hidden-pin" : ""} ${extraClass || ""}">${entry.icon}</div>`;
  }

  // ---- Variant A: horizontal scrolling ribbon, one chip per combatant ----
  function renderA(order) {
    const chips = order.map((c) => `
      <div class="chip ${c.index === currentIndex ? "is-current" : ""}" id="${c.index === currentIndex ? "current-chip" : ""}">
        <span class="seq">#${c.index + 1}</span>
        ${avatar(c)}
        <span class="name">${c.name}</span>
        <span class="init">${c.initiative}</span>
      </div>`).join("");
    return `
      <section class="tracker variant-a">
        <header><i>▤</i><span>Initiative Order — ${order.length} combatants</span></header>
        <div class="ribbon-wrap"><div class="ribbon" id="ribbon">${chips}</div></div>
      </section>`;
  }

  // ---- Variant B: vertical tiers, identical monsters collapsed into one row ----
  function renderB(order) {
    const rows = mergeAdjacent(order);
    const nowRows = rows.filter((r) => r.isCurrent);
    const nextRows = rows.slice(rows.indexOf(nowRows[0]) + 1, rows.indexOf(nowRows[0]) + 3);
    const laterRows = rows.filter((r) => !nowRows.includes(r) && !nextRows.includes(r));

    const rung = (row) => {
      const isGroup = row.count > 1;
      const body = isGroup
        ? `<div class="stack">${row.members.slice(0, 3).map((m) => avatar(m)).join("")}</div>
           <b>${row.name}</b><span class="count-badge">×${row.count}</span>`
        : `${avatar(row)}<b>${row.name}</b>`;
      const members = isGroup
        ? `<div class="members">${row.members.map((m) => `<span>#${m.index + 1} ${m.name}</span>`).join("")}</div>`
        : "";
      return `<div class="rung ${row.isCurrent ? "is-current" : ""} ${expanded.has(row.id) ? "is-expanded" : ""}" data-row-id="${row.id}" data-group="${isGroup ? "1" : "0"}">
        ${body}<span class="init-badge">${row.initiative}</span>${members}
      </div>`;
    };

    return `
      <section class="tracker variant-b">
        <header><i>▤</i><span>Initiative Order — ${order.length} combatants</span></header>
        <div class="ladder">
          <div class="tier-label tier">Now Acting</div>
          ${nowRows.map(rung).join("")}
          ${nextRows.length ? `<div class="tier-label">Up Next</div>${nextRows.map(rung).join("")}` : ""}
          ${laterRows.length ? `<div class="tier-label">Later This Round</div>${laterRows.map(rung).join("")}` : ""}
        </div>
      </section>`;
  }

  // ---- Variant C: radial wheel, current combatant called out beside it ----
  function renderC(order) {
    const current = order[currentIndex] ?? order[0];
    const n = order.length;
    const radius = n > 12 ? 4.9 : n > 8 ? 4.6 : 4.1;
    const size2 = n > 12 ? "1.5rem" : n > 8 ? "1.7rem" : "1.95rem";
    const nodes = order.map((c, i) => {
      const angle = (i / n) * 360 - 90;
      const rad = (angle * Math.PI) / 180;
      const x = 50 + radius * Math.cos(rad) * 10;
      const y = 50 + radius * Math.sin(rad) * 10;
      return `<div class="node ${i === currentIndex ? "is-current" : ""}" style="left:${x}%; top:${y}%; transform: translate(-50%, -50%);">
        ${avatar(c, "")}<span class="seq">${i + 1}</span>
      </div>`.replace(`<div class="avatar`, `<div style="width:${size2};height:${size2};font-size:0.55rem;" class="avatar`);
    }).join("");

    return `
      <section class="tracker variant-c">
        <div class="wheel">${nodes}</div>
        <div class="now-card">
          <span class="eyebrow2">Now Acting</span>
          <h3>${current.name}</h3>
          <p>${current.tier === "party" ? current.type : current.tier} · turn ${currentIndex + 1} of ${n}</p>
          <div class="init-line">Initiative ${current.initiative}</div>
        </div>
      </section>`;
  }

  function render() {
    const order = buildTurnOrder();
    if (currentIndex >= order.length) { currentIndex = 0; }
    const renderers = { A: renderA, B: renderB, C: renderC };
    document.getElementById("app").innerHTML = `
      <div class="dialog">
        <div class="dialog__heading">
          <span class="eyebrow">Battle Briefing</span>
          <h1>No Road Back</h1>
          <p>Your enemies stand between you and the only way out.</p>
        </div>
        <div class="dialog__body">
          <div class="side enemies">
            <h2>On Their Side</h2>
            ${order.filter((c) => c.side === "hostile").slice(0, 6).map((c) => `
              <div class="roster-row"><div class="mono">${c.icon}</div><b>${c.name}</b><small>${c.tier}</small></div>`).join("")}
          </div>
          <div class="side party">
            <h2>On Our Side</h2>
            ${PARTY.map((p) => `<div class="roster-row"><div class="mono">${p.icon}</div><b>${p.name}</b><small>Init ${p.initiative}</small></div>`).join("")}
          </div>
        </div>
        ${renderers[variant](order)}
      </div>`;

    document.querySelectorAll(".sizes button").forEach((b) => b.classList.toggle("is-active", Number(b.dataset.size) === size));
    document.getElementById("label").textContent = `${variants[variant]} · ${order.length} combatants`;

    const chip = document.getElementById("current-chip");
    if (chip) { chip.scrollIntoView({ inline: "center", block: "nearest" }); }

    document.querySelectorAll(".variant-b .rung[data-group='1']").forEach((row) => {
      row.addEventListener("click", () => {
        const id = row.dataset.rowId;
        expanded.has(id) ? expanded.delete(id) : expanded.add(id);
        render();
      });
    });
  }

  document.querySelectorAll(".sizes button").forEach((b) => {
    b.addEventListener("click", () => { size = Number(b.dataset.size); currentIndex = 0; render(); });
  });
  document.getElementById("nextTurn").addEventListener("click", () => {
    const order = buildTurnOrder();
    currentIndex = (currentIndex + 1) % order.length;
    render();
  });

  function setVariant(next) {
    variant = next;
    const url = new URL(location);
    url.searchParams.set("variant", variant);
    history.replaceState(null, "", url);
    render();
  }
  const keys = Object.keys(variants);
  document.getElementById("previous").addEventListener("click", () => setVariant(keys[(keys.indexOf(variant) - 1 + keys.length) % keys.length]));
  document.getElementById("next").addEventListener("click", () => setVariant(keys[(keys.indexOf(variant) + 1) % keys.length]));
  window.addEventListener("keydown", (e) => {
    const tag = document.activeElement?.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) { return; }
    if (e.key === "ArrowLeft") { document.getElementById("previous").click(); }
    if (e.key === "ArrowRight") { document.getElementById("next").click(); }
  });

  render();
</script>
</body>
</html>

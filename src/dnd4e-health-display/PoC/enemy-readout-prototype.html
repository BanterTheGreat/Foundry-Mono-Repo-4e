<!doctype html>
<!--
  THROWAWAY UI PROTOTYPE — not Foundry production code.
  Question: How can a GM read every enemy ability without opening each power?
  Three structurally different readouts, switchable via ?variant=A|B|C.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enemy Readout Prototype</title>
  <style>
    :root { color-scheme: dark; --ink:#111113; --panel:#1b191a; --panel-2:#262224; --brass:#997456; --gold:#e3bd77; --paper:#f1e3d1; --muted:#b7a795; --red:#a92d34; --green:#276f39; --blue:#27485e; --line:rgb(153 116 86 / .45); font-family: Signika, Georgia, serif; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; padding:2rem 1rem 6rem; background:radial-gradient(circle at top, #373034, #0e0e10 56%); color:var(--paper); }
    .prototype-note { max-width:62rem; margin:0 auto 1rem; color:#cdbda9; font-size:.86rem; text-align:center; } .shell { width:min(62rem, 100%); margin:auto; border:1px solid var(--brass); border-radius:.6rem; overflow:hidden; background:var(--ink); box-shadow:0 1rem 3rem #0009, inset 0 0 0 1px #fff1; }
    .identity { display:flex; gap:.85rem; align-items:center; padding:.7rem .85rem; border-bottom:1px solid var(--line); background:linear-gradient(110deg,#3d291d,#111113 65%); }
    .portrait { display:grid; place-items:center; width:3.3rem; height:3.3rem; flex:0 0 auto; border:2px solid #bb936a; border-radius:50%; background:radial-gradient(circle at 36% 30%,#c8a16c 0 8%,#60462e 9% 28%,#1f2520 29%); color:#fff4d7; font-size:1.35rem; box-shadow:0 0 0 3px #181310; }
    h1,h2,h3,p { margin:0; } h1 { color:#f7ddbc; font-family:Georgia,serif; font-size:1.5rem; line-height:1; } .identity p { margin-top:.18rem; color:#c9b9a8; font-size:.77rem; } .role { margin-left:auto; color:#efd0a5; font-size:.82rem; font-weight:700; text-align:right; } .role small { display:block; margin-top:.18rem; color:#c9b9a8; font-weight:400; }
    .stats { display:grid; grid-template-columns:1.55fr repeat(6, 1fr); background:#19191b; } .stat { min-width:0; padding:.5rem .35rem; border-right:1px solid var(--line); text-align:center; } .stat:last-child { border:0; } .stat b { display:block; color:#f1d4ad; font-family:Georgia,serif; font-size:1.15rem; line-height:1; } .stat span { display:block; margin-bottom:.16rem; color:#9f907f; font-size:.55rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; } .stat.hp { background:linear-gradient(110deg,#592024,#2c1e20); } .stat.hp b,.stat.hp span { color:#ffb4aa; }
    .content { padding:.75rem; } .section-title { display:flex; align-items:center; gap:.4rem; margin:0 0 .4rem; color:#dfc8a9; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; } .section-title::after { height:1px; flex:1; background:var(--line); content:""; }
    .chip { min-width:0; padding:.55rem .65rem; border:1px solid var(--line); border-left:3px solid #a27d56; border-radius:.25rem; background:linear-gradient(90deg,#31271f,#1d1c1d); } .chip b,.chip span { display:block; } .chip b { color:#f0d8b7; font-size:.78rem; } .chip span { margin-top:.2rem; color:#c6b7a7; font-size:.7rem; line-height:1.2; }
    .ability { border:1px solid #ffffff18; border-left:3px solid var(--green); border-radius:.3rem; overflow:hidden; background:linear-gradient(90deg,#173a21,#121d16); } .ability + .ability { margin-top:.35rem; } .ability.encounter { border-left-color:var(--red); background:linear-gradient(90deg,#452021,#241718); } .ability.daily { border-left-color:#7f828c; background:linear-gradient(90deg,#323236,#1d1d20); } .ability-head { display:flex; gap:.55rem; align-items:center; padding:.48rem .6rem; } .ability-head b { font-size:.85rem; } .badge { padding:.16rem .3rem; border:1px solid #ffffff2b; border-radius:.18rem; color:#e5efdf; font-size:.53rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; } .ability-head small { margin-left:auto; color:#c9b9a8; font-size:.64rem; } .rule { display:grid; grid-template-columns:4.4rem 1fr; gap:.45rem; padding:.28rem .6rem; border-top:1px solid #ffffff12; background:#0002; color:#e8ddd0; font-size:.73rem; line-height:1.25; } .rule b { color:#ffe1a2; }
    .switcher { position:fixed; z-index:2; bottom:1rem; left:50%; display:flex; align-items:center; gap:.6rem; padding:.42rem; border:1px solid #b89262; border-radius:99px; background:#171417; box-shadow:0 .35rem 1rem #000a; transform:translateX(-50%); } .switcher button { width:2rem; height:2rem; border:1px solid #6e5741; border-radius:50%; background:#302821; color:#f1d3a0; cursor:pointer; font:inherit; font-size:1rem; } .switcher button:hover { border-color:#f0c879; background:#493925; } .switcher output { min-width:11rem; color:#e6d0b3; font-size:.72rem; font-weight:700; text-align:center; }
    /* A: Rulebook rail — all rules, grouped by action economy. */ .variant-a .body { display:grid; grid-template-columns:9rem 1fr; } .variant-a .rail { padding:.75rem .55rem; border-right:1px solid var(--line); background:#161719; } .variant-a .rail div { padding:.6rem .35rem; border-left:3px solid #745b43; color:#d8c0a1; font-size:.67rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; } .variant-a .rail div + div { margin-top:.55rem; } .variant-a .rail .standard { border-color:var(--red); } .variant-a .rail .minor { border-color:var(--green); } .variant-a .main { padding:.75rem; } .variant-a .group + .group { margin-top:.75rem; }
    /* B: Tactical dashboard — traits first, powers as a concise battle plan. */ .quick-read { display:grid; grid-template-columns:repeat(3,1fr); gap:.35rem; padding:.65rem .75rem; border-bottom:1px solid var(--line); background:#151618; } .variant-b .body { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(13rem,.8fr); gap:.75rem; padding:.75rem; } .tactics { padding:.7rem; border:1px solid #a27d5680; border-radius:.32rem; background:linear-gradient(145deg,#ede0c8,#cdbd9f); color:#271e19; } .tactics h2 { color:#5a3824; font-family:Georgia,serif; font-size:1.05rem; } .tactics p { margin:.6rem 0; font-size:.8rem; line-height:1.35; } .tactics dl { margin:0; padding-top:.5rem; border-top:1px solid #7d604b77; font-size:.72rem; } .tactics dt { margin-top:.42rem; color:#63432d; font-weight:700; } .tactics dd { margin:.08rem 0 0; }
    /* C: Initiative ledger — horizontal table is fastest to compare many powers. */ .variant-c .legend { display:flex; flex-wrap:wrap; gap:.4rem; padding:.6rem .75rem; border-bottom:1px solid var(--line); color:#bba992; font-size:.68rem; } .variant-c .legend i { width:.6rem; height:.6rem; border-radius:50%; background:var(--green); } .variant-c .legend i:nth-of-type(2){background:var(--red)} .variant-c .legend i:nth-of-type(3){background:#7f828c} .ledger { width:100%; border-collapse:collapse; font-size:.76rem; } .ledger th { padding:.5rem .55rem; border-bottom:1px solid var(--line); background:#292526; color:#bfa98d; font-size:.58rem; letter-spacing:.07em; text-align:left; text-transform:uppercase; } .ledger td { padding:.6rem .55rem; border-bottom:1px solid #ffffff12; vertical-align:top; } .ledger tr:hover { background:#ffffff08; } .timing { width:7rem; color:#c4d5bf; font-size:.62rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; } .timing.standard { color:#f0b2aa; } .timing.passive { color:#ddc396; } .power-name { color:#f5deb9; font-weight:700; } .power-name small { display:block; margin-top:.18rem; color:#b4a797; font-style:italic; font-weight:400; } .compact-rule b { color:#f4d3a0; }
    @media (max-width:650px) { body{padding:.6rem .35rem 5.5rem}.stats{grid-template-columns:repeat(4,1fr)}.variant-a .body,.variant-b .body{grid-template-columns:1fr}.variant-a .rail{display:flex;gap:.25rem;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.variant-a .rail div,.variant-a .rail div + div{margin:0;white-space:nowrap}.quick-read{grid-template-columns:1fr}.variant-c .content{overflow-x:auto}.ledger{min-width:44rem}.role{display:none} }
  </style>
</head>
<body>
  <p class="prototype-note">Throwaway design study — every ability is readable in-place. Use ←/→ or the bottom control to compare structural approaches.</p>
  <main id="app"></main>
  <nav class="switcher" aria-label="Prototype variant selector"><button id="previous" aria-label="Previous variant">←</button><output id="label"></output><button id="next" aria-label="Next variant">→</button></nav>
  <script>
    const abilities = {
      traits: [['Combat Advantage','The kobold skirmisher deals +1d6 damage against targets granting combat advantage.'],['Mob Attack','+1 bonus to attack rolls per kobold ally adjacent to the target.'],['Trap Sense','+2 bonus to all defenses against traps.']],
      standard: [['Spear Attack','At-Will','Melee 1 (one creature); +6 vs. AC','1d10 damage.']],
      minor: [['Shifty','At-Will','—','Shift 1 square.']]
    };
    const header = () => `<section class="shell"><header class="identity"><div class="portrait" aria-label="Kobold portrait">♜</div><div><h1>Kobold Skirmisher</h1><p>Small natural humanoid (reptile)</p></div><div class="role">Level 1 Skirmisher<small>XP 100</small></div></header><div class="stats"><div class="stat hp"><span>HP</span><b>27/27</b></div><div class="stat"><span>AC</span><b>15</b></div><div class="stat"><span>Fort</span><b>14</b></div><div class="stat"><span>Ref</span><b>14</b></div><div class="stat"><span>Will</span><b>13</b></div><div class="stat"><span>Speed</span><b>6</b></div><div class="stat"><span>Init</span><b>+5</b></div></div>`;
    const card = (name, badge, attack, effect, kind='') => `<article class="ability ${kind}"><div class="ability-head"><span class="badge">${badge}</span><b>${name}</b><small>${name === 'Spear Attack' ? 'Melee weapon' : 'Move'}</small></div>${attack !== '—' ? `<div class="rule"><b>Attack</b><span>${attack}</span></div>` : ''}<div class="rule"><b>${attack === '—' ? 'Effect' : 'Hit'}</b><span>${effect}</span></div></article>`;
    const title = text => `<h2 class="section-title">${text}</h2>`;
    const variantA = () => `${header()}<div class="variant-a"><div class="body"><aside class="rail"><div>∞ Passive traits</div><div class="standard">⚔ Standard actions</div><div class="minor">↝ Minor actions</div></aside><div class="main"><section class="group">${title('Passive traits')}${abilities.traits.map(([n,e]) => `<div class="chip"><b>${n}</b><span>${e}</span></div>`).join('')}</section><section class="group">${title('Standard actions')}${card(...abilities.standard[0], 'standard')}</section><section class="group">${title('Minor actions')}${card(...abilities.minor[0], 'minor')}</section></div></div></div></section>`;
    const variantB = () => `${header()}<div class="variant-b"><section class="quick-read">${abilities.traits.map(([n,e]) => `<div class="chip"><b>${n}</b><span>${e}</span></div>`).join('')}</section><div class="body"><div><section>${title('Standard actions')}${card(...abilities.standard[0], 'standard')}</section><section style="margin-top:.75rem">${title('Minor actions')}${card(...abilities.minor[0], 'minor')}</section></div><aside class="tactics"><h2>✦ Tactical Notes</h2><p><b>Open with Spear Attack.</b> Reposition with Shifty. The skirmisher is more dangerous beside allies and against distracted targets.</p><dl><dt>Best positioning</dt><dd>Adjacent to allies; approach from a flank.</dd><dt>Watch for</dt><dd>Trap defenses and repeated shift movement.</dd></dl></aside></div></div></section>`;
    const traitRows = abilities.traits.map(([n,e]) => `<tr><td class="timing passive">Passive trait</td><td class="power-name">${n}</td><td class="compact-rule"><b>Effect:</b> ${e}</td></tr>`).join('');
    const variantC = () => `${header()}<div class="variant-c"><div class="legend"><i></i> At-will <i></i> Encounter <i></i> Daily <span>• Action economy is the primary scan order</span></div><div class="content"><table class="ledger"><thead><tr><th>When</th><th>Ability</th><th>Complete rule</th></tr></thead><tbody>${traitRows}<tr><td class="timing standard">Standard · At-will</td><td class="power-name">Spear Attack<small>Shifty little bugger.</small></td><td class="compact-rule"><b>Attack:</b> Melee 1 (one creature); +6 vs. AC<br><b>Hit:</b> 1d10 damage.</td></tr><tr><td class="timing">Minor · At-will</td><td class="power-name">Shifty<small>Movement</small></td><td class="compact-rule"><b>Effect:</b> Shift 1 square.</td></tr><tr><td class="timing">Immediate</td><td class="power-name">—</td><td class="compact-rule">No immediate actions.</td></tr></tbody></table></div></div></section>`;
    const variants = { A:['Rulebook rail',variantA], B:['Tactical dashboard',variantB], C:['Initiative ledger',variantC] };
    let key = new URLSearchParams(location.search).get('variant')?.toUpperCase(); if (!variants[key]) key = 'B';
    function render() { document.getElementById('app').innerHTML = variants[key][1](); document.getElementById('label').textContent = `${key} — ${variants[key][0]}`; }
    function move(delta) { const keys = Object.keys(variants); key = keys[(keys.indexOf(key)+delta+keys.length)%keys.length]; const url = new URL(location); url.searchParams.set('variant',key); history.replaceState(null,'',url); render(); }
    document.getElementById('previous').onclick=()=>move(-1); document.getElementById('next').onclick=()=>move(1); window.addEventListener('keydown',e=>{if(!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);}}); render();
  </script>
</body>
</html>

<!--
  PROTOTYPE — Three nested-radial segment shapes, switchable via ?variant=arc|plate|bead.
  Open directly in a browser. This is a visual comparison only; no state persists.
-->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radial segment shapes prototype</title><style>
:root{color-scheme:dark;--ink:#0b0b0d;--line:#9b7352;--gold:#e3ba81;--paper:#f4e4d2;--muted:#b9a08a;font-family:Signika,"Segoe UI",sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(ellipse at 50% 7%,#383329,#111316 48%,#08090a);color:var(--paper)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.11;background:repeating-linear-gradient(90deg,transparent 0 49px,#fff 50px),repeating-linear-gradient(0deg,transparent 0 49px,#fff 50px)}main{position:relative;z-index:1;width:min(840px,calc(100vw - 28px));margin:5rem auto;text-align:center}.eyebrow{margin:0;color:var(--gold);font-size:.68rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}h1{margin:.4rem 0 .45rem;font:700 2.25rem Georgia,serif;color:#f4d3aa}.intro{max-width:570px;margin:0 auto;color:#d6c0a8;font-size:.9rem;line-height:1.45}.panel{display:grid;place-items:center;min-height:410px;margin-top:2rem;border:1px solid var(--line);border-radius:15px;background:linear-gradient(135deg,#141214ef,#090a0bef);box-shadow:0 18px 42px #000a,inset 0 0 0 3px #fff1}.dial-wrap{display:grid;place-items:center}.dial{position:relative;width:290px;height:290px}.dial svg{position:absolute;inset:-9px;width:calc(100% + 18px);height:calc(100% + 18px);overflow:visible;filter:drop-shadow(0 6px 10px #0009)}.core{position:absolute;z-index:2;inset:107px;border:2px solid #2c1c18;border-radius:50%;display:grid;place-content:center;background:radial-gradient(circle,#171315,#09090a);box-shadow:inset 0 0 18px #000;text-align:center}.core b{color:#ffd177;font:700 3.1rem Georgia,serif;line-height:.9}.core small{margin-top:.25rem;color:#b9a08a;font-size:.77rem}.caption{max-width:530px;margin:1.4rem auto 0;color:#d8c2aa;font-size:.84rem;line-height:1.4}.caption b{color:#f4d5aa}.state{margin-top:.6rem;color:#aa9785;font-size:.72rem}.switcher{position:fixed;z-index:5;bottom:15px;left:50%;display:flex;align-items:center;gap:.3rem;padding:.35rem;border:1px solid var(--gold);border-radius:999px;background:#0c0d0e;box-shadow:0 8px 24px #000c;transform:translateX(-50%)}button{font:inherit;color:inherit;cursor:pointer}.switcher button{width:32px;height:30px;border:0;border-radius:999px;background:transparent;color:var(--gold);font-size:1.15rem}.switcher button:hover{background:#3e2e20}.switcher output{min-width:190px;color:#f4dfc1;font-size:.77rem;font-weight:bold}@media(max-width:500px){main{margin-top:2rem}.dial{transform:scale(.8)}.panel{min-height:345px}h1{font-size:1.8rem}}
</style></head><body><main><p class="eyebrow">Nested radial comparison</p><h1>Segment shape studies</h1><p class="intro">The values, ring widths, and colours do not change. Only the physical shape of each segment changes.</p><section class="panel"><div id="app" aria-live="polite"></div></section></main><nav class="switcher"><button id="prev" aria-label="Previous shape">←</button><output id="label"></output><button id="next" aria-label="Next shape">→</button></nav><script>
const keys=['arc','plate','bead'];const labels={arc:'A · Rounded arcs',plate:'B · Armour plates',bead:'C · Rune beads'};const notes={arc:'<b>Rounded arcs:</b> the smoothest and least visually busy. The ring still reads as a circle first, then as a count of segments.',plate:'<b>Armour plates:</b> each segment is a true wedge with firm edges. It feels more constructed and tactical, at the cost of a little visual weight.',bead:'<b>Rune beads:</b> distinctly separated capsules. Counting is effortless and the gaps make the three resources feel more individual.'};
const data=[{count:16,active:0,r:137,w:7,on:'#4a8da2',off:'#1d4553',edge:'#091519'},{count:8,active:6,r:106,w:38,on:'#c65462',off:'#472229',edge:'#210f13'},{count:12,active:11,r:72,w:14,on:'#d9ad52',off:'#49381d',edge:'#25180c'}];const polar=(r,a)=>[150+r*Math.cos(a*Math.PI/180),150+r*Math.sin(a*Math.PI/180)];const point=([x,y])=>`${x.toFixed(2)} ${y.toFixed(2)}`;const wedge=(r,w,a1,a2)=>{const outer=r+w/2,inner=r-w/2;return`M ${point(polar(outer,a1))} A ${outer} ${outer} 0 0 1 ${point(polar(outer,a2))} L ${point(polar(inner,a2))} A ${inner} ${inner} 0 0 0 ${point(polar(inner,a1))} Z`};
function arcs({count,active,r,w,on,off,edge}){return Array.from({length:count},(_,i)=>{const dash='.81 '+(count-.81);return`<circle cx="150" cy="150" r="${r}" pathLength="${count}" fill="none" stroke="${edge}" stroke-width="${w+4}" stroke-linecap="round" stroke-dasharray="${dash}" stroke-dashoffset="${-i}"/><circle cx="150" cy="150" r="${r}" pathLength="${count}" fill="none" stroke="${i<active?on:off}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${dash}" stroke-dashoffset="${-i}"/>`}).join('')}
function plates({count,active,r,w,on,off,edge}){const step=360/count;return Array.from({length:count},(_,i)=>{const a1=-90+i*step+1.7,a2=-90+(i+1)*step-1.7,d=wedge(r,w,a1,a2);return`<path d="${d}" fill="${edge}"/><path d="${wedge(r,w-4,a1+.55,a2-.55)}" fill="${i<active?on:off}"/>`}).join('')}
function beads({count,active,r,w,on,off,edge}){const step=360/count;return Array.from({length:count},(_,i)=>{const angle=-90+(i+.5)*step;const x=150+r*Math.cos(angle*Math.PI/180),y=150+r*Math.sin(angle*Math.PI/180);const length=(2*Math.PI*r/count)*.58;return`<g transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${angle+90})"><rect x="${(-length/2).toFixed(2)}" y="${(-w/2).toFixed(2)}" width="${length.toFixed(2)}" height="${w}" rx="${(w/2).toFixed(2)}" fill="${edge}"/><rect x="${(-length/2+2).toFixed(2)}" y="${(-w/2+2).toFixed(2)}" width="${(length-4).toFixed(2)}" height="${w-4}" rx="${((w-4)/2).toFixed(2)}" fill="${i<active?on:off}"/></g>`}).join('')}
function dial(shape){const build={arc:arcs,plate:plates,bead:beads}[shape];return`<div class="dial-wrap"><div class="dial"><svg viewBox="0 0 300 300" role="img" aria-label="Temporary hit points 0, hit points 70 of 93, healing surges 11 of 12">${data.map(build).join('')}</svg><div class="core"><b>70</b><small>/ 93</small></div></div><p class="caption">${notes[shape]}</p><p class="state">Outer: Temp HP 0 / 16 &nbsp;·&nbsp; Middle: HP 70 / 93 &nbsp;·&nbsp; Inner: Healing Surges 11 / 12</p></div>`}
function current(){const value=new URLSearchParams(location.search).get('variant');return keys.includes(value)?value:'arc'}function render(){const value=current();document.getElementById('app').innerHTML=dial(value);document.getElementById('label').textContent=labels[value]}function change(delta){const value=keys[(keys.indexOf(current())+delta+keys.length)%keys.length];const url=new URL(location);url.searchParams.set('variant',value);history.replaceState(null,'',url);render()}document.getElementById('prev').onclick=()=>change(-1);document.getElementById('next').onclick=()=>change(1);document.addEventListener('keydown',event=>{if(!/INPUT|TEXTAREA/.test(event.target.tagName)&&!event.target.isContentEditable){if(event.key==='ArrowLeft')change(-1);if(event.key==='ArrowRight')change(1)}});render();
</script></body></html>

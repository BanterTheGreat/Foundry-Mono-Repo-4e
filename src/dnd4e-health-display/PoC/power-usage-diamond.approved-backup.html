<!doctype html><html><head><meta charset="utf-8"><title>Power palette prototype</title><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#eee);font:14px/1.5 Arial,sans-serif}p{margin:0} .intro{margin-bottom:16px}.intro small{color:var(--muted-foreground,#aaa)}h2{font-size:18px;margin:0 0 5px}.stage{background:#202124;padding:24px;border-radius:10px;display:flex;justify-content:center}.chat{width:350px;max-width:100%}.speaker{font-size:11px;color:#aaa59b;margin:0 5px 7px;display:flex;justify-content:space-between}.card{background:linear-gradient(115deg,#191712,#101010 75%);color:#ebe7de;border:1px solid #8f794e;border-radius:6px;overflow:hidden;box-shadow:0 5px 18px #0005}.head{padding:12px 14px;border-bottom:1px solid #655433;background:linear-gradient(110deg,#38302055,transparent)}h3{font:600 21px Georgia,serif;color:#eee4cc;margin:0}.usage{font-size:10px;letter-spacing:.07em;color:#a9c6a7;margin-top:4px}.flavor{font:italic 14px/1.5 Georgia,serif;color:#c5b99c;padding:11px 14px;border-bottom:1px solid #493c26}.basics{padding:8px 14px;font-size:11px;color:#d3c8b1;border-bottom:1px solid #493c26}.basics span{display:block;color:#a89e8b;font-size:10px}.rules{padding:3px 14px}.rule{padding:9px 0;border-bottom:1px solid #332b1d;display:grid;grid-template-columns:55px 1fr;gap:8px;font-size:12px}.rule:last-child{border:0}b{color:#e5cc8e}.actions{display:flex;border-top:1px solid #655433}button{font:inherit;cursor:pointer}.actions button{flex:1;border:0;border-right:1px solid #493c26;background:#c4a7670b;color:#e5cc8e;padding:10px;font-size:11px}.actions button:last-child{border:0}.actions button:hover{background:#c4a76722}button:focus-visible{outline:2px solid #e5cc8e;outline-offset:-3px}.compact .head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}.compact h3{font-size:18px}.compact .usage{margin:0;font-size:9px}.compact .rule{display:block;padding:8px 0}.compact .rule b{margin-right:4px}.compact .basics{display:flex;justify-content:space-between}.compact .flavor{font-size:13px}.score{display:grid;grid-template-columns:1fr 80px}.score .head{border:0}.bonus{display:flex;flex-direction:column;justify-content:center;align-items:center;border-left:1px solid #655433;background:#a88a4510;color:#e5cc8e;font:30px Georgia,serif}.bonus small{font:9px Arial,sans-serif;letter-spacing:.1em;margin-top:3px}.feature .rules{padding:0}.feature .rule{padding:12px 14px;grid-template-columns:55px 1fr}.feature .rule:nth-child(2){background:#a88a4510}.note{padding:14px 0 70px;color:var(--muted-foreground,#aaa);font-size:12px}.switch{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;background:#e9e5db;color:#24231f;border:1px solid #82775d;border-radius:30px;box-shadow:0 4px 18px #0005;white-space:nowrap;z-index:3}.switch button{background:transparent;border:0;padding:10px 16px;color:inherit;font-size:18px}.switch span{min-width:185px;text-align:center;font-size:12px}.swatches{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted-foreground,#aaa);margin-top:12px}.swatches i{display:inline-block;width:10px;height:10px;border:1px solid #877650;margin-right:4px}#feedback{font-size:11px;color:#c5b99c;padding:0 14px}
/* Darken functional surfaces while retaining the original title and flavour treatment. */ .basics,.rules,.actions,#feedback{background:#090909}.actions button{background:#c4a76706}.bonus{background:#0d0c09}.feature .rule:nth-child(2){background:#a88a4509}.card{--usage-ink:#b9ddb5;--usage-edge:#668760;--usage-wash:#263423}.card[data-usage="Encounter"]{--usage-ink:#f0b4b4;--usage-edge:#a06464;--usage-wash:#402525}.card[data-usage="Daily"]{--usage-ink:#d5dbe7;--usage-edge:#7b869a;--usage-wash:#29303d}.head{border-top:4px solid var(--usage-edge);display:flex;align-items:center;justify-content:space-between;gap:10px}.usage{margin:0;padding:5px 8px;border:1px solid var(--usage-edge);border-radius:3px;background:var(--usage-wash);color:var(--usage-ink);font-size:11px;font-weight:bold;letter-spacing:.06em;white-space:nowrap}.class-label{font:10px Arial,sans-serif;letter-spacing:.1em;color:#b5a88e;margin-top:4px}.usage-controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.usage-controls button{padding:6px 12px;background:var(--secondary,#292929);color:var(--foreground,#eee);border:1px solid var(--border,#666);border-radius:4px;font-size:12px}.usage-controls button[aria-pressed="true"]{border-color:#bda16a;box-shadow:inset 0 -2px #bda16a}.switch{display:none}.note{padding-bottom:12px}
/* Usage presentation variants only; chat content stays fixed. */
.head{position:relative}.usage-banner{display:none}
.card[data-presentation="banner"] .head{border-top:0;display:block;padding-top:40px}
.card[data-presentation="banner"] .usage{position:absolute;top:0;left:0;right:0;border:0;border-bottom:1px solid var(--usage-edge);border-radius:0;padding:6px 14px;font-size:11px;letter-spacing:.14em}
.card[data-presentation="rail"]{border-left:5px solid var(--usage-edge)}
.card[data-presentation="rail"] .head{border-top:0;display:block}
.card[data-presentation="rail"] .usage{display:inline-block;margin-top:7px;padding:0;border:0;background:transparent;font-size:12px}
.card[data-presentation="rail"] .usage::before{content:"◆";margin-right:7px}
.switch{display:flex}.switch span{min-width:205px}.note{padding-bottom:68px}
/* Selected direction: diamond and usage beside the power title. */ .head{border-top:0;align-items:flex-start}.head>div:first-child{min-width:0}h3{overflow-wrap:anywhere}.usage{display:flex;align-items:center;gap:6px;padding:4px 0 0;border:0;background:transparent;color:var(--usage-ink);font-size:11px;letter-spacing:.04em}.usage::before{content:"◆";font-size:12px}.switch{display:none}.note{padding-bottom:12px}</style></head><body><!-- THROWAWAY: Three structurally different ways to combine the actor HUD tooltip palette with power chat cards, ?variant=A/B/C. -->
<div class="intro"><h2>Diamond + power usage</h2><small>Throwaway prototype · coloured usage beside the power title</small></div>
<div class="usage-controls" aria-label="Power usage examples"><button aria-pressed="true" data-usage-example="At-Will">At-Will</button><button aria-pressed="false" data-usage-example="Encounter">Encounter</button><button aria-pressed="false" data-usage-example="Daily">Daily</button></div><div class="stage"><div class="chat"><div class="speaker"><span>Aric · Fighter</span><span>Just now</span></div><article id="card" class="card"></article></div></div>
<div class="swatches"><span><i style="background:#090909"></i>Near-black #090909</span><span><i style="background:#8f794e"></i>Brass #8F794E</span><span><i style="background:#e5cc8e"></i>Gold #E5CC8E</span><span><i style="background:#ebe7de"></i>Parchment #EBE7DE</span></div><p class="note" id="note"></p>
<nav class="switch" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">‹</button><span id="label"></span><button id="next" aria-label="Next variant">›</button></nav>
<script>
const names=['A · Chat structure','B · Compact tooltip','C · Attack first'];
const notes=['Recommended starting point. Preserve the chat card’s title, metadata, aligned rule labels, and action footer. Gold carries the rules hierarchy; a small green usage label retains At-Will recognition.','Closest to the supplied tooltip. Inline labels and a smaller header make the card shorter, with the same warm separators and italic flavour text. Better density, less separation between rule labels and values.','Give the attack bonus a dedicated readout and the Hit rule a subtle gold wash. Faster to scan during play, but takes more space and places greater emphasis on attacks.'];
let index=0;
const flavor='<p class="flavor">The feel of your weapon crunching against the enemy puts your heart back in the fight.</p>';
const basics='<div class="basics">Standard Action · Melee Weapon<span>Martial · Weapon</span></div>';
const rules='<div class="rules"><div class="rule"><b>Attack</b><p>Melee Weapon (One creature); <strong>+19 vs. AC</strong></p></div><div class="rule"><b>Hit</b><p><strong>1[W] + Strength modifier</strong> damage.</p></div><div class="rule"><b>Special</b><p>Increase damage to <strong>2[W] + Strength modifier</strong> at 21st level.</p></div></div>';
const head='<header class="head"><div><h3>Crushing Surge</h3><div class="class-label">FIGHTER</div></div><div class="usage">AT-WILL</div></header>';
const actions='<footer class="actions"><button data-action="Attack">⚔ Attack</button><button data-action="Damage">◇ Damage</button></footer><div id="feedback" role="status"></div>';
function render(){document.getElementById('card').className='card '+['','compact','feature'][index];document.getElementById('card').innerHTML=index===0?head+flavor+basics+rules+actions:index===1?head+basics+flavor+rules+actions:'<div class="score">'+head+'<div class="bonus">+19<small>VS. AC</small></div></div>'+basics+rules+flavor+actions;document.getElementById('label').textContent=names[index];document.getElementById('note').textContent=notes[index];document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>document.getElementById('feedback').textContent=b.dataset.action+' selected · mock interaction only; no roll sent.');}
function step(n){index=(index+n+3)%3;try{const url=new URL(location.href);url.searchParams.set('variant',['A','B','C'][index]);history.replaceState(null,'',url);}catch(e){}render();}
render();
document.getElementById('note').textContent='Chat structure retained. A labelled usage badge and matching top border identify power frequency; title and flavour retain their warm backgrounds.';document.querySelectorAll('[data-usage-example]').forEach(button=>button.onclick=()=>{const usage=button.dataset.usageExample;document.getElementById('card').dataset.usage=usage;document.querySelector('.usage').textContent=usage.toUpperCase();document.querySelectorAll('[data-usage-example]').forEach(control=>control.setAttribute('aria-pressed',String(control===button)));});
const presentations=['badge','banner','rail'];
const presentationNames=['A · Title badge','B · Usage banner','C · Side rail'];
const presentationNotes=[
'A compact badge sits beside the title, reinforced by a coloured top edge. Keeps the power name and its usage together.',
'A full-width coloured strip announces usage before the power name. Strongest recognition when scanning a busy chat feed.',
'A coloured left rail marks the whole message, with a plain usage label below the title. More restrained header, persistent colour cue.'
];
let presentationIndex=Math.max(0,['A','B','C'].indexOf(new URLSearchParams(location.search).get('variant')));
function showPresentation(){
document.getElementById('card').dataset.presentation=presentations[presentationIndex];
document.getElementById('label').textContent=presentationNames[presentationIndex];
document.getElementById('note').textContent=presentationNotes[presentationIndex];
try{const url=new URL(location.href);url.searchParams.set('variant',['A','B','C'][presentationIndex]);history.replaceState(null,'',url);}catch(e){}
}
function cyclePresentation(direction){presentationIndex=(presentationIndex+direction+3)%3;showPresentation();}
document.getElementById('prev').onclick=()=>cyclePresentation(-1);
document.getElementById('next').onclick=()=>cyclePresentation(1);

showPresentation();
document.getElementById("card").dataset.presentation="diamond";document.getElementById("note").textContent="Diamond and usage share the corresponding colour: green for At-Will, red for Encounter, slate for Daily. Chat structure and warm title/flavour backgrounds remain.";
</script></body></html>

<!doctype html>
<!-- Throwaway prototype: three attack-mode placements, switchable with ?variant=A/B/C. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Attack mode placement prototype</title>
<style>
body{font:12px Arial,sans-serif;color:#eadbb4;margin:0;padding:18px 0 75px}.panel{width:min(406px,100%);margin:auto;background:#10100f;border:1px solid #8b7545;border-radius:7px;box-shadow:0 4px 15px #0008;overflow:hidden}.header{display:flex;align-items:center;gap:5px;padding:9px;border-bottom:1px solid #66583b;background:#1c1a16;font-weight:bold}.header strong{flex:1}.button,button{color:#e8d7a4;background:#25221b;border:1px solid #665533;border-radius:4px;padding:5px 8px;cursor:pointer}.close{font-size:18px;line-height:15px}.body{padding:10px}.row{display:flex;align-items:center;gap:10px;margin-bottom:8px}.row label{font-weight:bold;white-space:nowrap}.row select{flex:1}select{color:#ead9b5;background:#29252e;border:0;border-radius:4px;padding:9px;width:100%;font-size:11px}.attack{background:#24221d;border-left:2px solid #9b8548;padding:9px;margin:8px 0}.small{color:#d9be7d;font-size:10px;font-weight:bold;text-transform:uppercase;letter-spacing:.3px}.attack p{margin:7px 0 0;font-weight:bold}.summary{margin:10px 0;font-weight:bold;font-size:13px;color:#fff0c8}.summary span{font-size:10px;font-weight:normal}.hint{font-size:11px;margin:12px 0}.targets{border:1px solid #665333;border-radius:4px;overflow:hidden}.cols,.target{display:grid;grid-template-columns:1fr 90px 100px;align-items:center;padding:10px;background:#24211b}.cols{font-size:9px;color:#d0b67b}.target{background:#181817;border-top:1px solid #665333;font-weight:bold;color:#fff1c8}.target button{justify-self:end;grid-column:3}.manual{padding:10px 0;color:#d0b67b;border-bottom:1px solid #665333}.ready{background:#202a1c;border:1px solid #718155;border-radius:4px;padding:8px 10px;margin-top:8px;font-weight:bold;color:#f1e6b8}.action{width:100%;margin-top:7px;background:linear-gradient(#413820,#252117);font-weight:bold}.mode-line{display:flex;align-items:center;gap:8px;margin-top:8px}.mode-line select{padding:6px;max-width:180px}.mode-line .small{white-space:nowrap}.segmented{display:flex;gap:4px;margin:8px 0}.segmented button{flex:1;font-size:11px}.segmented button[aria-pressed=true]{background:#52452b;border-color:#b69a58;color:#fff0bc}.compact{display:flex;align-items:center;gap:8px}.compact .attack-title{flex:1}.compact select{width:145px;padding:6px}.switcher{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#eee;color:#111;border-radius:30px;padding:6px 9px;box-shadow:0 2px 12px #0008;white-space:nowrap}.switcher button{background:#222;color:white;border:0;border-radius:20px}.state{font-size:10px;color:#bcae8d;margin-top:7px}.explain{width:min(406px,100%);margin:12px auto;color:var(--muted, #aaa);line-height:1.4;font-size:12px}
</style></head><body><div class="panel"><div class="header"><strong>Melee Basic Attack · Select Targets</strong><button>◧ Details</button><button>⋮</button><button class="close">×</button></div><div class="body"><div class="row"><label for="origin">Origin</label><select id="origin"><option>Ozyn Valder</option></select></div><div id="variant"></div><div class="summary">1 target selected <span>· exactly 1 targets · Range 1 squares</span></div><div class="hint">Use normal targeting controls to select or remove targets.</div><div class="targets"><div class="cols"><span>TARGET</span><span>ATTACK</span><span>DAMAGE</span></div><div class="target"><span>🛡️ &nbsp;Orc Savage (1)</span><button aria-label="Remove target">×</button></div></div><div class="manual">▸ Manual checks · cover, elevation and special rules</div><div class="ready">Ready to Attack</div><div id="actions"></div><div class="state" id="state"></div></div></div><p class="explain" id="explain"></p><nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><strong id="label"></strong><button id="next" aria-label="Next variant">→</button></nav>
<script>
const variants=['A','B','C']; const names=['Variant buttons underneath','Mode as choice','Mode in attack heading']; let mode='Basic attack'; let index=Math.max(0,variants.indexOf(new URLSearchParams(location.search).get('variant')||'A'));
const options=()=>`<option ${mode==='Basic attack'?'selected':''}>Basic attack</option><option ${mode==='Charge'?'selected':''}>Charge</option>`;
function render(){let v=variants[index], root=document.querySelector('#variant'); if(v==='A') root.innerHTML=`<div class="attack"><div class="small">Before the attack</div><p>Attack: One creature; Intelligence vs. AC</p></div>`; if(v==='B') root.innerHTML=`<div class="small">Attack mode</div><div class="segmented"><button data-mode="Basic attack" aria-pressed="${mode==='Basic attack'}">Basic attack</button><button data-mode="Charge" aria-pressed="${mode==='Charge'}">Charge</button></div><div class="attack"><div class="small">Before the attack</div><p>Attack: One creature; Intelligence vs. AC</p></div>`; if(v==='C') root.innerHTML=`<div class="attack"><div class="compact"><div class="attack-title"><div class="small">Before the attack</div><p>Attack: One creature;<br>Intelligence vs. AC</p></div><select id="mode" aria-label="Attack mode">${options()}</select></div></div>`; root.querySelector('select')?.addEventListener('change',e=>{mode=e.target.value;render()}); root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=mode===b.dataset.mode?'Basic attack':b.dataset.mode;render()}); document.querySelector('#actions').innerHTML=v==='A'?'<div class="segmented"><button data-attack="Basic attack">Attack!</button><button data-attack="Charge">Charge</button></div>':'<button class="action" data-attack="'+mode+'">Attack!</button>'; document.querySelectorAll('[data-attack]').forEach(b=>b.onclick=()=>{document.querySelector('#state').textContent='Prototype action: '+b.dataset.attack}); document.querySelector('#label').textContent=`${v} · ${names[index]}`; document.querySelector('#state').textContent=`Prototype state: origin Ozyn Valder · mode ${mode} · 1 target`; document.querySelector('#explain').textContent=[ 'Choose an action directly: Attack! uses the basic attack, while each available variant has its own button alongside it. Unavailable variants are hidden.', 'Make the mode an explicit choice directly above the attack. Best when there are only a few modes.', 'Put the mode beside the attack itself, saving vertical space. The label is implicit.'][index]; history.replaceState(null,'','?variant='+v);}
function cycle(n){index=(index+n+3)%3;render()}document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></body></html>

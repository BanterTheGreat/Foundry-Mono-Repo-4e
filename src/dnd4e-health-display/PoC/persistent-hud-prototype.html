<!doctype html>
<!--
  THROWAWAY UI PROTOTYPE — not Foundry production code.
  Question: what should a pf2e-hud-style "Persistent HUD" look like for D&D4e —
  a docked panel showing the selected character's vitals, defenses, and quick
  actions, plus tabs into Powers/Skills/Feats/Items — without dragging in the
  Token HUD, Combat Tracker, or Dice Panel pieces of pf2e-hud?
  Two structurally different docking approaches, switchable via ?variant=A|B
  or the bottom control. State (HP, surges, AP, active tab) is shared and
  reactive across both so you can compare them mid-interaction.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>4e Persistent HUD Prototype</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #0d0d0e;
    --panel: #1b1a1c;
    --panel-2: #242224;
    --panel-3: #2c292b;
    --line: #4a3f2f88;
    --gold: #c9a35f;
    --gold-bright: #e8c583;
    --paper: #e9dfcf;
    --muted: #a89b8a;
    --red: #a5333a;
    --red-bright: #d65b60;
    --green: #3d7a4a;
    --blue: #3a6a8a;
    --purple: #6a4f8a;
    font-family: "Signika", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 30% 20%, #2a2a2e, #0a0a0b 65%);
    color: var(--paper);
    font-size: 14px;
  }
  /* fake VTT canvas backdrop so the HUD reads in context */
  .canvas-fill {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      repeating-linear-gradient(0deg, #ffffff08 0 1px, transparent 1px 48px),
      repeating-linear-gradient(90deg, #ffffff08 0 1px, transparent 1px 48px),
      radial-gradient(ellipse at 60% 40%, #2e3b2c, #14171a 70%);
  }
  .prototype-note {
    position: relative;
    z-index: 1;
    max-width: 60rem;
    margin: 0 auto;
    padding: .8rem 1rem 0;
    color: #cdbda9;
    font-size: .82rem;
    text-align: center;
  }
  .prototype-note code { color: var(--gold-bright); }

  h1, h2, h3, p { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ============ shared HUD internals (used by both variants) ============ */

  .portrait {
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    border: 2px solid var(--gold);
    border-radius: 6px;
    background: radial-gradient(circle at 35% 30%, #7a5a34 0 20%, #2a2016 55%, #14100a 100%);
    color: var(--gold-bright);
    font-size: 1.4rem;
    box-shadow: 0 0 0 3px #000a;
  }

  .bar {
    position: relative;
    overflow: hidden;
    height: .85rem;
    border: 1px solid #00000080;
    border-radius: 3px;
    background: #1a1414;
  }
  .bar > i {
    position: absolute;
    inset: 0 auto 0 0;
    display: block;
    background: linear-gradient(180deg, var(--red-bright), var(--red));
  }
  .bar.surge > i { background: linear-gradient(180deg, #f0d98a, var(--gold)); }
  .bar-label {
    position: relative;
    z-index: 1;
    display: block;
    padding-left: .3rem;
    color: #fff;
    font-size: .62rem;
    font-weight: 700;
    line-height: .85rem;
    text-shadow: 0 1px 2px #000;
  }

  .defenses {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: .35rem;
  }
  .def {
    padding: .3rem .2rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--panel-2);
    text-align: center;
  }
  .def span { display: block; color: var(--muted); font-size: .58rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .def b { display: block; color: var(--gold-bright); font-family: Georgia, serif; font-size: 1.05rem; }

  .action-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: .4rem;
  }
  .action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .25rem;
    padding: .45rem .2rem .35rem;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: linear-gradient(180deg, var(--panel-3), var(--panel-2));
    color: var(--paper);
    font-size: .6rem;
    font-weight: 600;
    letter-spacing: .01em;
    text-align: center;
    text-transform: uppercase;
    transition: background .1s, border-color .1s, transform .05s;
  }
  .action-btn .icon { font-size: 1.1rem; line-height: 1; }
  .action-btn:hover { border-color: var(--gold); background: linear-gradient(180deg, #3a3330, #2a2523); }
  .action-btn:active { transform: translateY(1px); }
  .action-btn.disabled { opacity: .35; cursor: not-allowed; }
  .action-btn.disabled:hover { border-color: var(--line); background: linear-gradient(180deg, var(--panel-3), var(--panel-2)); }
  .action-btn.spent .icon { filter: grayscale(1); }
  .action-btn.danger:hover { border-color: var(--red-bright); }

  .ap-pips { display: flex; gap: .2rem; justify-content: center; }
  .ap-pip { width: .55rem; height: .55rem; border: 1px solid var(--gold); border-radius: 50%; }
  .ap-pip.filled { background: var(--gold); box-shadow: 0 0 4px var(--gold-bright); }

  .status-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .4rem;
    padding: .35rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: .65rem;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .status-toggle input { accent-color: var(--gold); }

  /* tab content lists */
  .tab-list { display: flex; flex-direction: column; gap: .3rem; overflow-y: auto; }
  .power-row, .item-row, .skill-row, .feat-row {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .4rem .5rem;
    border: 1px solid var(--line);
    border-left: 3px solid var(--muted);
    border-radius: 4px;
    background: var(--panel-2);
  }
  .power-row.at-will { border-left-color: var(--green); }
  .power-row.encounter { border-left-color: var(--red-bright); }
  .power-row.daily { border-left-color: var(--purple); }
  .power-row.utility { border-left-color: var(--blue); }
  .power-row.spent { opacity: .4; }
  .row-main { flex: 1; min-width: 0; }
  .row-main b { display: block; font-size: .78rem; color: var(--gold-bright); }
  .row-main small { display: block; color: var(--muted); font-size: .66rem; }
  .row-tag {
    padding: .1rem .35rem;
    border: 1px solid #ffffff22;
    border-radius: 3px;
    color: var(--paper);
    font-size: .55rem;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .row-use {
    padding: .2rem .5rem;
    border: 1px solid var(--gold);
    border-radius: 3px;
    background: transparent;
    color: var(--gold-bright);
    font-size: .6rem;
    font-weight: 700;
    text-transform: uppercase;
  }
  .row-use:hover { background: var(--gold); color: #1a1a1a; }
  .skill-row { justify-content: space-between; }
  .skill-row.trained b { color: var(--gold-bright); }
  .skill-row.trained::after { content: "●"; color: var(--gold); font-size: .5rem; }
  .skill-mod { font-family: Georgia, serif; font-size: .9rem; }
  .item-row .qty { color: var(--muted); font-size: .65rem; }
  .empty-note { padding: 1rem; color: var(--muted); font-size: .75rem; font-style: italic; text-align: center; }

  .tab-strip { display: flex; gap: .25rem; }
  .tab-btn {
    flex: 1;
    padding: .4rem .3rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--panel-2);
    color: var(--muted);
    font-size: .62rem;
    font-weight: 700;
    letter-spacing: .04em;
    text-align: center;
    text-transform: uppercase;
  }
  .tab-btn.active { border-color: var(--gold); background: linear-gradient(180deg, #3d3226, #241d16); color: var(--gold-bright); }
  .tab-btn:hover:not(.active) { border-color: var(--muted); color: var(--paper); }

  .name-row { display: flex; align-items: baseline; gap: .4rem; }
  .name-row h2 { color: var(--gold-bright); font-family: Georgia, serif; font-size: 1rem; }
  .name-row small { color: var(--muted); font-size: .68rem; }

  /* ============================ VARIANT A ============================ */
  /* pf2e-hud-faithful: slim always-visible bottom bar anchored bottom-right,
     with a "shield" popup that flies open above it when a tab is picked.
     Closest to the reference screenshot's information architecture. */

  .variant-a-dock {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 2;
    display: flex;
    flex-direction: column-reverse;
    align-items: flex-end;
    gap: .5rem;
  }
  .a-bar {
    display: flex;
    align-items: stretch;
    gap: 0;
    border: 1px solid var(--gold);
    border-radius: 6px;
    background: linear-gradient(180deg, var(--panel), var(--ink));
    box-shadow: 0 .5rem 1.5rem #000c;
    overflow: hidden;
  }
  .a-portrait-col { position: relative; width: 3.6rem; }
  .a-portrait-col .portrait { width: 3.6rem; height: 3.6rem; border-radius: 0; border-width: 0 1px 0 0; }
  .a-vitals-col { display: flex; flex-direction: column; justify-content: center; gap: .3rem; width: 12rem; padding: .4rem .55rem; }
  .a-vitals-col .name-row h2 { font-size: .88rem; }
  .a-rail { display: flex; flex-direction: column; border-left: 1px solid var(--line); }
  .a-rail button {
    display: grid;
    place-items: center;
    width: 2.4rem;
    height: 100%;
    flex: 1;
    border: 0;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--muted);
    font-size: 1rem;
  }
  .a-rail button:last-child { border-bottom: 0; }
  .a-rail button.active { background: linear-gradient(90deg, #3d3226, var(--panel-2)); color: var(--gold-bright); box-shadow: inset 3px 0 0 var(--gold); }
  .a-rail button:hover:not(.active) { color: var(--paper); }

  .a-popup {
    width: 20rem;
    max-height: 60vh;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--gold);
    border-radius: 6px;
    background: var(--panel);
    box-shadow: 0 .5rem 1.5rem #000c;
    overflow: hidden;
    transform-origin: bottom right;
    animation: pop-in .12s ease-out;
  }
  @keyframes pop-in { from { opacity: 0; transform: translateY(.5rem) scale(.98); } to { opacity: 1; transform: none; } }
  .a-popup-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: .4rem .6rem;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
  }
  .a-popup-head h3 { color: var(--gold-bright); font-family: Georgia, serif; font-size: .85rem; }
  .a-popup-head button.close { border: 0; background: none; color: var(--muted); font-size: 1rem; }
  .a-popup-body { padding: .5rem; overflow-y: auto; }
  .a-popup .action-grid { padding: .5rem; }
  .a-defenses-wrap { padding: .5rem; border-bottom: 1px solid var(--line); }

  /* ============================ VARIANT B ============================ */
  /* Fully-docked sidebar: always expanded, always visible, no popups.
     Trades screen real-estate for zero clicks-to-see-everything. */

  .variant-b-dock {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 2;
    width: 19rem;
    max-height: calc(100vh - 2rem);
    display: flex;
    flex-direction: column;
    border: 1px solid var(--gold);
    border-radius: 8px;
    background: linear-gradient(180deg, var(--panel), var(--ink) 85%);
    box-shadow: 0 .6rem 2rem #000d;
    overflow: hidden;
  }
  .b-header {
    display: flex;
    gap: .55rem;
    align-items: center;
    padding: .55rem .6rem;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(120deg, #3a2c1c, var(--panel) 70%);
  }
  .b-header .portrait { width: 3rem; height: 3rem; }
  .b-vitals { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .3rem; }
  .b-defenses-block { padding: .5rem .6rem; border-bottom: 1px solid var(--line); }
  .b-defenses-block .section-label { margin-bottom: .3rem; }
  .b-actions-block { padding: .5rem .6rem; border-bottom: 1px solid var(--line); }
  .b-tabs-block { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .b-tab-strip { padding: .5rem .6rem 0; }
  .b-tab-content { flex: 1; min-height: 8rem; max-height: 14rem; padding: .5rem .6rem; overflow-y: auto; }

  .section-label {
    color: var(--muted);
    font-size: .6rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  /* ============================ switcher ============================ */
  .switcher {
    position: fixed;
    z-index: 3;
    left: 50%;
    bottom: 1rem;
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .42rem;
    border: 1px solid var(--gold);
    border-radius: 99px;
    background: #171417;
    box-shadow: 0 .35rem 1rem #000a;
    transform: translateX(-50%);
  }
  .switcher button {
    width: 2rem;
    height: 2rem;
    border: 1px solid #6e5741;
    border-radius: 50%;
    background: #302821;
    color: var(--gold-bright);
    font-size: 1rem;
  }
  .switcher button:hover { border-color: var(--gold-bright); background: #493925; }
  .switcher output { min-width: 15rem; color: #e6d0b3; font-size: .72rem; font-weight: 700; text-align: center; }

  .reasoning {
    position: relative;
    z-index: 1;
    max-width: 60rem;
    margin: .6rem auto 6rem;
    padding: .6rem .9rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #14131488;
    color: var(--muted);
    font-size: .74rem;
    line-height: 1.4;
  }
  .reasoning b { color: var(--gold-bright); }

  @media (max-width: 480px) {
    .variant-b-dock, .a-popup { width: calc(100vw - 2rem); }
  }
</style>
</head>
<body>
<div class="canvas-fill"></div>
<p class="prototype-note">Throwaway design study for the <b>Persistent HUD</b> piece only (no token HUD / combat tracker / dice panel). Switch approaches with the bottom control or <code>?variant=A</code> / <code>?variant=B</code>. Click the sidebar icons (A) or tabs (B), spend AP, take damage/healing, and open a rest to see state react.</p>

<div id="app"></div>

<div class="reasoning" id="reasoning"></div>

<nav class="switcher" aria-label="Prototype variant selector">
  <button id="prev" aria-label="Previous variant">←</button>
  <output id="label"></output>
  <button id="next" aria-label="Next variant">→</button>
</nav>

<script>
/* ---------------------------- shared fake state ---------------------------- */
const state = {
  name: 'Kaelen Ashworth',
  klass: 'Level 6 Warlord',
  hp: 44, hpMax: 58,
  surgeValue: 14, surges: 7, surgesMax: 9,
  ap: 1, apMax: 2,
  ac: 21, fort: 18, ref: 17, will: 19,
  savingThrowPenalty: 0,
  statusOnly: false,
  activeTab: null,       // null = closed (variant A), or 'powers'|'skills'|'feats'|'items'
  activeTabB: 'powers',  // variant B always has a tab open
  log: [],
};

const powers = [
  { name: 'Furious Smash', tag: 'At-Will', kind: 'at-will', note: 'Melee weapon; +9 vs AC — 1[W]+4 damage, ally within 5 gains +2 to attack.' },
  { name: 'Wolf Pack Tactics', tag: 'At-Will', kind: 'at-will', note: 'Melee weapon; +9 vs AC — 1[W]+4 damage, you or ally may shift 1.' },
  { name: 'Storm of Blades', tag: 'Encounter', kind: 'encounter', note: 'Close burst 1; +9 vs AC — 2[W]+4 damage to each enemy in burst.', spent: false },
  { name: "Commander's Strike", tag: 'Daily', kind: 'daily', note: 'Ally makes a melee basic attack with +4 damage; you gain a healing surge if it hits.', spent: true },
  { name: 'Inspiring Word', tag: 'Utility', kind: 'utility', note: 'Minor, encounter 2/day; target spends a healing surge +1d6.' },
];

const skills = [
  { name: 'Diplomacy', mod: '+11', trained: true },
  { name: 'History', mod: '+9', trained: true },
  { name: 'Heal', mod: '+8', trained: true },
  { name: 'Intimidate', mod: '+6', trained: false },
  { name: 'Athletics', mod: '+7', trained: false },
  { name: 'Endurance', mod: '+5', trained: false },
  { name: 'Perception', mod: '+4', trained: false },
];

const feats = [
  { name: 'Improved Initiative', note: '+4 bonus to initiative checks.' },
  { name: 'Tactical Assault', note: "Marked target attacked by an ally provokes an attack of opportunity from you." },
  { name: 'Toughness', note: '+6 hit points (already applied to max HP).' },
];

const items = [
  { name: 'Longsword +1', qty: '1' },
  { name: 'Chainmail +1', qty: '1' },
  { name: 'Potion of Healing', qty: '3' },
  { name: 'Rope, 50 ft.', qty: '1' },
  { name: 'Everburning Torch', qty: '1' },
];

/* ---------------------------- shared render helpers ---------------------------- */
function pct(cur, max) { return Math.max(0, Math.min(100, (cur / max) * 100)); }

function hpBar() {
  return `<div class="bar"><i style="width:${pct(state.hp, state.hpMax)}%"></i><span class="bar-label">HP ${state.hp} / ${state.hpMax}</span></div>`;
}
function surgeBar() {
  return `<div class="bar surge"><i style="width:${pct(state.surges, state.surgesMax)}%"></i><span class="bar-label">Surges ${state.surges}/${state.surgesMax} · value ${state.surgeValue}</span></div>`;
}
function apPips() {
  let pips = '';
  for (let i = 0; i < state.apMax; i++) pips += `<span class="ap-pip ${i < state.ap ? 'filled' : ''}"></span>`;
  return pips;
}
function defensesBlock() {
  return `<div class="defenses">
    <div class="def"><span>AC</span><b>${state.ac}</b></div>
    <div class="def"><span>Fort</span><b>${state.fort}</b></div>
    <div class="def"><span>Ref</span><b>${state.ref}</b></div>
    <div class="def"><span>Will</span><b>${state.will}</b></div>
  </div>`;
}
function nameBlock() {
  return `<div class="name-row"><h2>${state.name}</h2></div><small style="color:var(--muted);font-size:.68rem">${state.klass}</small>`;
}

function actionsBlock() {
  const btn = (id, icon, label, extra = '', disabled = false, danger = false) =>
    `<button class="action-btn${disabled ? ' disabled' : ''}${danger ? ' danger' : ''}" data-action="${id}" ${disabled ? 'disabled' : ''}>
      <span class="icon">${icon}</span><span>${label}</span>${extra}
    </button>`;
  return `<div class="action-grid">
    ${btn('ap', '⚡', 'Use AP', `<span class="ap-pips">${apPips()}</span>`, state.ap <= 0)}
    ${btn('save', '★', `Save +${state.savingThrowPenalty}`)}
    ${btn('surge', '➕', 'Spend Surge', '', state.surges <= 0)}
    ${btn('second-wind', '🛡', 'Second Wind')}
    ${btn('rest-short', '🕐', 'Short Rest')}
    ${btn('rest-extended', '🛌', 'Ext. Rest')}
    ${btn('death-save', '💀', 'Death Save', '', state.hp > 0, true)}
    ${btn('sheet', '📋', 'Open Sheet')}
  </div>`;
}

function statusToggle() {
  return `<label class="status-toggle"><input type="checkbox" id="status-only" ${state.statusOnly ? 'checked' : ''}/> Show status only</label>`;
}

function tabStrip(activeKey, dataAttr) {
  const tabs = [['powers', 'Powers'], ['skills', 'Skills'], ['feats', 'Feats'], ['items', 'Items']];
  return `<div class="tab-strip">${tabs.map(([k, label]) =>
    `<button class="tab-btn ${activeKey === k ? 'active' : ''}" data-${dataAttr}="${k}">${label}</button>`
  ).join('')}</div>`;
}

function tabContent(key) {
  if (!key) return `<p class="empty-note">Pick a tab to see it here.</p>`;
  if (key === 'powers') {
    return `<div class="tab-list">${powers.map(p =>
      `<div class="power-row ${p.kind} ${p.spent ? 'spent' : ''}">
        <div class="row-main"><b>${p.name}</b><small>${p.note}</small></div>
        <span class="row-tag">${p.tag}</span>
        ${p.kind !== 'at-will' ? `<button class="row-use">${p.spent ? 'Spent' : 'Use'}</button>` : `<button class="row-use">Use</button>`}
      </div>`
    ).join('')}</div>`;
  }
  if (key === 'skills') {
    return `<div class="tab-list">${skills.map(s =>
      `<div class="skill-row ${s.trained ? 'trained' : ''}"><b>${s.name}</b><span class="skill-mod">${s.mod}</span></div>`
    ).join('')}</div>`;
  }
  if (key === 'feats') {
    return `<div class="tab-list">${feats.map(f =>
      `<div class="feat-row"><div class="row-main"><b>${f.name}</b><small>${f.note}</small></div></div>`
    ).join('')}</div>`;
  }
  if (key === 'items') {
    return `<div class="tab-list">${items.map(i =>
      `<div class="item-row"><div class="row-main"><b>${i.name}</b></div><span class="qty">×${i.qty}</span></div>`
    ).join('')}</div>`;
  }
  return '';
}

/* ---------------------------- actions (shared logic) ---------------------------- */
function doAction(id) {
  if (id === 'ap' && state.ap > 0) { state.ap--; log('Spent an Action Point.'); }
  else if (id === 'save') { log(`Rolled a saving throw (current bonus +${state.savingThrowPenalty}).`); }
  else if (id === 'surge' && state.surges > 0) { state.surges--; state.hp = Math.min(state.hpMax, state.hp + state.surgeValue); log(`Spent a healing surge (+${state.surgeValue} HP).`); }
  else if (id === 'second-wind') { if (state.surges > 0) { state.surges--; state.hp = Math.min(state.hpMax, state.hp + state.surgeValue); } log('Used Second Wind (+2 to all defenses until start of next turn).'); }
  else if (id === 'rest-short') { state.ap = state.apMax; log('Took a short rest — action points refreshed to max.'); }
  else if (id === 'rest-extended') { state.hp = state.hpMax; state.surges = state.surgesMax; state.ap = 1; log('Took an extended rest — HP and surges fully restored.'); }
  else if (id === 'death-save') { log(state.hp > 0 ? 'Not dying — nothing to save against.' : 'Rolled a death saving throw.'); }
  else if (id === 'sheet') { log('Would open the character sheet application.'); }
  render();
}
function log(msg) { state.log.unshift(msg); state.log = state.log.slice(0, 4); }

/* ---------------------------- VARIANT A: slim bar + popup ---------------------------- */
function renderA() {
  const railBtn = (key, icon) =>
    `<button class="${state.activeTab === key ? 'active' : ''}" data-tab-a="${key}" title="${key}">${icon}</button>`;

  const popup = state.activeTab ? `
    <div class="a-popup">
      <div class="a-popup-head">
        <h3>${state.activeTab[0].toUpperCase()}${state.activeTab.slice(1)}</h3>
        <button class="close" data-close-a>✕</button>
      </div>
      <div class="a-defenses-wrap">${defensesBlock()}</div>
      <div class="a-popup-body">${tabContent(state.activeTab)}</div>
    </div>` : '';

  const actionsPopup = state.activeTab === 'actions' ? `
    <div class="a-popup">
      <div class="a-popup-head"><h3>Quick Actions</h3><button class="close" data-close-a>✕</button></div>
      <div class="action-grid" style="padding:.5rem">${actionsBlock().replace('<div class="action-grid">','').replace(/<\/div>$/,'')}</div>
      ${statusToggle()}
    </div>` : '';

  return `
    <div class="variant-a-dock">
      ${state.activeTab === 'actions' ? actionsPopup : popup}
      <div class="a-bar">
        <div class="a-portrait-col"><div class="portrait">🛡</div></div>
        <div class="a-vitals-col">
          ${nameBlock()}
          ${hpBar()}
          ${surgeBar()}
        </div>
        <div class="a-rail">
          ${railBtn('powers', '✦')}
          ${railBtn('skills', '◈')}
          ${railBtn('feats', '❖')}
          ${railBtn('items', '⛁')}
          ${railBtn('actions', '⚙')}
        </div>
      </div>
    </div>`;
}

/* ---------------------------- VARIANT B: full sidebar ---------------------------- */
function renderB() {
  return `
    <div class="variant-b-dock">
      <div class="b-header">
        <div class="portrait">🛡</div>
        <div class="b-vitals">
          ${nameBlock()}
          ${hpBar()}
          ${surgeBar()}
        </div>
      </div>
      <div class="b-defenses-block">
        <div class="section-label">Defenses</div>
        ${defensesBlock()}
      </div>
      <div class="b-actions-block">
        <div class="section-label">Actions</div>
        ${actionsBlock()}
        ${statusToggle()}
      </div>
      <div class="b-tabs-block">
        <div class="b-tab-strip">${tabStrip(state.activeTabB, 'tab-b')}</div>
        <div class="b-tab-content">${tabContent(state.activeTabB)}</div>
      </div>
    </div>`;
}

/* ---------------------------- reasoning notes per variant ---------------------------- */
const notes = {
  A: `<b>Variant A — slim dock + popup (closest to pf2e-hud).</b> Mirrors the reference: a compact always-on bar (portrait, HP, surge value) anchored bottom-right with an icon rail; clicking an icon flies a panel open above it and closes when you pick another / hit ✕. Keeps screen real estate free during normal play, and the pf2e-hud reference already proves this pattern reads well. Downside: defenses and the action grid are hidden by default (moved actions into their own rail icon here, since 8 buttons don't fit in the slim bar) — one extra click versus variant B.`,
  B: `<b>Variant B — always-open sidebar.</b> Defenses and the 4e action grid (AP / Saving Throw / Surge / Second Wind / Short Rest / Extended Rest / Death Save / Open Sheet) are permanently visible; only Powers/Skills/Feats/Items live behind tabs. Zero clicks to see vitals+defenses+actions, which matters a lot in 4e where action economy (minor/move/standard/AP) is checked constantly. Downside: ~19rem × most-of-viewport-height is a heavier permanent footprint on the canvas than variant A.`,
};

/* Note on button set vs the pf2e-hud reference image: pf2e's "Saving Throw"
   is generic (used for any recovery/ongoing-effect save) so it maps directly.
   "Heal" in the reference is folded into "Spend Surge" here since 4e healing
   *is* surge-spending. "Short Rest" is kept even though 4e's short rest has
   no mechanical HP/resource recovery on its own — it's the trigger that lets
   you spend surges and refresh encounter powers/AP, so it's still a useful
   one-click log entry distinct from the long Extended Rest. */

/* ---------------------------- wiring ---------------------------- */
const variants = { A: ['Slim dock + popup', renderA], B: ['Always-open sidebar', renderB] };
let key = new URLSearchParams(location.search).get('variant')?.toUpperCase();
if (!variants[key]) key = 'A';

function render() {
  document.getElementById('app').innerHTML = variants[key][1]();
  document.getElementById('label').textContent = `${key} — ${variants[key][0]}`;
  document.getElementById('reasoning').innerHTML = notes[key];
  wire();
}

function wire() {
  document.querySelectorAll('[data-action]').forEach(b => b.addEventListener('click', () => doAction(b.dataset.action)));
  document.querySelectorAll('[data-tab-a]').forEach(b => b.addEventListener('click', () => {
    state.activeTab = state.activeTab === b.dataset.tabA ? null : b.dataset.tabA;
    render();
  }));
  const closeA = document.querySelector('[data-close-a]');
  if (closeA) closeA.addEventListener('click', () => { state.activeTab = null; render(); });
  document.querySelectorAll('[data-tab-b]').forEach(b => b.addEventListener('click', () => { state.activeTabB = b.dataset.tabB; render(); }));
  const statusOnly = document.getElementById('status-only');
  if (statusOnly) statusOnly.addEventListener('change', e => { state.statusOnly = e.target.checked; });
}

function move(delta) {
  const keys = Object.keys(variants);
  key = keys[(keys.indexOf(key) + delta + keys.length) % keys.length];
  const url = new URL(location);
  url.searchParams.set('variant', key);
  history.replaceState(null, '', url);
  render();
}
document.getElementById('prev').onclick = () => move(-1);
document.getElementById('next').onclick = () => move(1);
window.addEventListener('keydown', e => {
  if (!/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    if (e.key === 'ArrowLeft') move(-1);
    if (e.key === 'ArrowRight') move(1);
  }
});

render();
</script>
</body>
</html>

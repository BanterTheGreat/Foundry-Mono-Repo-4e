<!doctype html>
<!--
  THROWAWAY UI PROTOTYPE — not Foundry production code.
  Follow-up to gm-unified-hud-prototype.html: the GM confirmed the
  Horizontal Actor HUD (the bottom-right panel: portrait, HP dial, temp
  HP/surges, defenses, Powers/Skills/Feats/Items tabs) is the one piece
  that MUST stay — only the MMO hotbar column gets dropped. Combat-Pointer
  notes (now-acting + environment) must be ALWAYS VISIBLE — no tab, no
  flyout, no click-to-reveal. This prototype keeps the anchor panel fixed
  and explores three different ways to permanently surface notes and the
  Combat Briefing tracker (round + initiative) around it.

  Switch variants with the pill at the top, or ← / →. All state is a plain
  JS object; every action re-renders. No persistence, no real Foundry
  integration, drawer tab content is stubbed (that part of the HUD was
  already validated in horizontal-hud-prototype.html — this prototype is
  only about where the tracker + always-visible notes attach).

    A — Notes Strip Above Panel:
        A persistent bar sits between the tab row and the panel: round +
        clickable initiative pips on one line, the acting creature's
        pointers + environment notes rendered as a permanent bullet list
        underneath. Nothing to click open — it's just always there,
        shrinking/growing with note count.

    B — Pointers + Environment as Their Own Panels:
        Player info, Pointers, and Environment are three separate bordered
        panels in a row (not one merged box). Initiative becomes a
        vertical rail on the left (hotbar's old footprint). The tab strip
        sits above the player-info panel only, so its width tracks that
        panel's width, not the full row.

    C — Notes Bar Below Header:
        A header bar on top of the dock holds round + Prev/Next + init
        pips (same as before), but instead of a flyout, a second always-
        visible strip directly below it prints the current notes inline.
        Panel + tabs underneath are untouched.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GM Horizontal HUD Anchor Prototype</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #0d0d0e;
    --panel: rgb(9 9 11 / 95%);
    --panel-2: #201c1a;
    --panel-3: #2a2422;
    --line: #99745688;
    --line-solid: #997456;
    --gold: #c9a35f;
    --gold-bright: #f0c879;
    --paper: #f5eee5;
    --muted: #b3a495;
    --red: #a5333a;
    --red-bright: #d65b60;
    --green: #3d7a4a;
    --green-bright: #6fbf73;
    --blue: #3a6a8a;
    --purple: #6a4f8a;
    font-family: "Signika", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 70% 20%, #2a2a2e, #0a0a0b 65%); color: var(--paper); font-size: 14px; }
  .canvas-fill {
    position: fixed; inset: 0; z-index: 0;
    background:
      repeating-linear-gradient(0deg, #ffffff08 0 1px, transparent 1px 48px),
      repeating-linear-gradient(90deg, #ffffff08 0 1px, transparent 1px 48px),
      radial-gradient(ellipse at 60% 40%, #2e3b2c, #14171a 70%);
  }
  .prototype-note { position: relative; z-index: 1; max-width: 68rem; margin: 0 auto; padding: .8rem 1rem 0; color: #cdbda9; font-size: .82rem; text-align: center; }
  .prototype-note code { color: var(--gold-bright); }
  .reasoning { position: relative; z-index: 1; max-width: 68rem; margin: .6rem auto 1rem; padding: .6rem .9rem; border: 1px solid var(--line); border-radius: 6px; background: #14131488; color: var(--muted); font-size: .74rem; line-height: 1.4; }
  .reasoning b { color: var(--gold-bright); }

  h1, h2, h3, p { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }

  .section-label { color: var(--muted); font-size: .55rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }

  /* ================================================================= anchor panel (kept, per iteration 15) */
  .hh-dock { position: fixed; right: 1.5rem; bottom: 1.5rem; z-index: 2; display: flex; flex-direction: column; align-items: stretch; gap: .5rem; }
  .hh-panel-wrap { display: flex; align-items: flex-end; gap: .6rem; }
  .hh-left-col { display: flex; flex-direction: column; gap: .5rem; flex: 1; min-width: 0; }
  .hh-panel {
    position: relative; display: flex; align-items: center; padding: .65rem;
    border: 1px solid var(--line-solid); border-radius: 8px;
    background: linear-gradient(180deg, var(--panel), var(--ink) 90%);
    box-shadow: 0 .6rem 2rem #000d, inset 0 0 0 1px rgb(255 255 255 / 4%);
    text-shadow: 0 .08rem .15rem #000;
  }
  .hh-charinfo { display: flex; align-items: stretch; gap: .7rem; width: 30rem; }
  .hh-portrait {
    display: grid; place-items: center; flex: 0 0 auto; border: 2px solid var(--line-solid); border-radius: 6px;
    background: radial-gradient(circle at 35% 30%, #7a5a34 0 20%, #2a2016 55%, #14100a 100%);
    color: var(--gold-bright); font-size: 1.6rem; box-shadow: 0 0 0 3px #000a;
    width: 7.5rem; height: auto;
  }
  .hh-charinfo-text { display: flex; flex-direction: column; justify-content: center; gap: .55rem; flex: 1; min-width: 0; }

  .hh-name-row { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
  .hh-name-line { display: flex; flex-direction: column; gap: .1rem; }
  .hh-name-row h2 { color: var(--gold-bright); font-family: Georgia, serif; font-size: 1.05rem; white-space: nowrap; }
  .hh-name-row small { color: var(--muted); font-size: .68rem; white-space: nowrap; }
  .hh-name-actions { display: flex; gap: .3rem; margin-left: auto; }
  .hh-action-btn {
    position: relative; width: 1.9rem; height: 1.9rem; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line-solid); border-radius: 6px;
    background: linear-gradient(180deg, var(--panel), var(--ink) 90%); color: var(--paper);
    box-shadow: 0 .2rem .6rem #0007, inset 0 0 0 1px rgb(255 255 255 / 4%);
    font-size: .85rem;
  }
  .hh-action-btn:hover { border-color: var(--gold); }

  .hh-hp-dial-wrap { display: flex; align-items: center; gap: 1rem; }
  .hh-hp-dial {
    --pct: 100; position: relative; width: 7rem; height: 7rem; border-radius: 50%; flex: 0 0 auto;
    background: conic-gradient(var(--red-bright) calc(var(--pct) * 1%), #2a1414 0);
    box-shadow: inset 0 0 0 1px #00000080, 0 .2rem .6rem #0007;
  }
  .hh-hp-dial::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: repeating-conic-gradient(#00000070 0deg 1.2deg, transparent 1.2deg 9deg);
  }
  .hh-hp-dial-inner {
    position: absolute; inset: .6rem; z-index: 1; border-radius: 50%; background: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem;
    box-shadow: inset 0 0 .5rem #0009;
  }
  .hh-hp-dial-inner .val { font-family: Georgia, serif; font-size: 1.7rem; color: var(--gold-bright); line-height: 1; }
  .hh-hp-dial-inner .hp-of { color: var(--muted); font-size: .65rem; }

  .hh-hp-side { display: flex; flex-direction: column; gap: .4rem; flex: 1; min-width: 0; }
  .hh-stat-card-row { display: flex; gap: .5rem; }
  .hh-stat-card {
    flex: 1; display: flex; flex-direction: column; gap: .3rem; padding: .35rem .6rem;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); min-width: 0;
  }
  .hh-stat-card-head { display: flex; align-items: center; gap: .35rem; color: var(--muted); font-size: .58rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .hh-stat-card-value { font-family: Georgia, serif; font-size: 1.3rem; color: var(--paper); }
  .hh-stat-card-value.surge { color: var(--gold-bright); }
  .hh-stat-card-value .of { color: var(--muted); font-size: .85rem; }
  .hh-segment-bar { display: flex; gap: .16rem; height: .55rem; }
  .hh-segment-bar i { flex: 1; border-radius: 1px; background: #1a1414; border: 1px solid #00000080; font-style: normal; }
  .hh-segment-bar i.filled { background: linear-gradient(180deg, #f0d98a, var(--gold)); border-color: #00000060; }

  .hh-def-grid { display: flex; gap: .35rem; }
  .hh-def-chip {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: .2rem;
    padding: .4rem .3rem .35rem; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2);
  }
  .hh-def-chip b { font-family: Georgia, serif; font-size: 1.05rem; color: var(--paper); }
  .hh-def-chip .label { color: var(--muted); font-size: .55rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }

  .hh-tab-dial { display: flex; gap: .35rem; }
  .hh-tab-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: .3rem;
    padding: .45rem .3rem; border: 1px solid var(--line-solid); border-radius: 6px; background: var(--panel-2);
    color: var(--muted); font-size: .62rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
  }
  .hh-tab-btn.active { border-color: var(--gold); background: linear-gradient(180deg, #4a3a26, #2a2016); color: var(--gold-bright); }

  .hh-drawer {
    position: absolute; right: 0; bottom: calc(100% + .5rem); width: 22rem; max-height: min(24rem, 55vh);
    display: flex; flex-direction: column;
    border: 1px solid var(--gold); border-radius: 6px; background: var(--panel);
    box-shadow: 0 .5rem 1.5rem #000c; overflow: hidden;
  }
  .hh-drawer-head { display: flex; align-items: center; justify-content: space-between; padding: .4rem .6rem; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  .hh-drawer-head h3 { color: var(--gold-bright); font-family: Georgia, serif; font-size: .85rem; }
  .hh-drawer-body { padding: .6rem; overflow-y: auto; font-size: .78rem; color: #d9cdbb; line-height: 1.5; }
  .hh-drawer-body .stub-row { padding: .35rem .5rem; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); margin-bottom: .3rem; }

  /* ---- shared: always-visible notes content (bullets, no chrome to open).
     Stacked (Pointers over Environment) by default; when a container's
     content would overflow and scroll, JS adds .is-split so the two
     groups sit side by side instead — trading height for width to avoid
     a scrollbar. ---- */
  .notes-body { display: flex; flex-direction: column; gap: .35rem; }
  .notes-body.is-split { flex-direction: row; gap: 1rem; }
  .notes-body.is-split .notes-group { flex: 1 1 0; min-width: 0; }
  .notes-group .lbl { color: var(--gold-bright); font-size: .58rem; letter-spacing: .05em; text-transform: uppercase; display: block; margin: 0 0 .15rem; }
  .notes-group ul { margin: 0; padding-left: 1rem; }
  .notes-group li { margin-bottom: .1rem; }

  /* ================================================================= VARIANT A: notes strip above panel */
  #variantA .a-turnstrip { display: flex; align-items: center; gap: .4rem; padding: .35rem .5rem; border: 1px solid var(--line-solid); border-radius: 6px 6px 0 0; border-bottom: none; background: var(--panel-2); }
  #variantA .a-turnstrip .round { font-family: Georgia, serif; color: var(--gold-bright); font-size: .95rem; padding-right: .4rem; border-right: 1px solid var(--line); }
  #variantA .a-turnstrip .pips { display: flex; gap: .3rem; flex: 1; overflow-x: auto; }
  #variantA .a-pip { display: flex; align-items: center; gap: .3rem; padding: .2rem .4rem; border-radius: 5px; border: 1px solid transparent; white-space: nowrap; }
  #variantA .a-pip.current { border-color: var(--gold); background: #3a2c1c; }
  #variantA .a-pip .av { width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--panel-3); display: grid; place-items: center; font-size: .7rem; }
  #variantA .a-pip .init { font-size: .62rem; color: var(--muted); }
  #variantA .a-turnstrip .navbtn { width: 1.6rem; height: 1.6rem; border: 1px solid var(--line-solid); border-radius: 5px; background: var(--panel-3); color: var(--muted); }
  #variantA .a-turnstrip .navbtn:hover { color: var(--gold-bright); }
  #variantA .a-notes {
    border: 1px solid var(--line-solid); border-top: 1px solid var(--line); border-radius: 0 0 6px 6px;
    background: var(--panel); padding: .5rem .6rem; font-size: .76rem; color: #d9cdbb; line-height: 1.4;
    max-height: 6.5rem; overflow-y: auto;
  }

  /* ================================================================= VARIANT B: Pointers + Environment as their
     own panels, sitting next to the player-info panel (not merged into
     it). Tabs live above the player-info panel only, so their width is
     purely a function of that panel's width — nothing forces them to
     span the Pointers/Environment panels too. */
  #variantB .hh-panel-wrap { align-items: flex-end; }
  #variantB .hh-left-col { flex: 0 0 auto; }
  #variantB .b-side-panel {
    display: block; width: 12rem; flex: 0 0 auto; overflow-y: auto; /* height set inline via JS to match player panel */
  }
  #variantB .b-side-panel .lbl { color: var(--gold-bright); font-size: .58rem; letter-spacing: .05em; text-transform: uppercase; display: block; margin: 0 0 .3rem; }
  #variantB .b-side-panel ul { margin: 0; padding-left: 1rem; font-size: .74rem; color: #d9cdbb; line-height: 1.4; }
  #variantB .b-side-panel li { margin-bottom: .15rem; }

  /* -- Combat Tracker: minimal card style lifted from the shipped Combat
     Briefing panel (round header, bordered combatant cards, footer nav).
     Overall height is set inline via JS to 120% of the player panel's
     height; the combatant list scrolls internally to absorb the rest. -- */
  #variantB .b-rail {
    display: flex; flex-direction: column; width: 13rem; flex: 0 0 auto;
    border: 1px solid var(--line-solid); border-radius: 10px; background: var(--ink);
    box-shadow: 0 .6rem 2rem #000d; overflow: hidden;
  }
  #variantB .b-rail-head { flex: 0 0 auto; display: flex; align-items: baseline; gap: .4rem; padding: .55rem .7rem .4rem; }
  #variantB .b-rail-head .section-label { font-size: .6rem; }
  #variantB .b-rail-head .round { font-family: Georgia, serif; color: var(--paper); font-size: 1.4rem; line-height: 1; font-weight: 700; }
  #variantB .b-rail-head .close-btn { margin-left: auto; align-self: flex-start; color: var(--muted); font-size: 1rem; line-height: 1; }
  #variantB .b-rail-head .close-btn:hover { color: var(--gold-bright); }
  #variantB .b-rail-title {
    flex: 0 0 auto; display: flex; align-items: center; gap: .35rem; padding: .4rem .7rem;
    background: linear-gradient(120deg, #3a3222, var(--panel-2) 75%); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    color: var(--gold-bright); font-size: .62rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  }
  #variantB .b-rail-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; padding: .55rem; }
  #variantB .b-entry {
    display: flex; align-items: center; gap: .5rem; padding: .4rem .5rem;
    border: 1px solid var(--line-solid); border-radius: 8px; background: var(--panel-2); flex: 0 0 auto; cursor: pointer;
  }
  #variantB .b-entry.current { border-color: var(--green-bright); box-shadow: 0 0 0 1px var(--green-bright) inset; }
  #variantB .b-entry .av {
    width: 2.1rem; height: 2.1rem; flex: 0 0 auto; border-radius: 50%; background: var(--panel-3);
    display: grid; place-items: center; font-size: .95rem; border: 2px solid var(--line-solid);
  }
  #variantB .b-entry.current .av { border-color: var(--green-bright); }
  #variantB .b-entry-mid { flex: 1; min-width: 0; }
  #variantB .b-entry .nm { display: block; font-size: .74rem; font-weight: 700; color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #variantB .b-entry-hp { display: flex; align-items: center; gap: .3rem; margin-top: .2rem; }
  #variantB .b-entry-hp .heart { color: var(--red-bright); font-size: .62rem; flex: 0 0 auto; }
  #variantB .b-entry-hp .hp-nums { font-size: .64rem; color: var(--muted); flex: 0 0 auto; white-space: nowrap; }
  #variantB .b-entry-hp .hp-nums b { color: var(--paper); font-weight: 700; }
  #variantB .b-entry-hp .hp-track { flex: 1; min-width: 0; height: .3rem; border-radius: 2px; background: #1a1414; border: 1px solid #00000080; overflow: hidden; }
  #variantB .b-entry-hp .hp-fill { height: 100%; background: linear-gradient(180deg, var(--red-bright), var(--red)); }
  #variantB .b-entry-init {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 2.2rem; height: 2.2rem; border: 1px solid var(--line-solid); border-radius: 6px; background: var(--panel-3);
  }
  #variantB .b-entry.current .b-entry-init { border-color: var(--green-bright); }
  #variantB .b-entry-init .val { font-family: Georgia, serif; font-size: 1rem; color: var(--paper); line-height: 1; }
  #variantB .b-entry-init .lbl { font-size: .46rem; color: var(--muted); letter-spacing: .03em; }

  #variantB .b-rail-foot { flex: 0 0 auto; display: flex; align-items: center; gap: .35rem; padding: .5rem; border-top: 1px solid var(--line); }
  #variantB .b-rail-foot .navbtn {
    width: 2rem; height: 2rem; flex: 0 0 auto; display: grid; place-items: center;
    border: 1px solid var(--line-solid); border-radius: 6px; background: var(--panel-2); color: var(--muted); font-size: .85rem;
  }
  #variantB .b-rail-foot .navbtn:hover { color: var(--gold-bright); border-color: var(--gold); }
  #variantB .b-rail-foot .navbtn.end-combat:hover { color: var(--red-bright); border-color: var(--red-bright); }
  #variantB .b-rail-foot .end-turn-btn {
    flex: 1; min-width: 0; padding: .5rem .3rem;
    border: 1px solid var(--line-solid); border-radius: 6px; background: linear-gradient(180deg, #3a3222, var(--panel-2));
    color: var(--gold-bright); font-size: .66rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #variantB .b-rail-foot .end-turn-btn:hover { border-color: var(--gold); }

  /* ================================================================= VARIANT C: notes bar below header */
  #variantC .c-header {
    display: flex; align-items: center; gap: .6rem; padding: .4rem .6rem; position: relative;
    border: 1px solid var(--line-solid); border-radius: 8px 8px 0 0; border-bottom: none;
    background: linear-gradient(120deg, #3a2c1c, var(--panel) 70%);
  }
  #variantC .c-header .round { font-family: Georgia, serif; color: var(--gold-bright); font-size: 1.05rem; padding-right: .5rem; border-right: 1px solid var(--line); white-space: nowrap; }
  #variantC .c-header .navbtn { width: 1.6rem; height: 1.6rem; border: 1px solid var(--line-solid); border-radius: 5px; background: var(--panel-2); color: var(--muted); }
  #variantC .c-header .navbtn:hover { color: var(--gold-bright); }
  #variantC .c-header .pips { display: flex; gap: .3rem; flex: 1; overflow-x: auto; }
  #variantC .c-pip { display: flex; align-items: center; gap: .25rem; padding: .15rem .35rem; border-radius: 5px; border: 1px solid transparent; white-space: nowrap; }
  #variantC .c-pip.current { border-color: var(--gold); background: #ffffff14; }
  #variantC .c-pip .av { width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--panel-3); display: grid; place-items: center; font-size: .65rem; }
  #variantC .c-pip .init { font-size: .58rem; color: var(--muted); }
  #variantC .c-pill-btn { padding: .3rem .6rem; border: 1px solid var(--line-solid); border-radius: 5px; background: var(--panel-2); color: var(--gold-bright); font-size: .72rem; white-space: nowrap; }
  #variantC .c-pill-btn:hover { border-color: var(--gold); }
  #variantC .c-notes {
    border: 1px solid var(--line-solid); border-top: 1px solid var(--line); border-radius: 0 0 8px 8px;
    background: var(--panel-2); padding: .4rem .7rem; font-size: .74rem; color: #d9cdbb; line-height: 1.35;
    display: flex; gap: 1.2rem; overflow-x: auto; white-space: nowrap;
  }
  #variantC .c-notes .grp { display: flex; align-items: baseline; gap: .4rem; }
  #variantC .c-notes .lbl { color: var(--gold-bright); font-size: .58rem; letter-spacing: .05em; text-transform: uppercase; flex: 0 0 auto; }
  #variantC .c-notes .item { color: var(--muted); }
  #variantC .c-notes .item + .item::before { content: '\2022'; margin-right: .4rem; color: var(--line-solid); }

  .hidden { display: none !important; }

  /* ---------------------------------------------------------------- switcher */
  .switcher {
    position: fixed; left: 50%; top: 1rem; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: .6rem;
    background: #0d0d0ef0; border: 1px solid var(--line-solid); border-radius: 999px;
    padding: .35rem .5rem; box-shadow: 0 .4rem 1.2rem #000c;
  }
  .switcher button.arrow {
    width: 1.8rem; height: 1.8rem; border-radius: 50%; border: 1px solid var(--line-solid);
    background: var(--panel-2); color: var(--gold-bright); display: grid; place-items: center;
  }
  .switcher .label { font-size: .82rem; color: var(--paper); min-width: 15rem; text-align: center; }
  .switcher .label b { color: var(--gold-bright); }
</style>
</head>
<body>

<div class="canvas-fill"></div>

<p class="prototype-note">
  THROWAWAY PROTOTYPE — the <code>Horizontal Actor HUD</code> (bottom-right, hotbar dropped) is the fixed anchor. Notes are ALWAYS visible now, no tab/flyout. Switch with the pill at top, or <code>←</code>/<code>→</code>.
</p>
<div id="reasoningBox" class="reasoning"></div>

<div id="app"></div>

<div class="switcher">
  <button class="arrow" id="prevBtn">&#8592;</button>
  <span class="label" id="switchLabel"></span>
  <button class="arrow" id="nextBtn">&#8594;</button>
</div>

<script>
/* ---------------------------------------------------------------- state */
const combatants = [
  {
    id: "badger1", name: "Badger (1)", sub: "Level 1 Beast", init: 21,
    hp: 21, maxHp: 44, tempHp: 0, hasSurges: false, ac: 16, fort: 14, ref: 15, will: 12, initMod: 5, speed: 6,
    icon: "🐾",
    notes: [
      "Flanks with Badger (2) whenever it can reach a shared target, and will delay a turn to line that up rather than attack alone. Prefers to gang up on the party's squishiest-looking target rather than the one currently marked.",
      "Burrows away the instant it drops below half HP — play this as a skill challenge (Perception/Athletics to track or dig it out) rather than letting it just tactically retreat like a PC would.",
    ],
  },
  {
    id: "badger2", name: "Badger (2)", sub: "Level 1 Beast", init: 19,
    hp: 44, maxHp: 44, tempHp: 0, hasSurges: false, ac: 16, fort: 14, ref: 15, will: 12, initMod: 5, speed: 6,
    icon: "🐾",

  },
  {
    id: "rogal", name: "Rogal", sub: "Level 10 Swordmage", init: 17,
    hp: 85, maxHp: 111, tempHp: 0, hasSurges: true, surges: 2, surgesMax: 11, ac: 26, fort: 20, ref: 21, will: 20, initMod: 1, speed: 5,
    icon: "🛡",
    notes: [

    ],
  },
  {
    id: "elira", name: "Elira", sub: "Level 10 Cleric", init: 15,
    hp: 60, maxHp: 78, tempHp: 5, hasSurges: true, surges: 6, surgesMax: 9, ac: 24, fort: 18, ref: 17, will: 22, initMod: 2, speed: 5,
    icon: "✚",
    notes: ["Has Healing Word available as an immediate action if anyone drops to 0 — remind the player this doesn't cost their standard action for the round."],
  },
  {
    id: "wolf1", name: "Dire Wolf (1)", sub: "Level 3 Beast", init: 14,
    hp: 38, maxHp: 38, tempHp: 0, hasSurges: false, ac: 17, fort: 16, ref: 16, will: 13, initMod: 3, speed: 8,
    icon: "🐺",
    notes: ["Pack tactics: gets combat advantage automatically while adjacent to another wolf. Trips a prone target on a hit if it also has combat advantage against them — remember to apply both effects, this one gets missed a lot."],
  },
  {
    id: "wolf2", name: "Dire Wolf (2)", sub: "Level 3 Beast", init: 12,
    hp: 22, maxHp: 38, tempHp: 0, hasSurges: false, ac: 17, fort: 16, ref: 16, will: 13, initMod: 3, speed: 8,
    icon: "🐺",
    notes: [],
  },
  {
    id: "thane", name: "Thane", sub: "Level 10 Ranger", init: 11,
    hp: 71, maxHp: 90, tempHp: 0, hasSurges: true, surges: 8, surgesMax: 10, ac: 23, fort: 19, ref: 24, will: 18, initMod: 6, speed: 6,
    icon: "🏹",
    notes: ["Two-weapon Twin Strike is his default action — he'll ask about cover a lot this fight since the stream splits line of sight to the den. Also has a standing Quarry on Badger (1) if it's still alive."],
  },
  {
    id: "vex", name: "Vex", sub: "Level 10 Warlock", init: 9,
    hp: 52, maxHp: 82, tempHp: 0, hasSurges: true, surges: 3, surgesMax: 8, ac: 22, fort: 17, ref: 20, will: 19, initMod: 1, speed: 5,
    icon: "🔮",
    notes: ["Curse target should be reassigned to whatever's currently bloodied so his at-wills keep getting the extra damage die — he usually forgets to call this out, so prompt him each of his turns."],
  },
];

const environmentNotes = [
  "A shallow stream cuts through the middle of the clearing, running roughly north-south; it counts as difficult terrain and anyone ending a turn in it without cover takes a -2 penalty to Reflex against area attacks originating from the treeline. It's shallow enough to see the bottom, so it doesn't block line of sight.",
  "The badger den entrance on the north slope is climbable with a DC 15 Athletics check; failing by 5 or more causes a fall and 1d6 damage. Creatures already inside the den get concealment against attacks made from outside it, but not vice versa.",
  "The treeline surrounding the clearing provides cover to anything within 2 squares of it, and lightly obscures line of sight beyond 4 squares — useful for the ranger's stealth but also for enemies trying to disengage.",
  "It's raining steadily, so any fire-based powers used this encounter have their duration halved and there's a cumulative 10% chance per round that an open flame effect is doused outright.",
];

const state = {
  variant: "B",
  round: 8,
  turnIndex: 0,
  activeTab: null,          // powers | skills | feats | items
};

const VARIANTS = ["A", "B", "C"];
const VARIANT_NAMES = { A: "Notes Strip Above Panel", B: "Notes as Panel Column", C: "Notes Bar Below Header" };
const REASONING = {
  A: "<b>A — Notes Strip Above Panel.</b> A persistent bar sits between the tab row and the panel: round + clickable initiative pips on one line, the acting creature's pointers and environment notes rendered underneath as a permanent bullet list — nothing to click open, it scrolls internally if it gets long. Smallest structural change, but notes sit above the panel, not next to the stats they're about.",
  B: "<b>B — Notes as Panel Column.</b> Row order: player info, Combat Tracker, Environment, Now Acting — Pointers. The tracker is restyled to match the shipped Combat Briefing panel (rounded card, round counter + close button, bordered combatant cards with portrait/HP bar/init box, footer nav) and is set to 120% of the player panel's height so its scrollable list has real room. Environment and Pointers are each pinned to exactly the player panel's height (JS-measured), so all three line up edge to edge. The tab strip lives above the player-info panel only, so its width tracks that panel, not the full row.",
  C: "<b>C — Notes Bar Below Header.</b> The header bar (round, Prev/Next, init pips) stays on top of the dock, but instead of opening a flyout, a second always-visible strip directly beneath it prints the current notes inline, comma-separated by group (Pointers / Environment). Panel and tabs underneath are untouched. Keeps notes compact and glanceable, but long notes get truncated/scroll horizontally rather than wrapping.",
};

function current() { return combatants[state.turnIndex]; }
function pct(c) { return Math.round((c.hp / c.maxHp) * 100); }

function stepTurn(delta) {
  const n = combatants.length;
  state.turnIndex = (state.turnIndex + delta + n) % n;
  if (delta > 0 && state.turnIndex === 0) state.round++;
  render();
}

/* ---------------------------------------------------------------- shared panel pieces */
function nameRow(c) {
  return `
    <div class="hh-name-row">
      <div class="hh-name-line">
        <h2>${c.name}</h2>
        <small>${c.sub}</small>
      </div>
      <div class="hh-name-actions">
        <button class="hh-action-btn" title="Use Action Point">&#9889;</button>
        <button class="hh-action-btn" title="Save">&#9733;</button>
        <button class="hh-action-btn" title="Heal">&#10133;</button>
        <button class="hh-action-btn" title="Rest">&#128716;</button>
      </div>
    </div>`;
}

function hpBlock(c) {
  return `
    <div class="hh-hp-dial-wrap">
      <div class="hh-hp-dial" style="--pct:${pct(c)}">
        <div class="hh-hp-dial-inner">
          <span class="section-label">HP</span>
          <span class="val">${c.hp}</span>
          <span class="hp-of">of ${c.maxHp}</span>
        </div>
      </div>
      <div class="hh-hp-side">
        <div class="hh-stat-card-row">
          <div class="hh-stat-card">
            <div class="hh-stat-card-head">&#128737; Temp HP</div>
            <div class="hh-stat-card-value">${c.tempHp}</div>
          </div>
          ${c.hasSurges ? `
          <div class="hh-stat-card">
            <div class="hh-stat-card-head">&#128147; Surges</div>
            <div class="hh-stat-card-value surge">${c.surges}<span class="of">/${c.surgesMax}</span></div>
          </div>` : ""}
        </div>
        ${c.hasSurges ? `<div class="hh-segment-bar">${Array.from({length: c.surgesMax}, (_, i) => `<i class="${i < c.surges ? "filled" : ""}"></i>`).join("")}</div>` : ""}
      </div>
    </div>`;
}

function defGrid(c) {
  const defs = [["AC", c.ac], ["Fort", c.fort], ["Ref", c.ref], ["Will", c.will], ["Init", c.initMod], ["Speed", c.speed]];
  return `<div class="hh-def-grid">${defs.map(([l, v]) => `<div class="hh-def-chip"><b>${v}</b><span class="label">${l}</span></div>`).join("")}</div>`;
}

function tabStrip(tabs, drawerHtml) {
  return `
    <div style="position:relative;">
      ${drawerHtml || ""}
      <div class="hh-tab-dial">
        ${tabs.map(([key, label]) => `<button class="hh-tab-btn ${state.activeTab === key ? "active" : ""}" data-tab="${key}">${label}</button>`).join("")}
      </div>
    </div>`;
}

function drawerStub(tab) {
  const stubItems = { powers: ["Lightning Lure", "Arcane Lance", "Basic Attack (Melee)"], skills: ["Arcana +14", "Athletics +9", "Diplomacy +6"], feats: ["Weapon Focus", "Improved Aegis"], items: ["Longsword +2", "Potion of Healing (x3)"] };
  return `
    <div class="hh-drawer">
      <div class="hh-drawer-head"><h3>${tab[0].toUpperCase()}${tab.slice(1)}</h3><button data-close-drawer>&times;</button></div>
      <div class="hh-drawer-body">${(stubItems[tab] || []).map(i => `<div class="stub-row">${i}</div>`).join("")}</div>
    </div>`;
}

function notesListHtml(c) {
  return `
    <div class="notes-group">
      <span class="lbl">Now Acting — Pointers</span>
      <ul>${c.notes.map(n => `<li>${n}</li>`).join("") || "<li>&mdash;</li>"}</ul>
    </div>
    <div class="notes-group">
      <span class="lbl">Environment</span>
      <ul>${environmentNotes.map(n => `<li>${n}</li>`).join("")}</ul>
    </div>`;
}

/* Stacks Pointers/Environment by default; if the content overflows and
   would scroll, switches to a side-by-side layout instead (trades height
   for width). Falls back to a scrollbar only if still overflowing. */
function fitNotes(el) {
  if (!el) return;
  el.classList.remove("is-split");
  if (el.scrollHeight > el.clientHeight + 1) {
    el.classList.add("is-split");
  }
}

function bindPanelCommon() {
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
    state.activeTab = state.activeTab === b.dataset.tab ? null : b.dataset.tab;
    render();
  });
  const close = document.querySelector("[data-close-drawer]");
  if (close) close.onclick = () => { state.activeTab = null; render(); };
}

const TABS4 = [["powers", "Powers"], ["skills", "Skills"], ["feats", "Feats"], ["items", "Items"]];

/* ---------------------------------------------------------------- VARIANT A */
function renderA() {
  const c = current();
  document.getElementById("app").innerHTML = `
    <div id="variantA">
      <div class="hh-dock">
        <div class="hh-panel-wrap">
          <div class="hh-left-col">
            <div class="a-turnstrip">
              <span class="round">R${state.round}</span>
              <button class="navbtn" id="aPrev">&#8676;</button>
              <div class="pips">
                ${combatants.map((cc, i) => `<div class="a-pip ${i === state.turnIndex ? "current" : ""}" data-idx="${i}"><span class="av">${cc.icon}</span><span class="init">${cc.init}</span></div>`).join("")}
              </div>
              <button class="navbtn" id="aNext">&#8677;</button>
            </div>
            <div class="a-notes notes-body">${notesListHtml(c)}</div>
            ${tabStrip(TABS4, state.activeTab ? drawerStub(state.activeTab) : "")}
            <div class="hh-panel">
              <div class="hh-charinfo">
                <div class="hh-portrait">${c.icon}</div>
                <div class="hh-charinfo-text">
                  ${nameRow(c)}
                  ${hpBlock(c)}
                  ${defGrid(c)}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  bindPanelCommon();
  document.getElementById("aPrev").onclick = () => stepTurn(-1);
  document.getElementById("aNext").onclick = () => stepTurn(1);
  document.querySelectorAll("#variantA .a-pip").forEach(el => el.onclick = () => { state.turnIndex = +el.dataset.idx; render(); });
  fitNotes(document.querySelector("#variantA .a-notes"));
}

/* ---------------------------------------------------------------- VARIANT B */
function renderB() {
  const c = current();
  document.getElementById("app").innerHTML = `
    <div id="variantB">
      <div class="hh-dock">
        <div class="hh-panel-wrap">
          <div class="hh-left-col">
            ${tabStrip(TABS4, state.activeTab ? drawerStub(state.activeTab) : "")}
            <div class="hh-panel">
              <div class="hh-charinfo">
                <div class="hh-portrait">${c.icon}</div>
                <div class="hh-charinfo-text">
                  ${nameRow(c)}
                  ${hpBlock(c)}
                  ${defGrid(c)}
                </div>
              </div>
            </div>
          </div>
          <div class="b-rail">
            <div class="b-rail-head">
              <span class="section-label">Round</span>
              <span class="round">${state.round}</span>
              <button class="close-btn" id="bClose" title="Collapse tracker">&times;</button>
            </div>
            <div class="b-rail-title">&#9876; Combat Briefing</div>
            <div class="b-rail-list">
              ${combatants.map((cc, i) => `
                <div class="b-entry ${i === state.turnIndex ? "current" : ""}" data-idx="${i}">
                  <span class="av">${cc.icon}</span>
                  <div class="b-entry-mid">
                    <span class="nm">${cc.name}</span>
                    <div class="b-entry-hp">
                      <span class="heart">&#9829;</span>
                      <span class="hp-nums"><b>${cc.hp}</b> / ${cc.maxHp}</span>
                      <div class="hp-track"><div class="hp-fill" style="width:${pct(cc)}%"></div></div>
                    </div>
                  </div>
                  <div class="b-entry-init"><span class="val">${cc.init}</span><span class="lbl">INIT</span></div>
                </div>`).join("")}
            </div>
            <div class="b-rail-foot">
              <button class="navbtn" id="bPrev" title="Previous Turn">&#8676;</button>
              <button class="end-turn-btn" id="bEndTurn">Next Turn</button>
              <button class="navbtn end-combat" id="bEndCombat" title="End Combat">&#9873;</button>
            </div>
          </div>
          <div class="hh-panel b-side-panel">
            <span class="lbl">Environment</span>
            <ul>${environmentNotes.map(n => `<li>${n}</li>`).join("")}</ul>
          </div>
          <div class="hh-panel b-side-panel">
            <span class="lbl">Now Acting — Pointers</span>
            <ul>${c.notes.map(n => `<li>${n}</li>`).join("") || "<li>&mdash;</li>"}</ul>
          </div>
        </div>
      </div>
    </div>`;
  bindPanelCommon();
  document.querySelectorAll("#variantB .b-entry").forEach(el => el.onclick = () => { state.turnIndex = +el.dataset.idx; render(); });
  document.getElementById("bPrev").onclick = () => stepTurn(-1);
  document.getElementById("bEndTurn").onclick = () => stepTurn(1);
  document.getElementById("bEndCombat").onclick = () => alert("End Combat clicked (stub — no real combat state in this prototype).");
  document.getElementById("bClose").onclick = () => alert("Collapse clicked (stub — kept for visual parity with the Combat Briefing panel's close button).");

  const playerPanel = document.querySelector("#variantB .hh-panel:not(.b-side-panel)");
  const rail = document.querySelector("#variantB .b-rail");
  if (playerPanel && rail) rail.style.maxHeight = (playerPanel.offsetHeight * 1.2) + "px";
  document.querySelectorAll("#variantB .b-side-panel").forEach(el => {
    if (playerPanel) el.style.height = playerPanel.offsetHeight + "px";
  });
}

/* ---------------------------------------------------------------- VARIANT C */
function renderC() {
  const c = current();
  document.getElementById("app").innerHTML = `
    <div id="variantC">
      <div class="hh-dock">
        <div class="c-header">
          <span class="round">Round ${state.round}</span>
          <button class="navbtn" id="cPrev">&#8676;</button>
          <div class="pips">
            ${combatants.map((cc, i) => `<div class="c-pip ${i === state.turnIndex ? "current" : ""}" data-idx="${i}"><span class="av">${cc.icon}</span><span class="init">${cc.init}</span></div>`).join("")}
          </div>
          <button class="c-pill-btn" id="cNext">Next Turn</button>
        </div>
        <div class="c-notes">
          <div class="grp"><span class="lbl">Pointers</span>${c.notes.map(n => `<span class="item">${n}</span>`).join("")}</div>
          <div class="grp"><span class="lbl">Environment</span>${environmentNotes.map(n => `<span class="item">${n}</span>`).join("")}</div>
        </div>
        <div class="hh-panel-wrap">
          <div class="hh-left-col">
            ${tabStrip(TABS4, state.activeTab ? drawerStub(state.activeTab) : "")}
            <div class="hh-panel">
              <div class="hh-charinfo">
                <div class="hh-portrait">${c.icon}</div>
                <div class="hh-charinfo-text">
                  ${nameRow(c)}
                  ${hpBlock(c)}
                  ${defGrid(c)}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  bindPanelCommon();
  document.getElementById("cPrev").onclick = () => stepTurn(-1);
  document.getElementById("cNext").onclick = () => stepTurn(1);
  document.querySelectorAll("#variantC .c-pip").forEach(el => el.onclick = () => { state.turnIndex = +el.dataset.idx; render(); });
}

/* ---------------------------------------------------------------- switcher + render */
function render() {
  document.getElementById("switchLabel").innerHTML = `<b>${state.variant}</b> &mdash; ${VARIANT_NAMES[state.variant]}`;
  document.getElementById("reasoningBox").innerHTML = REASONING[state.variant];
  if (state.variant === "A") renderA();
  if (state.variant === "B") renderB();
  if (state.variant === "C") renderC();
}

function cycle(delta) {
  const i = VARIANTS.indexOf(state.variant);
  state.variant = VARIANTS[(i + delta + VARIANTS.length) % VARIANTS.length];
  state.activeTab = null;
  render();
}

document.getElementById("prevBtn").onclick = () => cycle(-1);
document.getElementById("nextBtn").onclick = () => cycle(1);
window.addEventListener("keydown", (e) => {
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});

render();
</script>
</body>
</html>

<!doctype html>
<!-- THROWAWAY PROTOTYPE: Three right-of-radial combat decks, switchable with ?variant=belt|grid|console. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radial right-deck prototype</title><style>
:root{color-scheme:dark;--ink:#0b0b0d;--panel:#141112;--line:#8f674b;--gold:#e3ba81;--paper:#f4e4d2;--muted:#b9a08a;--red:#d55b69;--blue:#91cfe6;font-family:Signika,"Segoe UI",sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(ellipse at 50% 8%,#39342b,#111316 48%,#08090a);color:var(--paper)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.1;background:repeating-linear-gradient(90deg,transparent 0 49px,#fff 50px),repeating-linear-gradient(0deg,transparent 0 49px,#fff 50px)}main{position:relative;z-index:1;width:min(760px,calc(100vw - 28px));margin:3rem auto 7rem}.intro{margin:0 0 1rem;color:#dac5ad;text-align:center;font-size:.84rem;line-height:1.4}.intro b{color:var(--gold)}.hud{display:grid;grid-template-columns:280px 1fr;min-height:294px;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,#121113fa,#08090afa);box-shadow:0 16px 38px #000b,inset 0 0 0 3px #fff1}.radial-column{position:relative}.dial{position:absolute;inset:7px 0;width:280px;height:280px}.ring{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);filter:drop-shadow(0 5px 12px #000a)}.core{position:absolute;inset:81px 39px;display:grid;place-content:center;gap:.05rem;text-align:center}.surges{color:#f2cf7c;font-size:.88rem;font-weight:800}.hp{color:var(--red);font:700 2.3rem Georgia,serif;line-height:.9}.max{color:var(--muted);font-size:.61rem}.temp{color:var(--blue);font-size:.88rem;font-weight:800}.deck{min-width:0;padding:14px 10px 14px 0}.action{border:1px solid #805d45;border-radius:5px;background:linear-gradient(135deg,#211917,#121113);color:var(--paper);cursor:pointer}.action:hover{border-color:var(--gold);background:#2b211a}.action i{display:block;color:#d8b37d;font-style:normal}.action strong{display:block;color:#d8bea0;font:700 .7rem Georgia,serif}.action small,.eyebrow{display:block;color:var(--muted);font-size:.48rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.stat i{color:#d4b07c;font-style:normal}.stat b{font:700 1.15rem Georgia,serif}.stat small{color:var(--muted);font-size:.44rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.switcher{position:fixed;z-index:5;bottom:15px;left:50%;display:flex;align-items:center;gap:.3rem;padding:.35rem;border:1px solid var(--gold);border-radius:999px;background:#0c0d0e;box-shadow:0 8px 24px #000c;transform:translateX(-50%)}button{font:inherit}.switcher button{width:32px;height:30px;border:0;border-radius:999px;background:transparent;color:var(--gold);font-size:1.15rem;cursor:pointer}.switcher button:hover{background:#3e2e20}.switcher output{min-width:190px;text-align:center;color:#f4dfc1;font-size:.77rem;font-weight:bold}
/* A — buttons are a single command belt; stat hierarchy is a shield line underneath. */
.belt{display:grid;grid-template-rows:58px 1fr;gap:12px}.belt .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.belt .action{display:grid;place-content:center;gap:3px;text-align:center}.belt .action i{font-size:1.22rem}.belt .action small{font-size:.48rem}.shieldline{display:grid;grid-template-columns:1.38fr repeat(3,1fr);grid-template-rows:auto 1fr auto;gap:5px}.shieldline .eyebrow{grid-column:1/5}.shieldline .stat{display:grid;place-content:center;gap:2px;text-align:center;border-left:1px solid #ffffff18}.shieldline .stat.ac{border-left:0;border:1px solid #805d45;border-radius:5px;background:linear-gradient(135deg,#443022,#1b1514)}.shieldline .stat.ac b{color:#ffe0a7;font-size:1.55rem}.belt .pace{grid-column:1/5;display:flex;justify-content:center;gap:20px;padding-top:6px;border-top:1px solid #ffffff18}.belt .pace span{display:flex;align-items:baseline;gap:5px}.belt .pace b{color:#d8bea0;font:700 1rem Georgia,serif}
/* B — a 2×2 command pad takes one side; a tall defence totem gives AC dominance. */
.grid{display:grid;grid-template-columns:104px 1fr;gap:12px;height:266px}.grid .actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid .action{display:grid;place-content:center;text-align:center;gap:3px}.grid .action i{font-size:1.12rem}.grid .action small{font-size:.45rem}.totem{display:grid;grid-template-rows:auto 92px 1fr auto;gap:7px}.totem .ac{display:grid;place-content:center;text-align:center;border:1px solid #8f674b;border-radius:6px;background:linear-gradient(135deg,#4b3323,#191313)}.totem .ac i{color:#f1c87e;font-style:normal;font-size:1rem}.totem .ac b{color:#ffe0a7;font:700 2rem Georgia,serif}.totem .defences{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #ffffff18;border-bottom:1px solid #ffffff18}.totem .stat{display:grid;place-content:center;text-align:center;border-left:1px solid #ffffff18}.totem .stat:first-child{border-left:0}.totem .pace{display:grid;grid-template-columns:1fr 1fr;gap:6px}.totem .pace span{display:grid;grid-template-columns:auto auto;place-content:center;gap:4px;border:1px solid #ffffff18;border-radius:4px}.totem .pace b{color:#d8bea0;font:700 1rem Georgia,serif}
/* C — actions become a vertical console; defences form a compact instrument cluster. */
.console{display:grid;grid-template-columns:78px 1fr;gap:12px;height:266px}.console .actions{display:grid;grid-template-rows:repeat(4,1fr);gap:5px}.console .action{display:grid;grid-template-columns:20px 1fr;align-items:center;gap:4px;padding:0 8px;text-align:left}.console .action i{font-size:1rem}.console .action small{font-size:.48rem}.cluster{display:grid;grid-template-rows:auto 1fr auto;gap:8px}.cluster .shield{display:grid;grid-template-columns:82px 1fr;min-height:116px;border:1px solid #805d45;border-radius:6px;overflow:hidden;background:#171312}.cluster .ac{display:grid;place-content:center;text-align:center;background:linear-gradient(135deg,#533824,#231714)}.cluster .ac i{color:#f1c87e;font-style:normal}.cluster .ac b{color:#ffe0a7;font:700 1.95rem Georgia,serif}.cluster .defences{display:grid;grid-template-rows:repeat(3,1fr)}.cluster .stat{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;padding:0 10px;border-bottom:1px solid #ffffff14}.cluster .stat:last-child{border-bottom:0}.cluster .stat b{color:#ead5b6}.cluster .pace{display:flex;justify-content:space-around;padding:7px 0;border-top:1px solid #ffffff18}.cluster .pace span{display:flex;align-items:center;gap:5px}.cluster .pace b{color:#d8bea0;font:700 1rem Georgia,serif}@media(max-width:620px){main{margin-top:1rem}.hud{grid-template-columns:1fr}.radial-column{height:294px}.deck{padding:12px}.grid,.console{height:240px}}
</style></head><body><main><p class="intro"><b>Three right-side deck alternatives:</b> the radial is intentionally fixed; only its command and combat-stat space changes.</p><section id="app" aria-live="polite"></section></main><nav class="switcher"><button id="prev" aria-label="Previous variant">←</button><output id="label"></output><button id="next" aria-label="Next variant">→</button></nav><script>
const keys=['belt','grid','console'],labels={belt:'A · Command belt',grid:'B · Command pad',console:'C · Combat console'};const ring=()=>`<svg class="ring" viewBox="0 0 200 200" aria-label="70 of 93 hit points, 11 of 12 healing surges, zero temporary hit points"><g stroke="#120d0e" stroke-width="4">${Array.from({length:8},(_,n)=>`<path fill="${n<6?'#d55b69':'#4d252b'}" d="M100 100 L${100+85*Math.cos((-90+n*45-18)*Math.PI/180)} ${100+85*Math.sin((-90+n*45-18)*Math.PI/180)} A85 85 0 0 1 ${100+85*Math.cos((-90+n*45+18)*Math.PI/180)} ${100+85*Math.sin((-90+n*45+18)*Math.PI/180)}Z"/>`).join('')}</g><circle cx="100" cy="100" r="55" fill="none" stroke="#21170d" stroke-width="14"/><circle cx="100" cy="100" r="55" fill="none" stroke="#d9ad52" stroke-width="9" stroke-dasharray="25 4"/><circle cx="100" cy="100" r="43" fill="#0d0b0c" stroke="#2c1c18" stroke-width="2"/><circle cx="100" cy="100" r="96" fill="none" stroke="#1d4553" stroke-width="4" stroke-dasharray="19 5"/></svg>`;const radial=()=>`<section class="radial-column"><div class="dial">${ring()}<div class="core"><span class="surges">11 / 12</span><b class="hp">70</b><span class="max">/ 93</span><span class="temp">◒ 0</span></div></div></section>`;const actions=()=>[['ϟ','AP'],['♥','Heals'],['★','Saves'],['☾','Rests']].map(([icon,label])=>`<button class="action" title="${label}"><i>${icon}</i><small>${label}</small></button>`).join('');const defence=(kind)=>kind==='belt'?`<section class="shieldline"><span class="eyebrow">Defences</span><span class="stat ac"><i>⬟</i><b>25</b><small>AC</small></span>${[['✚',24,'Fort'],['ϟ',23,'Ref'],['✦',20,'Will']].map(([i,v,l])=>`<span class="stat"><i>${i}</i><b>${v}</b><small>${l}</small></span>`).join('')}<div class="pace"><span><i>♞</i><b>12</b><small>Init</small></span><span><i>↔</i><b>5</b><small>Speed</small></span></div></section>`:kind==='grid'?`<section class="totem"><span class="eyebrow">Armour & defences</span><div class="ac"><i>⬟</i><b>25</b><small>Armour Class</small></div><div class="defences">${[['✚',24,'Fort'],['ϟ',23,'Ref'],['✦',20,'Will']].map(([i,v,l])=>`<span class="stat"><i>${i}</i><b>${v}</b><small>${l}</small></span>`).join('')}</div><div class="pace"><span><i>♞</i><b>12</b><small>Init</small></span><span><i>↔</i><b>5</b><small>Speed</small></span></div></section>`:`<section class="cluster"><span class="eyebrow">Combat posture</span><div class="shield"><div class="ac"><i>⬟</i><b>25</b><small>AC</small></div><div class="defences">${[['✚',24,'Fort'],['ϟ',23,'Ref'],['✦',20,'Will']].map(([i,v,l])=>`<span class="stat"><i>${i}</i><small>${l}</small><b>${v}</b></span>`).join('')}</div></div><div class="pace"><span><i>♞</i><small>Init</small><b>12</b></span><span><i>↔</i><small>Speed</small><b>5</b></span></div></section>`;function render(){const key=new URLSearchParams(location.search).get('variant');const active=keys.includes(key)?key:'belt';document.getElementById('label').textContent=labels[active];document.getElementById('app').innerHTML=`<div class="hud">${radial()}<section class="deck ${active}"><div class="actions">${actions()}</div>${defence(active)}</section></div>`}function change(n){const p=new URLSearchParams(location.search),index=keys.indexOf(p.get('variant'));p.set('variant',keys[(index+n+keys.length)%keys.length]);history.replaceState(null,'','?'+p);render()}document.getElementById('prev').onclick=()=>change(-1);document.getElementById('next').onclick=()=>change(1);document.addEventListener('keydown',e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName)&&!e.target.isContentEditable){if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1)}});render();
</script></body></html>

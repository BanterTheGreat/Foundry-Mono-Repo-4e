<!-- PROTOTYPE — Three radical Compass compositions, switchable via ?variant=altar|board|dossier. -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radical Compass layouts</title><style>
:root{color-scheme:dark;--line:#9b7352;--gold:#e3ba81;--paper:#f4e4d2;--muted:#b9a08a;--red:#c65462;--blue:#91cfe6;font-family:Signika,"Segoe UI",sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(ellipse at 50% 8%,#39342b,#111316 48%,#08090a);color:var(--paper)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(90deg,transparent 0 49px,#fff 50px),repeating-linear-gradient(0deg,transparent 0 49px,#fff 50px)}main{position:relative;z-index:1;width:min(1080px,calc(100vw - 28px));margin:3.4rem auto 6rem}.intro{max-width:760px;margin:0 auto 1rem;text-align:center;color:#dac5ad;font-size:.85rem;line-height:1.4}.intro b{color:var(--gold)}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:.65rem;margin-bottom:.9rem}.tab{height:42px;border:1px solid var(--line);border-radius:10px;background:#151314ee;color:#bba083;box-shadow:0 4px 12px #0008;font-size:.78rem;font-weight:bold;letter-spacing:.05em;text-transform:uppercase}.tab:first-child{color:var(--gold);background:linear-gradient(#392b20,#191513)}.hud{display:grid;grid-template-columns:270px 1fr;min-height:324px;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#121113fa,#08090afa);box-shadow:0 16px 38px #000b,inset 0 0 0 3px #fff1}.portrait-wrap{position:relative;padding:14px;border-right:1px solid #72513b}.portrait{position:relative;height:294px;overflow:hidden;border:3px solid #735038;border-radius:10px;background:radial-gradient(circle at 45% 18%,#f1e3c4 0 18%,transparent 19%),linear-gradient(140deg,#e5d1ad,#b0a083 43% 43%,#743844 44% 64%,#211719 65%);box-shadow:inset 0 0 0 2px #ffe5bd55}.portrait:before{content:"";position:absolute;width:68px;height:145px;left:calc(50% - 34px);top:44px;border-radius:44% 48% 23% 23%;background:linear-gradient(100deg,#681d2c,#bd4a59 41%,#39121d 42%);transform:skew(-6deg)}.portrait:after{content:"";position:absolute;width:158px;height:100px;left:calc(50% - 75px);bottom:-30px;border-radius:55% 55% 0 0;background:#5a2639;transform:rotate(-5deg)}.identity{position:absolute;right:26px;bottom:25px;left:26px;padding:.7rem .75rem;border-top:1px solid #d5a36b;background:linear-gradient(90deg,#0b0b0ddd,#281b17cc);text-shadow:0 2px 4px #000}.identity h1{margin:0;color:#f4d3aa;font:1.5rem Georgia,serif}.identity p{margin:.3rem 0 0;color:var(--muted);font-style:italic}.work{padding:14px 18px}.label{display:block;color:var(--muted);font-size:.58rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.value{font:700 1.25rem Georgia,serif}.dial{position:relative;width:178px;height:178px}.radial-svg{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);overflow:visible;filter:drop-shadow(0 5px 12px #000a)}.dial-content{position:absolute;inset:67px 34px;z-index:2;display:grid;place-content:center;text-align:center}.dial-content b{color:#ffd177;font:700 1.8rem Georgia,serif}.dial-content small{color:var(--muted);font-size:.58rem}.rule{height:1px;background:#ffffff20}.note{margin:.8rem 0 0;padding:.68rem .8rem;border-left:3px solid var(--gold);background:#161413c8;color:#d8c2aa;font-size:.8rem;line-height:1.35}.note b{color:#f4d5aa}.switcher{position:fixed;z-index:5;bottom:15px;left:50%;display:flex;align-items:center;gap:.3rem;padding:.35rem;border:1px solid var(--gold);border-radius:999px;background:#0c0d0e;box-shadow:0 8px 24px #000c;transform:translateX(-50%)}button{font:inherit;color:inherit;cursor:pointer}.switcher button{width:32px;height:30px;border:0;border-radius:999px;background:transparent;color:var(--gold);font-size:1.15rem}.switcher button:hover{background:#3e2e20}.switcher output{min-width:210px;text-align:center;color:#f4dfc1;font-size:.77rem;font-weight:bold}
/* A — one centred combat shrine; actions form a lower command deck instead of a separate right column. */.altar{display:grid;grid-template-columns:160px 1fr 160px;grid-template-rows:1fr 74px;height:294px;column-gap:13px}.altar .radial-bay{display:grid;place-items:center}.altar .side{display:grid;align-content:center}.altar .readout{display:grid;grid-template-columns:1fr auto;align-items:center;padding:.6rem .35rem;border-bottom:1px solid #ffffff18}.altar .readout:last-child{border-bottom:0}.altar .defence{display:grid;grid-template-columns:repeat(3,1fr);margin-top:.7rem;border-top:1px solid #ffffff18}.altar .defence span{display:grid;place-content:center;text-align:center;padding:.42rem 0;border-left:1px solid #ffffff18}.altar .defence b{font:700 1.08rem Georgia,serif}.altar .commands{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding-top:9px;border-top:1px solid #8e654855}.altar .command{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.45rem;padding:.35rem .55rem;border:1px solid #72513b;border-radius:5px;background:#191514;text-align:left}.altar .command i{color:#d8b37d;font-style:normal;font-size:1.1rem}.altar .command b{font:700 1rem Georgia,serif}.altar .command small{color:var(--muted);font-size:.51rem;font-weight:800;text-transform:uppercase}.altar .command.rest{color:#bca083}
/* B — a command board: status is a vertical stack, actions are a 2×3 tactical pad. */.board{display:grid;grid-template-columns:210px 1fr;height:294px;gap:15px}.board .status{display:grid;grid-template-rows:1fr auto 1fr;border-right:1px solid #ffffff18}.board .resources{display:grid;align-content:center}.board .resource{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:.35rem;padding:.35rem .45rem;border-bottom:1px solid #ffffff14}.board .resource i{color:#d8b37d;font-style:normal}.board .combat-line{display:grid;grid-template-columns:1.25fr repeat(3,1fr) .9fr .9fr;border-top:1px solid #8e654855;border-bottom:1px solid #8e654855}.board .combat-line span{display:grid;grid-template-columns:auto auto;place-content:center;gap:.12rem;border-left:1px solid #ffffff18}.board .combat-line i{color:#d8b37d;font-style:normal}.board .combat-line b{font:700 1rem Georgia,serif}.board .command-space{display:grid;grid-template-columns:190px 1fr;align-items:center;gap:13px}.board .tactical-pad{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:5px}.board .pad{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:.45rem;padding:.45rem .6rem;border:1px solid #72513b;border-radius:5px;background:linear-gradient(135deg,#211917,#121113);text-align:left}.board .pad:hover{border-color:var(--gold)}.board .pad i{color:#d8b37d;font-style:normal;font-size:1rem}.board .pad b{font:700 1.05rem Georgia,serif}.board .pad small{color:var(--muted);font-size:.5rem;font-weight:800;text-transform:uppercase}.board .radial-bay{display:grid;place-items:center}
/* C — action columns frame the radial; information lives in a lower dossier rather than competing with it. */.dossier{display:grid;grid-template-rows:1fr 80px;height:294px}.dossier-top{display:grid;grid-template-columns:1fr 190px 1fr;align-items:center;gap:15px}.action-list{display:grid;gap:3px}.action-list.right{text-align:right}.action-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.5rem;padding:.45rem;border-bottom:1px solid #ffffff18}.action-list.right .action-row{grid-template-columns:auto 1fr auto}.action-row i{color:#d8b37d;font-style:normal}.action-row b{font:700 1.1rem Georgia,serif}.action-row small{color:var(--muted);font-size:.51rem;font-weight:800;text-transform:uppercase}.dossier .radial-bay{display:grid;place-items:center}.dossier-bottom{display:grid;grid-template-columns:1.4fr 1fr 1fr;border-top:1px solid #8e654855;background:#171312aa}.dossier-bottom section{display:grid;align-content:center;padding:.4rem .65rem;border-left:1px solid #ffffff18}.dossier-bottom section:first-child{border-left:0}.dossier .resource-row{display:grid;grid-template-columns:auto 1fr auto;gap:.35rem;align-items:baseline}.dossier .resource-row i{color:#d8b37d;font-style:normal}.dossier .shield-row{display:grid;grid-template-columns:1.3fr repeat(3,1fr);text-align:center}.dossier .shield-row span{display:grid;place-content:center;border-left:1px solid #ffffff14}.dossier .shield-row b{font:700 1.08rem Georgia,serif}.dossier .tempo{display:grid;grid-template-columns:1fr 1fr;gap:6px}.dossier .tempo span{display:grid;grid-template-columns:auto auto;place-content:center;gap:.15rem}.dossier .tempo i{color:#bca083;font-style:normal}.dossier .tempo b{font:700 1.05rem Georgia,serif}
</style></head><body><main><p class="intro"><b>Three radical compositions:</b> the nested plate radial stays untouched, while status, defences, and every combat action are reorganised as one system.</p><nav class="tabs"><button class="tab">⚔ Powers</button><button class="tab">◈ Skills</button><button class="tab">▤ Feats</button><button class="tab">▦ Items</button></nav><section id="app" aria-live="polite"></section></main><nav class="switcher"><button id="prev" aria-label="Previous variant">←</button><output id="label"></output><button id="next" aria-label="Next variant">→</button></nav><script>
const keys=['altar','board','dossier'],labels={altar:'A · Combat altar',board:'B · Command board',dossier:'C · Action dossier'},notes={altar:'<b>Combat altar:</b> the radial is the altar. Persistent state flanks it, while all six actions become one deliberate lower command deck.',board:'<b>Command board:</b> this leans fully tactical: the radial is a status instrument and the six actions become a quick-access pad.',dossier:'<b>Action dossier:</b> the radial remains clean and central, framed by response actions. All passive numbers move to a single quiet bottom dossier.'};const polar=(r,a)=>[100+r*Math.cos(a*Math.PI/180),100+r*Math.sin(a*Math.PI/180)];const point=([x,y])=>`${x.toFixed(2)} ${y.toFixed(2)}`;const wedge=(r,w,a1,a2)=>{const outer=r+w/2,inner=r-w/2;return`M ${point(polar(outer,a1))} A ${outer} ${outer} 0 0 1 ${point(polar(outer,a2))} L ${point(polar(inner,a2))} A ${inner} ${inner} 0 0 0 ${point(polar(inner,a1))} Z`};const ring=(count,active,r,w,on,off,edge)=>{const step=360/count,gap=count===8?2.1:count===12?1.5:1.1,inset=Math.min(2,w*.27);return Array.from({length:count},(_,i)=>{const a=-90+i*step+gap,b=-90+(i+1)*step-gap;return`<path d="${wedge(r,w,a,b)}" fill="${edge}"/><path d="${wedge(r,w-inset*2,a+.45,b-.45)}" fill="${i<active?on:off}"/>`}).join('')};const radial=()=>`<div class="dial"><svg class="radial-svg" viewBox="0 0 200 200">${ring(16,0,96,4,'#4a8da2','#1d4553','#091519')}${ring(8,6,75,28,'#c65462','#472229','#210f13')}${ring(12,11,51,10,'#d9ad52','#49381d','#25180c')}<circle cx="100" cy="100" r="43" fill="#0d0b0c" stroke="#2c1c18" stroke-width="2"/></svg><div class="dial-content"><b>70</b><small>/ 93</small></div></div>`;const portrait=()=>`<section class="portrait-wrap"><div class="portrait"></div><div class="identity"><h1>Idrani Fullhorn</h1><p>Level 10 Fighter</p></div></section>`;const resources=()=>[['⌁','Surges','11 / 12','#f2cf7c'],['◒','Temp HP','0','var(--blue)'],['ϟ','Action Pts','1','var(--paper)']];const stats=()=>[['⬟',25],['✚',24],['ϟ',23],['✦',20],['♞',12],['↔',5]];const actions=()=>[['♥','Heal'],['✦','Second Wind'],['★','Saving Throw'],['☠','Death Save'],['☾','Short Rest'],['🛏','Extended Rest']];const altar=()=>`<div class="altar"><section class="side">${resources().map(([i,l,v,c])=>`<div class="readout"><span class="label">${l}</span><span class="value" style="color:${c}">${v}</span></div>`).join('')}</section><div class="radial-bay">${radial()}</div><section class="side"><span class="label">Defences</span><div class="defence">${stats().slice(0,4).map(([i,v])=>`<span><i>${i}</i><b>${v}</b></span>`).join('')}</div><div class="defence">${stats().slice(4).map(([i,v])=>`<span><i>${i}</i><b>${v}</b></span>`).join('')}</div></section><section class="commands">${[['♥','Heal',''],['✦','Second Wind','Ready'],['★','Save / Death','+2 · +5'],['☾','Short Rest',''],['🛏','Extended Rest',''],['ϟ','Action Point','1']].map(([i,l,v])=>`<button class="command"><i>${i}</i><small>${l}</small><b>${v}</b></button>`).join('')}</section></div>`;const board=()=>`<div class="board"><section class="status"><div class="resources">${resources().map(([i,l,v,c])=>`<div class="resource"><i>${i}</i><span class="label">${l}</span><span class="value" style="color:${c}">${v}</span></div>`).join('')}</div><div class="combat-line">${stats().map(([i,v])=>`<span><i>${i}</i><b>${v}</b></span>`).join('')}</div><span></span></section><section class="command-space"><div class="radial-bay">${radial()}</div><div class="tactical-pad">${actions().map(([i,l],n)=>`<button class="pad"><i>${i}</i><span><small>${l}</small><b>${n===1?'Ready':n===2?'+2':n===3?'+5':''}</b></span></button>`).join('')}</div></section></div>`;const dossier=()=>`<div class="dossier"><div class="dossier-top"><section class="action-list">${actions().slice(0,3).map(([i,l],n)=>`<button class="action-row"><i>${i}</i><small>${l}</small><b>${n===1?'Ready':n===2?'+2':''}</b></button>`).join('')}</section><div class="radial-bay">${radial()}</div><section class="action-list right">${actions().slice(3).map(([i,l],n)=>`<button class="action-row"><i>${i}</i><small>${l}</small><b>${n===0?'+5':''}</b></button>`).join('')}</section></div><section class="dossier-bottom"><section>${resources().map(([i,l,v,c])=>`<div class="resource-row"><i>${i}</i><span class="label">${l}</span><span class="value" style="color:${c}">${v}</span></div>`).join('')}</section><section><span class="label">Defences</span><div class="shield-row">${stats().slice(0,4).map(([i,v])=>`<span><i>${i}</i><b>${v}</b></span>`).join('')}</div></section><section><span class="label">Pace</span><div class="tempo">${stats().slice(4).map(([i,v])=>`<span><i>${i}</i><b>${v}</b></span>`).join('')}</div></section></section></div>`;function view(key){return`<div class="hud">${portrait()}<section class="work">${{altar,board,dossier}[key]()}</section></div><p class="note">${notes[key]}<br><b>State:</b> HP 70 / 93 · Surges 11 / 12 · Temp HP 0 · Action Points 1 · AC 25 · Fort 24 · Ref 23 · Will 20 · Init 12 · Speed 5.</p>`}function current(){const k=new URLSearchParams(location.search).get('variant');return keys.includes(k)?k:'altar'}function render(){const k=current();document.getElementById('app').innerHTML=view(k);document.getElementById('label').textContent=labels[k]}function change(d){const k=keys[(keys.indexOf(current())+d+keys.length)%keys.length],u=new URL(location);u.searchParams.set('variant',k);history.replaceState(null,'',u);render()}document.getElementById('prev').onclick=()=>change(-1);document.getElementById('next').onclick=()=>change(1);document.addEventListener('keydown',e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName)&&!e.target.isContentEditable){if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1)}});render();
</script></body></html>

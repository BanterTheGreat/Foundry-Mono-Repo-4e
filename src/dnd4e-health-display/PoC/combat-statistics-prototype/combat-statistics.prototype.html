<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combat statistics prototype</title>
<!-- THROWAWAY: Which hierarchy makes a GM combat report easiest to read? Three layouts, ?variant=A/B/C. Sample data only; no Foundry access or persistence. -->
<style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#eee4cc);font:12px/1.5 Arial,sans-serif;padding-bottom:76px}button,select{font:inherit;color:inherit;background:#211e18;border:1px solid #655433;border-radius:4px;padding:6px 10px;cursor:pointer}button:hover{border-color:#d5b675}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #e5cc8e;outline-offset:3px}.launch{display:flex;gap:12px;align-items:center;padding:10px 0;color:#b9aa8d}.window{color:#eee4cc;background:#111112;border:1px solid #806b42;border-radius:6px;box-shadow:0 12px 28px #0005;overflow:hidden}.native{padding:8px 14px;border-bottom:1px solid #493c26;background:linear-gradient(110deg,#30291c,#151411);display:flex;justify-content:space-between;align-items:center}.native span{font-size:10px;letter-spacing:.1em;color:#dfc991;text-transform:uppercase}.native button{padding:0 6px;background:transparent;border:0;font-size:20px}.body{padding:16px}h1,h2,h3,p{margin:0}h1{font:24px Georgia,serif}h2{font:18px Georgia,serif;margin-bottom:10px}h3{font:16px Georgia,serif}small,.muted{color:#b9aa8d;font-size:11px}.heading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #493c26;border-radius:4px;background:#1b1915;margin-bottom:16px}.kpi{padding:12px;border-right:1px solid #493c26}.kpi:last-child{border:0}.kpi strong{display:block;font:26px Georgia,serif;color:#e5cc8e}.label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#b9aa8d}.panel{border:1px solid #493c26;background:#191816;border-radius:4px;padding:12px;margin-bottom:14px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:10px;color:#baab8e;margin-bottom:10px}.legend span:before{content:'';display:inline-block;width:8px;height:8px;background:var(--c);margin-right:5px}.chart{width:100%;height:185px;display:block}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}th{font-size:9px;color:#baab8e;text-transform:uppercase;letter-spacing:.04em;text-align:right;padding:9px 7px;border-bottom:1px solid #655433}td{padding:10px 7px;border-bottom:1px solid #363023;text-align:right;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}td b{font-size:12px}td small{display:block;font-size:9px}.team td{background:#292318;color:#dfc991;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.1em;padding:6px 8px}.gold{color:#e5cc8e}.green{color:#b9ddb5}.red{color:#efac9e}.note{font-size:10px;color:#b9aa8d;margin-top:10px}.split{display:grid;grid-template-columns:165px 1fr;gap:14px}.roster{display:grid;align-content:start;gap:6px}.roster button{text-align:left;padding:10px}.roster button.active{border-color:#cfb06d;background:#332b1c}.actor-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.metric{padding:12px;background:#242119;border:1px solid #493c26;border-radius:4px}.metric strong{display:block;font:23px Georgia,serif;color:#e5cc8e}.round{display:grid;grid-template-columns:70px 1fr 120px;gap:12px;align-items:center;padding:14px 0;border-top:1px solid #493c26}.bars{display:grid;gap:5px}.bar{height:15px;background:#292722;position:relative;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;width:var(--w);background:var(--c)}.bar span{position:absolute;inset:0 6px;text-align:right;font-size:10px;text-shadow:0 1px 3px #000;color:#fff}details{border-top:1px solid #493c26;padding-top:10px;color:#b9aa8d;font-size:11px}summary{cursor:pointer;color:#dfc991}details p{margin-top:8px}.switcher{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px;background:#eee4cc;color:#211c13;border:1px solid #806b42;border-radius:6px;box-shadow:0 5px 20px #0006;white-space:nowrap}.switcher button{color:#eee4cc}.state{margin-top:12px}pre{white-space:pre-wrap;font-size:10px;max-height:220px;overflow:auto}@media(max-width:600px){.body{padding:10px}.heading{align-items:start;flex-direction:column}.kpi{padding:8px}.kpi strong{font-size:21px}.split{grid-template-columns:1fr}.roster{grid-template-columns:repeat(3,1fr)}.actor-metrics{grid-template-columns:repeat(2,1fr)}.round{grid-template-columns:48px 1fr}.round>small{grid-column:2}}
</style>
<div class="launch"><button onclick="opened=true;render()">Open combat statistics</button><small>THROWAWAY · sample data · GM view</small></div><div id="app"></div><details class="state"><summary>Inspect prototype state</summary><pre id="state"></pre></details><nav class="switcher" aria-label="Prototype layouts"><button onclick="cycle(-1)" aria-label="Previous layout">←</button><b id="variant"></b><button onclick="cycle(1)" aria-label="Next layout">→</button></nav>
<script>
const actors=[
{name:'Seren Ashford',team:'PC',turns:5,time:74,contemplating:23,hit:8,attempt:12,taken:3,incoming:9,damage:186,estimated:24,d20:12.4,slain:2},
{name:'Bram Ironvale',team:'PC',turns:5,time:58,contemplating:14,hit:6,attempt:9,taken:7,incoming:12,damage:142,estimated:18,d20:10.8,slain:1},
{name:'Liora Venn',team:'PC',turns:5,time:91,contemplating:38,hit:9,attempt:13,taken:2,incoming:6,damage:224,estimated:32,d20:11.6,slain:3},
{name:'Stone Sentinel',team:'Summon',turns:3,time:19,contemplating:4,hit:2,attempt:4,taken:2,incoming:4,damage:28,estimated:0,d20:9.5,slain:0},
{name:'Ash Captain',team:'Enemy',turns:4,time:32,contemplating:8,hit:6,attempt:10,taken:8,incoming:12,damage:113,estimated:13,d20:12.1,slain:0},
{name:'Cinder Guard × 3',team:'Enemy',turns:11,time:24,contemplating:6,hit:5,attempt:14,taken:12,incoming:17,damage:87,estimated:8,d20:9.8,slain:0},
{name:'Ember Hound × 2',team:'Enemy',turns:6,time:21,contemplating:5,hit:3,attempt:7,taken:5,incoming:9,damage:46,estimated:6,d20:10.3,slain:0}];
const rounds=[{r:0,playerDamage:0,enemyDamage:0,hp:100,surge:100,enemy:100,event:'Combat begins'},{r:1,playerDamage:98,enemyDamage:62,hp:88,surge:96,enemy:83,event:'First blood'},{r:2,playerDamage:130,enemyDamage:53,hp:67,surge:88,enemy:62,event:'Two enemies down'},{r:3,playerDamage:118,enemyDamage:31,hp:79,surge:72,enemy:39,event:'Party rallies'},{r:4,playerDamage:144,enemyDamage:68,hp:53,surge:64,enemy:17,event:'Captain falls'},{r:5,playerDamage:90,enemyDamage:32,hp:61,surge:56,enemy:0,event:'Victory'}];
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!['A','B','C'].includes(variant)){variant='A'}let combat='last',selected=0,opened=true,filter='all',settingsOpen=false,bindingOwner='1',bindingScope='actor';
const percent=(a,b)=>b?Math.round(a/b*100)+'%':'—';const shownRounds=()=>combat==='current'?rounds.slice(0,4):rounds;const rawRoster=()=>actors.map(a=>combat==='current'?{...a,turns:Math.max(1,a.turns-2),hit:Math.floor(a.hit*.6),attempt:Math.max(1,Math.floor(a.attempt*.6)),taken:Math.floor(a.taken*.6),incoming:Math.max(1,Math.floor(a.incoming*.6)),damage:Math.floor(a.damage*.6),estimated:Math.floor(a.estimated*.6),slain:Math.floor(a.slain*.5)}:a);
/** Merge the sample friendly companion into its configured owner without averaging averages. */
function roster(){
 const rows=rawRoster().map((a,i)=>({...a,id:i,members:[],turnSeconds:a.turns*a.time,contemplatingSeconds:a.turns*a.contemplating,d20Count:a.attempt+a.incoming,d20Sum:a.d20*(a.attempt+a.incoming)}));
 if(bindingOwner!==''){
  const source=rows[3],owner=rows[Number(bindingOwner)];
  owner.members.push(source.name);
  for(const key of ['turns','hit','attempt','taken','incoming','damage','estimated','slain','turnSeconds','contemplatingSeconds','d20Count','d20Sum']){
   owner[key]+=source[key];
  }
  owner.time=Math.round(owner.turnSeconds/owner.turns);
  owner.contemplating=Math.round(owner.contemplatingSeconds/owner.turns);
  owner.d20=(owner.d20Sum/owner.d20Count).toFixed(1);
  return rows.filter(a=>a.id!==3);
 }
 return rows;
}
function attributionSettings(){return settingsOpen?`<section class="panel" aria-label="Mock module settings"><h2>Module settings · Statistics attribution</h2><p class="muted">Bind friendly tokens or actors to an owner. Their statistics merge into the owner; they have no separate overview row.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0"><label>Source scope<br><select aria-label="Binding scope" onchange="bindingScope=this.value;render()"><option value="actor" ${bindingScope==='actor'?'selected':''}>Actor · all its tokens</option><option value="token" ${bindingScope==='token'?'selected':''}>Token · this scene only</option></select></label><label>Friendly source<br><select aria-label="Friendly source"><option>Stone Sentinel${bindingScope==='token'?' · Ashen Gate token':''}</option></select></label><label>Credit statistics to<br><select aria-label="Statistics owner" onchange="bindingOwner=this.value;selected=0;render()"><option value="" ${bindingOwner===''?'selected':''}>Unbound · own row</option>${actors.slice(0,3).map((a,i)=>`<option value="${i}" ${bindingOwner===String(i)?'selected':''}>${a.name}</option>`).join('')}</select></label></div><small>Changes apply immediately to this sample report. Real module settings will be GM-only world settings. Token bindings override actor bindings; each source has one owner. Self-bindings and cycles are disallowed.</small><p class="note">Includes turns, turn time, contemplation, attacks made/received, damage, d20 rolls and kills. Averages use underlying totals and counts. Resource graphs still exclude summons. Settings here are in memory only.</p></section>`:''}

/** Show each team's per-round damage as lines matching the resource timeline. */
function damageMomentum(){
 const rs=shownRounds();
 const ceiling=Math.max(50,Math.ceil(Math.max(...rs.flatMap(r=>[r.playerDamage,r.enemyDamage]))/50)*50);
 const series=[['Player team','playerDamage','#ccad6b'],['Enemy team','enemyDamage','#8ba7ae']];
 return `<section style="margin-top:14px;border-top:1px solid #493c26;padding-top:12px" aria-label="Damage dealt per round"><h3>Total damage dealt · per round</h3><div class="legend" style="margin-top:8px"><span style="--c:#ccad6b">Player team damage</span><span style="--c:#8ba7ae">Enemy team damage</span></div><svg class="chart" viewBox="0 0 640 185" role="img" aria-label="Line chart of player and enemy total damage dealt each round, aligned with the resource timeline">${[0,.25,.5,.75,1].map(f=>`<line x1="40" x2="610" y1="${145-f*120}" y2="${145-f*120}" stroke="#413a2d"/><text x="5" y="${149-f*120}" fill="#baab8e" font-size="10">${ceiling*f}</text>`).join('')}${series.map(([team,key,color])=>`<polyline points="${rs.map(r=>`${45+r.r*110},${145-r[key]/ceiling*120}`).join(' ')}" fill="none" stroke="${color}" stroke-width="3"/>${rs.map(r=>`<circle cx="${45+r.r*110}" cy="${145-r[key]/ceiling*120}" r="4" fill="${color}"><title>${r.r?'Round '+r.r:'Start'} · ${team}: ${r[key]} damage</title></circle>`).join('')}`).join('')}${rs.map(r=>`<text x="${45+r.r*110}" y="170" text-anchor="middle" fill="#baab8e" font-size="10">${r.r?'R'+r.r:'Start'}${combat==='current'&&r.r===3?'*':''}</text>`).join('')}</svg><small>Damage points dealt during each round, including estimates. Player team includes friendly summons; bindings never double-count.${combat==='current'?' * Round 3 is still in progress.':''}</small></section>`;
}

function chart(){const rs=shownRounds();const line=(key,color,dash='')=>`<polyline points="${rs.map((r,i)=>`${45+i*110},${145-r[key]*1.2}`).join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-dasharray="${dash}"/>`;return `<div class="legend"><span style="--c:#bd6b68">PC health</span><span style="--c:#ccad6b">PC surges</span><span style="--c:#8ba7ae">Enemy health</span></div><svg class="chart" viewBox="0 0 640 185" role="img" aria-label="Team resources by round, percentages from combat start to latest round"><g stroke="#413a2d" stroke-width="1">${[0,25,50,75,100].map(v=>`<line x1="40" x2="610" y1="${145-v*1.2}" y2="${145-v*1.2}"/><text x="5" y="${149-v*1.2}" fill="#baab8e" stroke="none" font-size="10">${v}%</text>`).join('')}</g>${line('hp','#bd6b68')}${line('surge','#ccad6b','5 4')}${line('enemy','#8ba7ae')}${rs.map((r,i)=>`<text x="${45+i*110}" y="170" text-anchor="middle" fill="#baab8e" font-size="10">${r.r?'R'+r.r:'Start'}</text>`).join('')}</svg><small>End-of-round snapshots · PC totals exclude summons · current round is partial.</small>${damageMomentum()}`}
function table(){return `<div class="scroll"><table><thead><tr><th>Actor</th><th>Turns</th><th>Avg turn</th><th>Time contemplating</th><th title="Successful hits / attack attempts">Hits</th><th title="Hits received / incoming attack attempts">Hits taken</th><th>≈ Damage</th><th>Avg d20</th><th>Slain</th></tr></thead><tbody>${roster().filter(a=>filter==='all'||a.team===filter).map((a,i,arr)=>`${i===0||a.team!==arr[i-1].team?`<tr class="team"><td colspan="9">${a.team==='PC'?'Player characters':a.team==='Summon'?'Summons · excluded from resource graphs':'Enemies'}</td></tr>`:''}<tr><td><b>${a.name}</b>${a.members.length?`<small>Includes ${a.members.join(", ")}</small>`:""}</td><td>${a.turns}</td><td>${a.time}s</td><td title="Turn start until first movement, attack roll, or targeting preview"><b>${a.contemplating}s avg</b><small>${a.contemplatingSeconds}s total</small></td><td>${a.hit}/${a.attempt}<small class="green">${percent(a.hit,a.attempt)}</small></td><td>${a.taken}/${a.incoming}<small class="red">${percent(a.taken,a.incoming)}</small></td><td class="gold" title="Includes ${a.estimated} estimated damage attributed to the current turn actor">${a.damage}<small>incl. ≈${a.estimated}</small></td><td>${a.d20}</td><td>${a.slain}</td></tr>`).join('')}</tbody></table></div>`}
function ledger(){return `<section class="panel"><h2>Battle momentum</h2>${chart()}</section><h2>Combatants</h2><div style="margin-bottom:8px"><select aria-label="Filter combatants" onchange="filter=this.value;render()">${['all','PC','Summon','Enemy'].map(v=>`<option value="${v}" ${filter===v?'selected':''}>${v==='all'?'All teams':v}</option>`).join('')}</select></div>${table()}`}
function dossier(){const rows=roster();const a=rows.find(a=>a.id===selected)||rows[0];return `<div class="split"><nav class="roster" aria-label="Choose actor">${rows.map(x=>`<button class="${x.id===a.id?'active':''}" onclick="selected=${x.id};render()">${x.name}<br><small>${x.team}</small></button>`).join('')}</nav><div><h2>${a.name}</h2>${a.members.length?`<p class="muted">Includes ${a.members.join(", ")}</p>`:""}<small>${a.team} · ${a.turns} turns · average ${a.time}s per turn</small><div class="actor-metrics">${[['Hits',`${a.hit} / ${a.attempt}`,percent(a.hit,a.attempt)+' success'],['Hit received',`${a.taken} / ${a.incoming}`,percent(a.taken,a.incoming)+' hit rate'],['≈ Damage',a.damage,`Includes ≈${a.estimated} attributed`],['Average d20',a.d20,'Natural kept results'],['Enemies slain',a.slain,'First transition to 0 HP'],['Time on turn',Math.round(a.turnSeconds/60)+'m','Approx. total turn time'],['Time contemplating',a.contemplating+'s avg',`${a.contemplatingSeconds}s total · before first action`]].map(([l,v,s])=>`<div class="metric"><span class="label">${l}</span><strong>${v}</strong><small>${s}</small></div>`).join('')}</div><section class="panel"><h2>Team resources</h2>${chart()}</section></div></div>`}
function timeline(){return `${damageMomentum()}<h2 style="margin-top:16px">Round chronicle</h2><div class="legend"><span style="--c:#bd6b68">PC health</span><span style="--c:#ccad6b">PC surges</span><span style="--c:#8ba7ae">Enemy health</span></div>${shownRounds().map(r=>`<article class="round"><h3>${r.r?'Round '+r.r:'Start'}</h3><div class="bars">${[['PC HP',r.hp,'#995452'],['Surges',r.surge,'#9f834b'],['Enemy HP',r.enemy,'#577b87']].map(([l,v,c])=>`<div class="bar" style="--w:${v}%;--c:${c}"><i></i><span>${l} ${v}%</span></div>`).join('')}</div><small>${r.event}${combat==='current'&&r.r===3?' · partial':''}</small></article>`).join('')}<details style="margin-top:16px"><summary>Actor statistics · ${roster().length} rows</summary>${table()}</details>`}
function render(){document.getElementById('variant').textContent=variant+' · '+({A:'Combat ledger',B:'Actor dossier',C:'Round chronicle'}[variant]);document.getElementById('app').innerHTML=opened?`<section class="window" role="dialog" aria-label="Combat statistics"><div class="native"><span>Combat statistics · GM only</span><button aria-label="Close statistics" onclick="opened=false;render()">×</button></div><div class="body"><button style="float:right;margin-bottom:10px" onclick="settingsOpen=!settingsOpen;render()">Attribution settings</button><div style="clear:both"></div>${attributionSettings()}<header class="heading"><div><h1>The Ashen Gate</h1><small>${combat==='last'?'Last combat · Victory · 6 enemies defeated':'Current combat · Round 3 · in progress'}</small></div><select aria-label="Combat report" onchange="combat=this.value;render()"><option value="last" ${combat==='last'?'selected':''}>Last combat</option><option value="current" ${combat==='current'?'selected':''}>Current combat</option></select></header><div class="kpis">${[['Combat elapsed',combat==='last'?'42m 18s':'24m 06s'],['Rounds',combat==='last'?'5':'3'],['Party hit rate',percent(roster().filter(a=>a.team==='PC').reduce((n,a)=>n+a.hit,0),roster().filter(a=>a.team==='PC').reduce((n,a)=>n+a.attempt,0))],['Party ≈ damage',roster().filter(a=>a.team==='PC').reduce((n,a)=>n+a.damage,0)]].map(([l,v])=>`<div class="kpi"><span class="label">${l}</span><strong>${v}</strong></div>`).join('')}</div>${variant==='A'?ledger():variant==='B'?dossier():timeline()}<p class="note">Sample data only. This prototype does not collect combat events or enforce GM permissions.</p><details style="margin-top:12px"><summary>How these statistics are counted</summary><p><b>Attacks:</b> one resolved outcome per attacker–target attempt. Chat and targeting automation describe the same attack only once. Unknown results are excluded from hit-rate denominators and should be reported separately.</p><p><b>Active defense:</b> a failed defense means the attacker hit and the defender was hit; a successful defense means a miss. The d20 belongs to whoever rolled it. Average d20 uses kept natural dice, including attack and defense rolls; no modifiers.</p><p><b>Damage:</b> observed HP loss plus absorbed temporary HP when available. Known damage applications use their source. Other HP loss is estimated against the current turn actor; no turn owner means unattributed. Healing is excluded; corrections, ongoing damage and off-turn effects can distort estimates.</p><p><b>Slain:</b> first transition from positive HP to 0 or below, per enemy per combat; damage source determines credit. Uncertain source means estimated credit.</p><p><b>Time:</b> wall-clock time from combat start to end or now; paused time excluded. Turn timing starts at turn activation; skipped turns excluded. Extra turns count separately.</p><p><b>Time contemplating:</b> starts when the turn becomes active and stops at the first movement by that turn’s token, attack roll by that token, or opening of its targeting preview. Only that token’s activity stops the timer; later inactivity does not restart it. Paused time is excluded. If none occurs, count until turn end; show a still-running turn separately and exclude it from the completed-turn average. Total and average are shown per actor. Bound tokens still have their own turn timers before aggregation; a companion acting during its owner’s turn does not stop the owner token’s contemplation timer.</p><p><b>Round damage:</b> total damage dealt during each individual round by each team, not a cumulative total or an average. Shown in damage points on a separate axis aligned to the resource timeline. The current round is partial.</p><p><b>Resources:</b> sum current ÷ sum maximum, never average actor percentages. PCs only for party HP/surges; summons excluded. Enemy roster fixed at entry, defeated enemies stay at zero; reinforcements add their maximum on entry. Snapshots at combat start and each round end.</p><p><b>Grouped enemies:</b> prototype rows combine creatures of the same kind; production should allow individual actor rows and optional grouping.</p></details></div></section>`:'<p class="muted">Dialog closed. Use Open combat statistics to reopen.</p>';document.getElementById('state').textContent=JSON.stringify({prototype:true,source:'sample data; no recording',variant,combat,selectedActor:actors[selected].name,filter,opened,settingsOpen,binding:{source:'Stone Sentinel',scope:bindingScope,owner:bindingOwner===''?null:actors[Number(bindingOwner)].name},actors:roster(),rounds:shownRounds()},null,2)}
function cycle(step){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+step+3)%3];const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState({},'',url);render()}
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')){return}if(e.key==='ArrowLeft'){cycle(-1)}if(e.key==='ArrowRight'){cycle(1)}});render();
</script></html>

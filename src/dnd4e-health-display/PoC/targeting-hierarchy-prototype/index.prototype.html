<!doctype html><html><head><meta charset="utf-8"><title>Targeting hierarchy prototype</title><style>
:root{font-family:var(--font-sans,Arial,sans-serif);color:var(--foreground,#eee4cc)}*{box-sizing:border-box}body{margin:0;padding-bottom:80px}button,select{font:inherit}button{cursor:pointer}.dialog{background:#101010;color:#eee4cc;border:1px solid #907741;border-radius:12px;overflow:hidden}.title{background:#211e16;padding:14px 18px;border-bottom:1px solid #75603c;font-size:19px;font-weight:bold;display:flex;justify-content:space-between}.content{padding:18px}.heading{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #655433;padding-bottom:14px;margin-bottom:14px}h1{font: bold 30px Georgia,serif;margin:0}.details, .remove{color:#dfc68a;background:#10100c;border:1px solid #655433;border-radius:6px;padding:7px 12px}.origin{display:flex;align-items:center;gap:16px;margin-bottom:14px}.origin select{flex:1;min-width:0;background:#302934;color:#e6d1af;padding:14px;border:0;border-radius:7px}.rules{background:#242118;border-left:3px solid #aa8b4e;padding:15px;margin:14px 0 18px}.rules strong{display:block;text-transform:uppercase;font-size:16px;letter-spacing:.02em;color:#cebb94;margin-bottom:10px}.rules p{margin:0;font-size:18px}.rules b{color:#e1c383}.range{color:#baab8e;font-size:15px}.range b{color:#eee4cc}.hint{font-size:14px;color:#baab8e;line-height:1.5;margin:9px 0 13px}.status{font-size:18px;font-weight:bold;margin:16px 0}.countrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.countrow .range{white-space:nowrap}.table{border:1px solid #75603c;border-radius:8px;overflow:hidden}.columns{display:grid;grid-template-columns:1.7fr 1fr 1fr;background:#231f16;color:#baab8e;padding:13px;font-size:13px}.target{padding:24px 14px;display:flex;align-items:center;gap:12px;background:#191711}.portrait{width:38px;height:38px;display:grid;place-items:center;border:2px solid #aa8b4e;border-radius:50%;background:#38454a;font:20px Georgia}.target b{flex:1}.checks{margin:15px 0;color:#baab8e;font-size:14px}.attack{width:100%;background:linear-gradient(#51442b,#2b251a);color:#e5cb8e;border:1px solid #a78c4f;border-radius:6px;padding:11px;font-size:18px;font-weight:bold}.footer{border-top:1px solid #655433;padding-top:13px}.toolbar{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #493c26;margin-bottom:12px}.toolbar .range{padding-right:14px;border-right:1px solid #655433}.toolbar span:last-child{font-size:14px;color:#baab8e}.switcher{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:var(--popover,#252934);color:var(--foreground,#eee);border:1px solid var(--border,#666);padding:10px;border-radius:30px;box-shadow:0 4px 20px #0008;white-space:nowrap;font-size:13px}.switcher button{background:var(--secondary,#444);color:inherit;border:0;border-radius:20px;padding:6px 11px}.note{font-size:13px;color:var(--muted-foreground,#aaa);margin:10px 0 0}
</style></head><body><!-- THROWAWAY: Three targeting hierarchy variants. Preserve Before the Attack; compare range placement via ?variant=A/B/C. Mock data only. --><div id="app"></div><p class="note" id="note"></p><nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><span id="label"></span><button id="next" aria-label="Next variant">→</button></nav><script>
const names=['A · Range beneath Origin','B · Range beside target count','C · Targeting toolbar'];
const notes=['Range stays with the origin. Instructions introduce the target list.','Range becomes part of the target summary. Instructions remain beside the list.','Range and instructions share a lightweight toolbar above the target summary.'];
let current=Math.max(0,['A','B','C'].indexOf(new URLSearchParams(location.search).get('variant')));
function render(){document.getElementById('app').innerHTML='<article class="dialog"><header class="title"><span>Dire Radiance · Select Targets</span><span aria-hidden="true">⋮　×</span></header><main class="content"><div class="heading"><h1>Dire Radiance</h1><button class="details">▤ Details</button></div><label class="origin">Origin<select><option>Ozyn Valder</option></select></label>'+(current===0?'<div class="range">Range · <b>10 squares</b></div>':'')+'<section class="rules"><strong>Before the Attack</strong><p><b>Attack:</b> One creature; Charisma vs. Fortitude</p></section>'+(current===2?'<div class="toolbar"><span class="range">Range <b>10 squares</b></span><span>Use normal targeting controls to select or remove targets.</span></div>':'')+'<div class="countrow"><div class="status">1 / up to 2 targets · Ready</div>'+(current===1?'<span class="range">Range · <b>10 squares</b></span>':'')+'</div>'+(current!==2?'<p class="hint">Use normal targeting controls to select or remove targets.</p>':'')+'<section class="table"><div class="columns"><span>TARGET</span><span>ATTACK</span><span>DAMAGE</span></div><div class="target"><span class="portrait">H</span><b>Hana "Gale" Soliogn</b><button class="remove" aria-label="Remove target">×</button></div></section><div class="checks">▸ Manual checks · cover, elevation and special rules</div><footer class="footer"><button class="attack">◇ Attack…</button></footer></main></article>';document.getElementById('label').textContent=names[current];document.getElementById('note').textContent='Throwaway prototype · '+notes[current];}
function cycle(delta){current=(current+delta+3)%3;try{const url=new URL(location.href);url.searchParams.set('variant',['A','B','C'][current]);history.replaceState({},'',url);}catch{}render();}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});render();
</script></body></html>

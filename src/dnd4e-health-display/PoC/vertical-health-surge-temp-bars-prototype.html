<!doctype html>
<!--
  THROWAWAY UI PROTOTYPE — not Foundry production code.
  Question: Can Health, Healing Surges, and Temporary HP become a flavourful,
  faster-to-scan vertical stack instead of the radial gauge?
  Three variants switch via ?variant=reliquary|banners|codex. Open this file
  directly in a browser. All state is illustrative and stays in memory.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vertical combat resource bars — prototype</title>
  <style>
    :root { color-scheme: dark; --ink:#09090a; --panel:#121112; --raised:#1c1717; --line:#815d42; --gold:#e1b976; --paper:#f0debf; --muted:#ad957b; --red:#bd4c55; --red-dark:#3b171c; --blue:#62b6d4; --blue-dark:#163845; --amber:#d6aa52; --amber-dark:#4f3819; font-family:Signika, "Segoe UI", sans-serif; }
    * { box-sizing:border-box; } body { min-height:100vh; margin:0; background:radial-gradient(ellipse at 50% 0,#3a322a 0,#161618 48%,#08090a 100%); color:var(--paper); }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.12; background:repeating-linear-gradient(90deg,transparent 0 47px,#fff 48px),repeating-linear-gradient(0deg,transparent 0 47px,#fff 48px); }
    button { font:inherit; color:inherit; cursor:pointer; } .stage { position:relative; z-index:1; width:min(900px,calc(100vw - 28px)); margin:3.2rem auto 6rem; } .intro { max-width:700px; margin:0 auto 1rem; color:#dac5ad; text-align:center; font-size:.86rem; line-height:1.4; } .intro b { color:var(--gold); }
    .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:.45rem; margin-bottom:.65rem; } .tab { height:37px; border:1px solid var(--line); border-radius:7px 7px 3px 3px; background:linear-gradient(#211b19,#121112); color:#bca183; font-size:.68rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; } .tab:first-child { color:var(--gold); background:linear-gradient(#3a2b20,#171313); }
    .hud { position:relative; min-height:344px; overflow:hidden; border:1px solid var(--line); border-radius:10px; background:linear-gradient(125deg,#151214ee,#090a0bee); box-shadow:0 18px 42px #000b, inset 0 0 0 3px #fff1; } .hud::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(110deg,#fff1,transparent 18%,transparent 80%,#0006); }
    .portrait-wrap { position:relative; padding:14px; border-right:1px solid #72513b; } .portrait { position:relative; height:315px; overflow:hidden; border:3px solid #79543a; border-radius:8px; background:radial-gradient(circle at 47% 24%,#dfcfb1 0 18%,transparent 19%),linear-gradient(145deg,#c4baa4,#7b6e62 42%,#713640 43% 66%,#211719 67%); box-shadow:inset 0 0 0 2px #ffe5bd55; } .portrait::before { content:""; position:absolute; width:76px; height:170px; top:38px; left:calc(50% - 38px); border-radius:44% 48% 23% 23%; background:linear-gradient(100deg,#5b1726,#b84456 44%,#321017 45%); transform:skew(-7deg); } .portrait::after { content:""; position:absolute; width:180px; height:108px; bottom:-31px; left:calc(50% - 86px); border-radius:55% 55% 0 0; background:#512335; transform:rotate(-6deg); } .identity { position:absolute; z-index:2; right:25px; bottom:25px; left:25px; padding:.62rem .7rem; border-top:1px solid #d5a36b; background:linear-gradient(90deg,#0b0b0ddd,#281b17cc); text-shadow:0 2px 4px #000; } .identity h1 { margin:0; color:#f4d3aa; font:1.25rem Georgia,serif; } .identity p { margin:.22rem 0 0; color:var(--muted); font-size:.72rem; font-style:italic; }
    .label { color:var(--muted); font-size:.57rem; font-weight:900; letter-spacing:.09em; text-transform:uppercase; } .value { font:700 1.35rem Georgia,serif; } .resource { position:relative; min-width:0; } .resource-head { display:flex; align-items:baseline; justify-content:space-between; gap:.5rem; margin-bottom:.35rem; } .resource-head .value { white-space:nowrap; }
    /* Variant A: three iron-bound reliquary vials, adjacent like a physical loadout. */
    .reliquary { display:grid; grid-template-columns:245px 1fr; } .reliquary .right { display:grid; grid-template-columns:repeat(3,minmax(78px,1fr)) 1fr; align-items:center; gap:15px; padding:23px 22px; } .vial { display:grid; grid-template-rows:auto 230px auto; align-items:end; gap:.35rem; text-align:center; } .vial .resource-head { display:grid; justify-items:center; margin:0; } .vial .bar-frame { position:relative; width:55px; height:230px; margin:auto; padding:5px; border:2px solid #98724c; border-radius:9px 9px 18px 18px; background:#0b0b0c; box-shadow:inset 0 0 0 2px #281c16,0 5px 14px #000a; } .vial .bar-frame::before { content:""; position:absolute; z-index:3; top:-10px; left:7px; width:37px; height:14px; border:2px solid #98724c; border-bottom:0; border-radius:6px 6px 0 0; background:#231812; } .vial .fill { position:absolute; right:7px; bottom:7px; left:7px; height:var(--amount); border-radius:4px 4px 12px 12px; background:linear-gradient(90deg,#822d38,var(--colour),#69232b); box-shadow:inset 0 2px #fff3,0 0 12px var(--glow); } .vial .ticks { position:absolute; z-index:2; inset:7px; background:repeating-linear-gradient(0deg,transparent 0 calc(8.333% - 2px),#08090acc calc(8.333% - 1px) 8.333%); pointer-events:none; } .vial.temp .fill { background:linear-gradient(90deg,#24677d,var(--blue),#164858); } .vial.surges .fill { background:linear-gradient(90deg,#806128,var(--amber),#74551f); } .vial .caption { min-height:32px; color:#cdb492; font-size:.64rem; line-height:1.15; } .reliquary .battle-note { align-self:stretch; display:grid; align-content:center; gap:.65rem; padding-left:18px; border-left:1px solid #ffffff1c; } .battle-note strong { color:var(--gold); font:1.75rem Georgia,serif; } .battle-note p { margin:0; color:#c7b096; font-size:.76rem; line-height:1.4; }
    /* Variant B: three hanging battle standards; labels are the identity, bars are long battlefield signals. */
    .banners { display:grid; grid-template-columns:245px 1fr; } .banners .right { display:grid; grid-template-columns:1fr 116px; gap:22px; padding:23px; } .standards { display:grid; align-content:center; gap:13px; } .standard { display:grid; grid-template-columns:76px 1fr 70px; align-items:center; min-height:72px; gap:12px; } .standard-crest { position:relative; display:grid; place-items:center; width:66px; height:58px; border:1px solid #9e7650; clip-path:polygon(50% 0,96% 18%,86% 84%,50% 100%,14% 84%,4% 18%); background:linear-gradient(135deg,#563139,#1e1316); color:#f2c873; font-size:1.3rem; text-shadow:0 1px 4px #000; } .standard.temp .standard-crest { background:linear-gradient(135deg,#234c5b,#101d22); color:#8ed5e9; } .standard.surges .standard-crest { background:linear-gradient(135deg,#5c4822,#1e1710); color:#f0cf81; } .standard .resource-head { display:block; margin:0; } .standard .resource-head .value { display:block; margin-top:.14rem; } .banner-track { position:relative; height:18px; overflow:hidden; border:1px solid #5e4332; border-radius:2px; background:#090909; box-shadow:inset 0 1px 5px #000; } .banner-fill { height:100%; width:var(--amount); background:linear-gradient(90deg,#742831,var(--colour),#8a3039); box-shadow:0 0 12px var(--glow); } .standard.temp .banner-fill { background:linear-gradient(90deg,#205667,var(--blue),#367e94); } .standard.surges .banner-fill { background:linear-gradient(90deg,#71521d,var(--amber),#91702b); } .notches { position:absolute; inset:0; background:repeating-linear-gradient(90deg,transparent 0 calc(8.333% - 2px),#090909cc calc(8.333% - 1px) 8.333%); } .standard .flavour { color:#b69b7c; font-size:.63rem; line-height:1.25; text-align:right; } .banners .ritual { display:grid; align-content:center; justify-items:center; gap:.5rem; border-left:1px solid #ffffff1b; text-align:center; } .ritual .seal { display:grid; place-items:center; width:78px; height:78px; border:2px solid #a47b4f; border-radius:50%; box-shadow:inset 0 0 0 7px #241914,inset 0 0 0 9px #6e4b30; color:var(--gold); font:1.65rem Georgia,serif; } .ritual p { margin:0; color:var(--muted); font-size:.62rem; line-height:1.3; }
    /* Variant C: a grimoire's illuminated margin; resource bars become a single vertical reading column. */
    .codex { display:grid; grid-template-columns:245px 1fr; } .codex .right { display:grid; grid-template-columns:122px 1fr; gap:20px; padding:21px 24px; background:linear-gradient(90deg,transparent,#21191455); } .margin { position:relative; display:grid; grid-template-columns:repeat(3,1fr); align-items:end; gap:8px; padding:12px 12px 18px; border:1px solid #7d5e43; background:linear-gradient(135deg,#2c2119,#161111); box-shadow:inset 0 0 0 2px #0009; } .margin::before { content:"Vital Ledger"; position:absolute; top:10px; left:0; width:100%; color:#c7a778; font:700 .52rem Georgia,serif; letter-spacing:.13em; text-align:center; text-transform:uppercase; } .script-bar { position:relative; height:239px; border:1px solid #5c4434; background:#08090a; } .script-fill { position:absolute; right:3px; bottom:3px; left:3px; height:var(--amount); background:linear-gradient(90deg,#7b2d36,var(--colour),#66242b); box-shadow:0 0 9px var(--glow); } .script-bar.temp .script-fill { background:linear-gradient(90deg,#235a6c,var(--blue),#2c7086); } .script-bar.surges .script-fill { background:linear-gradient(90deg,#765720,var(--amber),#826126); } .script-bar::after { content:""; position:absolute; inset:3px; background:repeating-linear-gradient(0deg,transparent 0 calc(8.333% - 1px),#08090aaa calc(8.333% - .5px) 8.333%); } .script-mark { position:absolute; right:0; bottom:calc(var(--amount) - 6px); left:0; z-index:2; color:var(--paper); font:700 .55rem Georgia,serif; text-align:center; text-shadow:0 1px 2px #000; } .codex-copy { display:grid; align-content:center; gap:0; } .codex-row { display:grid; grid-template-columns:1fr auto; align-items:center; min-height:74px; padding:.55rem 0; border-bottom:1px solid #ffffff1c; } .codex-row:last-child { border:0; } .codex-row h2 { margin:0; color:#e8c184; font:1.05rem Georgia,serif; } .codex-row p { margin:.2rem 0 0; color:#af9476; font-size:.69rem; font-style:italic; } .codex-row .value { color:var(--colour); }
    /* New vertical studies: fantasy artefacts first, meters second. */
    .dragonbone,.brazier,.sword { display:grid; grid-template-columns:245px 1fr; } .dragonbone .right,.brazier .right,.sword .right { position:relative; display:grid; place-items:center; min-height:344px; padding:18px; }
    .dragonbone .right { grid-template-columns:1fr 134px 1fr; gap:22px; } .bone-copy { display:grid; align-content:center; gap:.8rem; } .bone-copy h2 { margin:0; color:#e7c083; font:1.2rem Georgia,serif; } .bone-copy p { margin:0; color:#b89d7c; font-size:.7rem; font-style:italic; line-height:1.45; } .bone-copy .value { color:var(--colour); } .spine { position:relative; display:grid; grid-template-rows:55px 1fr 62px; width:94px; height:294px; padding:8px 22px; border:2px solid #87674e; border-radius:46% 46% 35% 35%; background:linear-gradient(90deg,#2b211b,#0a0a0a 47%,#33251d); box-shadow:inset 0 0 0 3px #060606,0 8px 20px #000b; } .spine::before { content:"☠"; position:absolute; z-index:3; top:-27px; left:12px; color:#dbc89d; font-size:4rem; line-height:1; filter:drop-shadow(0 3px 3px #000); } .spine::after { content:""; position:absolute; z-index:2; top:48px; bottom:50px; left:35px; width:20px; border-radius:12px; background:repeating-linear-gradient(0deg,#5d422d 0 14px,#251a14 15px 22px); box-shadow:0 0 0 2px #120e0c; } .spine-piece { position:relative; z-index:4; align-self:end; height:var(--amount); min-height:9px; border:1px solid #0b0807; border-radius:8px; background:linear-gradient(90deg,#822c34,var(--colour),#6d252d); box-shadow:0 0 12px var(--colour); } .spine-piece.temp { align-self:start; background:linear-gradient(90deg,#20566a,var(--blue),#246176); } .spine-piece.surges { background:repeating-linear-gradient(0deg,#806022 0 8px,#dbb45b 9px 14px); } .bone-runes { display:grid; align-content:center; gap:.45rem; color:#d6b26d; font:1.25rem Georgia,serif; text-align:center; }
    .brazier .right { grid-template-columns:170px 150px 170px; gap:22px; } .brazier-copy { display:grid; align-content:center; gap:.7rem; } .brazier-copy h2 { margin:0; color:#efcb87; font:1.25rem Georgia,serif; } .brazier-copy p { margin:0; color:#b89d7c; font-size:.7rem; font-style:italic; line-height:1.45; } .crucible { position:relative; width:104px; height:294px; padding:10px; border:3px solid #9b7047; border-radius:16px 16px 28px 28px; background:linear-gradient(90deg,#38251b,#080809 45%,#38251b); box-shadow:inset 0 0 0 3px #160f0d,0 8px 22px #000c; } .crucible::before { content:"✦"; position:absolute; z-index:4; top:-31px; left:22px; color:#f5d58a; font-size:3.5rem; text-shadow:0 0 13px #c48435; } .crucible::after { content:""; position:absolute; z-index:4; right:-11px; bottom:-16px; left:-11px; height:21px; border:3px solid #9b7047; border-radius:50%; background:#241713; } .crucible-stack { position:relative; display:grid; grid-template-rows:48px 1fr 65px; height:100%; overflow:hidden; border:1px solid #67472f; border-radius:8px 8px 18px 18px; background:#09090a; } .essence { position:relative; overflow:hidden; border-bottom:2px solid #100c0a; } .essence:last-child { border:0; } .essence i { position:absolute; right:0; bottom:0; left:0; height:var(--amount); background:linear-gradient(90deg,#7c2932,var(--colour),#702630); box-shadow:0 0 16px var(--colour); } .essence.temp i { background:linear-gradient(90deg,#22596a,var(--blue),#2c7187); } .essence.surges i { background:repeating-linear-gradient(0deg,#72521b 0 7px,#ddb45b 8px 13px); } .essence b { position:absolute; z-index:2; left:0; width:100%; color:#f6dfbb; font:700 .63rem Georgia,serif; text-align:center; text-shadow:0 1px 3px #000; } .brazier-key { display:grid; align-content:center; gap:.9rem; } .brazier-key div { display:grid; grid-template-columns:12px 1fr auto; align-items:center; gap:.45rem; color:#c9ae8c; font-size:.68rem; } .brazier-key i { height:30px; border:1px solid #7f6144; background:var(--colour); box-shadow:0 0 8px var(--colour); }
    .sword .right { grid-template-columns:170px 145px 170px; gap:24px; } .sword-copy { display:grid; align-content:center; gap:.65rem; } .sword-copy h2 { margin:0; color:#e9c480; font:1.2rem Georgia,serif; } .sword-copy p { margin:0; color:#b89d7c; font-size:.7rem; font-style:italic; line-height:1.45; } .blade { position:relative; width:82px; height:300px; padding:10px 18px 48px; clip-path:polygon(50% 0,100% 16%,78% 86%,62% 100%,38% 100%,22% 86%,0 16%); background:linear-gradient(90deg,#866341,#e1c783 46%,#795a3c 54%,#2b211b); filter:drop-shadow(0 8px 13px #000b); } .blade::before { content:""; position:absolute; inset:5px 7px 43px; clip-path:polygon(50% 0,100% 15%,74% 100%,26% 100%,0 15%); background:#0a0b0d; } .blade::after { content:"✣"; position:absolute; z-index:3; bottom:17px; left:24px; color:#e6bb6d; font-size:1.9rem; text-shadow:0 0 8px #b67835; } .blade-gauge { position:relative; z-index:2; display:grid; grid-template-rows:34px 1fr 52px; height:238px; overflow:hidden; border-radius:0 0 8px 8px; } .blade-gauge div { position:relative; overflow:hidden; border-bottom:1px solid #050505; } .blade-gauge div:last-child { border:0; } .blade-gauge i { position:absolute; right:0; bottom:0; left:0; height:var(--amount); background:linear-gradient(90deg,#792630,var(--colour),#792630); box-shadow:0 0 14px var(--colour); } .blade-gauge .temp i { background:linear-gradient(90deg,#21576a,var(--blue),#286b80); } .blade-gauge .surges i { background:repeating-linear-gradient(0deg,#73531d 0 7px,#dbb25a 8px 13px); } .blade-gauge b { position:absolute; z-index:2; left:0; width:100%; color:#f4dfbd; font:700 .58rem Georgia,serif; text-align:center; text-shadow:0 1px 3px #000; } .sword-runes { display:grid; align-content:center; gap:.6rem; color:#d0af76; font:1.1rem Georgia,serif; text-align:center; } .sword-runes span { padding:.35rem; border-bottom:1px solid #ffffff1a; }
    /* Every integrated artefact reads top-to-bottom: ward, life, then resolve. */
    .spine-piece:first-child,.essence:first-child,.blade-gauge div:first-child { grid-row:2; } .spine-piece:nth-child(2),.essence:nth-child(2),.blade-gauge div:nth-child(2) { grid-row:3; } .spine-piece:nth-child(3),.essence:nth-child(3),.blade-gauge div:nth-child(3) { grid-row:1; }
    .note { position:relative; z-index:1; margin-top:.8rem; padding:.68rem .8rem; border-left:3px solid var(--gold); background:#161413c8; color:#d8c2aa; font-size:.8rem; line-height:1.38; } .note b { color:#f4d5aa; } .controls { display:flex; justify-content:center; flex-wrap:wrap; gap:.4rem; margin-top:.75rem; } .controls button { padding:.38rem .58rem; border:1px solid #805d43; border-radius:5px; background:#1b1715; color:#ddc49f; font-size:.7rem; font-weight:bold; } .controls button:hover { border-color:var(--gold); background:#302319; } .state { margin-top:.45rem; color:#bba084; text-align:center; font-size:.68rem; } .switcher { position:fixed; z-index:5; bottom:15px; left:50%; display:flex; align-items:center; gap:.3rem; padding:.35rem; border:1px solid var(--gold); border-radius:999px; background:#0c0d0e; box-shadow:0 8px 24px #000c; transform:translateX(-50%); } .switcher button { width:32px; height:30px; border:0; border-radius:999px; background:transparent; color:var(--gold); font-size:1.15rem; } .switcher button:hover { background:#3e2e20; } .switcher output { min-width:190px; color:#f4dfc1; text-align:center; font-size:.77rem; font-weight:bold; }
    @media (max-width:700px) { .stage { margin-top:1rem; } .reliquary,.banners,.codex { grid-template-columns:1fr; } .portrait-wrap { border-right:0; border-bottom:1px solid #72513b; } .portrait { height:220px; } .reliquary .right { grid-template-columns:repeat(3,1fr); } .reliquary .battle-note { display:none; } .banners .right { grid-template-columns:1fr; } .ritual { display:none !important; } .codex .right { grid-template-columns:100px 1fr; padding:15px; } }
  </style>
</head>
<body>
  <main class="stage">
    <p class="intro"><b>Vertical resource study:</b> three deliberately different ways to make HP, surges, and temporary HP feel like physical fantasy-game objects rather than a dashboard dial.</p>
    <nav class="tabs" aria-label="HUD tabs"><button class="tab">⚔ Powers</button><button class="tab">◈ Skills</button><button class="tab">▣ Feats</button><button class="tab">◫ Items</button></nav>
    <section id="app" aria-live="polite"></section>
    <div class="controls"><button data-action="damage">Take 5 damage</button><button data-action="heal">Heal 5 HP</button><button data-action="surge">Spend surge</button><button data-action="temp">Gain 5 temp HP</button></div>
    <output class="state" id="state"></output>
  </main>
  <nav class="switcher" aria-label="Prototype variations"><button id="prev" aria-label="Previous variation">←</button><output id="variant-label"></output><button id="next" aria-label="Next variation">→</button></nav>
  <script>
    const state = { hp:58, maxHp:71, surges:7, maxSurges:8, temp:1 };
    const variants = ['reliquary','codex','dragonbone','brazier','sword'];
    const labels = { reliquary:'A · Bloodglass reliquary', codex:'B · Vital codex', dragonbone:'C · Dragonbone spine', brazier:'D · Soul crucible', sword:'E · Oathblade' };
    const notes = { reliquary:'<b>Bloodglass reliquary:</b> three individual enchanted vessels. The clearest direct replacement for the radial dial, with a vivid tabletop-object silhouette.', codex:'<b>Vital codex:</b> an illuminated manuscript margin. The bar is compact and vertical, while the wording beside it makes the state unambiguous.', dragonbone:'<b>Dragonbone spine:</b> health becomes the living marrow of a trophy; temp HP is an icy ward near the skull, while surges are golden vertebrae at the base.', brazier:'<b>Soul crucible:</b> all three resources occupy one single vertical vessel: blue ward at the lip, crimson life-force in the heart, and segmented gold resolve below.', sword:'<b>Oathblade:</b> a single vertical weapon gauge. Frosted temp HP occupies the blade tip, HP fills its length, and surge runes charge the hilt.' };
    const portrait = () => `<section class="portrait-wrap"><div class="portrait"></div><div class="identity"><h1>Ozyn Valder</h1><p>Level 10 Warlord</p></div></section>`;
    const pct = (value,max) => `${Math.max(0,Math.min(100,value/max*100))}%`;
    const resource = (key,label,value,max,colour,kind='') => ({ key,label,value,max,colour,kind, amount:pct(value,max) });
    const values = () => [resource('hp','Hit Points',state.hp,state.maxHp,'#c95b64',''),resource('surges','Healing Surges',state.surges,state.maxSurges,'#dfb35d','surges'),resource('temp','Temporary HP',state.temp,Math.max(10,state.temp),'#64bddc','temp')];
    function reliquary() { return `<div class="hud reliquary">${portrait()}<section class="right">${values().map(r => `<article class="vial ${r.kind}"><div class="resource-head"><span class="label">${r.label}</span><span class="value" style="color:${r.colour}">${r.value}${r.key === 'hp' ? ` / ${r.max}` : r.key === 'surges' ? ` / ${r.max}` : ''}</span></div><div class="bar-frame"><div class="fill" style="--amount:${r.amount};--colour:${r.colour};--glow:${r.colour}66"></div><div class="ticks"></div></div><span class="caption">${r.key === 'hp' ? 'Bloodied at 35' : r.key === 'surges' ? 'A reserve of resolve' : 'A fading ward'}</span></article>`).join('')}<aside class="battle-note"><span class="label">Battle condition</span><strong>${state.hp > 35 ? 'Unbloodied' : 'Bloodied'}</strong><p>The vertical forms make the least stable resources naturally draw the eye: crimson health first, then the blue ward on top of it.</p></aside></section></div>`; }
    function banners() { return `<div class="hud banners">${portrait()}<section class="right"><div class="standards">${values().map((r,i) => `<article class="standard ${r.kind}"><div class="standard-crest">${['♥','✦','✧'][i]}</div><div><div class="resource-head"><span class="label">${r.label}</span><span class="value" style="color:${r.colour}">${r.value}${r.key !== 'temp' ? ` / ${r.max}` : ''}</span></div><div class="banner-track"><div class="banner-fill" style="--amount:${r.amount};--colour:${r.colour};--glow:${r.colour}88"></div><div class="notches"></div></div></div><span class="flavour">${r.key === 'hp' ? 'Hold the line' : r.key === 'surges' ? 'Seven prayers remain' : 'One point guarded'}</span></article>`).join('')}</div><aside class="ritual"><div class="seal">${state.hp > 35 ? '✠' : '!'}</div><p>Warrior<br>standing</p></aside></section></div>`; }
    function codex() { return `<div class="hud codex">${portrait()}<section class="right"><aside class="margin">${values().map(r => `<div class="script-bar ${r.kind}" style="--amount:${r.amount}"><div class="script-fill" style="--amount:${r.amount};--colour:${r.colour};--glow:${r.colour}77"></div><span class="script-mark">${r.value}</span></div>`).join('')}</aside><section class="codex-copy">${values().map(r => `<article class="codex-row"><div><h2>${r.label}</h2><p>${r.key === 'hp' ? 'Life-force, measured against the bloodied line.' : r.key === 'surges' ? 'The reserve that turns wounds aside.' : 'A transient magical ward.'}</p></div><strong class="value" style="--colour:${r.colour}">${r.value}${r.key !== 'temp' ? ` / ${r.max}` : ''}</strong></article>`).join('')}</section></section></div>`; }
    function dragonbone() { return `<div class="hud dragonbone">${portrait()}<section class="right"><div class="bone-copy"><span class="label">Trophy of the fallen wyrm</span><h2>Marrow of the warlord</h2><p>The spine itself is the meter: a cold ward crowns it, living blood fills the channel, and spent resolve hardens into amber vertebrae.</p></div><div class="spine">${values().map(r => `<div class="spine-piece ${r.kind}" style="--amount:${r.amount};--colour:${r.colour}" title="${r.label}: ${r.value}${r.key !== 'temp' ? ` / ${r.max}` : ''}"></div>`).join('')}</div><div class="bone-runes"><span>ᚺ</span><span>ᚱ</span><span>ᛟ</span><span>ᛚ</span><span>ᛞ</span></div></section></div>`; }
    function brazier() { return `<div class="hud brazier">${portrait()}<section class="right"><div class="brazier-copy"><span class="label">Bound within a bronze vessel</span><h2>Soul crucible</h2><p>One stacked vertical bar, deliberately ordered by urgency: temporary protection burns off first, life burns next, and remaining resolve glows under the ash.</p></div><div class="crucible"><div class="crucible-stack">${values().map(r => `<div class="essence ${r.kind}"><i style="--amount:${r.amount};--colour:${r.colour}"></i><b>${r.value}${r.key !== 'temp' ? ` / ${r.max}` : ''}</b></div>`).join('')}</div></div><div class="brazier-key">${values().map(r => `<div><i style="--colour:${r.colour}"></i><span>${r.label}</span><b>${r.value}</b></div>`).join('')}</div></section></div>`; }
    function sword() { return `<div class="hud sword">${portrait()}<section class="right"><div class="sword-copy"><span class="label">A blade sworn to its bearer</span><h2>Oathblade</h2><p>All vitality is carried in one upright weapon. It is graphic and ceremonial, but still preserves a simple vertical reading order.</p></div><div class="blade"><div class="blade-gauge">${values().map(r => `<div class="${r.kind}"><i style="--amount:${r.amount};--colour:${r.colour}"></i><b>${r.value}</b></div>`).join('')}</div></div><div class="sword-runes"><span>Temp ward</span><span>Heart's blood</span><span>Oaths remaining</span></div></section></div>`; }
    const views = { reliquary,codex,dragonbone,brazier,sword };
    function current() { const value = new URLSearchParams(location.search).get('variant'); return variants.includes(value) ? value : 'reliquary'; }
    function render() { const key=current(); document.getElementById('app').innerHTML=`${views[key]()}<p class="note">${notes[key]}</p>`; document.getElementById('variant-label').textContent=labels[key]; document.getElementById('state').textContent=`Illustrative state: ${state.hp}/${state.maxHp} HP · ${state.surges}/${state.maxSurges} surges · ${state.temp} temporary HP`; }
    function change(delta) { const key=variants[(variants.indexOf(current())+delta+variants.length)%variants.length]; const url=new URL(location); url.searchParams.set('variant',key); history.replaceState(null,'',url); render(); }
    document.getElementById('prev').onclick=()=>change(-1); document.getElementById('next').onclick=()=>change(1);
    document.querySelector('.controls').onclick=(event)=>{ const action=event.target.dataset.action; if (!action) return; if (action==='damage') { state.hp=Math.max(0,state.hp-5); state.temp=0; } if (action==='heal') state.hp=Math.min(state.maxHp,state.hp+5); if (action==='surge') state.surges=Math.max(0,state.surges-1); if (action==='temp') state.temp=Math.min(15,state.temp+5); render(); };
    document.addEventListener('keydown',event=>{ if (!/INPUT|TEXTAREA/.test(event.target.tagName) && !event.target.isContentEditable) { if (event.key==='ArrowLeft') change(-1); if (event.key==='ArrowRight') change(1); } });
    render();
  </script>
</body>
</html>

<!doctype html>
<!-- THROWAWAY PROTOTYPE: Three ways to spend Plinth's open space while the radial remains fixed. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plinth open-space prototype</title><style>
:root{color-scheme:dark;--ink:#0b0b0d;--line:#8f674b;--gold:#e3ba81;--paper:#f4e4d2;--muted:#b9a08a;--red:#d55b69;--blue:#91cfe6;font-family:Signika,"Segoe UI",sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(ellipse at 50% 8%,#39342b,#111316 48%,#08090a);color:var(--paper)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.1;background:repeating-linear-gradient(90deg,transparent 0 49px,#fff 50px),repeating-linear-gradient(0deg,transparent 0 49px,#fff 50px)}main{position:relative;z-index:1;width:min(880px,calc(100vw - 28px));margin:3rem auto 7rem}.intro{margin:0 0 1rem;text-align:center;color:#dac5ad;font-size:.84rem;line-height:1.4}.intro b{color:var(--gold)}.hud{display:grid;grid-template-columns:270px 280px 1fr;min-height:294px;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,#121113fa,#08090afa);box-shadow:0 16px 38px #000b,inset 0 0 0 3px #fff1}.portrait{position:relative;margin:14px;border:3px solid #735038;border-radius:9px;background:linear-gradient(140deg,#e5d1ad,#b0a083 43%,#743844 44% 64%,#211719 65%);overflow:hidden}.portrait:before{content:"";position:absolute;width:68px;height:145px;left:calc(50% - 34px);top:44px;border-radius:44% 48% 23% 23%;background:linear-gradient(100deg,#681d2c,#bd4a59 41%,#39121d 42%);transform:skew(-6deg)}.identity{position:absolute;right:13px;bottom:13px;left:13px;padding:.6rem .65rem;border-top:1px solid #d5a36b;background:#120f10d9}.identity b{display:block;color:#f4d3aa;font:1.25rem Georgia,serif}.identity small{color:var(--muted);font-style:italic}.radial-cell{position:relative}.dial{position:absolute;inset:7px 0;width:280px;height:280px}.ring{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);filter:drop-shadow(0 5px 12px #000a)}.core{position:absolute;inset:81px 39px;display:grid;place-content:center;gap:.05rem;text-align:center}.core .surges{color:#f2cf7c;font-size:.88rem;font-weight:800}.core b{color:var(--red);font:700 2.3rem Georgia,serif;line-height:.9}.core small{color:var(--muted);font-size:.61rem}.core .temp{color:var(--blue);font-size:.88rem;font-weight:800}.space{min-width:0;padding:14px 12px 14px 0}.action{border:1px solid #805d45;border-radius:5px;background:linear-gradient(135deg,#211917,#121113);color:var(--paper);cursor:pointer}.action:hover{border-color:var(--gold);background:#2b211a}.action i{color:#d8b37d;font-style:normal}.action strong{display:block;color:#f1d8b4;font:700 .76rem Georgia,serif}.action small,.eyebrow{display:block;color:var(--muted);font-size:.45rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.tempo{color:#ead5b6}.tempo b{color:#f0d5a6;font:700 1.35rem Georgia,serif}.tempo small{color:#c4a77e;font-size:.44rem;font-weight:900;letter-spacing:.08em}.switcher{position:fixed;z-index:5;bottom:15px;left:50%;display:flex;align-items:center;gap:.3rem;padding:.35rem;border:1px solid var(--gold);border-radius:999px;background:#0c0d0e;box-shadow:0 8px 24px #000c;transform:translateX(-50%)}button{font:inherit}.switcher button{width:32px;height:30px;border:0;border-radius:999px;background:transparent;color:var(--gold);font-size:1.15rem;cursor:pointer}.switcher button:hover{background:#3e2e20}.switcher output{min-width:210px;text-align:center;color:#f4dfc1;font-size:.77rem;font-weight:bold}
/* A: command banner — the open area becomes a calm, high-readability operations strip. */
.banner{display:grid;grid-template-rows:auto 1fr auto;gap:12px}.banner .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.banner .action{display:grid;place-content:center;gap:3px;height:55px;text-align:center}.banner .action i{font-size:1.1rem}.banner .cue{display:grid;place-content:center;text-align:center;border-top:1px solid #ffffff18;border-bottom:1px solid #ffffff18;color:#d5bea1;font-size:.72rem;line-height:1.4}.banner .cue b{color:#e3ba81}.banner .tempo{display:grid;grid-template-columns:1fr 1fr;gap:8px}.banner .tempo span{display:grid;grid-template-columns:auto auto;place-content:center;gap:6px;height:45px;border:1px solid #806048;border-radius:5px;background:#171318}.banner .tempo i{color:#d8b37d;font-style:normal}
/* B: action spine — four tools become a tactile vertical control strip; tempo is a large lower instrument. */
.spine{display:grid;grid-template-columns:66px 1fr;grid-template-rows:1fr auto;gap:10px}.spine .actions{display:grid;grid-template-rows:repeat(4,1fr);gap:5px;grid-row:1/3}.spine .action{display:grid;place-content:center;gap:2px;text-align:center}.spine .action i{font-size:1.06rem}.spine .monogram{display:grid;place-content:center;text-align:center;border:1px solid #806048;border-radius:6px;background:radial-gradient(circle,#302127,#151113 68%)}.spine .monogram b{color:#d6b77f;font:700 1.45rem Georgia,serif}.spine .tempo{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #806048;border-radius:6px;overflow:hidden}.spine .tempo span{display:grid;grid-template-columns:auto auto;place-content:center;gap:7px;min-height:66px;background:#171318}.spine .tempo span+span{border-left:1px solid #806048}.spine .tempo i{color:#d8b37d;font-style:normal;font-size:1.2rem}
/* C: tactical dock — actions become four labelled waypoints around a single central tempo compass. */
.dock{position:relative;display:grid;place-items:center}.dock .actions{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:0}.dock .action{display:grid;align-content:start;justify-items:start;gap:3px;padding:9px;border:0;border-radius:0;background:transparent;text-align:left}.dock .action:nth-child(2),.dock .action:nth-child(4){align-content:start;justify-items:end;text-align:right}.dock .action:nth-child(3),.dock .action:nth-child(4){align-content:end}.dock .action:hover{background:#2b211a55}.dock .action i{font-size:1.1rem}.dock .tempo{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;width:142px;height:142px;border:2px solid #1d4553;border-radius:50%;background:radial-gradient(circle,#241b20 0 47%,#121113 49%);box-shadow:inset 0 0 0 6px #d9ad5233}.dock .tempo:before,.dock .tempo:after{content:"";position:absolute;background:#d9ad5255}.dock .tempo:before{top:10px;bottom:10px;left:50%;width:1px}.dock .tempo:after{right:10px;left:10px;top:50%;height:1px}.dock .tempo span{position:relative;z-index:1;display:grid;place-content:center;text-align:center}.dock .tempo i{color:#d8b37d;font-style:normal}.dock .tempo span:first-child{border-right:1px solid #d9ad5244}.dock .tempo b{font-size:1.45rem}
@media(max-width:760px){main{margin-top:1rem}.hud{grid-template-columns:1fr}.portrait{height:230px}.radial-cell{height:294px}.space{height:294px;padding:12px}.dock{height:270px}}
</style></head><body><main><p class="intro"><b>Three open-space layouts:</b> the nested radial is fixed; all other right-side structure is deliberately up for debate.</p><section id="app" aria-live="polite"></section></main><nav class="switcher"><button id="prev" aria-label="Previous variant">←</button><output id="label"></output><button id="next" aria-label="Next variant">→</button></nav><script>
const keys=['banner','spine','dock'],labels={banner:'A · Command banner',spine:'B · Action spine',dock:'C · Tactical dock'};const ring=()=>`<svg class="ring" viewBox="0 0 200 200" aria-label="70 of 93 hit points; 11 of 12 healing surges; zero temporary hit points"><g stroke="#120d0e" stroke-width="4">${Array.from({length:8},(_,n)=>`<path fill="${n<6?'#d55b69':'#4d252b'}" d="M100 100 L${100+85*Math.cos((-90+n*45-18)*Math.PI/180)} ${100+85*Math.sin((-90+n*45-18)*Math.PI/180)} A85 85 0 0 1 ${100+85*Math.cos((-90+n*45+18)*Math.PI/180)} ${100+85*Math.sin((-90+n*45+18)*Math.PI/180)}Z"/>`).join('')}</g><circle cx="100" cy="100" r="55" fill="none" stroke="#21170d" stroke-width="14"/><circle cx="100" cy="100" r="55" fill="none" stroke="#d9ad52" stroke-width="9" stroke-dasharray="25 4"/><circle cx="100" cy="100" r="43" fill="#0d0b0c" stroke="#2c1c18" stroke-width="2"/><circle cx="100" cy="100" r="96" fill="none" stroke="#1d4553" stroke-width="4" stroke-dasharray="19 5"/></svg>`;const radial=()=>`<div class="radial-cell"><div class="dial">${ring()}<div class="core"><span class="surges">11 / 12</span><b>70</b><small>/ 93</small><span class="temp">◒ 0</span></div></div></div>`;const portrait=()=>`<div class="portrait"><div class="identity"><b>Idrani Fullhorn</b><small>Level 10 Fighter</small></div></div>`;const actions=()=>[['ϟ','AP'],['♥','Heals'],['★','Saves'],['☾','Rests']].map(([i,l])=>`<button class="action" title="${l}"><i>${i}</i><strong>${l}</strong></button>`).join('');const tempo=()=>`<div class="tempo"><span><i>♞</i><b>12</b><small>Init</small></span><span><i>↔</i><b>5</b><small>Speed</small></span></div>`;const view={banner:()=>`<section class="space banner"><div class="actions">${actions()}</div><div class="cue"><span class="eyebrow">Combat rhythm</span><b>Ready to act</b><span>Current resources live in the radial; this space is only for immediate choices.</span></div>${tempo()}</section>`,spine:()=>`<section class="space spine"><div class="actions">${actions()}</div><div class="monogram"><span class="eyebrow">Turn</span><b>10</b><small>Fighter</small></div>${tempo()}</section>`,dock:()=>`<section class="space dock"><div class="actions">${actions()}</div>${tempo()}</section>`};function current(){const value=new URLSearchParams(location.search).get('variant');return keys.includes(value)?value:'banner'}function render(){const key=current();document.getElementById('label').textContent=labels[key];document.getElementById('app').innerHTML=`<section class="hud">${portrait()}${radial()}${view[key]()}</section>`}function change(n){const index=keys.indexOf(current()),url=new URL(location);url.searchParams.set('variant',keys[(index+n+keys.length)%keys.length]);history.replaceState(null,'',url);render()}document.getElementById('prev').onclick=()=>change(-1);document.getElementById('next').onclick=()=>change(1);document.addEventListener('keydown',event=>{if(!/INPUT|TEXTAREA/.test(event.target.tagName)&&!event.target.isContentEditable){if(event.key==='ArrowLeft')change(-1);if(event.key==='ArrowRight')change(1)}});render();
</script></body></html>

<!doctype html>
<!--
  THROWAWAY UI PROTOTYPE — not Foundry production code.
  Question: How should the horizontal HUD arrange the character's combat
  information? Three variants, switchable with ?variant=rail|command|ledger.
  Open this file directly in a browser. State is illustrative and in-memory.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizontal HUD — information-layout prototype</title>
<style>
  :root { color-scheme:dark; --ink:#0b0b0d; --surface:#171313; --raised:#231d1a; --line:#987352; --gold:#d3ad75; --paper:#f3e5d5; --muted:#b6a18c; --red:#d85c68; --red-dark:#4b2024; --blue:#81c6df; --green:#82bd87; font-family:Signika,"Segoe UI",sans-serif; }
  * { box-sizing:border-box; } body { min-height:100vh; margin:0; color:var(--paper); background:radial-gradient(ellipse at 55% 15%,#31302a 0,#151619 38%,#08090a 100%); }
  body::before { content:""; position:fixed; inset:0; opacity:.18; pointer-events:none; background:repeating-linear-gradient(90deg,transparent 0 48px,#fff 49px 50px),repeating-linear-gradient(0deg,transparent 0 48px,#fff 49px 50px); }
  button { font:inherit; color:inherit; cursor:pointer; } .frame { position:relative; z-index:1; width:min(1068px,calc(100vw - 28px)); margin:4.5rem auto 6rem; }
  .why { max-width:780px; margin:0 auto 1rem; color:#dac8b2; text-align:center; font-size:.86rem; line-height:1.35; } .why b { color:var(--gold); }
  .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:.7rem; margin-bottom:1rem; } .tab { min-height:42px; border:1px solid var(--line); border-radius:11px; background:#161515e8; box-shadow:0 4px 12px #0008; color:#bba185; font-weight:700; letter-spacing:.04em; text-transform:uppercase; } .tab:first-child { color:var(--gold); background:linear-gradient(#34271d,#1c1714); }
  .hud { position:relative; border:1px solid var(--line); border-radius:14px; background:linear-gradient(135deg,#111113f5,#08090af5); box-shadow:0 16px 38px #000b,inset 0 0 0 3px #ffffff08; overflow:hidden; } .hud::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(110deg,#fff1 0 1px,transparent 1px 45%,#0003); }
  .portrait { position:relative; overflow:hidden; min-height:166px; border:3px solid #442f23; border-radius:10px; background:radial-gradient(circle at 45% 22%,#e7d8bb 0 16%,transparent 17%),linear-gradient(150deg,#d8c39f,#998873 46%,#4b2929 47% 62%,#1b1719 63%); box-shadow:inset 0 0 0 2px #f6dfbc55; } .portrait::before { content:""; position:absolute; width:46px; height:90px; left:calc(50% - 23px); top:33px; border-radius:45% 45% 25% 25%; background:linear-gradient(100deg,#611e2d,#b14a55 40%,#35131e 41%); transform:skew(-7deg); } .portrait::after { content:""; position:absolute; width:110px; height:70px; left:calc(50% - 52px); bottom:-22px; border-radius:55% 55% 0 0; background:#572536; transform:rotate(-6deg); }
  .identity h1 { margin:0; color:#f3d4ad; font-family:Georgia,serif; font-size:clamp(1.65rem,4vw,2.75rem); line-height:1; } .identity p { margin:.35rem 0 0; color:var(--muted); font-style:italic; } .label { display:block; color:var(--muted); font-size:.67rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase; } .value { color:var(--paper); font-family:Georgia,serif; font-size:1.45rem; font-weight:bold; }
  .stat { min-width:0; border:1px solid #87684f; border-radius:8px; background:#201a18; } .stat .label { margin-bottom:.22rem; } .def { display:grid; place-items:center; min-width:48px; padding:.32rem; text-align:center; } .def .value { font-size:1.2rem; } .def .label { font-size:.55rem; }
  .hp-number { color:#ffd273; font-family:Georgia,serif; font-size:2.7rem; font-weight:bold; line-height:.9; } .hp-number small { color:#bca28c; font:700 .75rem Signika,sans-serif; } .hp-bar { height:11px; overflow:hidden; border:1px solid #000; border-radius:999px; background:#351719; box-shadow:inset 0 1px 3px #000; } .hp-bar i { display:block; width:75.3%; height:100%; background:linear-gradient(90deg,#a63241,#e36b75); box-shadow:0 0 8px #e65b65; }
  .meter { display:flex; gap:2px; height:9px; margin-top:.5rem; } .meter i { flex:1; border:1px solid #0008; background:#2a211c; } .meter i.on { background:linear-gradient(#edcf83,#a87832); }
  .actions { display:flex; gap:.45rem; } .action { position:relative; width:43px; height:43px; border:1px solid var(--line); border-radius:9px; background:#151415; font-size:1.25rem; box-shadow:0 3px 10px #0008; } .action:first-child::after { content:"1"; position:absolute; right:-5px; bottom:-5px; padding:0 4px; border-radius:999px; background:#b3803a; color:#19130c; font:bold .7rem sans-serif; }
  /* A: glance-first vitals rail. HP is the one dominant read, everything else is peripheral. */
  .rail { display:grid; grid-template-columns:165px minmax(220px,1fr) 235px; gap:14px; padding:15px; align-items:stretch; } .rail .identity { display:flex; flex-direction:column; gap:.7rem; } .rail .identity h1 { font-size:1.6rem; } .rail .hp-zone { display:grid; grid-template-rows:auto 1fr auto; gap:.75rem; padding:.7rem .9rem; border-left:1px solid #6d503b; border-right:1px solid #6d503b; } .rail .hp-read { display:flex; align-items:end; justify-content:space-between; gap:1rem; } .rail .hp-read .label { color:#e4a6a7; } .rail .defenses { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; } .rail .recovery { display:grid; gap:8px; } .rail .recovery .stat { display:grid; grid-template-columns:1fr auto; align-items:center; padding:.7rem .8rem; } .rail .actions { align-self:end; justify-content:flex-end; }
  /* B: combat-command centre. Each info block answers a table-time question. */
  .command { display:grid; grid-template-columns:190px minmax(300px,1fr) 185px; } .command .identity { padding:15px; background:linear-gradient(135deg,#211a19,#111113); } .command .portrait { min-height:115px; margin-bottom:.8rem; } .command .identity h1 { font-size:1.5rem; } .command .now { display:grid; grid-template-rows:auto 1fr auto; padding:16px 20px; border-left:1px solid #6d503b; border-right:1px solid #6d503b; } .command .now-head { display:flex; align-items:center; justify-content:space-between; gap:1rem; } .command .now h2 { margin:0; color:var(--gold); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; } .command .current { display:flex; align-items:center; gap:1rem; } .command .shield { display:grid; place-items:center; width:73px; height:73px; flex:0 0 auto; border:2px solid #a46747; border-radius:48% 48% 42% 42%; background:#351b1d; color:#f0c16f; font:bold 1.25rem Georgia,serif; } .command .current .hp-number { font-size:3.15rem; } .command .quick { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; } .command .quick .stat { padding:.45rem .55rem; } .command .quick .value { font-size:1.18rem; } .command .reference { padding:14px 10px; background:#151314; } .command .reference h2 { margin:0 0 .55rem; color:var(--muted); font-size:.65rem; letter-spacing:.08em; text-transform:uppercase; } .command .defenses { display:grid; grid-template-columns:repeat(2,1fr); gap:5px; } .command .actions { margin-top:11px; justify-content:center; }
  /* C: ledger. Information is organized as a readable, editable character sheet strip. */
  .ledger { display:grid; grid-template-columns:155px minmax(260px,1fr) 310px; gap:13px; padding:14px; } .ledger .identity { display:grid; grid-template-rows:125px auto; gap:.6rem; } .ledger .portrait { min-height:125px; } .ledger .identity h1 { font-size:1.25rem; } .ledger .vitals { border-left:1px solid #6d503b; padding-left:13px; } .ledger .vital-row { display:grid; grid-template-columns:115px 1fr 90px; gap:10px; align-items:center; min-height:40px; padding:.35rem 0; border-bottom:1px solid #ffffff16; } .ledger .vital-row:last-child { border-bottom:0; } .ledger .vital-name { color:var(--muted); font-size:.71rem; font-weight:bold; letter-spacing:.05em; text-transform:uppercase; } .ledger .vital-row .value { text-align:right; font-size:1.25rem; } .ledger .hp-inline { display:grid; grid-template-columns:64px 1fr; align-items:center; gap:.6rem; } .ledger .hp-inline .hp-number { font-size:1.75rem; } .ledger .combat-sheet { padding-left:13px; border-left:1px solid #6d503b; } .ledger .combat-sheet h2 { margin:0 0 .5rem; color:var(--muted); font-size:.65rem; letter-spacing:.08em; text-transform:uppercase; } .ledger .defenses { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; } .ledger .actions { margin-top:10px; justify-content:space-between; } .ledger .action { width:51px; }
  .insight { position:relative; z-index:1; margin-top:.85rem; padding:.7rem .85rem; border-left:3px solid var(--gold); background:#171514bb; color:#d4c0aa; font-size:.82rem; line-height:1.35; } .insight b { color:#f1d3a4; }
  .switcher { position:fixed; z-index:4; left:50%; bottom:16px; display:flex; align-items:center; gap:.35rem; padding:.4rem; border:1px solid #d3ad75; border-radius:999px; background:#0e0e10; box-shadow:0 8px 24px #000c; transform:translateX(-50%); } .switcher button { min-width:33px; height:31px; border:0; border-radius:999px; background:transparent; color:var(--gold); font-size:1.15rem; } .switcher button:hover { background:#3b2c20; } .switcher output { min-width:190px; color:#f3dfc4; text-align:center; font-size:.78rem; font-weight:bold; }
  @media (max-width:760px) { .frame { margin-top:1.2rem; } .rail,.command,.ledger { grid-template-columns:1fr; } .rail .hp-zone,.command .now,.ledger .vitals,.ledger .combat-sheet { border:0; border-top:1px solid #6d503b; padding:13px 0 0; } .command .identity { display:grid; grid-template-columns:110px 1fr; gap:12px; } .command .portrait { margin:0; } .ledger .identity { grid-template-columns:105px 1fr; grid-template-rows:1fr; } .ledger .portrait { min-height:105px; } .tabs { gap:.3rem; } .tab { font-size:.68rem; } }
</style>
</head>
<body>
<main class="frame">
  <p class="why"><b>Prototype question:</b> where should a player’s eyes go during combat? The tab strip and four common actions stay constant; only the information architecture below changes.</p>
  <nav class="tabs" aria-label="Actor display sections"><button class="tab">⚔ Powers</button><button class="tab">◈ Skills</button><button class="tab">▤ Feats</button><button class="tab">▦ Items</button></nav>
  <section id="app" aria-live="polite"></section>
</main>
<nav class="switcher" aria-label="Prototype variant switcher"><button id="previous" aria-label="Previous variation">←</button><output id="variant-label"></output><button id="next" aria-label="Next variation">→</button></nav>
<script>
  const variants = ['rail', 'command', 'ledger'];
  const descriptions = { rail:'A · Vitals rail', command:'B · Combat command', ledger:'C · Character ledger' };
  const notes = {
    rail:'<b>Best for:</b> players who want a single fast health read. HP owns the center; defenses and recovery are supporting information.',
    command:'<b>Best for:</b> active turns. It separates “what is happening to me now?” from “what numbers will I need when the GM asks?”',
    ledger:'<b>Best for:</b> players who prefer a compact character-sheet scan. Labels and values form predictable rows, with little icon decoding.'
  };
  const defenses = [['⬟','AC',25],['✚','Fort',24],['ϟ','Ref',23],['✦','Will',20],['♞','Init',12],['↔','Speed',5]];
  const defenseHTML = () => `<div class="defenses">${defenses.map(([icon,label,value]) => `<div class="stat def"><span class="value">${icon} ${value}</span><span class="label">${label}</span></div>`).join('')}</div>`;
  const meter = () => `<div class="meter">${Array.from({length:12},(_,i)=>`<i class="${i<11?'on':''}"></i>`).join('')}</div>`;
  const actions = () => `<div class="actions" aria-label="Quick actions"><button class="action" title="Spend action point">ϟ</button><button class="action" title="Saving throw">★</button><button class="action" title="Healing">＋</button><button class="action" title="Rest">▰</button></div>`;
  function rail() { return `<div class="hud rail"><section class="identity"><div class="portrait" aria-label="Idrani Fullhorn portrait"></div><div><h1>Idrani Fullhorn</h1><p>Level 10 Fighter</p></div></section><section class="hp-zone"><div class="hp-read"><div><span class="label">Hit points</span><span class="hp-number">70 <small>of 93</small></span></div>${actions()}</div><div><div class="hp-bar"><i></i></div><span class="label" style="margin-top:.45rem">75% remaining · bloodied at 46</span></div>${defenseHTML()}</section><aside class="recovery"><div class="stat"><span><span class="label">Temporary HP</span><span class="value" style="color:var(--blue)">0</span></span><span>🛡</span></div><div class="stat"><span><span class="label">Healing surges</span><span class="value">11 <small style="color:var(--muted)">/ 12</small></span></span><span>♥</span></div>${meter()}</aside></div><p class="insight">${notes.rail}</p>`; }
  function command() { return `<div class="hud command"><section class="identity"><div class="portrait" aria-label="Idrani Fullhorn portrait"></div><div><h1>Idrani Fullhorn</h1><p>Level 10 Fighter</p></div></section><section class="now"><div class="now-head"><h2>Current condition</h2><span class="label" style="color:var(--green)">● Conscious</span></div><div class="current"><div class="shield">HP</div><div style="flex:1"><span class="hp-number">70 <small>of 93</small></span><div class="hp-bar" style="margin-top:.45rem"><i></i></div><span class="label" style="margin-top:.45rem">23 before bloodied</span></div></div><div class="quick"><div class="stat"><span class="label">Temp HP</span><span class="value" style="color:var(--blue)">0</span></div><div class="stat"><span class="label">Surges</span><span class="value">11/12</span></div><div class="stat"><span class="label">Action pts</span><span class="value">1</span></div></div></section><aside class="reference"><h2>Roll reference</h2>${defenseHTML()}${actions()}</aside></div><p class="insight">${notes.command}</p>`; }
  function ledger() { return `<div class="hud ledger"><section class="identity"><div class="portrait" aria-label="Idrani Fullhorn portrait"></div><div><h1>Idrani Fullhorn</h1><p>Level 10 Fighter</p></div></section><section class="vitals"><div class="vital-row"><span class="vital-name">Hit points</span><span class="hp-inline"><span class="hp-number">70</span><span class="hp-bar"><i></i></span></span><span class="value">/ 93</span></div><div class="vital-row"><span class="vital-name">Temporary HP</span><span class="label">Absorbs damage first</span><span class="value" style="color:var(--blue)">0</span></div><div class="vital-row"><span class="vital-name">Healing surges</span><span>${meter()}</span><span class="value">11 / 12</span></div><div class="vital-row"><span class="vital-name">Action points</span><span class="label">Spend for extra action</span><span class="value">1</span></div></section><aside class="combat-sheet"><h2>Combat numbers</h2>${defenseHTML()}${actions()}</aside></div><p class="insight">${notes.ledger}</p>`; }
  const renders = {rail,command,ledger};
  function current() { const value = new URLSearchParams(location.search).get('variant'); return variants.includes(value) ? value : 'rail'; }
  function render() { const key=current(); document.getElementById('app').innerHTML=renders[key](); document.getElementById('variant-label').textContent=descriptions[key]; }
  function go(offset) { const key=variants[(variants.indexOf(current())+offset+variants.length)%variants.length]; const url=new URL(location); url.searchParams.set('variant',key); history.replaceState(null,'',url); render(); }
  document.getElementById('previous').onclick=()=>go(-1); document.getElementById('next').onclick=()=>go(1);
  document.addEventListener('keydown', event => { if (!/INPUT|TEXTAREA/.test(event.target.tagName) && !event.target.isContentEditable) { if(event.key==='ArrowLeft') go(-1); if(event.key==='ArrowRight') go(1); } }); render();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combat Start — UI Prototype</title>
  <!-- Three Combat Start variants, switchable via ?variant=A|B|C. Throwaway prototype. -->
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap");

    :root {
      color-scheme: dark;
      --ink: #090a0c;
      --panel: #111319;
      --panel-2: #191b21;
      --line: #55452e;
      --line-bright: #a88043;
      --gold: #d4aa62;
      --parchment: #eadfc9;
      --muted: #999286;
      --danger: #b73f38;
      --danger-hot: #ed594d;
      --player: #6998b8;
      --ready: #78a878;
      --display: "Cinzel", Georgia, serif;
      --body: "Inter", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--parchment);
      font-family: var(--body);
      background:
        radial-gradient(circle at 50% -20%, rgba(139, 39, 28, .32), transparent 42%),
        radial-gradient(circle at 50% 120%, rgba(150, 105, 48, .14), transparent 40%),
        #08090b;
      overflow-x: hidden;
    }
    button { font: inherit; }
    button:focus-visible { outline: 2px solid #f2d08b; outline-offset: 3px; }
    .prototype-note {
      position: fixed; top: 12px; right: 14px; z-index: 50;
      color: #777; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    }
    #app { min-height: 100vh; padding: 24px 24px 100px; display: grid; place-items: center; }
    .screen { width: min(1180px, 100%); animation: arrive .55s cubic-bezier(.2,.8,.2,1); }
    @keyframes arrive { from { opacity: 0; transform: translateY(10px) scale(.99); } }
    @keyframes pulse { 50% { box-shadow: 0 0 30px rgba(205, 64, 50, .38); } }
    @keyframes flash { 45% { color: white; transform: scale(1.14); } }
    .display { font-family: var(--display); }
    .eyebrow { color: var(--gold); font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .initiative { min-width: 34px; text-align: center; color: #f2cf81; font-family: var(--display); font-size: 18px; font-weight: 800; }
    .initiative.rolling { animation: flash .18s ease 3; }
    .die-button {
      border: 1px solid #62563f; border-radius: 5px; background: #222129; color: #d9c8a7;
      cursor: pointer; font-size: 12px; padding: 7px 9px; transition: .16s ease;
    }
    .die-button:hover { border-color: var(--gold); color: white; transform: translateY(-1px); }
    .start-button {
      border: 1px solid #e06b58; border-radius: 5px; padding: 14px 30px; cursor: pointer;
      background: linear-gradient(#a93e32, #70221e); color: #fff5e4; box-shadow: inset 0 1px #e17868, 0 7px 25px #000a;
      font-family: var(--display); font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
      transition: .18s ease;
    }
    .start-button:hover { filter: brightness(1.18); transform: translateY(-2px); }
    .start-button:disabled { cursor: not-allowed; filter: grayscale(.8); opacity: .55; transform: none; }
    .all-button {
      padding: 10px 15px; border: 1px solid #75603d; border-radius: 5px; cursor: pointer;
      color: #eed8ad; background: linear-gradient(#30291f, #1c1916); font-weight: 700;
    }
    .all-button:hover { border-color: #c49852; filter: brightness(1.2); }

    /* A — The Face-Off */
    .faceoff { border: 1px solid #4e3c2b; background: linear-gradient(145deg, #111216f5, #0b0c0ff8); box-shadow: 0 30px 80px #000c; }
    .faceoff-header { padding: 24px 28px 20px; text-align: center; border-bottom: 1px solid #4a3928; background: linear-gradient(90deg, transparent, #5b201d35, transparent); }
    .faceoff-header h1 { margin: 3px 0 5px; font-size: clamp(30px, 5vw, 54px); line-height: 1; letter-spacing: .03em; text-shadow: 0 3px 20px #a5272666; }
    .faceoff-header p { margin: 0; font-size: 13px; color: #aaa095; }
    .faceoff-body { display: grid; grid-template-columns: 1fr 92px 1fr; padding: 20px 24px 16px; gap: 18px; }
    .roster-title { display: flex; align-items: end; justify-content: space-between; margin-bottom: 11px; }
    .roster-title h2 { margin: 0; font-size: 17px; letter-spacing: .08em; }
    .roster-title span { color: #817a70; font-size: 11px; text-transform: uppercase; }
    .combatant-list { display: grid; gap: 7px; }
    .combatant {
      display: grid; grid-template-columns: 42px 1fr auto auto; align-items: center; gap: 11px;
      min-height: 56px; padding: 7px 9px; border: 1px solid #333138; border-radius: 5px;
      background: linear-gradient(90deg, #1a1b20, #121318); position: relative;
    }
    .combatant.enemy { grid-template-columns: auto auto 1fr 42px; text-align: right; background: linear-gradient(270deg, #211716, #121318); }
    .portrait { width: 42px; height: 42px; border: 1px solid #766043; border-radius: 4px; display: grid; place-items: center; background: #27252a; font-size: 22px; }
    .enemy .portrait { border-color: #763b34; background: #2b1b1a; }
    .combatant h3 { margin: 0 0 3px; font-size: 13px; }
    .combatant p { margin: 0; color: #89837b; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .vs { display: grid; place-items: center; align-content: center; color: #7b6b57; }
    .vs strong { font-family: var(--display); font-size: 30px; color: #be4c40; text-shadow: 0 0 22px #a52a2277; }
    .vs::before, .vs::after { content: ""; height: 70px; width: 1px; background: linear-gradient(transparent, #6b5034, transparent); }
    .faceoff-footer { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 16px 24px 22px; border-top: 1px solid #332a22; }

    /* B — Threat Briefing */
    .briefing { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, .65fr); min-height: 700px; border: 1px solid #594026; background: #0d0e11; box-shadow: 0 30px 90px #000d; }
    .brief-threat { padding: 32px; display: flex; flex-direction: column; background: radial-gradient(circle at 50% 35%, #6b242635, transparent 42%), linear-gradient(#151419, #0c0d10); }
    .brief-threat h1 { margin: 6px 0 0; font-size: clamp(32px, 5vw, 58px); line-height: .98; }
    .threat-summary { margin: 9px 0 24px; color: #b3a99a; font-size: 13px; }
    .boss-card { position: relative; flex: 1; min-height: 300px; border: 1px solid #693a31; overflow: hidden; background: radial-gradient(circle at 50% 30%, #5b2625 0, #261618 31%, #101116 72%); display: grid; place-items: end center; }
    .boss-sigil { position: absolute; inset: 15% auto auto 50%; translate: -50% 0; width: 210px; height: 210px; border: 1px solid #a14c4070; rotate: 45deg; box-shadow: 0 0 50px #b72b2040, inset 0 0 45px #8b2c2640; }
    .boss-glyph { position: absolute; inset: 25% 0 auto; text-align: center; font-size: 128px; filter: grayscale(.3) drop-shadow(0 12px 20px #000); }
    .boss-info { position: relative; width: 100%; padding: 58px 22px 20px; background: linear-gradient(transparent, #0b0c0ff5 45%); }
    .boss-info h2 { margin: 0; font-size: 27px; }
    .boss-info p { margin: 5px 0 14px; color: #c0b09d; }
    .minion-strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
    .minion { min-width: 0; padding: 9px 10px; border: 1px solid #47312c; background: #191419; }
    .minion-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .minion b { overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .minion-count { color: #e2b66c; font-family: var(--display); font-size: 13px; font-weight: 800; }
    .minion small { display: block; margin-top: 3px; color: #96877b; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
    .brief-party { padding: 28px 22px; border-left: 1px solid #4b3828; background: linear-gradient(140deg, #191a1e, #101115); display: flex; flex-direction: column; }
    .brief-party h2 { margin: 4px 0 5px; font-size: 25px; }
    .brief-party > p { margin: 0 0 20px; color: #8e8980; font-size: 12px; }
    .hero-stack { display: grid; gap: 9px; }
    .hero-chip { display: grid; grid-template-columns: 39px 1fr auto; align-items: center; gap: 10px; padding: 9px; border: 1px solid #3e4246; border-left: 3px solid #547993; background: #1b1d22; }
    .hero-chip .portrait { width: 39px; height: 39px; }
    .hero-chip h3 { margin: 0; font-size: 12px; }
    .hero-chip small { color: #8f8980; }
    .brief-actions { margin-top: auto; display: grid; gap: 10px; padding-top: 22px; }
    .brief-actions .start-button { width: 100%; }

    /* C — Initiative War Table */
    .wartable { border: 1px solid #54462f; padding: 23px; background: linear-gradient(#171820f2, #0c0d11f5), repeating-linear-gradient(0deg, transparent 0 31px, #ffffff05 32px); box-shadow: 0 30px 90px #000c; }
    .war-header { display: flex; align-items: end; justify-content: space-between; gap: 24px; padding: 5px 5px 18px; }
    .war-header h1 { margin: 3px 0 0; font-size: clamp(29px, 4vw, 45px); }
    .war-meta { text-align: right; color: #9d9588; font-size: 12px; line-height: 1.7; }
    .war-meta strong { color: #d4bd90; }
    .battleline { display: grid; grid-template-columns: 1fr 72px 1.25fr; gap: 12px; align-items: stretch; }
    .formation { border: 1px solid #3e3b38; padding: 14px; background: #101216bf; }
    .formation.enemy-side { border-color: #56322f; background: #171012d9; }
    .formation-head { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .13em; color: #989187; }
    .token-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .enemy-side .token-grid { grid-template-columns: repeat(4, 1fr); }
    .war-token { min-height: 108px; border: 1px solid #3d444b; background: radial-gradient(circle at 50% 30%, #2b343d, #17191e 65%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 4px; text-align: center; position: relative; }
    .enemy-side .war-token { border-color: #573530; background: radial-gradient(circle at 50% 30%, #49231f, #1b1416 65%); }
    .war-token .icon { font-size: 27px; }
    .war-token b { margin-top: 7px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .war-token small { margin-top: 3px; color: #817d77; font-size: 9px; text-transform: uppercase; }
    .war-token .initiative { position: absolute; top: 5px; right: 6px; font-size: 16px; }
    .war-token .die-button { position: absolute; inset: auto 5px 5px; padding: 4px 7px; font-size: 10px; opacity: 0; }
    .war-token:hover .die-button, .war-token:focus-within .die-button { opacity: 1; }
    .clash { display: grid; place-items: center; color: #b34d43; }
    .clash span { writing-mode: vertical-rl; font-family: var(--display); font-size: 13px; letter-spacing: .25em; text-transform: uppercase; }
    .clash::before, .clash::after { content: ""; width: 1px; height: 100%; background: linear-gradient(transparent, #7e463c, transparent); }
    .initiative-track { margin-top: 13px; min-height: 72px; display: flex; gap: 7px; align-items: center; padding: 11px; border: 1px solid #40392e; overflow-x: auto; background: #090a0d; }
    .initiative-track::before { content: "ORDER"; color: #786e60; font-size: 9px; letter-spacing: .15em; margin: 0 6px; }
    .turn-card { min-width: 102px; padding: 8px 9px; border-left: 2px solid var(--player); background: #1a1d22; font-size: 10px; }
    .turn-card.enemy-turn { border-color: var(--danger); }
    .turn-card b { display: block; color: #e3c980; font-family: var(--display); font-size: 16px; }
    .war-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 14px; }

    .switcher {
      position: fixed; z-index: 100; left: 50%; bottom: 18px; transform: translateX(-50%);
      display: grid; grid-template-columns: 42px minmax(190px, auto) 42px; align-items: center;
      border: 1px solid #8f8f95; border-radius: 999px; overflow: hidden; background: #ececf0; color: #17171a;
      box-shadow: 0 8px 32px #000c; font-size: 12px;
    }
    .switcher button { height: 40px; border: 0; cursor: pointer; background: #d5d5db; color: #17171a; font-size: 18px; }
    .switcher button:hover { background: white; }
    .switcher-label { padding: 0 15px; text-align: center; font-weight: 700; }
    .toast { position: fixed; z-index: 90; inset: 50% auto auto 50%; transform: translate(-50%, -50%) scale(.9); opacity: 0; pointer-events: none; padding: 24px 34px; border: 1px solid #d16858; background: #120f11ed; box-shadow: 0 0 90px #b8322e88; text-align: center; transition: .3s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .toast strong { display: block; font-family: var(--display); font-size: 32px; color: #f4dfbb; }

    @media (max-width: 820px) {
      #app { padding: 12px 12px 90px; align-items: start; }
      .faceoff-body { grid-template-columns: 1fr; }
      .vs { grid-auto-flow: column; }
      .vs::before, .vs::after { height: 1px; width: 70px; }
      .briefing { grid-template-columns: 1fr; }
      .brief-party { border: 0; border-top: 1px solid #4b3828; }
      .battleline { grid-template-columns: 1fr; }
      .clash { grid-auto-flow: column; }
      .clash span { writing-mode: initial; }
      .clash::before, .clash::after { width: 100%; height: 1px; }
      .enemy-side .token-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="prototype-note">Throwaway UI prototype</div>
  <main id="app"></main>
  <div class="toast" id="toast" role="status"><strong>ENCOUNTER STARTED</strong><span>Roll for your lives.</span></div>
  <nav class="switcher" aria-label="Prototype variants">
    <button type="button" id="previous" aria-label="Previous variant">←</button>
    <div class="switcher-label" id="variant-label"></div>
    <button type="button" id="next" aria-label="Next variant">→</button>
  </nav>

  <script>
    const heroes = [
      { id: "h1", name: "Mara Vex", detail: "Dragonborn Warlord", icon: "🐲", side: "hero" },
      { id: "h2", name: "Thorne", detail: "Human Fighter", icon: "🛡️", side: "hero" },
      { id: "h3", name: "Selene Ash", detail: "Eladrin Wizard", icon: "✨", side: "hero" },
      { id: "h4", name: "Brother Cade", detail: "Dwarf Cleric", icon: "⚒️", side: "hero" },
      { id: "h5", name: "Kestrel", detail: "Halfling Rogue", icon: "🗡️", side: "hero" }
    ];
    const enemies = [
      { id: "e1", name: "Varkesh the Hollow", detail: "Elite Death Knight", icon: "☠️", side: "enemy" },
      { id: "e2", name: "Ashbound Reaver", detail: "Brute", icon: "🪓", side: "enemy" },
      { id: "e3", name: "Ashbound Reaver", detail: "Brute", icon: "🪓", side: "enemy" },
      { id: "e4", name: "Cinder Hexer", detail: "Controller", icon: "🔥", side: "enemy" },
      { id: "e5", name: "Grave Hound", detail: "Skirmisher", icon: "🐺", side: "enemy" },
      { id: "e6", name: "Grave Hound", detail: "Skirmisher", icon: "🐺", side: "enemy" },
      { id: "e7", name: "Ash Wretch", detail: "Minion", icon: "💀", side: "enemy" },
      { id: "e8", name: "Ash Wretch", detail: "Minion", icon: "💀", side: "enemy" }
    ];
    const allCombatants = [...heroes, ...enemies];
    const initiative = new Map();
    const variants = [
      { key: "A", name: "The Face-Off" },
      { key: "B", name: "Threat Briefing" },
      { key: "C", name: "Initiative War Table" }
    ];

    function valueFor(id) {
      return initiative.has(id) ? initiative.get(id) : "—";
    }

    function combatantRow(person, enemy = false) {
      const portrait = `<div class="portrait" aria-hidden="true">${person.icon}</div>`;
      const text = `<div><h3>${person.name}</h3><p>${person.detail}</p></div>`;
      const score = `<span class="initiative" data-score="${person.id}">${valueFor(person.id)}</span>`;
      const roll = `<button class="die-button" data-roll="${person.id}" type="button" aria-label="Roll initiative for ${person.name}">d20</button>`;
      return `<article class="combatant ${enemy ? "enemy" : ""}">${enemy ? `${roll}${score}${text}${portrait}` : `${portrait}${text}${score}${roll}`}</article>`;
    }

    function variantA() {
      return `<section class="screen faceoff">
        <header class="faceoff-header"><span class="eyebrow">The Ember Vault · Encounter 4</span><h1 class="display">No Road Back</h1><p>Thirteen combatants. One way out.</p></header>
        <div class="faceoff-body">
          <section><div class="roster-title"><h2 class="display">The Company</h2><span>5 adventurers</span></div><div class="combatant-list">${heroes.map(hero => combatantRow(hero)).join("")}</div></section>
          <div class="vs"><strong>VS</strong></div>
          <section><div class="roster-title"><h2 class="display">The Hollow Host</h2><span>8 hostiles</span></div><div class="combatant-list">${enemies.map(enemy => combatantRow(enemy, true)).join("")}</div></section>
        </div>
        <footer class="faceoff-footer"><button class="all-button" data-roll-all type="button">⚄ Roll All Initiative</button><button class="start-button" data-start type="button">Start Encounter</button></footer>
      </section>`;
    }

    function variantB() {
      const enemyGroups = enemies.slice(1).reduce((groups, enemy) => {
        const existing = groups.find(group => group.name === enemy.name);
        if (existing) {
          existing.count += 1;
        } else {
          groups.push({ name: enemy.name, detail: enemy.detail, count: 1 });
        }
        return groups;
      }, []);

      return `<section class="screen briefing">
        <section class="brief-threat"><span class="eyebrow">Threat Identified · Severe</span><h1 class="display">The Hollow Host</h1><p class="threat-summary">Eight enemies stand between you and the Ember Gate.</p>
          <article class="boss-card"><div class="boss-sigil"></div><div class="boss-glyph">☠️</div><div class="boss-info"><span class="eyebrow">Enemy Commander</span><h2 class="display">Varkesh the Hollow</h2><p>Elite Death Knight · Level 9 Soldier</p><div class="minion-strip">${enemyGroups.map(group => `<div class="minion"><div class="minion-heading"><b>${group.name}</b><span class="minion-count">×${group.count}</span></div><small>${group.detail}</small></div>`).join("")}</div></div></article>
        </section>
        <aside class="brief-party"><span class="eyebrow">Your Company</span><h2 class="display">Five Stand Ready</h2><p>Set the order. Face what waits beyond.</p><div class="hero-stack">${heroes.map(hero => `<article class="hero-chip"><div class="portrait">${hero.icon}</div><div><h3>${hero.name}</h3><small>${hero.detail}</small></div><div><span class="initiative" data-score="${hero.id}">${valueFor(hero.id)}</span> <button class="die-button" data-roll="${hero.id}" type="button">d20</button></div></article>`).join("")}</div>
          <div class="brief-actions"><button class="start-button" data-start type="button">Enter the Ember Vault</button></div>
        </aside>
      </section>`;
    }

    function warToken(person) {
      return `<article class="war-token"><span class="initiative" data-score="${person.id}">${valueFor(person.id)}</span><span class="icon">${person.icon}</span><b>${person.name}</b><small>${person.detail}</small><button class="die-button" data-roll="${person.id}" type="button">Roll d20</button></article>`;
    }

    function orderTrack() {
      const ordered = allCombatants.filter(person => initiative.has(person.id)).sort((a, b) => initiative.get(b.id) - initiative.get(a.id));
      return ordered.length ? ordered.map(person => `<div class="turn-card ${person.side === "enemy" ? "enemy-turn" : ""}"><b>${initiative.get(person.id)}</b>${person.name}</div>`).join("") : `<span class="muted">Roll initiative to reveal the turn order.</span>`;
    }

    function variantC() {
      return `<section class="screen wartable"><header class="war-header"><div><span class="eyebrow">Combat Deployment</span><h1 class="display">The Ember Gate</h1></div><div class="war-meta"><strong>5</strong> heroes · <strong>8</strong> hostiles<br>Threat: <strong>Severe</strong></div></header>
        <div class="battleline"><section class="formation"><div class="formation-head"><span>Allied formation</span><span>West approach</span></div><div class="token-grid">${heroes.map(warToken).join("")}</div></section><div class="clash"><span>Battleline</span></div><section class="formation enemy-side"><div class="formation-head"><span>Hostile formation</span><span>Ember Gate</span></div><div class="token-grid">${enemies.map(warToken).join("")}</div></section></div>
        <div class="initiative-track" data-track>${orderTrack()}</div><footer class="war-actions"><button class="all-button" data-roll-all type="button">⚄ Roll Initiative</button><button class="start-button" data-start type="button">Start Encounter →</button></footer>
      </section>`;
    }

    function currentIndex() {
      const key = new URLSearchParams(location.search).get("variant")?.toUpperCase() || "A";
      const index = variants.findIndex(variant => variant.key === key);
      return index < 0 ? 0 : index;
    }

    function render() {
      const index = currentIndex();
      const renderers = [variantA, variantB, variantC];
      document.getElementById("app").innerHTML = renderers[index]();
      document.getElementById("variant-label").textContent = `${variants[index].key} · ${variants[index].name}`;
      bindActions();
    }

    function go(offset) {
      const next = (currentIndex() + offset + variants.length) % variants.length;
      const url = new URL(location.href);
      url.searchParams.set("variant", variants[next].key);
      history.replaceState({}, "", url);
      render();
    }

    function rollOne(id) {
      initiative.set(id, Math.floor(Math.random() * 20) + 1);
      updateState();
      const score = document.querySelector(`[data-score="${id}"]`);
      score?.classList.add("rolling");
      setTimeout(() => score?.classList.remove("rolling"), 600);
    }

    function updateState() {
      document.querySelectorAll("[data-score]").forEach(node => { node.textContent = valueFor(node.dataset.score); });
      const status = document.querySelector("[data-status]");
      if (status) status.textContent = `${initiative.size} of ${allCombatants.length} initiatives rolled`;
      const track = document.querySelector("[data-track]");
      if (track) track.innerHTML = orderTrack();
    }

    function rollAll() {
      allCombatants.forEach(person => initiative.set(person.id, Math.floor(Math.random() * 20) + 1));
      updateState();
      document.querySelectorAll("[data-score]").forEach(node => node.classList.add("rolling"));
      setTimeout(() => document.querySelectorAll("[data-score]").forEach(node => node.classList.remove("rolling")), 650);
    }

    function startEncounter() {
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1900);
    }

    function bindActions() {
      document.querySelectorAll("[data-roll]").forEach(button => button.addEventListener("click", () => rollOne(button.dataset.roll)));
      document.querySelector("[data-roll-all]")?.addEventListener("click", rollAll);
      document.querySelector("[data-start]")?.addEventListener("click", startEncounter);
    }

    document.getElementById("previous").addEventListener("click", () => go(-1));
    document.getElementById("next").addEventListener("click", () => go(1));
    window.addEventListener("popstate", render);
    window.addEventListener("keydown", event => {
      const tag = document.activeElement?.tagName;
      if (["INPUT", "TEXTAREA"].includes(tag) || document.activeElement?.isContentEditable) return;
      if (event.key === "ArrowLeft") go(-1);
      if (event.key === "ArrowRight") go(1);
    });
    render();
  </script>
</body>
</html>

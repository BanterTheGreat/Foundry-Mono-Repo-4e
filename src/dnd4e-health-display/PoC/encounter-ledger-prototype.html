<!doctype html>
<!--
  THROWAWAY UI PROTOTYPE — not Foundry production code.
  Question: Which right-side Encounter Ledger best supports a 4e GM during play?
  Three structural variants, switchable via ?variant=A|B|C.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4e Encounter Ledger Prototype</title>
  <style>
    :root { color-scheme:dark; --void:#0a0a0e; --surface:#151318; --surface-2:#201b1e; --brass:#cf9f68; --edge:#856344; --paper:#f0dec3; --muted:#ad9a87; --red:#c34e4e; --green:#55945c; --blue:#55a7c0; --daily:#778190; --line:rgb(207 159 104 / .38); font-family:Signika,system-ui,sans-serif; }
    * { box-sizing:border-box; } body { min-width:900px; min-height:100vh; margin:0; overflow:hidden; background:radial-gradient(ellipse at 44% 43%,#3e393a 0,#222126 38%,#101015 72%); color:var(--paper); } button { color:inherit; font:inherit; cursor:pointer; }
    .canvas { position:fixed; inset:0; background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px); background-size:48px 48px; mask-image:radial-gradient(ellipse at center,#000 0 40%,transparent 80%); } .canvas::before { position:absolute; top:33%; left:32%; width:34%; height:30%; border:2px solid #bb875550; border-radius:44% 56% 58% 42%; box-shadow:0 0 4rem #d3934e55; content:""; }
    .context { position:fixed; z-index:1; bottom:1.2rem; left:1.2rem; width:19rem; color:#c9b8a4; font-size:.76rem; line-height:1.45; text-shadow:0 1px #000; } .context b { color:#f2cc95; }
    .ledger { position:fixed; z-index:2; top:.65rem; right:.65rem; bottom:.65rem; width:22rem; overflow:hidden; border:1px solid var(--edge); border-radius:.4rem; background:linear-gradient(115deg,#19151a,#0c0c11 72%); box-shadow:0 .8rem 2.5rem #000c,inset 0 0 0 1px #fff1; } .ledger-header { display:flex; align-items:center; gap:.6rem; min-height:3.5rem; padding:.55rem .7rem; border-bottom:1px solid var(--line); background:linear-gradient(95deg,#422a1d,#171419 67%); } h1,h2,h3,p { margin:0; } .ledger-header h1 { color:#f6d7a8; font-family:Georgia,serif; font-size:1.15rem; } .ledger-header small { display:block; margin-top:.16rem; color:var(--muted); font-size:.59rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; } .gear { width:2rem; height:2rem; margin-left:auto; border:1px solid #94704e; border-radius:.25rem; background:#241d1b; color:#f1d3a0; }
    .roundbar { display:flex; align-items:center; justify-content:space-between; min-height:2.25rem; padding:.35rem .7rem; border-bottom:1px solid var(--line); background:#0e0e12; color:#c6af92; font-size:.64rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; } .roundbar b { color:#f4d195; font-family:Georgia,serif; font-size:1rem; letter-spacing:0; text-transform:none; } .roundbar .counter { color:#a99a8b; }
    .body { overflow:auto; max-height:calc(100% - 8.15rem); } .footer { position:absolute; right:0; bottom:0; left:0; display:flex; gap:.42rem; padding:.55rem .65rem; border-top:1px solid var(--line); background:#100e13; } .footer button { flex:1; min-height:2.18rem; border:1px solid #8c6a4c; border-radius:.22rem; background:#201a1a; color:#ebd1ad; font-size:.7rem; font-weight:700; } .footer .end { border-color:#d0a46e; background:linear-gradient(#694228,#382315); } .footer button:hover,.gear:hover { border-color:#f2c475; background:#513522; }
    .portrait { display:grid; place-items:center; width:2.2rem; height:2.2rem; border:1px solid #bd9469; border-radius:50%; background:radial-gradient(circle at 35% 28%,#d5a873 0 10%,#65462f 11% 28%,#292820 29%); color:#2c1b12; font-size:1.1rem; box-shadow:0 0 0 2px #0d0d11; } .portrait.hero { background:radial-gradient(circle at 35% 27%,#ead4a5 0 9%,#864c30 10% 28%,#29343a 29%); }
    .chip { display:inline-flex; align-items:center; min-height:1.05rem; padding:.08rem .25rem; border:1px solid #ffffff26; border-radius:.13rem; color:#d6c4ad; font-size:.5rem; font-weight:700; letter-spacing:.045em; text-transform:uppercase; } .chip.bad { border-color:#c95458; color:#ffbab3; } .chip.good { border-color:#5c9f69; color:#c0e3bc; } .chip.mark { border-color:#d49a4e; color:#ffd696; }
    /* A: chronological ledger — scan initiative from top to bottom, expand the active turn. */
    .variant-a .entry { display:grid; grid-template-columns:2.35rem 2.25rem minmax(0,1fr) 2.25rem; gap:.48rem; align-items:center; width:100%; padding:.55rem .65rem; border:0; border-bottom:1px solid #ffffff11; border-left:3px solid transparent; background:transparent; text-align:left; } .variant-a .entry:hover { background:#ffffff09; } .variant-a .entry.active { grid-template-columns:2.35rem 2.25rem minmax(0,1fr) 2.25rem; border-left-color:var(--brass); background:linear-gradient(90deg,#5b3420,#241a1b 60%,#131116); box-shadow:inset 0 1px #e5ac6b45,inset 0 -1px #e5ac6b25; } .variant-a .number { color:#b2987a; font-family:Georgia,serif; font-size:1.35rem; text-align:center; } .variant-a .entry.active .number { color:#f2c879; } .variant-a .name { min-width:0; } .variant-a .name b,.variant-a .name small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .variant-a .name b { color:#f2dabc; font-size:.78rem; } .variant-a .name small { margin-top:.13rem; color:#ac9c8c; font-size:.61rem; } .variant-a .init { color:#f1cd91; font-family:Georgia,serif; font-size:1.1rem; text-align:right; } .variant-a .details { grid-column:2 / 5; display:none; padding:.05rem .1rem .35rem; } .variant-a .active .details { display:block; } .variant-a .conditions { display:flex; flex-wrap:wrap; gap:.2rem; margin:.28rem 0 .4rem; } .variant-a .actions { display:grid; grid-template-columns:repeat(3,1fr); gap:.22rem; } .variant-a .actions span { padding:.22rem .15rem; border:1px solid #ffffff25; border-radius:.16rem; background:#0d0d10; color:#cdbca6; font-size:.55rem; text-align:center; } .variant-a .actions span b { display:block; color:#e7c89d; font-size:.55rem; letter-spacing:.06em; text-transform:uppercase; } .variant-a .actions .spent { opacity:.4; text-decoration:line-through; }
    /* B: opposing forces — make the tactical sides and their aggregate state primary. */
    .variant-b .side { border-bottom:1px solid var(--line); } .variant-b .side-head { display:flex; align-items:center; gap:.4rem; padding:.5rem .65rem; background:#151316; color:#d9c3a5; font-size:.62rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; } .variant-b .side-head::after { height:1px; flex:1; background:#ffffff1d; content:""; } .variant-b .side-head b { color:#f2cf98; font-family:Georgia,serif; font-size:.82rem; letter-spacing:0; text-transform:none; } .variant-b .force { display:grid; grid-template-columns:1fr 1fr; gap:.35rem; padding:.45rem; } .variant-b .member { position:relative; min-height:6.6rem; padding:.45rem; border:1px solid #ffffff1c; border-top:3px solid #795d43; border-radius:.25rem; background:#111014; text-align:left; } .variant-b .member.active { border-color:#d3a066; border-top-color:#e8b66f; background:linear-gradient(135deg,#56331f,#1b1517); box-shadow:0 0 1rem #bd7e4260; } .variant-b .member-top { display:flex; gap:.4rem; align-items:center; } .variant-b .member .portrait { width:1.7rem; height:1.7rem; font-size:.82rem; } .variant-b .member b { display:block; overflow:hidden; color:#efd8b8; font-size:.67rem; text-overflow:ellipsis; white-space:nowrap; } .variant-b .member small { color:#ac9a87; font-size:.55rem; } .variant-b .member .initiative { position:absolute; top:.42rem; right:.45rem; color:#efcc8d; font-family:Georgia,serif; font-size:.92rem; } .variant-b .health { height:.34rem; margin:.48rem 0 .3rem; overflow:hidden; border-radius:99px; background:#08080a; } .variant-b .health i { display:block; height:100%; background:linear-gradient(90deg,#a32f36,#e16a64); } .variant-b .health.blue i { background:linear-gradient(90deg,#276a82,#64c0d9); } .variant-b .member .chips { display:flex; flex-wrap:wrap; gap:.16rem; } .variant-b .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; border-top:1px solid var(--line); background:var(--line); } .variant-b .summary div { padding:.38rem .25rem; background:#101015; color:#aa9988; font-size:.51rem; text-align:center; text-transform:uppercase; } .variant-b .summary b { display:block; margin-bottom:.12rem; color:#ecd0a6; font-family:Georgia,serif; font-size:.86rem; }
    /* C: turn inspector — prioritize the current creature, its active effects, and next turns. */
    .variant-c .active-sheet { padding:.65rem; border-bottom:1px solid var(--line); background:linear-gradient(130deg,#4d2d1e,#24191b 56%,#141217); } .variant-c .sheet-title { display:grid; grid-template-columns:3.5rem minmax(0,1fr) 2.4rem; gap:.55rem; align-items:center; } .variant-c .sheet-title .portrait { width:3.2rem; height:3.2rem; font-size:1.5rem; } .variant-c .sheet-title h2 { overflow:hidden; color:#f5d8b5; font-family:Georgia,serif; font-size:1.08rem; text-overflow:ellipsis; white-space:nowrap; } .variant-c .sheet-title p { margin-top:.13rem; color:#c3ac91; font-size:.61rem; } .variant-c .sheet-init { color:#f5cf8d; font-family:Georgia,serif; font-size:1.65rem; text-align:right; } .variant-c .vitals { display:grid; grid-template-columns:1.2fr 1fr 1.35fr; gap:.35rem; margin-top:.55rem; } .variant-c .vital { padding:.3rem .35rem; border:1px solid #ffffff20; border-radius:.2rem; background:#09090b8c; } .variant-c .vital span { display:block; color:#af9d8b; font-size:.5rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; } .variant-c .vital b { display:block; margin-top:.13rem; color:#f0d1a7; font-size:.75rem; } .variant-c .vital.hp b { color:#ffbbb0; } .variant-c .turn-economy { display:grid; grid-template-columns:repeat(3,1fr); gap:.28rem; margin-top:.5rem; } .variant-c .turn-economy button { min-height:2.45rem; border:1px solid #ffffff2a; border-radius:.2rem; background:#100f12; font-size:.57rem; text-align:center; } .variant-c .turn-economy button b { display:block; margin-bottom:.18rem; color:#e9c99e; font-size:.6rem; letter-spacing:.06em; text-transform:uppercase; } .variant-c .turn-economy .used { opacity:.48; text-decoration:line-through; } .variant-c .section-label { display:flex; gap:.4rem; align-items:center; padding:.55rem .65rem .3rem; color:#bda98f; font-size:.58rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; } .variant-c .section-label::after { height:1px; flex:1; background:var(--line); content:""; } .variant-c .next { display:grid; grid-template-columns:2rem minmax(0,1fr) 2.2rem; gap:.48rem; align-items:center; width:100%; padding:.42rem .65rem; border:0; border-left:3px solid transparent; background:transparent; text-align:left; } .variant-c .next:hover { background:#ffffff0a; } .variant-c .next .portrait { width:1.7rem; height:1.7rem; font-size:.85rem; } .variant-c .next b,.variant-c .next small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .variant-c .next b { color:#e7d2b4; font-size:.71rem; } .variant-c .next small { color:#aa9988; font-size:.56rem; } .variant-c .next strong { color:#e9c58a; font-family:Georgia,serif; font-size:1rem; text-align:right; } .variant-c .effects { display:flex; flex-wrap:wrap; gap:.25rem; padding:.25rem .65rem .5rem; }
    .switcher { position:fixed; z-index:4; bottom:1rem; left:50%; display:flex; align-items:center; gap:.55rem; padding:.42rem; border:1px solid #bd9360; border-radius:2rem; background:#151216; box-shadow:0 .35rem 1.2rem #000c; transform:translateX(-50%); } .switcher button { width:2rem; height:2rem; border:1px solid #745a43; border-radius:50%; background:#2a211c; color:#f4d39e; font-size:1rem; } .switcher button:hover { border-color:#f0c879; background:#4b3522; } .switcher output { min-width:15rem; color:#ecd3b2; font-size:.7rem; font-weight:700; text-align:center; }
  </style>
</head>
<body>
  <div class="canvas" aria-hidden="true"></div>
  <p class="context"><b>Throwaway design study — 4e Encounter Ledger.</b> Click a combatant to change the current turn. The active state, initiative order, conditions, action economy, and side composition are intentionally visible in every design.</p>
  <main id="app"></main>
  <nav class="switcher" aria-label="Prototype variant selector"><button id="previous" aria-label="Previous variant">←</button><output id="label"></output><button id="next" aria-label="Next variant">→</button></nav>
  <script>
    const combatants = [
      {name:'Kobold Skirmisher', short:'Skirmisher', role:'Level 1 Skirmisher', init:20, icon:'♞', hp:'14 / 27', percent:52, tags:[['bloodied','bad']], enemy:true},
      {name:'Kobold Dragonshield', short:'Dragonshield', role:'Level 2 Soldier', init:14, icon:'♜', hp:'31 / 36', percent:86, tags:[['marked','mark'],['save ends','bad']], enemy:true},
      {name:'Beltane', short:'Beltane', role:'Level 3 Ranger', init:10, icon:'♝', hp:'18 / 31', percent:58, tags:[['quarry','good'],['temp 5','good']], hero:true},
      {name:'Kobold Slinger', short:'Slinger', role:'Level 1 Artillery', init:9, icon:'♞', hp:'21 / 24', percent:88, tags:[['slowed','bad']], enemy:true}
    ];
    let active=2;
    const current=()=>combatants[active];
    const tags=(person)=>person.tags.map(([text,type])=>`<span class="chip ${type}">${text}</span>`).join('');
    const header=()=>`<header class="ledger-header"><div><h1>Encounter Ledger</h1><small>4e tactical combat · ${combatants.length} combatants</small></div><button class="gear" title="Combat settings">⚙</button></header><div class="roundbar"><span>Round <b>10</b></span><span class="counter">Current count <b>${current().init}</b></span></div>`;
    const footer=()=>`<footer class="footer"><button>＋ Add</button><button class="end">✓ End Turn</button></footer>`;
    const ledger=(content,variant)=>`<aside class="ledger variant-${variant}">${header()}<section class="body">${content}</section>${footer()}</aside>`;
    const variantA=()=>ledger(combatants.map((p,index)=>`<button class="entry ${index===active?'active':''}" data-person="${index}"><span class="number">${p.init}</span><span class="portrait ${p.hero?'hero':''}">${p.icon}</span><span class="name"><b>${p.name}</b><small>${p.role} · ${p.hp} HP</small></span><strong class="init">${index===active?'NOW':'›'}</strong><div class="details"><div class="conditions">${tags(p)}</div><div class="actions"><span><b>Standard</b>Ready</span><span><b>Move</b>Ready</span><span class="spent"><b>Minor</b>Used</span></div></div></button>`).join(''),'a');
    const card=(p,index)=>`<button class="member ${index===active?'active':''}" data-person="${index}"><div class="member-top"><span class="portrait ${p.hero?'hero':''}">${p.icon}</span><span><b>${p.short}</b><small>${p.role.replace('Level ','L')}</small></span></div><strong class="initiative">${p.init}</strong><div class="health ${p.hero?'blue':''}"><i style="width:${p.percent}%"></i></div><div class="chips">${tags(p)}</div></button>`;
    const variantB=()=>ledger(`<section class="side"><header class="side-head">Heroes <b>1 active</b></header><div class="force">${combatants.filter(p=>p.hero).map(p=>card(p,combatants.indexOf(p))).join('')}</div></section><section class="side"><header class="side-head">Enemies <b>3 remaining</b></header><div class="force">${combatants.filter(p=>p.enemy).map(p=>card(p,combatants.indexOf(p))).join('')}</div></section><section class="summary"><div><b>2</b>Bloodied</div><div><b>3</b>Conditions</div><div><b>1</b>Marked</div></section>`,'b');
    const variantC=()=>ledger(`<section class="active-sheet"><div class="sheet-title"><span class="portrait ${current().hero?'hero':''}">${current().icon}</span><div><h2>${current().name}</h2><p>${current().role} · Current turn</p></div><strong class="sheet-init">${current().init}</strong></div><div class="vitals"><div class="vital hp"><span>Hit points</span><b>${current().hp}</b></div><div class="vital"><span>Defenses</span><b>AC 19 · F 16</b></div><div class="vital"><span>Status</span><b>${current().tags.map(t=>t[0]).join(', ')}</b></div></div><div class="turn-economy"><button><b>Standard</b>Ready</button><button><b>Move</b>Ready</button><button class="used"><b>Minor</b>Used</button></div></section><div class="section-label">Next in initiative</div>${combatants.filter((_,index)=>index!==active).map(p=>`<button class="next" data-person="${combatants.indexOf(p)}"><span class="portrait ${p.hero?'hero':''}">${p.icon}</span><span><b>${p.name}</b><small>${p.role}</small></span><strong>${p.init}</strong></button>`).join('')}<div class="section-label">Current effects</div><div class="effects">${tags(current())}<span class="chip">+2 CA vs. target</span></div>`,'c');
    const variants={A:['A — Chronological ledger',variantA],B:['B — Opposing forces',variantB],C:['C — Turn inspector',variantC]}; let key=new URLSearchParams(location.search).get('variant')?.toUpperCase(); if(!variants[key])key='A';
    function render(){document.getElementById('app').innerHTML=variants[key][1]();document.getElementById('label').textContent=variants[key][0];document.querySelectorAll('[data-person]').forEach(button=>button.onclick=()=>{active=Number(button.dataset.person);render();});}
    function move(delta){const keys=Object.keys(variants);key=keys[(keys.indexOf(key)+delta+keys.length)%keys.length];const url=new URL(location);url.searchParams.set('variant',key);history.replaceState(null,'',url);render();}
    document.getElementById('previous').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);window.addEventListener('keydown',event=>{if(!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){if(event.key==='ArrowLeft')move(-1);if(event.key==='ArrowRight')move(1);}});render();
  </script>
</body>
</html>

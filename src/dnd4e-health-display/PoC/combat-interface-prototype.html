<!doctype html>
<!--
  THROWAWAY UI PROTOTYPE — not Foundry production code.
  Question: How can the right-side Combat Tracker and a top-center initiative
  carousel make D&D 4e combat state readable at a glance?
  Three structural directions, switchable with ?variant=A|B|C.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4e Combat Interface Prototype</title>
  <style>
    :root { color-scheme:dark; --void:#09090d; --panel:#121116; --panel-2:#1b181b; --edge:#7f6046; --brass:#d0a46e; --paper:#f0dfc7; --muted:#af9d8a; --red:#bd4549; --green:#54955b; --blue:#5ba6bb; --slate:#788394; --line:rgb(208 164 110 / .38); font-family:Signika,system-ui,sans-serif; }
    * { box-sizing:border-box; } body { min-width:980px; min-height:100vh; margin:0; overflow:hidden; background:radial-gradient(ellipse at 48% 42%,#3e3a3b 0,#201f23 35%,#111116 70%); color:var(--paper); }
    button { color:inherit; font:inherit; cursor:pointer; } .map { position:fixed; inset:0; background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px); background-size:48px 48px; mask-image:radial-gradient(ellipse at center,#000 0 40%,transparent 78%); } .map::after { position:absolute; top:37%; left:35%; width:31%; height:24%; border:2px solid #a9846155; border-radius:48% 52% 42% 58%; box-shadow:0 0 3rem #c6975570; content:""; }
    .note { position:fixed; z-index:3; bottom:4.9rem; left:1rem; width:17rem; color:#d0beaa; font-size:.75rem; line-height:1.4; text-shadow:0 1px #000; } .note b { color:#f3d1a0; }
    .right-rail { position:fixed; z-index:2; top:.65rem; right:.65rem; bottom:.65rem; width:20.3rem; overflow:hidden; border:1px solid var(--edge); border-radius:.38rem; background:linear-gradient(110deg,#18151a,#0d0d12 70%); box-shadow:0 .7rem 2.2rem #000b,inset 0 0 0 1px #fff1; }
    .tracker-title { display:flex; align-items:center; min-height:3.15rem; padding:.55rem .7rem; border-bottom:1px solid var(--line); background:linear-gradient(90deg,#3b271c,#171419 68%); } .tracker-title h1 { margin:0; color:#f2d4a6; font-family:Georgia,serif; font-size:1.08rem; } .tracker-title small { display:block; margin-top:.14rem; color:var(--muted); font-size:.62rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; } .tracker-title button { width:2rem; height:2rem; margin-left:auto; border:1px solid #a88159; border-radius:.25rem; background:#211c1c; color:#f1d4a5; }
    .round { display:flex; justify-content:space-between; align-items:center; padding:.48rem .7rem; border-bottom:1px solid var(--line); background:#0c0c10; color:#dcc5a7; font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; } .round b { color:#f5d39c; font-family:Georgia,serif; font-size:1rem; letter-spacing:0; text-transform:none; }
    .combatants { overflow:auto; max-height:calc(100% - 8.2rem); } .combatant { display:grid; grid-template-columns:2.55rem minmax(0,1fr) 2.25rem; gap:.5rem; align-items:center; width:100%; padding:.55rem .65rem; border:0; border-bottom:1px solid #ffffff12; border-left:3px solid transparent; background:transparent; text-align:left; } .combatant:hover { background:#ffffff0a; } .combatant.active { border-left-color:var(--brass); background:linear-gradient(90deg,#5a331f 0,#211a1b 56%,#121116); box-shadow:inset 0 1px #e7ae6a45,inset 0 -1px #e7ae6a25; } .portrait { display:grid; place-items:center; width:2.35rem; height:2.35rem; border:1px solid #bd9568; border-radius:50%; background:radial-gradient(circle at 35% 30%,#d1a873 0 10%,#644530 11% 28%,#282820 29%); color:#281912; font-size:1.25rem; box-shadow:0 0 0 2px #09090d; } .portrait.hero { background:radial-gradient(circle at 35% 27%,#ead1a1 0 9%,#884f32 10% 28%,#29333a 29%); } .who { min-width:0; } .who b,.who small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .who b { color:#f0dbbd; font-size:.82rem; } .who small { margin-top:.15rem; color:#a99a89; font-size:.64rem; } .initiative { color:#f6d89e; font-family:Georgia,serif; font-size:1.2rem; text-align:right; } .tags { display:flex; gap:.22rem; margin-top:.25rem; } .tag { padding:.1rem .22rem; border:1px solid #ffffff23; border-radius:.14rem; color:#d8c5a9; font-size:.52rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; } .tag.mark { border-color:#ce8e47; color:#ffd797; } .tag.save { border-color:#be4d52; color:#ffb8af; }
    .tracker-footer { position:absolute; right:0; bottom:0; left:0; display:flex; gap:.45rem; padding:.55rem .65rem; border-top:1px solid var(--line); background:#100f13; } .tracker-footer button { flex:1; min-height:2.15rem; border:1px solid #9e7c58; border-radius:.22rem; background:#221d1d; color:#f1d6ae; font-size:.73rem; font-weight:700; } .tracker-footer button.primary { border-color:#d0a46e; background:linear-gradient(#664127,#352217); }
    .carousel { position:fixed; z-index:2; top:.8rem; left:50%; width:min(62rem,calc(100vw - 23rem)); transform:translateX(-50%); } .current-card { border:1px solid var(--brass); background:linear-gradient(120deg,#4a2b1c,#25191b 48%,#121116); box-shadow:0 .7rem 2rem #0009,inset 0 0 0 1px #fff2; } .current-card h2,.current-card p { margin:0; } .power-strip { display:flex; gap:.4rem; margin-top:.55rem; } .power { padding:.26rem .38rem; border:1px solid #ffffff2b; border-left:3px solid var(--green); border-radius:.17rem; background:#0c0d0e; color:#d8d9cf; font-size:.6rem; } .power.encounter { border-left-color:var(--red); } .power.daily { border-left-color:var(--slate); }
    /* A — Film strip: surrounding turns stay visible, current turn becomes a large tactical focus. */
    .variant-a .turns { display:grid; grid-template-columns:1fr 1.6fr 2.7fr 1.6fr 1fr; align-items:stretch; gap:.28rem; } .variant-a .turn { min-width:0; min-height:5.6rem; padding:.55rem .45rem; border:1px solid #725842; border-radius:.26rem; background:#151318eF; color:#c1ad95; text-align:center; } .variant-a .turn.far { opacity:.62; } .variant-a .turn.active { border-color:var(--brass); background:linear-gradient(120deg,#5a3320,#1d1619); box-shadow:0 0 1.3rem #c2844466; } .variant-a .turn .portrait { margin:auto; width:2.1rem; height:2.1rem; font-size:1rem; } .variant-a .turn b { display:block; margin-top:.3rem; overflow:hidden; color:#edd6b6; font-size:.68rem; text-overflow:ellipsis; white-space:nowrap; } .variant-a .turn strong { display:block; margin-top:.15rem; color:#f1c77e; font-family:Georgia,serif; font-size:.94rem; } .variant-a .turn.active b { font-size:.9rem; } .variant-a .turn.active strong { font-size:1.4rem; } .variant-a .turn.active::after { display:block; margin-top:.3rem; color:#ffc875; font-size:.56rem; font-weight:700; letter-spacing:.1em; content:"ACTING NOW"; }
    /* B — Initiative ruler: a continuous initiative count is the main object; actors attach to it. */
    .variant-b { padding-top:.35rem; } .variant-b .ruler { position:relative; display:grid; grid-template-columns:repeat(12,1fr); height:7.5rem; padding:0 2.3rem; } .variant-b .ruler::before { position:absolute; top:3.2rem; right:2.3rem; left:2.3rem; height:2px; background:linear-gradient(90deg,#5d4a38,#e0ad6d 42%,#5d4a38); content:""; } .variant-b .tick { position:relative; z-index:1; padding-top:3.55rem; color:#998a79; font-size:.62rem; text-align:center; } .variant-b .tick::before { position:absolute; top:2.85rem; left:50%; width:.65rem; height:.65rem; border:2px solid #907457; border-radius:50%; background:#161419; content:""; transform:translateX(-50%); } .variant-b .token { position:absolute; z-index:2; top:.2rem; display:grid; place-items:center; width:4.45rem; padding:.35rem .25rem; border:1px solid #937050; border-radius:.32rem; background:#171419; color:#dfcbb0; box-shadow:0 .35rem .8rem #0008; font-size:.62rem; text-align:center; } .variant-b .token b { display:block; color:#f1d8b6; font-size:.7rem; } .variant-b .token.active { top:.02rem; border-color:#e1af6e; background:#4a2b1d; box-shadow:0 0 1.3rem #c9874c88; } .variant-b .token.active::after { position:absolute; top:4.1rem; width:.9rem; height:.9rem; border:3px solid #edc277; border-radius:50%; background:#3b241a; content:""; } .variant-b .now { position:absolute; top:6.2rem; left:48%; color:#f0c675; font-size:.63rem; font-weight:700; letter-spacing:.1em; transform:translateX(-50%); }
    /* C — Command deck: current actor and their 4e turn economy are the primary affordance. */
    .variant-c .current-card { display:grid; grid-template-columns:5.3rem minmax(14rem,1fr) 20rem; min-height:7.3rem; padding:.65rem; border-radius:.4rem; } .variant-c .portrait { align-self:center; width:4.2rem; height:4.2rem; font-size:1.8rem; } .variant-c .actor-summary { padding:.25rem .65rem; } .variant-c h2 { color:#f7dcba; font-family:Georgia,serif; font-size:1.32rem; } .variant-c .actor-summary > p { margin-top:.15rem; color:#c5b4a2; font-size:.68rem; } .variant-c .vitals { display:flex; gap:.75rem; margin-top:.55rem; font-size:.64rem; } .variant-c .vitals b { display:block; margin-top:.1rem; color:#ffd0c4; font-family:Georgia,serif; font-size:1rem; } .variant-c .vitals span { color:#b8a594; font-size:.55rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; } .variant-c .actions { display:grid; grid-template-columns:repeat(3,1fr); gap:.32rem; align-self:center; } .variant-c .action { min-height:4.55rem; padding:.35rem; border:1px solid #ffffff25; border-radius:.25rem; background:#0d0e10; text-align:center; } .variant-c .action b { display:block; color:#e6c99e; font-size:.64rem; letter-spacing:.06em; text-transform:uppercase; } .variant-c .action span { display:block; margin-top:.42rem; color:#a9b9a4; font-size:.68rem; } .variant-c .action.used { opacity:.45; text-decoration:line-through; } .variant-c .queue { display:flex; justify-content:center; gap:.33rem; margin-top:.4rem; } .variant-c .queue button { padding:.35rem .6rem; border:1px solid #725842; border-radius:.22rem; background:#141217; color:#d7c1a2; font-size:.63rem; } .variant-c .queue button:nth-child(2) { border-color:#d0a46e; color:#f4d196; }
    .switcher { position:fixed; z-index:5; bottom:1rem; left:50%; display:flex; align-items:center; gap:.55rem; padding:.42rem; border:1px solid #bd9360; border-radius:2rem; background:#151216; box-shadow:0 .35rem 1.2rem #000c; transform:translateX(-50%); } .switcher button { width:2rem; height:2rem; border:1px solid #745a43; border-radius:50%; background:#2a211c; color:#f4d39e; font-size:1rem; } .switcher button:hover,.tracker-footer button:hover,.tracker-title button:hover { border-color:#f0c879; background:#4b3522; } .switcher output { min-width:15rem; color:#ecd3b2; font-size:.7rem; font-weight:700; text-align:center; }
  </style>
</head>
<body>
  <div class="map" aria-hidden="true"></div>
  <p class="note"><b>Throwaway design study.</b> Click a combatant to change the active turn. Compare the carousel with ←/→ or the bottom selector; the right rail changes with each direction.</p>
  <main id="app"></main>
  <nav class="switcher" aria-label="Prototype variant selector"><button id="previous" aria-label="Previous variant">←</button><output id="label"></output><button id="next" aria-label="Next variant">→</button></nav>
  <script>
    const people = [
      { name:'Kobold Skirmisher', role:'Level 1 Skirmisher · bloodied', init:20, icon:'♞', tags:['bloodied'], foe:true },
      { name:'Kobold Dragonshield', role:'Level 2 Soldier · marked', init:14, icon:'♜', tags:['marked','save'], foe:true },
      { name:'Beltane', role:'Level 3 Ranger · 18 / 31 HP', init:10, icon:'♝', tags:['quarry'], hero:true },
      { name:'Kobold Slinger', role:'Level 1 Artillery · slowed', init:9, icon:'♞', tags:['slowed'], foe:true }
    ];
    let active = 2;
    const person = () => people[active];
    const rail = () => `<aside class="right-rail"><header class="tracker-title"><div><h1>Encounter Ledger</h1><small>4 combatants · 3 conditions</small></div><button title="Combat settings">⚙</button></header><div class="round"><span>Round <b>10</b></span><span>Initiative</span></div><section class="combatants">${people.map((p,index) => `<button class="combatant ${index === active ? 'active' : ''}" data-person="${index}"><span class="portrait ${p.hero ? 'hero' : ''}">${p.icon}</span><span class="who"><b>${p.name}</b><small>${p.role}</small><span class="tags">${p.tags.map(t => `<i class="tag ${t === 'marked' ? 'mark' : t === 'save' || t === 'bloodied' ? 'save' : ''}">${t}</i>`).join('')}</span></span><strong class="initiative">${p.init}</strong></button>`).join('')}</section><footer class="tracker-footer"><button>⌘ Add</button><button class="primary">✓ End Turn</button></footer></aside>`;
    const film = () => `<section class="carousel variant-a"><div class="turns">${[-2,-1,0,1,2].map((offset) => { const index=(active+offset+people.length)%people.length, p=people[index]; return `<button class="turn ${offset === 0 ? 'active' : ''} ${Math.abs(offset) === 2 ? 'far' : ''}" data-person="${index}"><span class="portrait ${p.hero ? 'hero' : ''}">${p.icon}</span><b>${p.name}</b><strong>${p.init}</strong></button>`; }).join('')}</div></section>`;
    const ruler = () => `<section class="carousel variant-b"><div class="ruler">${[20,19,18,17,16,15,14,13,12,11,10,9].map(n => `<span class="tick">${n}</span>`).join('')}${people.map((p,i) => `<button class="token ${i === active ? 'active' : ''}" style="left:calc(${((20-p.init)/11)*82+8}% - 2.2rem)" data-person="${i}"><b>${p.init}</b>${p.name.replace('Kobold ','')}</button>`).join('')}<span class="now">CURRENT COUNT · ${person().init}</span></div></section>`;
    const deck = () => `<section class="carousel variant-c"><div class="current-card"><span class="portrait ${person().hero ? 'hero' : ''}">${person().icon}</span><div class="actor-summary"><h2>${person().name}</h2><p>${person().role}</p><div class="vitals"><div><span>Hit points</span><b>${person().hero ? '18 / 31' : '17 / 27'}</b></div><div><span>Defenses</span><b>AC 19 · F 16 · R 18 · W 14</b></div><div><span>Conditions</span><b>${person().tags.join(', ')}</b></div></div></div><div class="actions"><div class="action"><b>Standard</b><span>Ready</span></div><div class="action"><b>Move</b><span>Ready</span></div><div class="action used"><b>Minor</b><span>Used</span></div></div></div><div class="queue">${people.filter((_,i)=>i!==active).map((p,i) => `<button data-person="${people.indexOf(p)}">${i === 0 ? 'NEXT · ' : ''}${p.name} <b>${p.init}</b></button>`).join('')}</div></section>`;
    const variants = { A:['A — Film-strip carousel',film], B:['B — Initiative ruler',ruler], C:['C — Turn command deck',deck] };
    let key = new URLSearchParams(location.search).get('variant')?.toUpperCase(); if (!variants[key]) key='A';
    function render() { document.getElementById('app').innerHTML = rail()+variants[key][1](); document.getElementById('label').textContent=variants[key][0]; document.querySelectorAll('[data-person]').forEach(button => button.onclick=() => { active=Number(button.dataset.person); render(); }); }
    function move(delta) { const keys=Object.keys(variants); key=keys[(keys.indexOf(key)+delta+keys.length)%keys.length]; const url=new URL(location); url.searchParams.set('variant',key); history.replaceState(null,'',url); render(); }
    document.getElementById('previous').onclick=()=>move(-1); document.getElementById('next').onclick=()=>move(1); window.addEventListener('keydown',event => { if (!/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { if (event.key==='ArrowLeft') move(-1); if (event.key==='ArrowRight') move(1); } }); render();
  </script>
</body>
</html>

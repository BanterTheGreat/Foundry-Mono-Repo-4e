<!doctype html>
<!-- Throwaway prototype: five range treatments, switchable with ?variant=1..5. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Range design studies</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:14px var(--font-sans,system-ui);color:var(--foreground,#e9e6dc)}button,select,input{font:inherit}button,select{background:var(--card,#202322);color:var(--foreground,#e9e6dc);border:1px solid var(--border,#444944);border-radius:8px;padding:9px 12px}button{cursor:pointer}button[aria-pressed=true]{border-color:var(--foreground,#e9e6dc);background:var(--secondary,var(--card,#202322))}.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:12px 0}.toolbar label{display:flex;gap:7px;align-items:center}.toolbar input[type=range]{width:100px;accent-color:#d8ded7}.scene{position:relative;overflow:hidden;border-radius:var(--radius,12px);background:#242a28}canvas{display:block;width:100%;height:440px}.scene-caption{position:absolute;left:16px;top:14px;color:#f0eee4;letter-spacing:.13em;font-size:10px;pointer-events:none}.scene-caption span{display:block;color:#bdc5bd;letter-spacing:0;margin-top:5px;font-size:12px}.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted-foreground,#aaa89f);font-size:12px;margin:10px 0}.legend b{color:var(--foreground,#e9e6dc)}.summary{min-height:74px;margin:14px 0}.summary h2{font-size:20px;margin:0 0 6px}.summary p{margin:0;color:var(--muted-foreground,#aaa89f);line-height:1.5}.switcher{position:sticky;bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card,#202322);border:1px solid var(--border,#444944);border-radius:14px;padding:8px;width:max-content;max-width:100%;margin:16px auto 0;box-shadow:0 8px 24px #0005}.switcher .numbers{display:flex;gap:4px}.switcher button{min-width:36px}.status{color:var(--muted-foreground,#aaa89f);font-size:12px}.prototype{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted-foreground,#aaa89f)}@media(max-width:480px){canvas{height:350px}.toolbar{gap:8px;font-size:12px}.switcher{gap:4px}.switcher button{padding:8px;min-width:30px}.summary{min-height:100px}}
</style></head><body>
<div class="prototype">Range studies · interactive prototype</div>
<div class="toolbar">
 <label>Range <input id="range" type="range" min="1" max="5" value="3"><output id="range-value">3 squares</output></label>
 <label>Zoom <input id="zoom" type="range" min="65" max="150" value="100"><output id="zoom-value">100%</output></label>
 <label>Map <select id="map"><option value="dark">Dark stone</option><option value="light">Pale stone</option></select></label>
 <label><input id="long" type="checkbox">Long range</label>
 <button id="reference" aria-pressed="false">Current style</button>
</div>
<div class="scene"><div class="scene-caption">THE OLD CISTERN<span>Square-grid range · unobstructed reach</span></div><canvas id="scene" role="img" aria-label="Tactical map comparing five square-grid range overlays around a caster, with ally and enemy tokens."></canvas></div>
<div class="legend"><span><b>W</b> Caster</span><span><b>A</b> Ally</span><span><b>1–3</b> Enemies</span><span>Move over the map to measure distance</span></div>
<div class="summary" aria-live="polite"><h2 id="name"></h2><p id="description"></p></div>
<div class="status" id="status"></div>
<nav class="switcher" aria-label="Range design"><button id="previous" aria-label="Previous design">←</button><div class="numbers"><button data-variant="1">1</button><button data-variant="2">2</button><button data-variant="3">3</button><button data-variant="4">4</button><button data-variant="5">5</button></div><button id="next" aria-label="Next design">→</button></nav>
<script>
const root=document, canvas=root.getElementById('scene'),ctx=canvas.getContext('2d');
const names=['Silver mist','Surveyor’s brackets','Vector field','Warding sigil','Living grid'];
const descriptions=[
 'A bright outer lip spills a broad mist inward. The center stays clear; the edge feels like a veil draped over the battlefield.',
 'Four bold corner brackets carry the shape. Tiny edge ticks finish the measurement without enclosing the map in a solid box.',
 'Outward-facing chevrons point toward the limit of your reach. A fine rail anchors them; the broken silhouette leaves the scene open.',
 'A double ward surrounds the caster, with diamond seals and geometric inscriptions. The range reads as a spell drawn onto the floor.',
 'Individual reachable squares catch the light, getting brighter near the limit. The range reads through the grid itself rather than a floating frame.'
];
let variant=Math.max(1,Math.min(5,Number(new URLSearchParams(location.search).get('variant'))||1)), reference=false, pointer=null;
const byId=id=>root.getElementById(id);
function line(points,width=2,alpha=1,color='#f3f6ed'){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.lineWidth=width;ctx.strokeStyle=color;ctx.globalAlpha=alpha;ctx.stroke();ctx.globalAlpha=1}
function box(x,y,w,h,r,width,alpha){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.lineWidth=width;ctx.strokeStyle='#f3f6ed';ctx.globalAlpha=alpha;ctx.stroke();ctx.globalAlpha=1}
function diamond(x,y,r,alpha=1){line([[x,y-r],[x+r,y],[x,y+r],[x-r,y],[x,y-r]],2,alpha)}
function current(x,y,w){for(const [weight,alpha] of [[36,.04],[28,.08],[20,.14],[14,.22],[8,.85]])box(x,y,w,w,12,weight,alpha)}
function mist(x,y,w){for(let i=40;i>=0;i--){box(x+i/2,y+i/2,w-i,w-i,14,2,.012+(1-i/40)*.018)}box(x,y,w,w,14,3,.95);box(x-3,y-3,w+6,w+6,17,1,.25)}
function brackets(x,y,w){const a=Math.min(46,w*.22);box(x,y,w,w,12,1,.12);for(const [cx,cy,sx,sy] of [[x,y,1,1],[x+w,y,-1,1],[x+w,y+w,-1,-1],[x,y+w,1,-1]]){const p=[[cx+sx*a,cy],[cx+sx*10,cy],[cx,cy+sy*10],[cx,cy+sy*a]];line(p,18,.055);line(p,8,.12);line(p,4,.95)}for(let i=50;i<w;i+=50){line([[x+i,y-4],[x+i,y+4]],2,.55);line([[x+i,y+w-4],[x+i,y+w+4]],2,.55);line([[x-4,y+i],[x+4,y+i]],2,.55);line([[x+w-4,y+i],[x+w+4,y+i]],2,.55)}for(const [cx,cy] of [[x+w/2,y],[x+w,y+w/2],[x+w/2,y+w],[x,y+w/2]])diamond(cx,cy,5,.8)}
function vectors(x,y,w){box(x,y,w,w,10,1,.4);for(let i=25;i<w;i+=50){for(const [cx,cy,angle] of [[x+i,y,-Math.PI/2],[x+w,y+i,0],[x+i,y+w,Math.PI/2],[x,y+i,Math.PI]]){ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);const p=[[-7,-9],[1,0],[-7,9]];line(p,16,.06);line(p,7,.15);line(p,3,.95);ctx.restore()}}}
function ward(x,y,w){box(x,y,w,w,16,16,.05);box(x,y,w,w,16,2,.8);box(x+9,y+9,w-18,w-18,10,1,.35);for(const [cx,cy] of [[x,y],[x+w,y],[x+w,y+w],[x,y+w]]){ctx.beginPath();ctx.arc(cx,cy,15,0,Math.PI*2);ctx.strokeStyle='#eff6e9';ctx.lineWidth=2;ctx.stroke();diamond(cx,cy,8);diamond(cx,cy,23,.35)}for(let i=25;i<w-10;i+=50){for(const [cx,cy,angle] of [[x+i,y,0],[x+w,y+i,Math.PI/2],[x+w-i,y+w,Math.PI],[x,y+w-i,-Math.PI/2]]){ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);line([[-6,-5],[0,-11],[6,-5],[0,1],[-6,-5]],1,.65);line([[0,-11],[0,5]],1,.65);ctx.restore()}}}
function grid(x,y,w){const n=w/50;for(let row=0;row<n;row++)for(let col=0;col<n;col++){if(row===Math.floor(n/2)&&col===Math.floor(n/2))continue;const edge=Math.min(row,col,n-1-row,n-1-col),a=edge===0?.6:.14;ctx.fillStyle=`rgba(230,244,225,${edge===0?.065:.015})`;ctx.fillRect(x+col*50+2,y+row*50+2,46,46);box(x+col*50+3,y+row*50+3,44,44,4,edge===0?2:1,a)} }
const designs=[mist,brackets,vectors,ward,grid];
function draw(){const rect=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const light=byId('map').value==='light';ctx.fillStyle=light?'#9d9d8d':'#303a36';ctx.fillRect(0,0,rect.width,rect.height);const scale=Math.min(rect.width/830,rect.height/570)*Number(byId('zoom').value)/100;ctx.translate(rect.width/2,rect.height/2);ctx.scale(scale,scale);ctx.translate(-425,-285);
 for(let row=-15;row<25;row++)for(let col=-15;col<30;col++){const x=col*50,y=row*50;const v=((row*73+col*37)%11+11)%11;ctx.fillStyle=light?`hsl(58 8% ${59+v*.4}%)`:`hsl(147 9% ${19+v*.35}%)`;ctx.fillRect(x+1,y+1,48,48);ctx.strokeStyle=light?'#696d5c55':'#111d1955';ctx.lineWidth=.8;ctx.strokeRect(x+4,y+4,42,42)}
 // Sparse ruins establish a map, without suggesting that this prototype calculates line of sight.
 for(const [x,y,w,h] of [[55,75,100,35],[55,110,35,130],[705,375,75,35],[745,410,35,105]]){ctx.fillStyle=light?'#727568':'#1d2722';ctx.shadowColor='#0008';ctx.shadowBlur=12;ctx.shadowOffsetY=6;ctx.fillRect(x,y,w,h);ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.strokeStyle=light?'#b6b7a2':'#536050';ctx.strokeRect(x+3,y+3,w-6,h-6)}
 const r=Number(byId('range').value),w=(r*2+1)*50,x=425-w/2,y=275-w/2;
 if(byId('long').checked){ctx.setLineDash([10,10]);box(x-50,y-50,w+100,w+100,15,2,.4);ctx.setLineDash([])}
 (reference?current:designs[variant-1])(x,y,w);
 for(const [tx,ty,label,type] of [[425,275,'W','caster'],[325,325,'A','ally'],[575,175,'1','enemy'],[625,375,'2','enemy'],[225,125,'3','enemy']]){const dist=Math.max(Math.abs(tx-425),Math.abs(ty-275))/50;ctx.beginPath();ctx.arc(tx,ty,19,0,Math.PI*2);ctx.fillStyle=type==='enemy'?'#442d2b':type==='ally'?'#304940':'#273943';ctx.shadowBlur=8;ctx.shadowColor='#0009';ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=type==='caster'?3:2;ctx.strokeStyle=type==='caster'?'#faf5da':dist<=r?'#e7e8dc':'#8b8075';ctx.stroke();ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#f8f3e6';ctx.fillText(label,tx,ty);if(type==='enemy'&&dist<=r){ctx.beginPath();ctx.arc(tx,ty,25,-.8,.8);ctx.strokeStyle='#f1f5e9';ctx.lineWidth=2;ctx.stroke()}}
 if(pointer){const px=(pointer.x-rect.width/2)/scale+425,py=(pointer.y-rect.height/2)/scale+285,gx=Math.floor(px/50)*50,gy=Math.floor(py/50)*50,d=Math.max(Math.abs((gx+25-425)/50),Math.abs((gy+25-275)/50));box(gx+2,gy+2,46,46,4,2,.8);ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillStyle='#f5f4e9';ctx.fillText(`${d} sq · ${d<=r?'in range':'out of range'}`,gx+25,gy-12)}
 byId('range-value').textContent=`${r} squares`;byId('zoom-value').textContent=`${byId('zoom').value}%`;byId('name').textContent=reference?'Reference · Current style':`${variant} / 5 · ${names[variant-1]}`;byId('description').textContent=reference?'The approved thick white border and broad fade, scaling with the map. Toggle Current style again to return to the selected exploration.':descriptions[variant-1];byId('status').textContent=`${reference?'Current style':names[variant-1]} · Range ${r} · ${byId('zoom').value}% zoom · ${byId('long').checked?'Long range shown':'Normal range only'}`;root.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.variant)===variant&&!reference)));byId('reference').setAttribute('aria-pressed',String(reference));}
function select(n){variant=(n+4)%5+1;reference=false;try{const u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u)}catch{}draw()}
root.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>select(Number(b.dataset.variant)));byId('previous').onclick=()=>select(variant-1);byId('next').onclick=()=>select(variant+1);byId('reference').onclick=()=>{reference=!reference;draw()};['range','zoom','map','long'].forEach(id=>byId(id).oninput=draw);canvas.onpointermove=e=>{const r=canvas.getBoundingClientRect();pointer={x:e.clientX-r.left,y:e.clientY-r.top};draw()};canvas.onpointerleave=()=>{pointer=null;draw()};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();select(variant+(e.key==='ArrowRight'?1:-1))}});new ResizeObserver(draw).observe(canvas);draw();
</script></body></html>

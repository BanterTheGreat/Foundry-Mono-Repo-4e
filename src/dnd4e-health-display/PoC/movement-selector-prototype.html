<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Actor HUD movement · prototype</title><style>
*{box-sizing:border-box}body{margin:0;font:14px var(--font-sans,Arial);color:var(--foreground,#eee4cc)}button{cursor:pointer;font:inherit}button:focus-visible{outline:2px solid #e9dfce;outline-offset:2px}.intro{line-height:1.5;margin-bottom:12px}.intro small{color:var(--muted-foreground,#aaa)}.viewport{overflow:auto;border-radius:var(--radius,7px);background:var(--card,#191919)}.sizer{position:relative}.canvas{position:relative;width:1354px;height:690px;transform-origin:top left;color:#eee4cc;font:13px Arial;background:#242019}.backdrop{position:absolute;width:1354px;height:615px;inset:0;pointer-events:none}.bottom{position:absolute;top:615px;width:100%;height:75px;background:linear-gradient(#242019,#141310)}.canvas button,.canvas select{color:#e5cc8e;border:1px solid #493c26;border-radius:4px;background:#0d0c09;padding:8px 12px;min-height:34px}.canvas button:hover{border-color:#bb9654;background:linear-gradient(#ffffff0d,#ffffff0d),#0d0c09}.canvas button.active{border-color:#bb9654;background:linear-gradient(110deg,#443825,#27221b);color:#f1d7a1;box-shadow:inset 0 0 0 1px #bb965455}.movement{position:absolute;background:linear-gradient(180deg,#101011fa,#0d0d0efc);border:1px solid #8f794e;border-radius:6px;box-shadow:0 6px 18px #0007}.row{display:flex;align-items:center;gap:5px}.row button{flex:1;white-space:nowrap}.heading{color:#ab9873;text-transform:uppercase;letter-spacing:1px;font-size:10px}.readout{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.readout strong{font:600 16px Georgia}.hint{color:#b7aa8d;font-size:11px;margin-top:8px}.strip{left:573px;top:436px;width:762px;padding:9px 10px;display:flex;align-items:center;gap:12px}.strip .row{flex:1}.strip select{width:100px}.portrait-bottom{position:absolute;left:10px;top:398px;width:264px;padding:0 14px 14px;background:linear-gradient(#101011,#0d0d0e);border:1px solid #8f794e;border-top:0;border-radius:0 0 7px 7px}.resources{display:flex;justify-content:space-between;color:#b9a689;font-size:11px;padding:14px 0 10px;border-bottom:1px solid #493c26}.resources b{font:19px Georgia;color:#d4b565}.portrait-move{padding:12px 0;border-bottom:1px solid #493c26}.portrait-move .row button{padding:7px 5px;font-size:12px}.party{margin-top:13px}.party-title{font-weight:bold;font-size:11px;letter-spacing:1.2px;color:#a98f6c;text-transform:uppercase}.member{margin-top:13px}.member>div{display:flex;justify-content:space-between;font-size:13px}.member span{font-size:12px;color:#bbae92}.bars{height:7px;display:flex;gap:4px;margin-top:6px}.bars i{background:#b54e63;flex:1}.trigger{position:absolute;left:573px;top:450px;min-width:155px}.popup{left:573px;top:229px;width:345px;padding:0}.popup header{display:flex;justify-content:space-between;align-items:center;padding:10px;background:linear-gradient(110deg,#292318,#101010);border-bottom:1px solid #655433;font:600 14px Georgia}.popup header button{min-height:24px;padding:1px 7px}.popup .content{padding:12px}.popup .row button{padding:8px}.popup p{margin:10px 0;font-size:12px;color:#b7aa8d}.badge{position:absolute;left:566px;top:165px;border:1px solid #bb9654;background:#141310ec;padding:7px 13px;border-radius:4px;color:#f1d7a1}.existing-hit{position:absolute;top:496px;height:39px;border:0!important;opacity:0;padding:0!important}.existing-popup{left:573px;top:326px;width:345px;padding:12px}.existing-popup p{border-left:3px solid #5caa69;padding:10px;margin:6px 0;background:#ffffff05}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tools button,.switcher button{padding:8px 12px;border:1px solid var(--border,#655433);border-radius:5px;background:var(--secondary,#25251f);color:var(--foreground,#eee4cc)}.state{padding:12px 16px;border-radius:var(--radius,7px);background:var(--card,#20201d);line-height:1.6;font-size:13px}.switcher{position:sticky;bottom:10px;display:flex;gap:12px;align-items:center;width:max-content;max-width:100%;margin:16px auto 4px;padding:6px;background:var(--popover,#242424);border:1px solid var(--border,#655433);border-radius:30px;box-shadow:0 4px 20px #0006}.switcher button{border-radius:50%}.details{font-size:12px;color:var(--muted-foreground,#aaa);margin:8px 0}
</style></head><body>
<!-- Throwaway: three movement additions to the current two-part Actor HUD. Source: actor-portrait.hbs, actor-display.hbs, actor-display.js, actor-display.css. Screenshot supplies the unmodified host UI. -->
<div class="intro"><small>THROWAWAY · CURRENT ACTOR HUD</small><br><span id="description"></span></div>
<div class="viewport" id="viewport"><div class="sizer" id="sizer"><div class="canvas" id="canvas"><img class="backdrop" src="movement-prototype-backdrop.png" alt="Current Foundry canvas with Sedrior Wardyn's portrait panel, party health and actor menus above the hotbar"><div class="bottom"></div><div id="ui"></div></div></div></div>
<div class="tools"><button onclick="zoom()">Toggle fit / actual size</button><button onclick="complete()">Complete movement</button><button onclick="cancelDrag()">Cancel drag</button><button onclick="reset()">Reset</button></div>
<div class="state" id="state" aria-live="polite"></div>
<div class="details">Screenshot preserves the existing UI. New movement controls and sample Standard/Minor menus are interactive. Distances are sample values; no Foundry rules or documents are changed.</div>
<nav class="switcher" aria-label="Prototype variants"><button onclick="cycle(-1)" aria-label="Previous variant">←</button><span id="variant"></span><button onclick="cycle(1)" aria-label="Next variant">→</button></nav>
<script>
const variants={A:['Above the hotbar','A · Always-visible movement strip above the existing menu row.'],B:['Inside the portrait','B · Movement between resources and party health; the existing bottom menus stay in place.'],C:['Compact popup','C · A current-movement button above the menu row, opening upward like the existing HUD menus.']};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants[variant])variant='A';
let action='Walk',travel='Ground',popup=false,menu=null,fit=true,message='Choose Walk, Shift or Run. The selected mode stays visible.',used=null;
const speeds={Ground:6,Fly:8,Swim:3};
function distance(x=action){return x==='Shift'?1:x==='Run'?speeds[travel]+2:speeds[travel]}
function current(){return action+' · '+distance()+' sq'+(travel==='Ground'?'':' · '+travel)}
function choices(){return '<div class="row">'+['Walk','Shift','Run'].map(x=>'<button aria-pressed="'+(action===x)+'" class="'+(action===x?'active':'')+'" onclick="choose(\''+x+'\')">'+x+' <b>'+distance(x)+'</b></button>').join('')+'</div>'}
function select(){return '<select aria-label="Travel mode" onchange="mode(this.value)">'+Object.keys(speeds).map(x=>'<option '+(travel===x?'selected':'')+'>'+x+'</option>').join('')+'</select>'}
function party(){return '<div class="party"><div class="party-title">Party health</div>'+['Gorktholomew','Idrani Fullhorn',"Mork’allande"].map(x=>'<div class="member"><div>'+x+'<span>Healthy</span></div><div class="bars"><i></i><i></i><i></i><i></i></div></div>').join('')+'</div>'}
function render(){
let h='';
if(variant==='A')h='<section class="movement strip" aria-label="Movement"><div><div class="heading">Movement</div><strong>'+current()+'</strong></div>'+choices()+select()+'</section>';
if(variant==='B')h='<section class="portrait-bottom"><div class="resources">TEMP HP <b style="color:#7bc5dd">0</b> SURGES <b>9<small>/9</small></b></div><div class="portrait-move"><div class="readout"><span class="heading">Movement</span><strong>'+current()+'</strong></div>'+choices()+'<div class="row" style="margin-top:8px"><span class="hint" style="flex:1;margin:0">Travel mode</span>'+select()+'</div></div>'+party()+'</section>';
if(variant==='C'){h='<button class="trigger '+(popup?'active':'')+'" onclick="toggle()" aria-expanded="'+popup+'">↗ '+current()+' ▴</button>';if(popup)h+='<section class="movement popup"><header>Movement · Sedrior Wardyn<button aria-label="Close movement" onclick="toggle()">×</button></header><div class="content"><div class="readout"><strong>'+current()+'</strong>'+select()+'</div>'+choices()+'<p>Shift and Run apply to the next completed movement.</p></div></section>'}
if(action!=='Walk')h+='<div class="badge">'+current()+' · next movement</div>';
h+='<button class="existing-hit" style="left:573px;width:70px" aria-label="Open Standard powers" onclick="openMenu(\'Standard\')"></button><button class="existing-hit" style="left:647px;width:70px" aria-label="Open Minor powers" onclick="openMenu(\'Minor\')"></button>';
if(menu)h+='<section class="movement existing-popup"><div class="readout"><strong>'+menu+' powers</strong><button onclick="openMenu(null)" aria-label="Close powers">×</button></div><p>'+(menu==='Standard'?'Melee Basic Attack':'Minor power')+'</p><span class="hint">Sample menu: opening powers closes the movement popup.</span></section>';
document.getElementById('ui').innerHTML=h;document.getElementById('variant').textContent=variant+' · '+variants[variant][0];document.getElementById('description').textContent=variants[variant][1];
document.getElementById('state').innerHTML='<strong>Prepared: '+current()+'</strong> · '+(action==='Walk'?'stays selected':'next completed movement only')+'<br>'+message+'<br><small>Travel: '+travel+' · Action: '+action+' · Last completed: '+(used||'none')+'</small>';size()}
function choose(x){action=x;popup=false;menu=null;message=x+' prepared. '+(x==='Walk'?'':'Returns to Walk after completion.');render()}
function mode(x){travel=x;message='Travel mode stays '+x+' until changed.';render()}
function toggle(){popup=!popup;menu=null;render()}
function openMenu(x){menu=menu===x?null:x;popup=false;render()}
function complete(){used=current();message='Completed '+used+'.';action='Walk';popup=false;menu=null;message+=' Next: '+current()+'.';render()}
function cancelDrag(){message='Drag cancelled; '+current()+' remains prepared.';render()}
function reset(){action='Walk';travel='Ground';popup=false;menu=null;used=null;message='Reset to Walk · 6 sq.';render()}
function size(){const scale=fit?Math.min(1,document.getElementById('viewport').clientWidth/1354):1;document.getElementById('canvas').style.transform='scale('+scale+')';document.getElementById('sizer').style.width=(1354*scale)+'px';document.getElementById('sizer').style.height=(690*scale)+'px'}
function zoom(){fit=!fit;size()}
function cycle(n){variant=Object.keys(variants)[(Object.keys(variants).indexOf(variant)+n+3)%3];popup=false;menu=null;try{let u=new URL(location.href);u.searchParams.set('variant',variant);history.replaceState(null,'',u)}catch{}render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){popup=false;menu=null;render()}if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
document.getElementById('canvas').addEventListener('pointerdown',e=>{if(e.target.closest('button,select,.movement,.portrait-bottom'))return;if(popup||menu){popup=false;menu=null;render()}});
window.addEventListener('resize',size);render();
</script></body></html>

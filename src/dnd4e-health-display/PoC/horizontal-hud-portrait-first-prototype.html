<!doctype html>
<!--
  THROWAWAY UI PROTOTYPE — not Foundry production code.
  Question: Can the horizontal HUD reorganize combat data while retaining a
  full-size, prominent portrait? Layouts switch via ?variant=radial|crest|bands|folio.
  Open this file directly in a browser. It has no Foundry integration or persistence.
-->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizontal HUD — portrait-first prototype</title>
<style>
  :root{color-scheme:dark;--ink:#090a0b;--panel:#151314;--panel2:#211b18;--line:#9e7652;--gold:#e5bd84;--paper:#f7e7d5;--muted:#bba18a;--red:#dc616b;--blue:#8fcfe7;--green:#88ba8a;font-family:Signika,"Segoe UI",sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(ellipse at 50% 10%,#37332b,#121416 48%,#070809);color:var(--paper)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background:repeating-linear-gradient(90deg,transparent 0 47px,#fff 48px),repeating-linear-gradient(0deg,transparent 0 47px,#fff 48px)}button{font:inherit;color:inherit;cursor:pointer}.stage{position:relative;z-index:1;width:min(1080px,calc(100vw - 26px));margin:3.25rem auto 6rem}.prompt{max-width:780px;margin:0 auto 1rem;text-align:center;color:#ddc9b1;font-size:.85rem;line-height:1.35}.prompt b{color:var(--gold)}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:.65rem;margin-bottom:.9rem}.tab{height:42px;border:1px solid var(--line);border-radius:10px;background:#141313e8;color:#bda183;box-shadow:0 4px 12px #0008;font-size:.78rem;font-weight:bold;letter-spacing:.05em;text-transform:uppercase}.tab:first-child{background:linear-gradient(#3c2d20,#1b1613);color:var(--gold)}.hud{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#121113f8,#08090af8);box-shadow:0 14px 36px #000b,inset 0 0 0 3px #fff1}.hud:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,#fff1,transparent 17%,transparent 82%,#0004)}.portrait{position:relative;min-width:250px;min-height:294px;overflow:hidden;border:3px solid #735038;border-radius:10px;background:radial-gradient(circle at 45% 18%,#f1e3c4 0 18%,transparent 19%),linear-gradient(140deg,#e5d1ad,#b0a083 43%,#743844 44% 64%,#211719 65%);box-shadow:inset 0 0 0 2px #ffe5bd55}.portrait:before{content:"";position:absolute;z-index:1;width:68px;height:145px;left:calc(50% - 34px);top:44px;border-radius:44% 48% 23% 23%;background:linear-gradient(100deg,#681d2c,#bd4a59 41%,#39121d 42%);transform:skew(-6deg)}.portrait:after{content:"";position:absolute;z-index:2;width:158px;height:100px;left:calc(50% - 75px);bottom:-30px;border-radius:55% 55% 0 0;background:#5a2639;transform:rotate(-5deg)}h1,h2,p{margin:0}.name{color:#f4d3aa;font-family:Georgia,serif;font-size:clamp(1.7rem,3.2vw,2.65rem);line-height:1}.sub{margin-top:.35rem;color:var(--muted);font-style:italic}.label{display:block;color:var(--muted);font-size:.63rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.value{font-family:Georgia,serif;font-size:1.3rem;font-weight:bold}.hp-value{color:#ffd077;font-family:Georgia,serif;font-size:3.2rem;font-weight:bold;line-height:.9}.hp-value small{color:var(--muted);font:700 .78rem Signika,sans-serif}.hp-line{height:12px;overflow:hidden;border:1px solid #000;border-radius:999px;background:#3a171b;box-shadow:inset 0 1px 4px #000}.hp-line i{display:block;width:75%;height:100%;background:linear-gradient(90deg,#a32f40,#e67079);box-shadow:0 0 9px #e2616a}.defenses{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.def{min-width:0;padding:.35rem .2rem;border:1px solid #806048;border-radius:6px;background:#211b18;text-align:center}.def b{display:block;font:700 1.15rem Georgia,serif}.def span{display:block;color:var(--muted);font-size:.54rem;font-weight:bold;letter-spacing:.05em;text-transform:uppercase}.actions{display:flex;gap:.42rem}.action{position:relative;display:grid;place-items:center;width:43px;height:43px;border:1px solid var(--line);border-radius:8px;background:#141314;box-shadow:0 3px 10px #0008;font-size:1.2rem}.action:first-child:after{content:"1";position:absolute;right:-5px;bottom:-5px;padding:0 4px;border-radius:9px;background:#bb873d;color:#1b150d;font:bold .68rem sans-serif}.meter{display:flex;gap:2px;height:8px}.meter i{flex:1;background:#2a211c;border:1px solid #0008}.meter i.on{background:linear-gradient(#f0d786,#a67734)}
  /* A — “Crest”: the portrait is a visual coat of arms; the name overlays it and HP becomes the adjacent banner. */
  .crest{display:grid;grid-template-columns:270px 1fr}.crest .portrait-wrap{position:relative;padding:14px}.crest .portrait{height:294px}.crest .identity{position:absolute;z-index:2;right:26px;bottom:25px;left:26px;padding:.7rem .75rem;border-top:1px solid #d5a36b;background:linear-gradient(90deg,#0b0b0ddd,#281b17cc);text-shadow:0 2px 4px #000}.crest .identity h1{font-size:1.5rem}.crest .right{display:grid;grid-template-rows:auto 1fr auto;gap:18px;padding:24px 24px 18px;border-left:1px solid #72513b}.crest .right-top{display:flex;align-items:start;justify-content:space-between;gap:1rem}.crest .right-top h2{color:var(--gold);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase}.crest .hp-hero{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:18px}.crest .health-copy{display:grid;gap:8px}.crest .bottom{display:flex;align-items:end;gap:12px}.crest .bottom .defenses{flex:1}.crest .actions{margin-left:auto}
  /* D — Variant A's portrait/name treatment, now paired with a deliberately equal-weight radial health read. */
  .crest-radial{display:grid;grid-template-columns:270px 1fr}.crest-radial .portrait-wrap{position:relative;padding:14px}.crest-radial .portrait{height:294px}.crest-radial .identity{position:absolute;z-index:2;right:26px;bottom:25px;left:26px;padding:.7rem .75rem;border-top:1px solid #d5a36b;background:linear-gradient(90deg,#0b0b0ddd,#281b17cc);text-shadow:0 2px 4px #000}.crest-radial .identity h1{font-size:1.5rem}.crest-radial .right{display:grid;grid-template-rows:43px 164px 54px;gap:9px;padding:16px 18px;border-left:1px solid #72513b}.crest-radial .right-top{display:flex;align-items:center;justify-content:space-between;gap:1rem}.crest-radial .right-top h2{color:var(--gold);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase}.crest-radial .heading-actions{display:flex;align-items:center;gap:.8rem}.crest-radial .heading-actions .actions{gap:.3rem}.crest-radial .heading-actions .action{width:38px;height:38px}.radial-layout{display:grid;grid-template-columns:164px 1fr;align-items:stretch;gap:12px}.radial-dial{position:relative;width:164px;height:164px;border-radius:50%;background:conic-gradient(var(--red) 0deg 271deg,#3a1b1e 271deg 360deg);box-shadow:0 0 0 1px #000,0 5px 14px #0009}.radial-dial:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(#0b0b0dcc 0deg 1.3deg,transparent 1.3deg 9deg)}.radial-dial:after{content:"";position:absolute;inset:14px;border:1px solid #613035;border-radius:50%;background:radial-gradient(circle,#161315,#0a0a0b);box-shadow:inset 0 0 13px #000}.dial-inner{position:absolute;z-index:1;inset:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.dial-inner .label{color:#e9abab}.dial-inner strong{color:#ffd077;font:700 2.6rem Georgia,serif;line-height:1}.dial-inner small{margin-top:.2rem;color:var(--muted);font-size:.75rem}.radial-detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,1fr);gap:6px}.radial-detail .statline{display:flex;align-items:center;justify-content:space-between;gap:.45rem;padding:.55rem .65rem;border:1px solid #806048;border-radius:7px;background:#211b18}.radial-detail .statline .label:last-child{font-size:.54rem}.radial-detail .value{font-size:1.2rem;white-space:nowrap}.crest-radial .bottom{display:flex;align-items:stretch}.crest-radial .bottom .defenses{width:100%;gap:5px}.crest-radial .bottom .def{display:grid;place-items:center;padding:.28rem}.crest-radial .bottom .def b{font-size:1.08rem}
  /* B — “Bands”: data is not card-shaped; three broad, readable status bands sit beside the uninterrupted art. */
  .bands{display:grid;grid-template-columns:270px 1fr;gap:0}.bands .portrait-wrap{padding:14px;border-right:1px solid #72513b}.bands .portrait{height:294px}.bands .side{padding:14px 22px}.bands .identity{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:14px}.bands .identity .actions{flex:0 0 auto}.bands .band{display:grid;grid-template-columns:142px 1fr 104px;align-items:center;gap:16px;min-height:72px;padding:10px 0;border-top:1px solid #ffffff1d}.bands .band:first-of-type{border-top:2px solid #9f523f}.bands .band-name{color:#d9c0a3;font-size:.76rem;font-weight:bold;letter-spacing:.06em;text-transform:uppercase}.bands .band .value{text-align:right}.bands .band .hp-value{font-size:2.3rem}.bands .defenses{grid-template-columns:repeat(6,1fr)}
  /* C — “Folio”: portrait and identity form a page; data lives in two named columns rather than a dashboard. */
  .folio{display:grid;grid-template-columns:270px minmax(280px,1fr) 245px;gap:16px;padding:14px}.folio .portrait{height:294px}.folio .identity{margin-top:.75rem}.folio .identity h1{font-size:1.65rem}.folio .vitals{display:flex;flex-direction:column;gap:0;padding-top:5px}.folio h2{margin:0 0 .7rem;color:var(--gold);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}.folio .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;min-height:55px;border-top:1px solid #ffffff1d}.folio .row .value{font-size:1.45rem}.folio .row .hp-value{font-size:2.55rem}.folio .row .hp-line{grid-column:1 / -1;margin-top:-10px}.folio .reference{padding:5px 0 0 16px;border-left:1px solid #72513b}.folio .reference .defenses{grid-template-columns:repeat(2,1fr);gap:6px}.folio .reference .def{padding:.55rem .2rem}.folio .reference .actions{margin-top:16px;justify-content:space-between}
  .note{position:relative;z-index:1;margin-top:.8rem;padding:.68rem .8rem;border-left:3px solid var(--gold);background:#161413c8;color:#d8c2aa;font-size:.8rem;line-height:1.35}.note b{color:#f4d5aa}.switcher{position:fixed;z-index:5;bottom:15px;left:50%;display:flex;align-items:center;gap:.3rem;padding:.35rem;border:1px solid var(--gold);border-radius:999px;background:#0c0d0e;box-shadow:0 8px 24px #000c;transform:translateX(-50%)}.switcher button{width:32px;height:30px;border:0;border-radius:999px;background:transparent;color:var(--gold);font-size:1.15rem}.switcher button:hover{background:#3e2e20}.switcher output{min-width:185px;text-align:center;color:#f4dfc1;font-size:.77rem;font-weight:bold}@media(max-width:760px){.stage{margin-top:1rem}.crest,.crest-radial,.bands,.folio{grid-template-columns:1fr}.crest .portrait-wrap,.crest-radial .portrait-wrap,.bands .portrait-wrap{border:0;border-bottom:1px solid #72513b}.crest .portrait,.crest-radial .portrait,.bands .portrait{height:294px}.crest .right,.crest-radial .right,.bands .side{padding:16px}.folio .reference{padding:10px 0 0;border:0;border-top:1px solid #72513b}.folio .reference .defenses{grid-template-columns:repeat(6,1fr)}.folio .reference .actions{justify-content:start}.bands .band{grid-template-columns:105px 1fr 72px;gap:8px}.bands .defenses{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><main class="stage"><p class="prompt"><b>Portrait-first experiment:</b> the illustration stays at a minimum 250 × 294px in every design. The question is how the rest of the HUD can frame it without competing with it.</p><nav class="tabs" aria-label="Actor display sections"><button class="tab">⚔ Powers</button><button class="tab">◈ Skills</button><button class="tab">▤ Feats</button><button class="tab">▦ Items</button></nav><section id="app" aria-live="polite"></section></main><nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous">←</button><output id="label"></output><button id="next" aria-label="Next">→</button></nav>
<script>
const keys=['radial','crest','bands','folio'];const labels={radial:'D · Crest + radial health',crest:'A · Crest banner',bands:'B · Status bands',folio:'C · Character folio'};const notes={radial:'<b>Portrait and HP as the two anchors.</b> This keeps Variant A’s name-and-rank treatment on the image, but restores the radial read as the visual answer to “how hurt am I?”',crest:'<b>Portrait as crest.</b> The identity belongs to the art, while the adjacent banner carries a single big health read. This is the most cinematic option.',bands:'<b>Portrait as anchor.</b> Three horizontal bands replace the small cards: health, recovery, and roll reference. It is easiest to scan left-to-right during a turn.',folio:'<b>Portrait as character sheet.</b> Combat information is deliberately labeled and quiet. This trades a little speed for maximum clarity and makes the portrait a full first column.'};
const defs=[['⬟','AC',25],['✚','Fort',24],['ϟ','Ref',23],['✦','Will',20],['♞','Init',12],['↔','Speed',5]];const defense=()=>`<div class="defenses">${defs.map(d=>`<div class="def"><b>${d[0]} ${d[2]}</b><span>${d[1]}</span></div>`).join('')}</div>`;const meter=()=>`<div class="meter">${Array.from({length:12},(_,i)=>`<i class="${i<11?'on':''}"></i>`).join('')}</div>`;const actions=()=>`<div class="actions"><button class="action" title="Spend action point">ϟ</button><button class="action" title="Saving throw">★</button><button class="action" title="Healing">＋</button><button class="action" title="Rest">▰</button></div>`;
function crest(){return`<div class="hud crest"><section class="portrait-wrap"><div class="portrait" aria-label="Idrani Fullhorn portrait"></div><div class="identity"><h1>Idrani Fullhorn</h1><p class="sub">Level 10 Fighter</p></div></section><section class="right"><div class="right-top"><h2>Battle condition</h2><span class="label" style="color:var(--green)">● Conscious</span></div><div class="hp-hero"><div class="hp-value">70 <small>of 93</small></div><div class="health-copy"><span class="label" style="color:#efafb1">Hit points · bloodied at 46</span><div class="hp-line"><i></i></div><span class="label">23 hit points before bloodied</span></div></div><div class="bottom">${defense()}${actions()}</div></section></div><p class="note">${notes.crest}</p>`}
function radial(){return`<div class="hud crest-radial"><section class="portrait-wrap"><div class="portrait" aria-label="Idrani Fullhorn portrait"></div><div class="identity"><h1>Idrani Fullhorn</h1><p class="sub">Level 10 Fighter</p></div></section><section class="right"><div class="right-top"><h2>Battle condition</h2><div class="heading-actions"><span class="label" style="color:var(--green)">● Conscious</span>${actions()}</div></div><div class="radial-layout"><div class="radial-dial" aria-label="70 of 93 hit points"><div class="dial-inner"><span class="label">Hit points</span><strong>70</strong><small>of 93 · bloodied 46</small></div></div><div class="radial-detail"><div class="statline"><span><span class="label">Temporary HP</span><span class="label" style="margin-top:.2rem">Absorbs damage first</span></span><span class="value" style="color:var(--blue)">0</span></div><div class="statline"><span class="label">Healing surges</span><span class="value">11 / 12</span></div><div class="statline"><span class="label">Action points</span><span class="value">1</span></div><div class="statline"><span><span class="label">Second wind</span><span class="label" style="margin-top:.2rem">Standard action</span></span><span class="value" style="color:var(--green)">Ready</span></div></div></div><div class="bottom">${defense()}</div></section></div><p class="note">${notes.radial}</p>`}
function bands(){return`<div class="hud bands"><section class="portrait-wrap"><div class="portrait" aria-label="Idrani Fullhorn portrait"></div></section><section class="side"><div class="identity"><div><h1>Idrani Fullhorn</h1><p class="sub">Level 10 Fighter</p></div>${actions()}</div><div class="band"><span class="band-name">Hit points</span><div><div class="hp-line"><i></i></div><span class="label" style="margin-top:.38rem">Bloodied at 46</span></div><span class="hp-value">70 <small>/93</small></span></div><div class="band"><span class="band-name">Recovery</span><div><span class="label">Healing surges</span>${meter()}</div><span class="value">11 / 12</span></div><div class="band"><span class="band-name">Roll reference</span>${defense()}<span class="value" style="color:var(--blue)">Temp 0</span></div></section></div><p class="note">${notes.bands}</p>`}
function folio(){return`<div class="hud folio"><section><div class="portrait" aria-label="Idrani Fullhorn portrait"></div><div class="identity"><h1>Idrani Fullhorn</h1><p class="sub">Level 10 Fighter</p></div></section><section class="vitals"><h2>Vital record</h2><div class="row"><span><span class="label">Hit points</span><span class="label" style="margin-top:.25rem;color:#e9a3a5">Bloodied at 46</span></span><span class="hp-value">70 <small>/ 93</small></span><div class="hp-line"><i></i></div></div><div class="row"><span class="label">Temporary hit points</span><span class="value" style="color:var(--blue)">0</span></div><div class="row"><span><span class="label">Healing surges</span>${meter()}</span><span class="value">11 / 12</span></div><div class="row"><span class="label">Action points</span><span class="value">1</span></div></section><aside class="reference"><h2>Defense record</h2>${defense()}${actions()}</aside></div><p class="note">${notes.folio}</p>`}
const renderers={radial,crest,bands,folio};function current(){const key=new URLSearchParams(location.search).get('variant');return keys.includes(key)?key:'radial'}function render(){const key=current();document.getElementById('app').innerHTML=renderers[key]();document.getElementById('label').textContent=labels[key]}function change(step){const key=keys[(keys.indexOf(current())+step+keys.length)%keys.length],url=new URL(location);url.searchParams.set('variant',key);history.replaceState(null,'',url);render()}document.getElementById('prev').onclick=()=>change(-1);document.getElementById('next').onclick=()=>change(1);document.addEventListener('keydown',e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName)&&!e.target.isContentEditable){if(e.key==='ArrowLeft')change(-1);if(e.key==='ArrowRight')change(1)}});render();
</script></body></html>

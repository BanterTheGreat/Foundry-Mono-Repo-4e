<!doctype html>
<!-- THROWAWAY: Three mobile main-character screens in the saved Printed rulebook style.
     Native Android design study expressed as standalone HTML, not production web UI.
     Open: open src/character-builder/android/prototypes/main-character.prototype.html
     Share variants with ?variant=A, B, C. Mock state only; no storage or rules engine. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modern 4e · Mobile character view prototype</title>
<style>
:root{--background:transparent;--foreground:#322b25;--muted:#71675c;--border:#c9bda7;--radius:16px;--font-sans:Calibri,'Segoe UI',sans-serif;--paper:#f3eddf;--ink:#322b25;--dim:#71675c;--line:#c9bda7;--accent:#863f36;--wash:#e8ddcb}
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);color:var(--foreground)}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;touch-action:manipulation}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.intro,.explanation,.state{max-width:410px;margin:12px auto;font-size:12px;line-height:1.5;color:var(--muted)}.intro b{letter-spacing:.1em;font-size:10px}.phone{position:relative;max-width:410px;margin:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 35px #0002}.topbar{height:62px;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;padding:0 12px;border-bottom:1px solid var(--line)}.character-name{font:normal 24px Georgia,serif;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:transparent;border:0;min-height:44px;padding:6px 10px;color:var(--ink)}.icon{border:0;background:transparent;min-width:44px;min-height:44px;font-size:23px;padding:8px}.viewport{height:650px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}.page{padding:22px 20px 28px}.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600}.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.display-field{position:relative;display:block;text-align:left;min-width:0;padding:13px 14px;background:transparent;border:1px solid var(--line);border-radius:3px;min-height:76px}.display-field:after{content:'↗';position:absolute;right:9px;top:9px;font-size:11px;color:var(--accent);opacity:.65}.display-field strong{display:block;font:normal 21px/1.25 Georgia,serif;margin-top:8px;overflow-wrap:anywhere}.display-field.full{grid-column:1/-1}.display-field.prominent{background:var(--wash);border-color:var(--line)}.display-field.prominent strong{color:var(--accent)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px}.section-head h2{font:normal 24px Georgia,serif;margin:0}.section-head small{color:var(--dim);font-size:10px;letter-spacing:.06em}.ability-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.ability{position:relative;min-height:85px;border:1px solid var(--line);border-top:2px solid var(--accent);background:transparent;padding:12px 3px;text-align:center;border-radius:2px}.ability strong{display:block;font:normal 30px Georgia,serif;color:var(--accent);margin:7px 0 0}.ability small{font-size:10px;color:var(--dim)}.skills{display:flex;flex-wrap:wrap;gap:8px;width:100%;padding:0;text-align:left;border:0;background:transparent}.skill{border:1px solid var(--line);padding:10px 12px;min-height:40px;background:var(--wash);font-size:13px;border-radius:3px}.edit-link{min-height:40px;background:transparent;border:0;color:var(--accent);font-size:12px;padding:8px 0 8px 10px}.notes-display{display:block;width:100%;min-height:110px;padding:16px;text-align:left;background:linear-gradient(#ffffff15,#ffffff15),var(--wash);border:1px solid var(--line);border-left:3px solid var(--accent);color:var(--ink);font:italic 14px/1.8 Georgia,serif;white-space:pre-wrap;overflow-wrap:anywhere}.ledger .display-field{display:flex;align-items:center;justify-content:space-between;border:0;border-bottom:1px solid var(--line);border-radius:0;min-height:55px;padding:10px 18px 10px 0;gap:15px}.ledger .display-field strong{text-align:right;margin:0;font-size:18px}.ledger .display-field:after{right:0;top:20px}.ledger .prominent{background:transparent}.chapter{border-bottom:1px solid var(--line);margin-bottom:12px}summary{display:flex;align-items:center;list-style:none;min-height:56px;cursor:pointer;font:23px Georgia,serif}summary::-webkit-details-marker{display:none}summary:after{content:'−';margin-left:auto;color:var(--accent)}details:not([open]) summary:after{content:'+'}.chapter .profile-grid{padding-bottom:16px}.bottomnav{display:grid;grid-template-columns:repeat(2,1fr);padding:4px 12px 8px;border-top:1px solid var(--line);background:var(--paper)}.bottomnav button{position:relative;background:transparent;border:0;min-height:54px;color:var(--dim);font-size:11px}.bottomnav .nav-icon{position:relative;display:block;width:38px;margin:0 auto 4px;font:20px Georgia,serif}.bottomnav .badge{position:absolute;left:25px;top:-2px;display:grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:20px;background:var(--accent);color:var(--paper);font:10px var(--font-sans)}.bottomnav button.active{color:var(--accent);font-weight:700}.switcher{display:flex;align-items:center;justify-content:space-between;gap:8px;width:min(360px,100%);margin:18px auto 10px;padding:7px;background:#282d35;color:white;border-radius:30px;box-shadow:0 4px 18px #0003;font:12px system-ui,sans-serif}.switcher button{border:0;background:#444b56;color:white;width:42px;height:42px;border-radius:50%;font-size:19px}.switcher small{display:block;font-size:10px;color:#c6ccd4;margin-top:4px}.switcher div{text-align:center}.overlay{position:absolute;inset:0;background:#322b2566;z-index:5;display:flex;align-items:end}.overlay[hidden]{display:none}.sheet{width:100%;max-height:90%;overflow:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:12px 22px 22px;box-shadow:0 -10px 35px #0002}.handle{height:3px;width:36px;background:var(--line);margin:0 auto 10px}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet h2{font:normal 28px Georgia,serif;margin:12px 0}.field{display:block;margin:18px 0;font-size:12px;color:var(--dim)}.field input,.field textarea,.field select{display:block;margin-top:8px;width:100%;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:13px;font-size:17px;min-height:48px}.field textarea{min-height:180px;resize:vertical;line-height:1.5}.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.primary,.secondary{border:1px solid var(--accent);background:var(--accent);color:var(--paper);border-radius:3px;padding:12px 16px;min-height:46px;font-size:14px}.secondary{background:transparent;color:var(--accent)}.option{display:block;border-bottom:1px solid var(--line);padding:13px 0;font-size:14px;min-height:46px}.option input{accent-color:var(--accent);margin-right:10px}.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.subtle{color:var(--dim);font-size:12px;line-height:1.6}.row{display:flex;align-items:center;justify-content:space-between;text-align:left;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:15px 0;min-height:62px}.row small{display:block;color:var(--dim);font-size:12px;margin-top:5px}.row .chevron{color:var(--accent);font-size:22px}.tag{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}.profile-heading{font:normal 32px Georgia,serif;margin:8px 0 6px}.state{padding-top:10px;border-top:1px solid var(--border);font-size:11px}.explanation{min-height:38px}.error{color:var(--accent);font-size:13px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:380px){.page{padding:18px 15px 26px}.phone{border-radius:14px}.display-field{padding:12px}.display-field strong{font-size:19px}}

.folio .level-portrait{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:12px;margin-bottom:12px}.level-display{position:relative;display:flex;align-items:center;gap:18px;text-align:left;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--wash);padding:12px 18px;min-height:104px}.level-display strong{font:normal 65px/.95 Georgia,serif;color:var(--accent)}.level-display:after{content:'↗';position:absolute;right:10px;top:10px;color:var(--accent);font-size:12px}.portrait{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:var(--wash);border:1px solid var(--line);border-radius:3px;color:var(--dim);min-height:104px;overflow:hidden}.portrait svg{width:42px;height:44px;stroke:var(--dim);fill:none;stroke-width:1;opacity:.65}.portrait small{font-size:9px;letter-spacing:.12em;text-transform:uppercase}.portrait:before,.portrait:after{content:'';position:absolute;width:13px;height:13px;border-color:var(--accent);opacity:.6}.portrait:before{top:5px;left:5px;border-top:1px solid;border-left:1px solid}.portrait:after{right:5px;bottom:5px;border-bottom:1px solid;border-right:1px solid}.folio .profile-grid{gap:7px}.folio .display-field{min-height:59px;padding:8px 11px}.folio .display-field strong{font-size:18px;line-height:1.2;margin-top:4px}.folio .display-field .eyebrow{font-size:9px}.folio .display-field.prominent{background:transparent}.folio .display-field.prominent strong{color:var(--ink)}.folio .section-head{margin:17px 0 8px}.folio .section-head h2{font-size:22px}.folio .ability-grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.folio .ability{min-height:61px;padding:7px 2px}.folio .ability strong{font-size:25px;margin-top:4px}.folio .ability small{font-size:9px;letter-spacing:.04em}.folio .skills{gap:6px}.folio .skill{font-size:12px;min-height:35px;padding:8px 10px}.folio .edit-link{min-height:35px;padding-top:5px;padding-bottom:5px}.folio .notes-display{min-height:96px}

.folio .level-summary{display:flex;flex-direction:column;justify-content:center;min-width:0;min-height:104px;border-left:3px solid var(--accent);background:var(--wash);border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-right:1px solid var(--line)}.folio .level-display{display:block;width:100%;min-height:64px;padding:10px 13px 3px;border:0;background:transparent;font:normal clamp(32px,8vw,42px)/1.15 Georgia,serif;white-space:nowrap;color:var(--accent)}.folio .level-display strong{font:inherit}.folio .level-display:after{top:8px;right:8px;font:11px var(--font-sans)}.character-facts{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:7px 13px 12px;font-size:12px;color:var(--dim)}.character-facts>span+span{border-left:1px solid var(--line);padding-left:10px}.folio .personal-details{grid-template-columns:repeat(3,minmax(0,1fr))}.folio .language-display strong{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:17px}.language-display strong span+span{border-left:1px solid var(--line);padding-left:14px}.folio .personal-details>.display-field:not(.full){padding-right:8px}.folio .personal-details>.display-field:not(.full):after{right:6px;top:7px;font-size:9px}

.skills{list-style:none;margin:0}.ability{cursor:default}.skill{display:flex;align-items:center;gap:10px}.skill-modifier{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
</style></head><body>
<p class="intro"><b>MOBILE CHARACTER BUILDER · PROTOTYPE</b><br>Tap a detail to edit it. Each modal has Cancel & Save. Illustrative Modern 4e values; saves are simulated in memory.</p>
<div class="phone" id="phone"><header class="topbar"><button class="icon" data-action="characters" aria-label="Character navigation">‹</button><button class="character-name" id="character-name" data-action="identity">Mara Vey</button><span aria-hidden="true"></span></header><main class="viewport" id="screen"></main><nav class="bottomnav" id="navigation" aria-label="Character sections"></nav><div class="overlay" id="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="handle"></div><div class="sheet-head"><span class="eyebrow">Character details</span><button class="icon" data-action="close" aria-label="Close dialog">×</button></div><div id="sheet-content"></div></section></div></div>
<p class="explanation" id="explanation"></p><nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous screen approach">←</button><div id="variant-label"></div><button id="next" aria-label="Next screen approach">→</button></nav><p class="state" id="state" aria-live="polite"></p>
<script>
const designs={A:{name:'Open folio',description:'A · Level with derived facts, a portrait, and compact personal details. Tap editable displays to change them.'},B:{name:'Personal chapters',description:'B · Expandable detail chapters, with abilities and proficient skills below.'},C:{name:'Compact ledger',description:'C · Details as an engraved list, followed by abilities, proficient skills, and notes.'}};
const keys=Object.keys(designs);let variant=new URLSearchParams(location.search).get('variant')||'A';if(!designs[variant])variant='A';let section='Character',name='Mara Vey',feat='',lastSaved='',editing=null,returnFocus;
const profile={speed:'6sq speed',size:'Medium',level:'1',gender:'Woman',deity:'Erathis',age:'28',languages:'Common, Dwarven',notes:'Former city guard. Still carries her old badge.\n\n“Someone has to hold the line.”'};
const abilities={Strength:4,Dexterity:2,Constitution:2,Intelligence:1,Wisdom:0,Charisma:0};
const allSkills=['Athletics','Acrobatics','Stealth','Thievery','Endurance','Arcana','Crafting','Society','Medicine','Insight','Nature','Perception','Religion','Bluff','Diplomacy','Intimidate'];let proficient=['Athletics','Endurance','Society','Intimidate'];
const labels={speed:'Speed',size:'Size',level:'Level',gender:'Gender',deity:'Deity',age:'Age',languages:'Languages',notes:'Notes',name:'Character name'};
const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function field(key,full=false){return `<button class="display-field ${full?'full':''} ${['speed','size','level'].includes(key)?'prominent':''}" data-action="edit" data-key="${key}" aria-label="Edit ${labels[key]}: ${esc(profile[key]||'Not set')}"><span class="eyebrow">${labels[key]}</span><strong>${esc(profile[key]||'—')}</strong></button>`;}
function abilityDisplay(){return `<div class="section-head"><h2>Abilities</h2></div><div class="ability-grid">${Object.entries(abilities).map(([a,value])=>`<div class="ability" aria-label="${a}: ${value}"><small>${variant==='A'?a.slice(0,3).toUpperCase():a}</small><strong>${value}</strong></div>`).join('')}</div>`;}
const skillAbilities={Athletics:'Strength',Acrobatics:'Dexterity',Stealth:'Dexterity',Thievery:'Dexterity',Endurance:'Constitution',Arcana:'Intelligence',Crafting:'Intelligence',Society:'Intelligence',Medicine:'Intelligence',Insight:'Wisdom',Nature:'Wisdom',Perception:'Wisdom',Religion:'Wisdom',Bluff:'Charisma',Diplomacy:'Charisma',Intimidate:'Charisma'};
function skillsDisplay(){return `<div class="section-head"><h2>Proficient skills</h2></div><ul class="skills" aria-label="Proficient skills">${proficient.length?proficient.map(skill=>`<li class="skill">${skill}<strong class="skill-modifier">+${abilities[skillAbilities[skill]]+5}</strong></li>`).join(''):'<li class="subtle">No proficient skills</li>'}</ul>`;}
function notes(){return `<div class="section-head"><h2>Notes</h2><button class="edit-link" data-action="edit" data-key="notes">Edit ↗</button></div><button class="notes-display" data-action="edit" data-key="notes" aria-label="Edit notes">${esc(profile.notes||'Your story, connections, reminders…')}</button>`;}
function character(){if(variant==='A'){return `<div class="page folio"><div class="level-portrait"><div class="level-summary"><button class="level-display" data-action="edit" data-key="level" aria-label="Edit Level: ${esc(profile.level)}"><span>Level <strong>${esc(profile.level)}</strong></span></button><div class="character-facts" aria-label="Character facts"><span><span class="sr-only">Speed: </span>${esc(profile.speed)}</span><span><span class="sr-only">Size: </span>${esc(profile.size)}</span></div></div><div class="portrait" role="img" aria-label="Character portrait placeholder"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="15" r="9"/><path d="M7 46v-5c0-10 7-16 17-16s17 6 17 16v5"/></svg><small>Portrait</small></div></div><div class="profile-grid personal-details">${['gender','age','deity'].map(k=>field(k)).join('')}<button class="display-field full language-display" data-action="edit" data-key="languages" aria-label="Edit Languages: ${esc(profile.languages)}"><span class="eyebrow">Languages</span><strong>${profile.languages.split(',').map(language=>language.trim()).filter(Boolean).map(language=>`<span>${esc(language)}</span>`).join('')||'—'}</strong></button></div>${abilityDisplay()}${skillsDisplay()}${notes()}</div>`;}const all=['speed','size','level','gender','deity','age','languages'];const details=variant==='B'?`<details class="chapter" open><summary>Physical details</summary><div class="profile-grid">${all.filter(k=>['speed','size','level'].includes(k)).map(k=>field(k)).join('')}</div></details><details class="chapter" open><summary>Identity</summary><div class="profile-grid">${all.filter(k=>!['speed','size','level'].includes(k)).map(k=>field(k,k==='languages')).join('')}</div></details>`:`<div class="${variant==='C'?'ledger':'profile-grid'}">${all.map(k=>field(k,k==='languages')).join('')}</div>`;return `<div class="page">${details}${abilityDisplay()}${skillsDisplay()}${notes()}</div>`;}
function progression(){return `<div class="page"><div class="eyebrow">Your build</div><h1 class="profile-heading">Progression</h1><p class="subtle">Level ${esc(profile.level)} · Fighter</p><div class="section-head"><h2>Level 1</h2><span class="tag">${feat?'Complete':'1 choice remaining'}</span></div><button class="row" data-action="feat"><span><strong>Feat</strong><small>${feat?esc(feat):'Choose a talent for this level'}</small></span><span class="chevron">${feat?'›':'+'}</span></button><p class="subtle">Sample progression interaction. Choose a feat to clear the footer notification.</p></div>`;}
function updateStatus(){el('character-name').textContent=name;el('character-name').setAttribute('aria-label','Edit character name: '+name);el('state').textContent='PROTOTYPE STATE · '+section+' · '+(lastSaved?'Saved '+lastSaved+' independently (in memory).':'Sample character. Tap a field to edit.')+' Reload resets edits.';}
function render(){el('screen').innerHTML=section==='Character'?character():progression();el('navigation').innerHTML=['Character','Progression'].map((s,i)=>`<button data-action="section" data-section="${s}" class="${section===s?'active':''}" aria-pressed="${section===s}" ${s==='Progression'&&!feat?'aria-label="Progression, 1 choice remaining"':''}><span class="nav-icon"><span aria-hidden="true">${['♧','↗'][i]}</span>${s==='Progression'&&!feat?'<span class="badge" aria-hidden="true">1</span>':''}</span>${s}</button>`).join('');el('variant-label').innerHTML=variant+' · '+designs[variant].name+'<small>Screen '+(keys.indexOf(variant)+1)+' of 3 · ← →</small>';el('explanation').textContent=designs[variant].description;updateStatus();}
function actions(){return '<p class="error" id="edit-error" role="alert"></p><div class="dialog-actions"><button class="secondary" data-action="close">Cancel</button><button class="primary" data-action="commit">Save</button></div>';}
function openSheet(html){returnFocus=document.activeElement;el('sheet-content').innerHTML=html;el('overlay').hidden=false;el('overlay').querySelector('button').focus();el('screen').inert=true;el('navigation').inert=true;document.querySelector('.topbar').inert=true;}
function closeSheet(){el('overlay').hidden=true;el('screen').inert=false;el('navigation').inert=false;document.querySelector('.topbar').inert=false;editing=null;if(returnFocus?.isConnected)returnFocus.focus();else el('character-name').focus();}
function editField(key){editing={type:'field',key};const label=labels[key],value=key==='name'?name:profile[key];let control;if(key==='notes')control=`<textarea id="edit-value">${esc(value)}</textarea>`;else if(key==='size')control=`<select id="edit-value">${['Tiny','Small','Medium','Large','Huge','Gargantuan'].map(v=>`<option ${value===v?'selected':''}>${v}</option>`).join('')}</select>`;else control=`<input id="edit-value" value="${esc(value)}" ${['level','age'].includes(key)?'type="number" step="1" min="'+(key==='level'?'1':'0')+'"':''} ${key==='level'?'max="30"':''}>`;openSheet(`<h2 id="sheet-title">${label}</h2><label class="field">${label}${control}</label>${actions()}`);}
function commit(){const draft=editing;if(!draft)return;if(draft.type==='field'||draft.type==='ability'){const input=el('edit-value');if(!input.reportValidity())return;const value=input.value;if(draft.type==='ability'){if(value.trim()===''||!Number.isInteger(Number(value))){el('edit-error').textContent='Enter a whole number.';return;}abilities[draft.key]=Number(value);lastSaved=draft.key;}else{if(draft.key==='name'&&!value.trim()){el('edit-error').textContent='Enter a character name.';return;}if(['age','level'].includes(draft.key)&&!value.trim()){el('edit-error').textContent='Enter a value.';return;}if(draft.key==='name')name=value.trim();else profile[draft.key]=value;lastSaved=labels[draft.key];}}else if(draft.type==='skills'){proficient=[...document.querySelectorAll('input[name="skill"]:checked')].map(i=>i.value);lastSaved='proficient skills';}else if(draft.type==='feat'){feat=document.querySelector('input[name="feat"]:checked').value;lastSaved='feat';}const scroll=el('screen').scrollTop;render();el('screen').scrollTop=scroll;closeSheet();}
 document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='close'){closeSheet();return;}if(a==='edit'||a==='identity'){editField(a==='identity'?'name':b.dataset.key);return;}if(a==='commit'){commit();return;}if(a==='section'){section=b.dataset.section;render();el('screen').scrollTop=0;return;}if(a==='feat'){editing={type:'feat'};openSheet(`<h2 id="sheet-title">Choose a feat</h2><p class="subtle">Illustrative options, not a validated eligible list.</p>${['Toughness','Weapon Focus','Improved Initiative'].map((f,i)=>`<label class="option"><input type="radio" name="feat" value="${f}" ${feat===f||!feat&&i===0?'checked':''}>${f}</label>`).join('')}${actions()}`);return;}if(a==='characters'){editing=null;openSheet('<h2 id="sheet-title">Character navigation</h2><p class="subtle">Back to your character library in the full application.</p><button class="secondary" data-action="close">Close</button>');}});
function cycle(d){closeSheet();variant=keys[(keys.indexOf(variant)+d+3)%3];section='Character';const u=new URL(location.href);u.searchParams.set('variant',variant);try{history.replaceState(null,'',u);}catch{}render();el('screen').scrollTop=0;}
el('prev').onclick=()=>cycle(-1);el('next').onclick=()=>cycle(1);el('overlay').onclick=e=>{if(e.target===el('overlay'))closeSheet();};document.addEventListener('keydown',e=>{if(!el('overlay').hidden){if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const nodes=[...el('overlay').querySelectorAll('button,input,textarea,select')];const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1);}});window.addEventListener('popstate',()=>{variant=new URLSearchParams(location.search).get('variant')||'A';if(!designs[variant])variant='A';section='Character';closeSheet();render();});render();
</script></body></html>

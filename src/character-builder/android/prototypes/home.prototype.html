<!doctype html>
<!-- THROWAWAY: Selected layout A: minimal Android home. Title, settings placeholder, character-list action.
     Open directly or npm run prototype:home. In-memory sample navigation only. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modern 4e · Home prototype</title><style>
:root{--background:transparent;--foreground:#322b25;--muted:#71675c;--border:#c9bda7;--radius:16px;--font-sans:Calibri,'Segoe UI',sans-serif;--paper:#f3eddf;--ink:#322b25;--dim:#71675c;--line:#c9bda7;--oxblood:#863f36;--wash:#e8ddcb}*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:2px solid var(--oxblood);outline-offset:3px}.phone{max-width:410px;margin:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:22px;overflow:hidden;position:relative;box-shadow:0 12px 35px #0002}.status{height:30px;padding:10px 22px 0;display:flex;justify-content:space-between;font-size:11px}.top{height:62px;margin:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font:20px Georgia,serif}.overline{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--dim)}.content{min-height:630px;padding:28px 24px 24px;display:flex;flex-direction:column}h1,h2,h3,p{margin:0}h1{font:normal 44px/1.08 Georgia,serif;letter-spacing:-1px}h2{font:normal 27px/1.15 Georgia,serif}h3{font:normal 24px Georgia,serif}.copy{font-size:15px;line-height:1.6;color:var(--dim);margin:15px 0 27px;max-width:280px}.primary,.secondary{width:100%;min-height:52px;border:1px solid var(--oxblood);border-radius:3px;padding:14px 18px;text-align:left;display:flex;align-items:center;justify-content:space-between;font-size:16px}.primary{background:var(--oxblood);color:var(--paper)}.secondary{background:transparent;color:var(--oxblood);margin-top:12px}.foot{margin-top:auto;padding-top:30px;font-size:11px;color:var(--dim);line-height:1.5}.emblem{width:96px;height:96px;margin:8px auto 38px;display:grid;place-items:center;color:var(--oxblood)}.emblem svg{width:96px;height:96px;fill:none;stroke:currentColor;stroke-width:1}.cover{text-align:center}.cover .copy{margin:18px auto 32px}.cover .overline{margin-bottom:12px}.cover .foot{padding-top:40px}.folio-rule{display:flex;align-items:center;gap:12px;margin:30px 0;color:var(--oxblood);font-size:12px}.folio-rule:before,.folio-rule:after{content:'';height:1px;background:var(--line);flex:1}.feature{margin:25px 0 24px;padding:21px 18px;background:var(--wash);border:1px solid var(--line);border-left:3px solid var(--oxblood)}.feature .overline{margin-bottom:18px}.feature p{font-size:13px;color:var(--dim);margin:8px 0 22px}.feature .primary{min-height:48px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px}.count{color:var(--dim);font-size:12px}.ledger-row{border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);width:100%;display:flex;gap:16px;align-items:center;text-align:left;padding:22px 0;min-height:92px}.ledger-row:last-child{border-bottom:1px solid var(--line)}.number{font:22px Georgia,serif;color:var(--oxblood);width:26px}.row-text{flex:1}.row-text strong{font:normal 24px Georgia,serif;display:block}.row-text small{display:block;font-size:13px;line-height:1.4;color:var(--dim);margin-top:7px}.arrow{color:var(--oxblood);font-size:23px}.chapter-head{margin:26px 0 40px}.chapter-head h1{font-size:51px;margin:15px 0}.bottom{height:25px;display:grid;place-items:center}.gesture{height:4px;width:100px;background:var(--ink);border-radius:5px}.tools,.note,.state{max-width:410px;margin:14px auto;font-size:12px;line-height:1.5;color:var(--muted)}.tools{display:flex;align-items:center;justify-content:space-between;gap:12px}.tools button{min-height:40px;border:1px solid var(--border);background:transparent;color:var(--foreground);padding:8px 12px;border-radius:3px}.switcher{position:sticky;bottom:12px;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:8px;width:min(360px,100%);margin:20px auto 12px;padding:7px;border-radius:30px;background:#282d35;color:white;box-shadow:0 4px 18px #0003;font:12px system-ui,sans-serif}.switcher button{width:42px;height:42px;background:#444b56;color:white;border:0;border-radius:50%;font-size:19px}.switcher div{text-align:center}.switcher small{display:block;color:#c6ccd4;font-size:10px;margin-top:4px}.state{border-top:1px solid var(--border);padding-top:10px;font-size:11px}.back{min-width:48px;min-height:48px;border:0;background:transparent;color:var(--oxblood);font-size:24px;text-align:left}.library-item{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:22px 0;text-align:left;color:var(--ink)}.library-item small{display:block;color:var(--dim);margin-top:7px}.import-symbol{font:50px Georgia,serif;color:var(--oxblood);margin:25px 0}.notice{padding:16px;background:var(--wash);font-size:13px;line-height:1.6;color:var(--dim);margin:22px 0}.character-link{display:block;padding:15px;text-align:center;color:var(--oxblood);border:1px solid var(--oxblood);text-decoration:none;margin-top:20px}.quiet{border:0;background:transparent;color:var(--oxblood);padding:14px 0;min-height:48px;text-align:left}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:370px){.content{padding:24px 20px;min-height:620px}h1{font-size:40px}}
.home-top{border-bottom:0}.settings{width:48px;height:48px;display:grid;place-items:center;background:transparent;border:0;color:var(--dim);cursor:default}.settings svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}.home{padding-top:0;min-height:630px}.home-title{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding-bottom:70px}.home-title h1{font:normal clamp(42px,12vw,54px)/1.15 Georgia,serif;letter-spacing:-1px}.home-subtitle{margin-top:16px;font-size:16px;letter-spacing:.13em;color:var(--dim)}.home-action .primary{min-height:64px;justify-content:center;font-size:18px}.home-action .primary span:empty{display:none}
.import-copy{font-size:15px;line-height:1.5;color:var(--dim);margin:0 0 20px}
.primary,.secondary{text-align:center;justify-content:center}.primary span:empty,.secondary span:empty{display:none}
</style></head><body>
<div class="phone"><div class="status" aria-hidden="true"><span>9:41</span><span>▴ ▰</span></div><header class="top" id="header"></header><main class="content" id="screen"></main><div class="bottom" aria-hidden="true"><div class="gesture"></div></div></div>
<p class="sr" id="state" aria-live="polite"></p>
<script>
let page='home',empty=false,imported=false;const el=id=>document.getElementById(id);const count=()=>imported?(empty?1:4):empty?0:3;
function action(label,a,primary=false,detail=''){return `<button class="${primary?'primary':'secondary'}" data-action="${a}"><span>${label}</span><span aria-hidden="true">${detail}</span></button>`;}
function VariantA(){return `<div class="home-title"><h1>Modern 4e</h1><p class="home-subtitle">Character Builder</p></div><div class="home-action">${action('Your Characters','library',true,'')}</div>`;}
function render(){el('header').innerHTML=page==='home'?'<span></span><button class="settings" aria-label="Settings (coming later)" aria-disabled="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.6 2.3-1.6.9-2.3-.6-2.5 4.3 1.7 1.7v1.8l-1.7 1.7 2.5 4.3 2.3-.6 1.6.9.6 2.3h5l.6-2.3 1.6-.9 2.3.6 2.5-4.3-1.7-1.7v-1.8l1.7-1.7-2.5-4.3-2.3.6-1.6-.9L14.5 3Z"/><circle cx="12" cy="12" r="3.3"/></svg></button>':`<button class="back" data-action="home" aria-label="Back to home">‹</button><span class="brand">${page==='library'?'Characters':page==='import'?'Import Character':'Mara Vey'}</span><span style="width:48px"></span>`;let html='';if(page==='home'){html=VariantA();}else if(page==='library'){html=`${count()?[...(!empty?['Mara Vey','Aldren Ash','Sera Dawn']:[]),...(imported?['Imported character']:[])].map((n,i)=>`<button class="library-item" data-action="character"><h3>${n}</h3><small>${i?'Sample character':'Level 1 Fighter'} <span style="float:right">→</span></small></button>`).join(''):'<p class="copy">No characters yet. Import a character to start your collection.</p>'}<div style="margin-top:auto;padding-top:24px">${action('Import a character','import',true,'')}</div>`;}else if(page==='import'){html=`<p class="import-copy">Choose a character file from your device to add it to your character list.</p>${action('Choose a file','choose',true)}`;}else{html='<div class="overline">Character opened</div><h1 style="margin:15px 0">Mara Vey</h1><p class="copy">Level 1 Fighter</p><div class="notice">This is the handoff from Home to the existing character screen.</div><a class="character-link" href="main-character.prototype.html">Open character-screen prototype →</a>';}
el('screen').innerHTML=html;el('screen').classList.toggle('home',page==='home');el('header').classList.toggle('home-top',page==='home');el('state').textContent=`Prototype · ${page} · ${count()} sample characters. Changes are in memory.`;}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(!a){return;}if(a==='choose'){imported=true;page='library';}else{page=a;}render();});render();
</script></body></html>

<!doctype html>
<!-- THROWAWAY: Three structurally different takes on the character screen chrome: header, footer (bottom nav)
     and the "setting cabinet" (today's cog-opened right drawer: Exit, Open, Export, Copy, Validation).
     Native Android design study expressed as standalone HTML, not production web UI.
     Open: open src/character-builder/android/prototypes/chrome.prototype.html
     Share variants with ?variant=A, B, C (also ← / → keys). Mock state only; nothing is stored. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modern 4e · Chrome prototype</title>
<style>
:root{--foreground:#322b25;--muted:#71675c;--paper:#f3eddf;--ink:#322b25;--dim:#71675c;--line:#c9bda7;--accent:#863f36;--wash:#e8ddcb;--font-sans:Calibri,'Segoe UI',sans-serif;--serif:Georgia,serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);color:var(--foreground);padding-bottom:90px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;background:transparent;border:0;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
button:disabled,button[aria-disabled=true]{cursor:default}
.note,.tools,.state{max-width:410px;margin:12px auto;font-size:12px;line-height:1.5;color:var(--muted)}
.note b{letter-spacing:.1em;font-size:10px}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{border:1px solid var(--line);border-radius:3px;padding:8px 12px;min-height:40px;font-size:12px}
.tools button[aria-pressed=true]{background:var(--wash);border-color:var(--accent);color:var(--accent)}
.state{border-top:1px solid var(--line);padding-top:10px;font-size:11px}

/* ---- phone ---- */
.phone{position:relative;max-width:410px;height:min(780px,calc(100vh - 170px));min-height:640px;margin:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 35px #0002;display:flex;flex-direction:column}
.status{height:30px;flex:none;padding:10px 22px 0;display:flex;justify-content:space-between;font-size:11px}
.hd{height:62px;flex:none;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.slot{height:4px;flex:none}
.viewport{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--accent) var(--line)}
.page{padding:20px 20px 28px}
.i svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;display:block}
.ibtn{width:48px;height:48px;display:grid;place-items:center;color:var(--dim)}.ibtn.accent{color:var(--accent)}
.nm{font:normal 24px/28px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:100%}
.eyebrow{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:600}
.badge{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:20px;background:var(--accent);color:var(--paper);font:700 10px var(--font-sans)}

/* ---- mock page content ---- */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{border:1px solid var(--line);border-radius:3px;padding:12px 14px;min-height:72px}
.field strong{display:block;font:normal 20px/1.25 var(--serif);margin-top:7px}.field.full{grid-column:1/-1}.field.hot{background:var(--wash)}.field.hot strong{color:var(--accent)}
.sec{font:normal 23px var(--serif);margin:24px 0 12px}
.abil{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ab{border:1px solid var(--line);border-top:2px solid var(--accent);padding:10px 2px;text-align:center}.ab strong{display:block;font:normal 28px var(--serif);color:var(--accent)}.ab small{font-size:10px;color:var(--dim)}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line)}.row strong{font:normal 21px var(--serif)}.row span{font-size:13px;color:var(--dim)}.row span.req{color:var(--accent)}
.para{font-size:14px;line-height:1.6;color:var(--dim)}

/* ---- scrim shared ---- */
.scrim{position:absolute;inset:0;background:#322b2566;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.open{opacity:1;pointer-events:auto}
.v-C .scrim{top:92px}
.cab{position:absolute;transition:transform .22s ease-out}
.crow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:58px;padding:8px 18px;border-bottom:1px solid var(--line);color:var(--ink)}
.crow .i{color:var(--dim);flex:none}.crow .t{flex:1;min-width:0}.crow .t b{display:block;font:normal 17px/1.25 var(--serif);font-weight:400}.crow .t small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.crow:disabled{opacity:.45}.crow .flag{font-size:12px;color:var(--accent)}

/* ================= A: Ledger drawer ================= */
.hdA{padding:0 4px 0 8px}
.hdA .namebtn{flex:1;min-width:0;text-align:left;min-height:48px;padding:3px 8px;display:flex;flex-direction:column;justify-content:center}
.hdA .sub{font-size:11px;color:var(--dim);margin-top:1px;display:flex;gap:6px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}.dot.ok{background:#6f7a4f}
.dot.pulse{animation:p 1s infinite}@keyframes p{50%{opacity:.25}}
.tabsA{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);flex:none}
.tabsA button{position:relative;min-height:60px;color:var(--dim);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabsA button:before{content:'';position:absolute;left:18%;right:18%;top:-1px;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .2s}
.tabsA button.on{color:var(--accent);font-weight:700}.tabsA button.on:before{transform:scaleX(1)}
.tabsA .i{position:relative}.tabsA .badge{position:absolute;left:14px;top:-7px}
.cab-A{top:0;right:0;bottom:0;width:276px;background:var(--paper);border-left:1px solid var(--line);transform:translateX(102%);display:flex;flex-direction:column}
.cab-A.open{transform:none;box-shadow:-8px 0 24px #0003}
.cab-A .idb{padding:34px 18px 16px;border-bottom:1px solid var(--line);background:var(--wash)}
.cab-A .idb strong{display:block;font:normal 22px/1.2 var(--serif);margin:6px 0 4px;overflow-wrap:anywhere}.cab-A .idb span{font-size:12px;color:var(--dim)}
.cab-A .scroll{flex:1;overflow-y:auto}
.cab-A .grp{padding:14px 18px 6px}
.cab-A .pin{padding:14px 18px 18px;border-top:1px solid var(--line)}
.btn-out{width:100%;min-height:52px;border:1px solid var(--accent);border-radius:3px;color:var(--accent);font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}

/* ================= B: Thumb cabinet (bottom sheet) ================= */
.hdB{padding:0 14px 0 8px}
.hdB .namebtn{flex:1;min-width:0;text-align:left;min-height:48px;padding:0 8px}
.folio{flex:none;text-align:right;padding-left:10px;border-left:1px solid var(--line);margin-left:6px;min-width:64px}
.folio small{display:block;font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.folio b{display:block;font:normal 28px/30px var(--serif);color:var(--accent);font-weight:400}
.folio b em{font:italic 12px var(--font-sans);color:var(--dim);margin-left:4px}
.tabsB{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:4px 6px 6px;border-top:1px solid var(--line);flex:none}
.tabsB button{position:relative;min-height:56px;color:var(--dim);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:2px}
.tabsB button.on{background:var(--wash);color:var(--accent);font-weight:700}
.tabsB button.more{border-left:1px solid var(--line);border-radius:0;margin-left:2px}
.tabsB .i{position:relative}.tabsB .badge{position:absolute;left:14px;top:-7px}
.cab-B{left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);border-radius:6px 6px 0 0;transform:translateY(102%);padding-bottom:6px}
.cab-B.open{transform:none;box-shadow:0 -8px 24px #0003}
.cab-B .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:9px auto 4px}
.cab-B .shead{display:flex;justify-content:space-between;align-items:center;padding:4px 18px 8px;border-bottom:1px solid var(--line)}
.cab-B .shead button{color:var(--accent);font-size:14px;min-height:44px;padding:0 4px}
.cab-B .two{display:grid;grid-template-columns:1fr 1fr}
.cab-B .two .crow:nth-child(odd){border-right:1px solid var(--line)}
.cab-B .crow{min-height:64px}

/* ================= C: Drop cabinet + status footer ================= */
.hdC{padding:0 4px 0 8px}
.hdC .center{flex:1;min-width:0;text-align:center;padding:0 4px}
.hdC .center .eyebrow{display:block;margin-top:1px;font-size:9px}
.hdC .nm{font-size:22px;line-height:26px}
.hdC .ibtn.cab{position:relative}.hdC .ibtn.cab.openbtn{color:var(--accent);background:var(--wash)}
.hdC .dot{position:absolute;right:9px;top:10px}
.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0;padding:0 14px 0 14px;height:42px;background:var(--wash);border-top:1px solid var(--line);border-left:3px solid var(--accent);flex:none;font-size:13px;color:var(--ink)}
.strip.done{border-left-color:#6f7a4f;color:var(--dim)}
.strip button{color:var(--accent);font-size:13px;font-weight:700;min-height:42px;padding:0 2px}
.tabsC{position:relative;display:grid;grid-template-columns:repeat(3,1fr);flex:none;border-top:1px solid var(--line)}
.tabsC button{min-height:50px;font-size:13px;color:var(--dim);letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:6px}
.tabsC button.on{color:var(--accent);font-weight:700}
.tabsC .ind{position:absolute;left:0;bottom:0;width:33.333%;height:3px;background:var(--accent);transition:transform .22s}
.tabsC[data-i="1"] .ind{transform:translateX(100%)}.tabsC[data-i="2"] .ind{transform:translateX(200%)}.tabsC[data-i="-1"] .ind{opacity:0}
.cab-C{left:0;right:0;top:92px;bottom:0;overflow:hidden;pointer-events:none}
.cab-C .panel{background:var(--paper);border-bottom:1px solid var(--line);transform:translateY(-102%);transition:transform .22s ease-out;pointer-events:auto}
.cab-C.open .panel{transform:none;box-shadow:0 10px 24px #0003}
.cab-C .grid{display:grid;grid-template-columns:repeat(3,1fr)}
.cab-C .tile{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:10px 4px;text-align:center;position:relative}
.cab-C .tile:nth-child(3n){border-right:0}.cab-C .tile:nth-last-child(-n+3){border-bottom:0}
.cab-C .tile .i{color:var(--accent)}.cab-C .tile b{font:normal 15px var(--serif);font-weight:400}.cab-C .tile small{font-size:11px;color:var(--dim);margin-top:-5px}
.cab-C .tile:disabled{opacity:.45}.cab-C .tile:disabled .i{color:var(--dim)}
.cab-C .tile .badge{position:absolute;right:calc(50% - 26px);top:18px}
.cab-C .foot{padding:6px 18px 8px;border-top:1px solid var(--line);font-size:11px;color:var(--dim);display:flex;justify-content:space-between}

/* ---- prototype switcher (not part of the design) ---- */
.switcher{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:9;display:flex;align-items:center;justify-content:space-between;gap:8px;width:min(380px,calc(100% - 24px));padding:7px;border-radius:30px;background:#282d35;color:#fff;box-shadow:0 4px 18px #0004;font:12px system-ui,sans-serif}
.switcher button{width:42px;height:42px;background:#444b56;color:#fff;border-radius:50%;font-size:19px}
.switcher div{text-align:center}.switcher small{display:block;color:#c6ccd4;font-size:10px;margin-top:4px}
</style></head><body>
<p class="note"><b>THROWAWAY PROTOTYPE</b><br>Three takes on the character screen's header, footer and cabinet (the cog drawer). Tap the cabinet button, the tabs and the toggles below. ← / → switches variant.</p>
<div class="phone" id="phone">
  <div class="status" aria-hidden="true"><span>9:41</span><span>▴ ▰</span></div>
  <div id="top"></div><div class="slot"></div>
  <main class="viewport" id="page"></main>
  <div id="bottom"></div>
  <div class="scrim" id="scrim" data-a="close"></div>
  <div id="cabinet"></div>
</div>
<div class="tools" id="tools"></div>
<p class="state" id="state" aria-live="polite"></p>
<div class="switcher" id="switcher"><button data-a="prev" aria-label="Previous variant">‹</button><div id="vlabel"></div><button data-a="next" aria-label="Next variant">›</button></div>
<script>
const $=id=>document.getElementById(id);
const svg=p=>`<span class="i"><svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg></span>`;
const I={
  cog:svg('<path d="m9.5 3-.6 2.3-1.6.9-2.3-.6-2.5 4.3 1.7 1.7v1.8l-1.7 1.7 2.5 4.3 2.3-.6 1.6.9.6 2.3h5l.6-2.3 1.6-.9 2.3.6 2.5-4.3-1.7-1.7v-1.8l1.7-1.7-2.5-4.3-2.3.6-1.6-.9L14.5 3Z"/><circle cx="12" cy="12" r="3.3"/>'),
  cabinet:svg('<rect x="4.5" y="3.5" width="15" height="17"/><path d="M4.5 12h15M10 7.7h4M10 16.2h4"/>'),
  back:svg('<path d="M14.5 5.5 8 12l6.5 6.5"/>'),
  about:svg('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-4 3.5-6 7-6s6.2 2 7 6"/>'),
  levels:svg('<path d="M4 20h5v-5h5v-5h5V5"/>'),
  stats:svg('<path d="M6 20v-9M12 20V5M18 20v-6"/>'),
  open:svg('<path d="M3.5 6.5h6l2 2h9v10h-17Z"/>'),
  copy:svg('<rect x="8.5" y="8.5" width="11" height="11"/><path d="M15.5 8.5v-4h-11v11h4"/>'),
  export:svg('<path d="M12 15V3.5M7.5 8 12 3.5 16.5 8M5 13v7h14v-7"/>'),
  check:svg('<circle cx="12" cy="12" r="8.5"/><path d="m8.2 12.4 2.6 2.6 5-5.4"/>'),
  exit:svg('<path d="M10 4.5H5v15h5M14 8l4 4-4 4M18 12H9"/>')
};
const NAME='Mara Vey', LONG='Aldren Ashgrove-Vey of the Unbroken Oath';
const state={v:'A',tab:'character',open:false,saving:false,missing:3,long:false,log:'Nothing tapped yet.'};
const name=()=>state.long?LONG:NAME;
const meta='Level 1 · Fighter · Human';
const TABS=[['character','About','about'],['progression','Levels','levels'],['stats','Stats','stats']];
const ITEMS=[
  {id:'open',label:'Open Character',sub:'Switch to another character',icon:'open',group:'Library'},
  {id:'copy',label:'Copy Character',sub:'Duplicate as a new sheet',icon:'copy',group:'Library',needsSaved:true},
  {id:'export',label:'Export',sub:'Save a file or share it',icon:'export',group:'Share',needsSaved:true},
  {id:'validation',label:'Validation',icon:'check',group:'Check'},
  {id:'settings',label:'Settings',sub:'Coming later',icon:'cog',group:'App',disabled:true},
  {id:'exit',label:'Exit',sub:'Back to home',icon:'exit',group:'App'}
];
const itemSub=it=>it.id==='validation'?(state.missing?`${state.missing} choices to resolve`:'No issues found'):it.sub;
const off=it=>it.disabled||(it.needsSaved&&state.saving);
const bdg=n=>n?`<span class="badge" aria-label="${n} required choices remaining">${n}</span>`:'';

function pageHtml(){
  if(state.tab==='character')return `<div class="page"><div class="fields"><div class="field full hot"><span class="eyebrow">Class</span><strong>Fighter</strong></div><div class="field"><span class="eyebrow">Race</span><strong>Human</strong></div><div class="field"><span class="eyebrow">Size</span><strong>Medium</strong></div></div><h2 class="sec">Abilities</h2><div class="abil">${['STR 17','CON 14','DEX 12','INT 10','WIS 13','CHA 9'].map(a=>`<div class="ab"><small>${a.slice(0,3)}</small><strong>${a.slice(4)}</strong></div>`).join('')}</div><h2 class="sec">Notes</h2><p class="para">Tap-to-edit fields stay as they are today. This prototype only judges the frame around them.</p></div>`;
  if(state.tab==='progression')return `<div class="page">${[1,2,3,4].map(l=>`<div class="row"><strong>Level ${l}</strong><span class="${l<4&&state.missing?'req':''}">${l===1?(state.missing?'3 choices':'Complete'):'Locked'}</span></div>`).join('')}</div>`;
  if(state.tab==='stats')return `<div class="page">${[['Hit Points','31'],['Surges','9'],['AC','18'],['Fortitude','16'],['Reflex','13'],['Will','12']].map(r=>`<div class="row"><strong>${r[0]}</strong><span>${r[1]}</span></div>`).join('')}</div>`;
  return `<div class="page"><h2 class="sec" style="margin-top:0">Validation</h2><p class="para">${state.missing?`${state.missing} required choices remain at level 1.`:'No rules diagnostics.'}</p></div>`;
}

/* ---------- A · Ledger drawer ---------- */
const A={label:'Ledger drawer',
  header:()=>`<header class="hd hdA"><button class="ibtn accent" data-a="back" aria-label="Back">${I.back}</button><button class="namebtn" data-a="rename" aria-label="Edit character name"><span class="nm">${name()}</span><span class="sub"><i class="dot ${state.saving?'pulse':'ok'}"></i>${state.saving?'Saving…':'Level 1 Fighter · Saved'}</span></button><button class="ibtn" data-a="cabinet" aria-label="Character menu">${I.cog}</button></header>`,
  footer:()=>`<nav class="tabsA">${TABS.map(([id,l,ic])=>`<button class="${state.tab===id?'on':''}" data-a="tab:${id}">${I[ic]}${id==='progression'?bdg(state.missing):''}<span>${l}</span></button>`).join('')}</nav>`,
  cabinet:()=>{
    const groups=['Library','Share','Check','App'].map(g=>{const items=ITEMS.filter(i=>i.group===g&&i.id!=='exit');return `<div class="grp eyebrow">${g}</div>`+items.map(it=>`<button class="crow" data-a="item:${it.id}" ${off(it)?'disabled':''}>${I[it.icon]}<span class="t"><b>${it.label}</b><small>${itemSub(it)}</small></span>${it.id==='validation'&&state.missing?`<span class="flag">${state.missing}</span>`:''}</button>`).join('')}).join('');
    return `<aside class="cab cab-A" aria-label="Character menu"><div class="idb"><span class="eyebrow">Character</span><strong>${name()}</strong><span>${meta}</span></div><div class="scroll">${groups}</div><div class="pin"><button class="btn-out" data-a="item:exit">${I.exit}Exit to home</button></div></aside>`;
  }};

/* ---------- B · Thumb cabinet ---------- */
const B={label:'Thumb cabinet',
  header:()=>`<header class="hd hdB"><button class="ibtn accent" data-a="back" aria-label="Back">${I.back}</button><button class="namebtn" data-a="rename" aria-label="Edit character name"><span class="nm">${name()}</span></button><div class="folio"><small>${state.saving?'Saving…':'Level'}</small><b>1<em>Fighter</em></b></div></header>`,
  footer:()=>`<nav class="tabsB">${TABS.map(([id,l,ic])=>`<button class="${state.tab===id?'on':''}" data-a="tab:${id}">${I[ic]}${id==='progression'?bdg(state.missing):''}<span>${l}</span></button>`).join('')}<button class="more ${state.open?'on':''}" data-a="cabinet" aria-label="Character menu">${I.cabinet}<span>Menu</span></button></nav>`,
  cabinet:()=>`<aside class="cab cab-B" aria-label="Character menu"><div class="grab"></div><div class="shead"><span class="eyebrow">Character menu</span><button data-a="close">Done</button></div><div class="two">${ITEMS.map(it=>`<button class="crow" data-a="item:${it.id}" ${off(it)?'disabled':''}>${I[it.icon]}<span class="t"><b>${it.label}</b><small>${itemSub(it)}</small></span></button>`).join('')}</div></aside>`};

/* ---------- C · Drop cabinet + status footer ---------- */
const C={label:'Drop cabinet + status',
  header:()=>`<header class="hd hdC"><button class="ibtn accent" data-a="back" aria-label="Back">${I.back}</button><button class="center" data-a="rename" aria-label="Edit character name"><span class="nm">${name()}</span><span class="eyebrow">Level 1 · Fighter</span></button><button class="ibtn cab ${state.open?'openbtn':''}" data-a="cabinet" aria-label="Character menu">${I.cabinet}${state.saving?'<i class="dot pulse"></i>':''}</button></header>`,
  footer:()=>{
    const i=TABS.findIndex(t=>t[0]===state.tab);
    const strip=state.missing?`<div class="strip"><span>${state.missing} required choices left</span><button data-a="tab:progression">Continue →</button></div>`:`<div class="strip done"><span>All choices complete</span><button data-a="item:validation">Validate</button></div>`;
    return strip+`<nav class="tabsC" data-i="${i}">${TABS.map(([id,l])=>`<button class="${state.tab===id?'on':''}" data-a="tab:${id}">${l}</button>`).join('')}<span class="ind"></span></nav>`;
  },
  cabinet:()=>`<aside class="cab cab-C" aria-label="Character menu"><div class="panel"><div class="grid">${['open','copy','export','validation','settings','exit'].map(id=>ITEMS.find(i=>i.id===id)).map(it=>`<button class="tile" data-a="item:${it.id}" ${off(it)?'disabled':''}>${I[it.icon]}<b>${it.label.replace(' Character','')}</b><small>${it.id==='validation'?(state.missing?'':'Clear'):it.id==='settings'?'Soon':''}</small>${it.id==='validation'?bdg(state.missing):''}</button>`).join('')}</div><div class="foot"><span>${name().length>26?name().slice(0,24)+'…':name()}</span><span>${state.saving?'Saving…':'Saved'}</span></div></div></aside>`};

const VARIANTS={A,B,C},KEYS=Object.keys(VARIANTS);

function render(){
  const v=VARIANTS[state.v];
  $('phone').className='phone v-'+state.v;
  $('top').innerHTML=v.header();$('bottom').innerHTML=v.footer();$('cabinet').innerHTML=v.cabinet();
  $('cabinet').firstElementChild.classList.toggle('open',state.open);$('scrim').classList.toggle('open',state.open);
  $('page').innerHTML=pageHtml();
  $('vlabel').innerHTML=`<b>${state.v}</b> (${v.label})<small>← → to switch</small>`;
  $('tools').innerHTML=[['saving','Saving…',state.saving],['long','Long name',state.long],['missing','Choices left: '+(state.missing||'none'),state.missing>0]].map(([k,l,p])=>`<button data-a="tog:${k}" aria-pressed="${p}">${l}</button>`).join('');
  $('state').textContent=`Variant ${state.v} · tab ${state.tab} · cabinet ${state.open?'open':'closed'} · saving ${state.saving} · missing ${state.missing}. Last: ${state.log}`;
}
function setOpen(o){ // toggle without a full render so the slide transition plays
  state.open=o;const c=$('cabinet').firstElementChild;if(c){c.classList.toggle('open',o);}$('scrim').classList.toggle('open',o);
  const cabBtn=document.querySelector('.ibtn.cab');if(cabBtn){cabBtn.classList.toggle('openbtn',o);}
  const more=document.querySelector('.tabsB .more');if(more){more.classList.toggle('on',o);}
  $('state').textContent=$('state').textContent.replace(/cabinet \w+/,'cabinet '+(o?'open':'closed'));
}
function setVariant(k){const url=new URL(location.href);url.searchParams.set('variant',k);history.replaceState(null,'',url);state.v=k;state.open=false;render();}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]')?.dataset.a;if(!a||e.target.closest('[disabled]'))return;
  const [k,arg]=a.split(':');
  if(k==='prev'||k==='next'){const i=KEYS.indexOf(state.v);setVariant(KEYS[(i+(k==='next'?1:-1)+KEYS.length)%KEYS.length]);return;}
  if(k==='cabinet'){setOpen(!state.open);return;}
  if(k==='close'){setOpen(false);return;}
  if(k==='tab'){state.tab=arg;state.open=false;state.log='Tab → '+arg;render();return;}
  if(k==='item'){state.open=false;state.log='Cabinet → '+arg+(arg==='validation'?' (page opens)':' (stub, nothing happens)');if(arg==='validation'){state.tab='validation';}render();return;}
  if(k==='tog'){if(arg==='missing'){state.missing=state.missing?0:3;}else{state[arg]=!state[arg];}render();return;}
  if(k==='back'||k==='rename'){state.log=k==='back'?'Back (stub)':'Edit name dialog (stub)';render();}
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,[contenteditable]'))return;
  if(e.key==='Escape'&&state.open){setOpen(false);}
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const i=KEYS.indexOf(state.v);setVariant(KEYS[(i+(e.key==='ArrowRight'?1:-1)+KEYS.length)%KEYS.length]);}
});
const q=new URLSearchParams(location.search).get('variant');if(KEYS.includes(q)){state.v=q;}
render();
</script></body></html>

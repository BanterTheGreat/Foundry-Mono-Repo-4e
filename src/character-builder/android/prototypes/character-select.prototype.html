<!doctype html>
<!-- THROWAWAY PROTOTYPE: three list designs for the Character select (Library) screen, no images.
     Switch with ?variant=A|B|C, the bottom bar or the left/right arrow keys. Replaces LibraryScreen.kt if one wins.
       A  Ledger    "Continue" strip, search + sort, rows led by a big level numeral
       B  Grouped   rows grouped under class headings (Levels-tab style), delete icon kept on the row
       C  Expanding rows tap a row to open its facts and actions; the row itself no longer opens the character
     Open directly or npm run prototype:select. Sample data and in-memory delete only; nothing persists. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modern 4e · Character select prototype</title><style>
:root{--paper:#f3eddf;--ink:#322b25;--dim:#71675c;--line:#c9bda7;--accent:#863f36;--wash:#e8ddcb;--err:#b3261e;--serif:Georgia,'Times New Roman',serif;--sans:Calibri,'Segoe UI',sans-serif}
*{box-sizing:border-box}body{margin:0;padding:16px 0 96px;background:#d9d2c3;color:var(--ink);font-family:var(--sans)}
button,input{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.phone{width:410px;max-width:100%;height:800px;margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 12px 35px #0002}
.status{height:30px;padding:10px 22px 0;display:flex;justify-content:space-between;font-size:11px;flex:none}
.top{height:62px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.top .t{font:22px var(--serif);text-align:center}.top .sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:block;text-align:center;margin-top:1px}
.ib{width:48px;height:48px;border:0;background:transparent;color:var(--accent);font-size:26px;display:grid;place-items:center;flex:none}
.ib.dim{color:var(--dim)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.body{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 12px}
.body::-webkit-scrollbar{width:5px}.body::-webkit-scrollbar-track{background:var(--line)}.body::-webkit-scrollbar-thumb{background:var(--accent)}
.foot{flex:none;padding:8px 16px 10px;display:flex;gap:8px}
.gesture{height:25px;flex:none;display:grid;place-items:center}.gesture i{display:block;height:4px;width:100px;background:var(--ink);border-radius:5px}
.btn{flex:1;min-height:56px;border:1px solid var(--accent);border-radius:3px;background:var(--accent);color:var(--paper);font-size:17px}
.btn.o{background:transparent;color:var(--accent)}.btn.c{min-height:40px;font-size:14px;padding:0 14px;flex:none}
.btn.d{border-color:var(--err);background:var(--err);color:#fff}.btn.d.o{background:transparent;color:var(--err)}
.txt{border:0;background:transparent;color:var(--accent);font-size:14px;min-height:40px;padding:0 12px}
.label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.dim{color:var(--dim)}
.nm{font:18px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds{font-size:12px;line-height:16px;color:var(--dim)}
.empty{padding:40px 8px;text-align:center}.empty h2{font:normal 23px var(--serif);margin:0 0 8px}.empty p{color:var(--dim);margin:0;line-height:1.5}
/* A: ledger */
.cont{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--wash);border-radius:3px;padding:10px 6px 10px 12px;margin:2px 0 14px}
.cont .mid{flex:1;min-width:0}.cont .nm{font-size:22px;margin:2px 0}.cont .go{color:var(--accent);font-size:14px;padding:0 8px;white-space:nowrap}
.search{display:flex;gap:8px;margin-bottom:6px}
.search input{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:3px;background:var(--paper);padding:0 10px;font-size:15px}
.sort{display:flex;border:1px solid var(--accent);border-radius:3px;overflow:hidden;flex:none}
.sort button{border:0;background:transparent;color:var(--accent);font-size:13px;padding:0 10px}.sort button.on{background:var(--accent);color:var(--paper)}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:10px 0;min-height:64px}
.row.last{border-bottom:1px solid var(--line)}
.row .lv{width:36px;text-align:center;font:28px var(--serif);color:var(--accent)}.row .lv small{display:block;font:9px var(--sans);letter-spacing:1px;color:var(--dim)}
.row .mid{flex:1;min-width:0}
.row .dt{font-size:11px;color:var(--dim);text-align:right;max-width:72px}
/* B: grouped */
.grp{display:flex;align-items:baseline;gap:10px;margin:14px 0 8px}.grp:first-child{margin-top:4px}
.grp b{font:normal 23px var(--serif)}.grp i{flex:1;height:1px;background:var(--line);align-self:center}.grp span{font-size:11px;color:var(--dim)}
.crd{display:flex;align-items:center;border:1px solid var(--line);border-radius:3px;background:var(--paper);margin-bottom:6px;padding:4px 2px 4px 0;overflow:hidden}
.crd .open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:2px 0 2px 12px;min-height:46px}
.crd .lvl{font:20px var(--serif);color:var(--accent);min-width:22px}
.crd .mid{flex:1;min-width:0}.crd .dt{font-size:11px;color:var(--dim);text-align:right;max-width:72px;padding-left:6px}
.crd.e{border-left:3px solid var(--accent)}
/* C: expanding rows */
.xr{border-bottom:1px solid var(--line)}.xr:first-child{border-top:1px solid var(--line)}
.xr .h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:12px 4px;min-height:60px}
.xr .mid{flex:1;min-width:0}.xr .chev{color:var(--accent);font-size:20px;transition:transform .15s;width:22px;text-align:center}
.xr.on{background:var(--wash);margin:0 -16px;padding:0 16px}.xr.on .chev{transform:rotate(90deg)}
.xr .more{padding:0 4px 14px 36px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:3px;background:var(--paper);margin-bottom:10px}
.facts div{padding:7px 10px;border-right:1px solid var(--line)}.facts div:last-child{border:0}.facts b{display:block;font:16px var(--serif);font-weight:normal;margin-top:2px}
.acts{display:flex;gap:8px;align-items:center}.acts .btn{min-height:44px;font-size:15px}
.hint{font-size:12px;color:var(--dim);padding:10px 4px}
/* delete dialog */
.scrim{position:absolute;inset:0;background:#322b2599;display:grid;place-items:center;padding:24px;z-index:5}
.dlg{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px;width:100%}.dlg h3{margin:0 0 8px;font:normal 22px var(--serif)}.dlg p{margin:0 0 16px;color:var(--dim);line-height:1.5;font-size:14px}
.dlg .a{display:flex;justify-content:flex-end;gap:8px}
/* prototype chrome (not part of the design) */
.tools,.state{width:410px;max-width:100%;margin:12px auto;font-size:12px;color:#5b5348;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools button{min-height:34px;border:1px solid #8b8272;background:transparent;border-radius:3px;padding:0 10px;font-size:12px}
.state{display:block;line-height:1.5}
.switcher{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px;padding:7px;border-radius:30px;background:#282d35;color:#fff;box-shadow:0 4px 18px #0004;font:12px system-ui,sans-serif;min-width:300px;justify-content:space-between}
.switcher button{width:42px;height:42px;background:#444b56;color:#fff;border:0;border-radius:50%;font-size:19px}
.switcher div{text-align:center}.switcher small{display:block;color:#c6ccd4;font-size:10px;margin-top:3px}
</style></head><body>
<div class="tools"><span>Sample library:</span><button data-t="count">Cycle count</button><button data-t="reset">Restore characters</button><button data-t="busy">Toggle busy</button></div>
<div class="phone" id="phone"><div class="status" aria-hidden="true"><span>9:41</span><span>▴ ▰</span></div><header class="top" id="top"></header><main class="body" id="body"></main><div class="foot" id="foot"></div><div class="gesture" aria-hidden="true"><i></i></div></div>
<p class="state" id="state"></p>
<nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">‹</button><div><b id="vlabel"></b><small>← → keys also switch</small></div><button id="next" aria-label="Next variant">›</button></nav>
<script>
/* ---- sample data: CharacterSummary fields (name, savedAt, level, ancestry, class) ---- */
const SEED=[
 {id:1,name:'Mara Vey',level:5,anc:'Dwarf',cls:'Fighter',at:'2026-11-20T21:10:00Z'},
 {id:2,name:'Aldren Ash',level:3,anc:'Eladrin',cls:'Wizard',at:'2026-11-18T18:30:00Z'},
 {id:3,name:'Sera Dawn',level:1,anc:'Human',cls:'Cleric',at:'2026-11-12T09:00:00Z'},
 {id:4,name:'Tobias “Tuck” Underbough-Fennimore',level:8,anc:'Halfling',cls:'Rogue',at:'2026-10-30T20:00:00Z'},
 {id:5,name:'Kharn',level:2,anc:'Dragonborn',cls:'Warlord',at:'2026-10-02T12:00:00Z'},
 {id:6,name:'Brannoc',level:1,anc:'Half-Elf',cls:'Fighter',at:'2026-08-01T10:00:00Z'},
 {id:7,name:'Tessaly Rook',level:12,anc:'Tiefling',cls:'Wizard',at:'2026-09-14T19:45:00Z'}];
const counts=[SEED.length,3,1,0];let ci=0,list=SEED.slice(0,counts[0]),busy=false,deleting=null,open=1,q='',sort='recent',note='';
const V=[['A','Ledger'],['B','Grouped'],['C','Expanding rows']];
let variant=(new URLSearchParams(location.search).get('variant')||'A').toUpperCase();if(!V.some(v=>v[0]===variant)){variant='A';}
const $=id=>document.getElementById(id);
const fmt=s=>new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const desc=c=>`Level ${c.level} ${c.anc} ${c.cls}`;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const trash='<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>';
const menu='<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>';
const recent=()=>[...list].sort((a,b)=>b.at.localeCompare(a.at));
const footer=()=>{$('foot').style.display='flex';$('foot').innerHTML=`<button class="btn" data-a="new" ${busy?'disabled':''}>New</button><button class="btn o" data-a="import" ${busy?'disabled':''}>Import</button>`;};
const emptyBlock=()=>`<div class="empty"><h2>No characters yet</h2><p>Create a new character or import a character file to start your collection.</p></div>`;
const header=sub=>{$('top').innerHTML=`<button class="ib" aria-label="Back to home" data-a="back">‹</button><div><div class="t">Characters</div>${sub?`<span class="sub">${sub}</span>`:''}</div><button class="ib" aria-label="Library menu" data-a="menu">${menu}</button>`;};
const delBtn=c=>`<button class="ib dim" aria-label="Delete ${esc(c.name)}" data-a="del" data-id="${c.id}" ${busy?'disabled':''}>${trash}</button>`;
/* ---- A: ledger ---- */
function VA(){
  header('');footer();
  if(!list.length){$('body').innerHTML=emptyBlock();return;}
  const last=recent()[0];
  let rows=list.filter(c=>(c.name+' '+c.cls+' '+c.anc).toLowerCase().includes(q.toLowerCase()));
  rows=sort==='recent'?rows.sort((a,b)=>b.at.localeCompare(a.at)):sort==='name'?rows.sort((a,b)=>a.name.localeCompare(b.name)):rows.sort((a,b)=>b.level-a.level);
  $('body').innerHTML=`<button class="cont" data-a="open" data-id="${last.id}"><span class="mid"><span class="label">Continue · saved ${fmt(last.at)}</span><div class="nm">${esc(last.name)}</div><div class="ds">${desc(last)}</div></span><span class="go">Continue ›</span></button>
  <div class="search"><input id="q" type="search" placeholder="Search ${list.length} characters" value="${esc(q)}" aria-label="Search characters"><div class="sort" role="group" aria-label="Sort">${[['recent','Recent'],['name','A–Z'],['level','Level']].map(s=>`<button class="${sort===s[0]?'on':''}" data-a="sort" data-s="${s[0]}">${s[1]}</button>`).join('')}</div></div>
  ${rows.map((c,i)=>`<button class="row ${i===rows.length-1?'last':''}" data-a="open" data-id="${c.id}"><span class="lv">${c.level}<small>LEVEL</small></span><span class="mid"><div class="nm">${esc(c.name)}</div><div class="ds">${c.anc} ${c.cls}</div></span><span class="dt">${fmt(c.at)}</span></button>`).join('')||'<p class="dim" style="padding:20px 0">No match.</p>'}`;
  const i=$('q');i.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;VA();$('q').focus();$('q').setSelectionRange(p,p);};
}
/* ---- B: grouped by class ---- */
function VB(){
  header(`${list.length} saved`);footer();
  if(!list.length){$('body').innerHTML=emptyBlock();return;}
  const g={};recent().forEach(c=>(g[c.cls]=g[c.cls]||[]).push(c));
  $('body').innerHTML=Object.keys(g).sort().map(k=>`<div class="grp"><b>${k}</b><i></i><span>${g[k].length}</span></div>`+g[k].map(c=>`<div class="crd"><button class="open" data-a="open" data-id="${c.id}"><span class="lvl">${c.level}</span><span class="mid"><div class="nm">${esc(c.name)}</div><div class="ds">${c.anc} · Level ${c.level}</div></span><span class="dt">${fmt(c.at)}</span></button>${delBtn(c)}</div>`).join('')).join('');
}
/* ---- C: expanding rows ---- */
function VC(){
  header('');footer();
  if(!list.length){$('body').innerHTML=emptyBlock();return;}
  $('body').innerHTML=recent().map(c=>`<div class="xr ${open===c.id?'on':''}"><button class="h" data-a="toggle" data-id="${c.id}" aria-expanded="${open===c.id}"><span class="chev">›</span><span class="mid"><div class="nm">${esc(c.name)}</div><div class="ds">${desc(c)}</div></span></button>
  ${open===c.id?`<div class="more"><div class="facts"><div><span class="label">Level</span><b>${c.level}</b></div><div><span class="label">Class</span><b>${c.cls}</b></div><div><span class="label">Saved</span><b style="font-size:13px;line-height:1.6">${fmt(c.at)}</b></div></div><div class="acts"><button class="btn" data-a="open" data-id="${c.id}">Select Character</button><button class="ib dim" style="border:1px solid var(--line);border-radius:3px" aria-label="Delete ${esc(c.name)}" data-a="del" data-id="${c.id}">${trash}</button></div></div>`:''}</div>`).join('')+'<p class="hint">Tap a character to see details before opening it.</p>';
}
/* ---- shell ---- */
function render(){
  ({A:VA,B:VB,C:VC})[variant]();
  const v=V.find(v=>v[0]===variant);$('vlabel').textContent=`${v[0]} (${v[1]})`;
  if(deleting){const c=list.find(x=>x.id===deleting);$('phone').insertAdjacentHTML('beforeend',`<div class="scrim"><div class="dlg" role="dialog"><h3>Delete ${esc(c.name)}?</h3><p>This removes the character from this device. Recovery copies are kept separately.</p><div class="a"><button class="txt" data-a="cancel">Cancel</button><button class="btn d c" data-a="confirm">Delete</button></div></div></div>`);}
  $('state').textContent=`Variant ${variant} · ${list.length} of ${SEED.length} sample characters${busy?' · busy (actions disabled)':''}${note?' · last action: '+note:''}`;
}
function setVariant(k){variant=k;const u=new URL(location.href);u.searchParams.set('variant',k);try{history.replaceState(null,'',u);}catch(e){}render();}
const step=d=>{const i=V.findIndex(v=>v[0]===variant);setVariant(V[(i+d+V.length)%V.length][0]);};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');
  if(t){if(t.dataset.t==='count'){ci=(ci+1)%counts.length;list=SEED.slice(0,counts[ci]);}else if(t.dataset.t==='reset'){list=SEED.slice(0,counts[ci]);}else{busy=!busy;}render();return;}
  const el=e.target.closest('[data-a]');if(!el||el.disabled){return;}const a=el.dataset.a,id=+el.dataset.id;
  if(a==='open'){note='opened '+list.find(c=>c.id===id).name;}
  else if(a==='toggle'){open=open===id?null:id;}
  else if(a==='sort'){sort=el.dataset.s;}
  else if(a==='del'){deleting=id;}
  else if(a==='cancel'){deleting=null;}
  else if(a==='confirm'){list=list.filter(c=>c.id!==deleting);deleting=null;note='deleted';}
  else{note=a;}
  render();
});
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)||document.activeElement.isContentEditable){return;}
  if(e.key==='ArrowLeft'){step(-1);}else if(e.key==='ArrowRight'){step(1);}
});
render();
</script></body></html>

<!doctype html>
<!-- THROWAWAY PROTOTYPE: three structurally different start pages for the Android Character Builder.
     Question: what should Home look like now that it is more than a title and one button?
     Variants switch via ?variant=A|B|C or the floating bar (arrow keys also work). Sample data and navigation are in memory only.
     Open directly or `npm run prototype:start`. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modern 4e · Start page prototype</title><style>
:root{--paper:#f3eddf;--ink:#322b25;--dim:#71675c;--line:#c9bda7;--oxblood:#863f36;--wash:#e8ddcb;--green:#4d6b3a;--serif:Georgia,'Times New Roman',serif;--sans:Calibri,'Segoe UI',sans-serif}
*{box-sizing:border-box}
body{margin:0;padding:18px 0 110px;background:#d9d2c3;color:var(--ink);font-family:var(--sans)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border-radius:3px}
button:focus-visible{outline:2px solid var(--oxblood);outline-offset:3px}
h1,h2,h3,p{margin:0;font-weight:normal}
.phone{width:min(410px,100% - 20px);margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 35px #0002;display:flex;flex-direction:column;min-height:760px}
.status{height:30px;padding:10px 22px 0;display:flex;justify-content:space-between;font-size:11px}
.top{height:62px;padding:0 8px 0 20px;display:flex;align-items:center;justify-content:space-between}
.cog{width:48px;height:48px;display:grid;place-items:center;border:0;background:transparent;color:var(--dim)}
.cog svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}
.screen{flex:1;display:flex;flex-direction:column;padding:0 24px 20px}
.gesture{height:25px;display:grid;place-items:center}.gesture i{width:100px;height:4px;background:var(--ink);border-radius:5px}
.overline{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--dim)}
.build{font-size:11px;color:var(--dim);text-align:center;margin-top:auto;padding-top:18px}
.btn{width:100%;min-height:56px;border:1px solid var(--oxblood);background:transparent;color:var(--oxblood);font-size:17px;padding:10px 16px;display:flex;align-items:center;justify-content:center}
.btn.fill{background:var(--oxblood);color:var(--paper)}
.btn.compact{min-height:40px;font-size:14px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.portrait{background:var(--wash);border:1px solid var(--line);display:grid;place-items:center;font:28px var(--serif);color:var(--oxblood)}
.status-chip{font-size:11px;font-weight:bold;color:var(--oxblood)}.ok{color:var(--green)}
.mark{font:normal 44px/1.1 var(--serif);letter-spacing:-1px}.sub{font-size:14px;letter-spacing:.13em;color:var(--dim);margin-top:10px}

/* A: Resume */
.a-head{padding:6px 0 26px}.a-head .mark{font-size:34px}.a-head .sub{font-size:12px;margin-top:6px}
.resume{background:var(--wash);border:1px solid var(--line);border-left:3px solid var(--oxblood);padding:18px;display:flex;flex-direction:column;gap:16px}
.resume .who{display:flex;gap:14px;align-items:center}.resume .portrait{width:78px;height:96px;flex:none}
.resume h2{font:normal 27px/1.15 var(--serif)}.resume small{display:block;color:var(--dim);font-size:13px;margin-top:5px;line-height:1.4}
.a-more{margin-top:26px}.a-more .row2{margin-top:12px}
.a-link{margin-top:14px;border:0;background:transparent;color:var(--oxblood);min-height:48px;font-size:15px;text-align:left;padding:0}

/* B: Shelf */
.b-head{display:flex;align-items:baseline;justify-content:space-between;padding:6px 0 14px;border-bottom:1px solid var(--line)}
.b-head .mark{font-size:28px}.b-head .sub{margin:0;font-size:11px}
.shelf{flex:1;overflow:auto;padding-top:12px}
.card{width:100%;border:1px solid var(--line);background:var(--paper);margin-bottom:6px;padding:8px 12px;display:flex;align-items:center;gap:12px;text-align:left}
.card .portrait{width:38px;height:46px;font-size:17px;flex:none}
.card .nm{font:18px/1.2 var(--serif)}.card small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.card .meta{margin-left:auto;text-align:right;font-size:11px;color:var(--dim);white-space:nowrap}
.empty-note{padding:34px 4px;color:var(--dim);font-size:15px;line-height:1.6}
.empty-note h2{font:normal 24px var(--serif);color:var(--ink);margin-bottom:10px}
.b-foot{padding-top:10px;display:flex;flex-direction:column;gap:8px}

/* C: Cover */
.cover{text-align:center;padding-top:18px}
.emblem{width:84px;height:84px;margin:0 auto 22px;color:var(--oxblood)}.emblem svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1}
.cover .mark{font-size:50px}
.rule{display:flex;align-items:center;gap:12px;margin:30px 0 4px;color:var(--oxblood);font-size:12px}.rule:before,.rule:after{content:'';height:1px;background:var(--line);flex:1}
.ledger{margin-top:6px}
.led{width:100%;border:0;border-top:1px solid var(--line);background:transparent;display:flex;align-items:center;gap:14px;text-align:left;padding:16px 0;min-height:72px}
.led:last-child{border-bottom:1px solid var(--line)}
.led .n{font:22px var(--serif);color:var(--oxblood);width:24px;text-align:center}
.led .t{flex:1}.led .t b{display:block;font:normal 21px var(--serif)}.led .t small{display:block;color:var(--dim);font-size:13px;margin-top:3px}
.led .ar{color:var(--oxblood);font-size:22px}
.attn{margin-top:16px;padding:10px 12px;background:var(--wash);border-left:3px solid var(--oxblood);font-size:13px;color:var(--dim);display:flex;justify-content:space-between;gap:8px;text-align:left}
.attn b{color:var(--oxblood);font-weight:bold}

/* harness */
.tools{width:min(410px,100% - 20px);margin:14px auto 0;display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:#5b5348;align-items:center}
.tools button{border:1px solid #9d927f;background:transparent;padding:6px 10px;min-height:34px}.tools button[aria-pressed=true]{background:#322b25;color:#fff;border-color:#322b25}
.state{width:min(410px,100% - 20px);margin:12px auto 0;border-top:1px solid #9d927f;padding-top:8px;font:11px/1.5 ui-monospace,Consolas,monospace;color:#5b5348;white-space:pre-wrap}
.switcher{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:10px;padding:7px;border-radius:30px;background:#282d35;color:#fff;box-shadow:0 4px 18px #0004;font:13px system-ui,sans-serif}
.switcher button{width:42px;height:42px;border:0;border-radius:50%;background:#444b56;color:#fff;font-size:19px}
.switcher div{min-width:210px;text-align:center}.switcher small{display:block;color:#c6ccd4;font-size:10px;margin-top:3px}
</style></head><body>
<div class="tools" id="tools"></div>
<div class="phone" id="phone"></div>
<div class="state" id="state" aria-live="polite"></div>
<div class="switcher"><button id="prev" aria-label="Previous variant">‹</button><div id="label"></div><button id="next" aria-label="Next variant">›</button></div>
<script>
// Variants: A Resume (continue the last character first), B Shelf (the library lives on Home), C Cover (title page with a ledger of actions).
const ALL=[
  {id:'mv',name:'Mara Vey',lvl:'Level 7 Fighter',date:'21 Nov 2026',left:0,init:'MV'},
  {id:'aa',name:'Aldren Ash',lvl:'Level 3 Wizard',date:'19 Nov 2026',left:2,init:'AA'},
  {id:'sd',name:'Sera Dawn',lvl:'Level 1 Cleric',date:'14 Nov 2026',left:5,init:'SD'},
  {id:'gt',name:'Gruk Thornhide',lvl:'Level 12 Barbarian',date:'02 Nov 2026',left:0,init:'GT'}
];
const VARIANTS=[{k:'A',n:'Resume'},{k:'B',n:'Shelf'},{k:'C',n:'Cover'}];
let count=3;       // 0 = first run, 1, 3, 4 sample characters
let recovery=true; // whether recovery copies exist (shown only in the cabinet in production; surfaced here as a nudge)
const el=id=>document.getElementById(id);
const chars=()=>ALL.slice(0,count);
const cog='<button class="cog" aria-label="Menu" data-go="Open cabinet drawer (Recovery Copies, Settings)"><svg viewBox="0 0 24 24"><path d="m9.5 3-.6 2.3-1.6.9-2.3-.6-2.5 4.3 1.7 1.7v1.8l-1.7 1.7 2.5 4.3 2.3-.6 1.6.9.6 2.3h5l.6-2.3 1.6-.9 2.3.6 2.5-4.3-1.7-1.7v-1.8l1.7-1.7-2.5-4.3-2.3.6-1.6-.9L14.5 3Z"/><circle cx="12" cy="12" r="3.3"/></svg></button>';
const portrait=(c,cls='')=>`<div class="portrait ${cls}" aria-hidden="true">${c.init}</div>`;
const build='<p class="build">Build 21 Nov 2026 14:32</p>';
const btn=(label,go,cls='')=>`<button class="btn ${cls}" data-go="${go}">${label}</button>`;
const left=c=>c.left?`<span class="status-chip">${c.left} to choose</span>`:`<span class="status-chip ok">✓ Complete</span>`;

function A(){
  const c=chars()[0],more=chars().length;
  const head=`<div class="a-head"><h1 class="mark">Modern 4e</h1><p class="sub">CHARACTER BUILDER</p></div>`;
  if(!c){return head+`<div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:40px"><p class="overline" style="margin-bottom:12px">Welcome</p><h2 style="font:27px/1.2 var(--serif);margin-bottom:12px">Start your first character</h2><p style="color:var(--dim);font-size:15px;line-height:1.6;margin-bottom:26px">Create a new Modern 4e hero, or import a character file from another device.</p>${btn('New Character','New character','fill')}<div style="height:12px"></div>${btn('Import Character','Import')}</div>`+build;}
  return head+`<p class="overline" style="margin-bottom:10px">Continue where you left off</p>
  <div class="resume"><div class="who">${portrait(c)}<div><h2>${c.name}</h2><small>${c.lvl}<br>Saved ${c.date}</small><small>${left(c)}</small></div></div>${btn('Continue','Open '+c.name,'fill')}</div>
  <div class="a-more"><p class="overline">Other</p><div class="row2">${btn('New','New character','compact')}${btn('Import','Import','compact')}</div>
  <button class="a-link" data-go="Library page">All characters${more>1?` (${more})`:''} ›</button></div>`+build;
}

function B(){
  const list=chars();
  const head=`<div class="b-head"><h1 class="mark">Modern 4e</h1><p class="sub">CHARACTER BUILDER</p></div>`;
  const body=list.length?`<div class="shelf"><p class="overline" style="margin:4px 0 10px">Your characters · ${list.length}</p>${list.map(c=>`<button class="card" data-go="Open ${c.name}">${portrait(c)}<div><div class="nm">${c.name}</div><small>${c.lvl}</small></div><div class="meta">${left(c)}<br>${c.date}</div></button>`).join('')}</div>`
  :`<div class="shelf"><div class="empty-note"><h2>No characters yet</h2>Create a new character or import a character file to start your collection.</div></div>`;
  return head+body+`<div class="b-foot"><div class="row2">${btn('New','New character','fill')}${btn('Import','Import')}</div>${build.replace('padding-top:18px','')}</div>`;
}

function C(){
  const list=chars(),c=list[0],pending=list.filter(x=>x.left);
  const leftTotal=pending.reduce((s,x)=>s+x.left,0);
  const emblem='<div class="emblem"><svg viewBox="0 0 96 96"><path d="M48 6 86 26v28c0 18-14 32-38 38C24 86 10 72 10 54V26Z"/><path d="M48 18 74 32v21c0 12-9 22-26 27-17-5-26-15-26-27V32Z"/><path d="M48 30v40M34 44h28"/></svg></div>';
  const rows=[];
  if(c){rows.push(['Continue',c.name+' · '+c.lvl,'Open '+c.name]);}
  rows.push(['Characters',list.length?list.length+' saved':'None yet','Library page']);
  rows.push(['New character','Start from a Modern 4e class','New character']);
  rows.push(['Import','Add a character file','Import']);
  return `<div class="cover">${emblem}<h1 class="mark">Modern 4e</h1><p class="sub">CHARACTER BUILDER</p></div>
  <div class="rule">❖</div>
  <div class="ledger">${rows.map((r,i)=>`<button class="led" data-go="${r[2]}"><span class="n">${['I','II','III','IV'][i]}</span><span class="t"><b>${r[0]}</b><small>${r[1]}</small></span><span class="ar">›</span></button>`).join('')}</div>
  ${leftTotal?`<div class="attn"><span><b>${leftTotal} choices</b> waiting across ${pending.length} character${pending.length>1?'s':''}</span><span class="status-chip">Review ›</span></div>`:''}`+build;
}

function readParam(){const v=new URLSearchParams(location.search).get('variant');return VARIANTS.some(x=>x.k===v)?v:'A';}
let variant=readParam(),last='—';
function render(){
  const v=VARIANTS.find(x=>x.k===variant);
  el('phone').innerHTML=`<div class="status" aria-hidden="true"><span>9:41</span><span>▴ ▰</span></div><header class="top"><span></span>${cog}</header><main class="screen">${{A,B,C}[variant]()}</main><div class="gesture" aria-hidden="true"><i></i></div>`;
  el('label').innerHTML=`${v.k} (${v.n})<small>←  →  to switch</small>`;
  el('tools').innerHTML=`<span>Characters:</span>${[0,1,3,4].map(n=>`<button data-count="${n}" aria-pressed="${n===count}">${n}</button>`).join('')}`;
  el('state').textContent=`variant=${variant} (${v.n})\ncharacters=${count}${count?` [${chars().map(c=>c.name+(c.left?` (${c.left} left)`:'')).join(', ')}]`:''}\nlast tap → ${last}`;
}
function setVariant(k){variant=k;const u=new URL(location.href);u.searchParams.set('variant',k);history.replaceState(null,'',u);render();}
function cycle(d){const i=VARIANTS.findIndex(x=>x.k===variant);setVariant(VARIANTS[(i+d+VARIANTS.length)%VARIANTS.length].k);}
el('prev').onclick=()=>cycle(-1);el('next').onclick=()=>cycle(1);
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)||e.target.isContentEditable){return;}if(e.key==='ArrowLeft'){cycle(-1);}if(e.key==='ArrowRight'){cycle(1);}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-count]');if(!t){return;}if(t.dataset.count){count=+t.dataset.count;}else{last=t.dataset.go;}render();});
render();
</script></body></html>

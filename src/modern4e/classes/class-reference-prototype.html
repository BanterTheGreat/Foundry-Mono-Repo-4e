<script>
const ability=s=>`<span class="ability">${s}</span>`;
const armor='Light Armor, Chainmail, Scale, Shields';
const weapons='Simple Melee, Simple Ranged, Military Melee, Military Ranged';
const assign='Assign 5 points across non-main abilities, up to 2 per ability. You may optionally lower an ability to −1 to increase another non-main ability by 1 point, even above the 2-point maximum.';
const extra=`${ability('Constitution')}, ${ability('Dexterity')} or ${ability('Wisdom')}`;
const accuracy=`All Fighter powers use ${ability('Strength')} for accuracy, while sometimes benefitting from ${extra} for extra effects.`;
const allocation=`<div class="allocation"><strong>Assign points</strong><p>${assign}</p></div>`;
const score=`<div class="main-score"><span class="score">4</span><div><strong>${ability('Strength')}</strong><br><small>Main ability · power accuracy</small></div></div>`;
const defenseStats=`<div class="stats">${[['Fortitude','13','STR CON'],['Reflex','11','INT DEX'],['Willpower','11','WIS CHA']].map(([l,n,a])=>`<div class="stat"><span class="stat-label">${l}</span><b>${n}</b><span class="formula">+ ${a.split(' ').map(ability).join(' ')}</span></div>`).join('')}</div>`;
const healthStats=`<div class="stats">${[['Base Health','18',`+ ${ability('CON')} × 2`],['Per Level','7',`× LEVEL`],['Healing Surges','9',`+ ${ability('CON')}`]].map(([l,n,f])=>`<div class="stat"><span class="stat-label">${l}</span><b>${n}</b><span class="formula">${f}</span></div>`).join('')}</div>`;
const proficiency=`<div class="pair"><strong>Armor</strong><span>${armor}</span></div><div class="pair"><strong>Weapons</strong><span>${weapons}</span></div>`;
const mastery=`<section><h2>Melee Weapon Mastery</h2><p>Various Fighter powers come with bonuses if you have certain weapon types equipped. See the table below.</p><table><thead><tr><th>Melee Type</th><th>Ability</th></tr></thead><tbody>${[['Axe','Constitution'],['Flail','Dexterity'],['Hammer','Constitution'],['Heavy Blade','Dexterity'],['Light Blade','Dexterity'],['Mace','Constitution'],['Pick','Constitution'],['Polearm','Wisdom'],['Spear','Dexterity'],['Staff','Constitution']].map(([w,a])=>`<tr><td>${w}</td><td>${ability(a)}</td></tr>`).join('')}</tbody></table></section>`;
const challenge=`<section class="feature"><h2>Combat Challenge</h2><p>In combat, it’s dangerous to ignore The Fighter. Every time you attack an enemy, you can choose to <b>mark</b> that target. The mark lasts until the end of your next turn.</p><p>Additionally, you gain the Combat Challenge power:</p><div class="power"><div class="title">Combat Challenge <span class="right">At-Will</span></div><div class="meta"><span>Martial, Weapon</span><span>Immediate Interrupt ☆</span></div><small>Melee 1</small><p><b>Trigger:</b> Whenever an enemy marked by you is adjacent to you and shifts or makes an attack that does not include you as a target.</p><p><b>Effect:</b> You can make a melee basic attack against that enemy</p></div></section>`;
const reactivity=`<section class="feature"><h2>Reactivity</h2><div class="choice"><span>BUILD CHOICE</span><span>CHOOSE ONE</span></div><p>As a Fighter, you are quick to strike down those who try to escape your reach. Choose one of the options below.</p><small><b>○ COMBAT REACTIVITY</b></small><div class="power"><div class="title">Combat Reactivity <span class="right">At-Will</span></div><div class="meta"><span>Martial, Weapon</span><span>Opportunity Action ☆</span></div><small>Melee weapon</small><p><b>Trigger:</b> An enemy adjacent to you takes an action that provokes an opportunity attack.</p><p><b>Effect:</b> After the triggering enemy completes the action, you shift a number of squares equal to your ${ability('Dexterity')}. You must end the shift closer to the target than you were when you began the shift. Then, make the following attack</p></div></section>`;
const footer='<footer class="footer">104 <span>v1.0.0</span></footer>';
function VariantA(){return `<div class="columns"><aside><div class="panel"><header class="panel-head"><strong>Fighter</strong><span>CLASS REFERENCE</span></header><div class="panel-body"><div class="group"><div class="label">Proficiencies</div>${proficiency}</div><div class="group"><div class="label">Defenses</div>${defenseStats}</div><div class="group"><div class="label">Health</div>${healthStats}</div><div class="group"><div class="label">Abilities</div>${score}<p><small>Extra effects: ${extra}.</small></p>${allocation}</div></div></div><p class="note">Your abilities decide what your character will specialise in. Depending on your playstyle, you will want to focus on different abilities.</p></aside><article>${mastery}${challenge}${reactivity}</article></div>`}
function VariantB(){return `<div class="ribbon-title"><strong>Fighter</strong><span class="label">Class reference</span></div><div class="ribbon"><div><div class="label">Proficiencies</div>${proficiency}</div><div><div class="label">Defenses & health</div>${defenseStats}${healthStats}</div><div><div class="label">Abilities</div>${score}<p><small>Extra effects: ${extra}.</small></p>${allocation}</div></div><div class="columns"><article>${mastery}<p class="note">Your abilities decide what your character will specialise in. Depending on your playstyle, you will want to focus on different abilities.</p></article><article>${challenge.replace('class="feature"','')}${reactivity}</article></div>`}
function VariantC(){return `<div class="columns"><aside class="ledger"><h2 class="ledger-title">Fighter <span class="label">Class reference</span></h2><div class="row"><strong>Armor</strong><p>${armor}</p></div><div class="row"><strong>Weapons</strong><p>${weapons}</p></div><div class="row"><strong>Defenses</strong><div><div class="formula-line"><span>Fortitude</span><strong>13 + ${ability('STR')} ${ability('CON')}</strong></div><div class="formula-line"><span>Reflex</span><strong>11 + ${ability('INT')} ${ability('DEX')}</strong></div><div class="formula-line"><span>Willpower</span><strong>11 + ${ability('WIS')} ${ability('CHA')}</strong></div></div></div><div class="row"><strong>Health</strong><div><div class="formula-line"><span>Base Health</span><strong>18 + ${ability('CON')} × 2</strong></div><div class="formula-line"><span>Per Level</span><strong>7 × LEVEL</strong></div><div class="formula-line"><span>Healing Surges</span><strong>9 + ${ability('CON')}</strong></div></div></div><div class="row"><strong>Main ability</strong><div><strong>${ability('Strength')} · 4 points</strong><span class="sub">${accuracy}</span></div></div>${allocation}<p class="note">Your abilities decide what your character will specialise in. Depending on your playstyle, you will want to focus on different abilities.</p></aside><article>${mastery}${challenge}${reactivity}</article></div>`}
const bannerAbilities=`<div class="banner-group banner-abilities"><div class="label">Abilities</div><div class="ability-primary"><strong>${ability('Strength')}</strong><span class="points-badge">4 points</span></div><span class="ability-caption">Main ability · accuracy for all Fighter powers</span><div class="secondary-abilities"><span class="ability-caption">Depending on the power, extra effects use:</span><ul><li>${ability('Constitution')}</li><li>${ability('Dexterity')}</li><li>${ability('Wisdom')}</li></ul></div><h3 class="assign-heading">Assigning 5 Points</h3><div class="assign-summary">Distribute <strong>5 points</strong> across non-main abilities.<br>Maximum <strong>2 points</strong> per ability.</div><p class="optional-rule"><strong>Optional:</strong> Lower an ability to −1 to increase another non-main ability by 1 point, even above the 2-point maximum.</p></div>`;
function VariantD(){return `<div class="banner-layout"><aside class="class-banner"><div class="label">Class reference</div><div class="banner-title">Fighter</div><div class="banner-group"><div class="label">Proficiencies</div><p><strong>Armor</strong><br>${armor}</p><p><strong>Weapons</strong><br>${weapons}</p></div><div class="banner-group"><div class="label">Defenses</div>${[['Fortitude','13','STR','CON'],['Reflex','11','INT','DEX'],['Willpower','11','WIS','CHA']].map(([l,n,a,b])=>`<div class="banner-row"><span>${l}</span><strong>${n} + ${ability(a)} ${ability(b)}</strong></div>`).join('')}</div><div class="banner-group"><div class="label">Health</div><div class="banner-row"><span>Base Health</span><strong>18 + ${ability('CON')} × 2</strong></div><div class="banner-row"><span>Per Level</span><strong>7 × LEVEL</strong></div><div class="banner-row"><span>Healing Surges</span><strong>9 + ${ability('CON')}</strong></div></div>${bannerAbilities}</aside><article>${mastery}${challenge}${reactivity}</article></div>`}
// Only the ability presentation changes; D's banner, feature column, and assignment rules stay shared.
function withAbilityStudy(content){const assignment=bannerAbilities.slice(bannerAbilities.indexOf('<h3 class="assign-heading">')).replace('<h3 class="assign-heading">Assigning 5 Points</h3>','<section class="required-allocation" aria-label="Required ability point assignment"><span class="required-label">Required</span><h3 class="assign-heading">Assign 5 Points</h3>').replace('</p></div>','</p></section></div>');return VariantD().replace(bannerAbilities,`<div class="banner-group banner-abilities"><div class="label">Abilities</div>${content}${assignment}`)}
function VariantD1(){return withAbilityStudy(`<div class="ability-study"><div class="ability-hero"><span class="hero-number">4</span><span class="study-label">Main ability</span><span class="hero-name">Strength</span><span class="study-caption">All power accuracy</span><span class="hero-points">starting points</span></div><div class="study-label support-heading">Extra-effect abilities</div><div class="ability-support">${[['CON','Constitution'],['DEX','Dexterity'],['WIS','Wisdom']].map(([short,name])=>`<div><strong>${short}</strong><small>${name}</small></div>`).join('')}</div><p class="study-caption">The ability used depends on the power.</p></div>`)}
function VariantD2(){return withAbilityStudy(`<div class="ability-study"><div class="study-label">Main ability</div><div class="ability-ledger"><div class="main-entry"><strong>Strength</strong><span>4 points</span></div><span class="ledger-label">Used for all power accuracy</span></div><div class="study-label support-heading">Extra-effect abilities</div><div class="ability-ledger"><div><span>Constitution</span><strong>CON</strong></div><div><span>Dexterity</span><strong>DEX</strong></div><div><span>Wisdom</span><strong>WIS</strong></div></div><p class="study-caption">The ability used depends on the power.</p></div>`)}
function VariantD3(){return withAbilityStudy(`<div class="ability-study prose-abilities"><p class="main-sentence"><strong>Strength</strong><br>starts at <strong>4 points.</strong></p><span class="study-caption">Your main ability, used for accuracy with every Fighter power.</span><p class="extra-sentence">For extra effects, powers may also use <strong>Constitution</strong>, <strong>Dexterity</strong> or <strong>Wisdom</strong>.</p></div>`)}
function VariantNarrow(){return VariantD3().replace('class="banner-layout"','class="banner-layout narrow-banner"').replace(`<article>${mastery}${challenge}${reactivity}</article>`,`<article class="class-content-grid"><div>${mastery}${challenge}</div><div>${reactivity}</div></article>`)}
function VariantRequiredStep(){return VariantNarrow().replace('class="required-allocation"','class="required-allocation allocation-alternative allocation-step"').replace('<span class="required-label">Required</span><h3 class="assign-heading">Assign 5 Points</h3>','<div class="step-title"><span class="step-marker">1</span><span class="required-label">Required step</span><h3 class="assign-heading">Assign 5 Points</h3></div>')}
function VariantRequiredInline(){return VariantNarrow().replace('class="required-allocation"','class="required-allocation allocation-alternative allocation-inline"').replace('<span class="required-label">Required</span>','<span class="required-label">Required · character setup</span>')}
const variants={D3:{name:'Base · 30%',render:VariantD3,verdict:'D3 · 30% banner with the current required-assignment treatment. The standalone snapshot preserves the earlier layout exactly.'},TEST:{name:'Original required panel',render:VariantNarrow,verdict:'TEST · Previous pale-box treatment, kept for comparison. 23% banner with two class-content columns.'},TEST1:{name:'Required step',render:VariantRequiredStep,verdict:'TEST1 · A small numbered marker and “Required step” introduce the assignment. The text stays directly on the dark banner, with no contrasting box.'},TEST2:{name:'Underlined instruction',render:VariantRequiredInline,verdict:'TEST2 · “Required · character setup” sits above an underlined “Assign 5 Points” heading. A compact typographic treatment that matches the banner.'}};
function selectedVariant(){const requested=new URL(location.href).searchParams.get('variant');return variants[requested]?requested:'TEST'}
let key=selectedVariant();
function render(){document.querySelector('#page').innerHTML=variants[key].render()+footer;document.querySelector('#verdict').textContent=variants[key].verdict;document.querySelector('#current').innerHTML=`${key} · ${variants[key].name}<small>PROTOTYPE · ${Object.keys(variants).indexOf(key)+1} / ${Object.keys(variants).length} · ← →</small>`;document.title=`${key} — ${variants[key].name} · Fighter prototype`}
function cycle(delta){const keys=Object.keys(variants);key=keys[(keys.indexOf(key)+delta+keys.length)%keys.length];const url=new URL(location.href);url.searchParams.set('variant',key);history.replaceState(null,'',url);render()}
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});window.addEventListener('popstate',()=>{key=selectedVariant();render()});render();
</script>
</html>

<!doctype html><html><head><meta charset="utf-8"><title>Deva layout prototype</title><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#222);font-family:system-ui,sans-serif}.intro{font-size:14px;line-height:1.5;margin:0 0 16px}.intro p{margin:6px 0}.paper{background:#f0f6f6;color:#172526;padding:28px!important;border-radius:var(--radius,8px);font-family:Georgia,serif}.paper h1{font-size:34px;letter-spacing:1px;margin:0 0 6px}.kicker{font:11px system-ui;letter-spacing:2px;text-transform:uppercase;color:#527477;margin-bottom:22px}h2{font-size:21px;margin:22px 0 12px;border-bottom:2px solid #527477;padding-bottom:7px}article{break-inside:avoid;margin:0 0 12px;font-size:13px;line-height:1.48}article h3{font-size:15px;line-height:1.25;margin:0;padding:7px 9px;background:#d9e5e5}article h3:before{content:'○ ';font-weight:normal}article p{margin:0;padding:7px 9px 9px}article .req{font:600 11px/1.4 system-ui;color:#375b60;padding:7px 9px 0}.a .flow{columns:3;column-gap:18px}.a article{border:1px solid #c0d3d5;background:#e7f0f0}.b .flow{columns:2;column-gap:26px}.b article{border-top:1px solid #b5cccc;padding:9px 0}.b article h3{background:none;padding:0;font-size:17px}.b article p{padding:6px 0}.b article .req{padding:6px 0 0}.c article{display:grid;grid-template-columns:185px 1fr;border-bottom:1px solid #b5cccc;padding:12px 0;margin:0;gap:14px}.c article h3{background:none;padding:0}.c article p{padding:0}.c article .req{padding:6px 0 0}.c .flow{columns:auto}.footer{font:10px system-ui;color:#527477;display:flex;justify-content:space-between;border-top:1px solid #b5cccc;margin-top:22px;padding-top:10px}.switcher{position:sticky;bottom:12px;display:flex;align-items:center;justify-content:center;gap:12px;background:#192d30;color:white;border-radius:32px;padding:10px 14px;margin:18px auto 12px;width:max-content;max-width:100%;box-shadow:0 4px 18px #0003;font:13px system-ui}.switcher button{background:#fff2;color:white;border:1px solid #ffffff50;border-radius:50%;width:32px;height:32px;cursor:pointer}.switcher span{min-width:215px;text-align:center}.state{font-size:12px;color:var(--muted-foreground,#666);margin:10px 0}@media(max-width:520px){.paper{padding:16px!important}.a .flow{columns:2;column-gap:12px}.b .flow{columns:1}.c article{grid-template-columns:1fr;gap:6px}.paper h1{font-size:28px}article{font-size:12px}}@media print{.intro,.switcher,.state{display:none}.paper{border-radius:0}}
</style></head><body><div class="intro"><strong>Which layout makes feats easier to browse?</strong><p>Throwaway prototype · Same 16 heroic feats and requirements · Layout only</p><p id="verdict"></p></div><div class="paper" id="paper"></div><div class="state" id="state"></div><nav class="switcher" aria-label="Prototype variants"><button id="prev" aria-label="Previous layout">←</button><span id="label"></span><button id="next" aria-label="Next layout">→</button></nav><script>
const feats=[{"title": "Auspicious Lineage", "req": "", "text": "When you use your memory of a thousand lifetimes racial power, you add 1d8 to the triggering roll, instead of 1d6."}, {"title": "Battle Intuition", "req": "", "text": "You can use your Wisdom in place of your Dexterity to determine your initiative bonus. Additionally, you gain a +2 feat bonus to initiative checks."}, {"title": "Heavenly Heritage", "req": "2 Wisdom", "text": "When you take cold damage or fire damage, you gain a number of temporary hit points equal to your Wisdom."}, {"title": "Immortal Skill", "req": "", "text": "When using memory of a thousand lifetimes to modify a skill check or ability check, you treat a result that is lower than the average for the die you roll\u20143 for d6 or 4 for d8\u2014as the average."}, {"title": "Potent Rebirth", "req": "", "text": "When you drop to 0 hit points or fewer, you gain a +2 bonus to attack rolls and damage rolls until the end of the encounter."}, {"title": "Radiant Power", "req": "", "text": "When you make an implement attack, you can take a -2 penalty to the attack roll. If you do so and the attack hits, it deals 2 extra radiant damage. The extra radiant damage increases to 4 at 11th level and 6 at 21st level."}, {"title": "Upright Revival", "req": "", "text": "If you drop to 0 or fewer hit points and fall unconscious, when you regain 1 or more hit points and become conscious, you stand and shift 1 square as a free action."}, {"title": "Magic of the Ages", "req": "any arcane class", "text": "When you use your memory of a thousand lifetimes racial power to add to the attack roll of an arcane power, you gain a +1 bonus to the triggering roll."}, {"title": "Astral Elixir", "req": "artificer, shielding elixir power", "text": "Shielding Elixir also grants radiant resistance of the same value and duration as its usual resistance. Its target may end the effect as a free action when making a saving throw to add 1d6 to that save, replacing the usual benefit for ending the elixir."}, {"title": "Astral Enmity", "req": "avenger, oath of enmity power", "text": "When Memory of a Thousand Lifetimes boosts an attack against your Oath of Enmity target, that attack also deals extra damage equal to the bonus rolled."}, {"title": "Astral Preservation", "req": "invoker, Covenant of Preservation", "text": "Using Preserver's Rebuke gives allies within 2 squares +1 to all defenses against bloodied attackers for the rest of the encounter."}, {"title": "Eternal Void Memories", "req": "assassin", "text": "When Memory of a Thousand Lifetimes improves an attack roll, its target also takes damage equal to your Dexterity, in addition to the attack's other effects."}, {"title": "Immortal Warding", "req": "swordmage, Swordmage Warding", "text": "Swordmage Warding stays active while you are unconscious. Its AC bonus also increases both resistances from your Astral Resistance trait by that amount."}, {"title": "Memory of a Thousand Battles", "req": "fighter", "text": "After a reliable fighter power misses all its targets, you may expend Memory of a Thousand Lifetimes to reroll all of that power's attack rolls."}, {"title": "Remembered Wizardry", "req": "2 Wisdom, wizard", "text": "For each level of wizard daily attack powers and wizard utility powers you know, add one extra power of each kind to your spellbook. Whenever you gain access to a new level of either kind, learn one additional power of that kind and level. Your daily preparation limits stay the same."}, {"title": "Shared Memories", "req": "warlord", "text": "As a free action, expend Memory of a Thousand Lifetimes to add 1d6 to an adjacent ally's attack roll, saving throw, or skill check."}];
const variants=[{key:'A',name:'Independent columns',note:'Closest to the book. Each column flows independently, eliminating gaps under short cards. Read down each column; cards remain intact.'},{key:'B',name:'Two-column reading',note:'Wider lines and quieter separators make long mechanics easier to read. Uses more vertical space; may need another printed page.'},{key:'C',name:'Reference rows',note:'A consistent title lane makes names and prerequisites easy to scan. Full-width mechanics trade the familiar card format for a reference-book structure.'}];
let index=Math.max(0,variants.findIndex(v=>v.key===new URLSearchParams(location.search).get('variant')));
function card(f){return `<article><header><h3>${f.title}</h3>${f.req?`<div class="req">Requires: ${f.req}</div>`:''}</header><p>${f.text}</p></article>`}
function render(){const v=variants[index];document.getElementById('paper').className='paper '+v.key.toLowerCase();document.getElementById('paper').innerHTML='<h1>DEVA FEATS</h1><div class="kicker">Ancestry options · Heroic tier</div><h2>Heroic Feats</h2><div class="flow">'+feats.slice(0,7).map(card).join('')+'</div><h2>Heroic Class Feats</h2><div class="flow">'+feats.slice(7).map(card).join('')+'</div><div class="footer"><span>DND4: Death to CBLoader Edition</span><span>Layout study · Heroic feats</span></div>';document.getElementById('label').textContent=v.key+' · '+v.name;document.getElementById('verdict').textContent=v.note;document.getElementById('state').textContent='Variant '+v.key+' / 3 · 7 general + 9 class feats · Text unchanged · Use ← → to compare. Browser spacing is illustrative; final pagination needs Typst validation.';try{const u=new URL(location.href);u.searchParams.set('variant',v.key);history.replaceState(null,'',u)}catch{}console.log('Variant',v.key,'feats',feats.length,'rendered',document.querySelectorAll('article').length)}
function cycle(n){index=(index+n+3)%3;render()}document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}});render();
</script></body></html>

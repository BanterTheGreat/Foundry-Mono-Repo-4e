const image=()=>`<img class="art" src="${art}" alt="Elf character illustration from the rulebook">`;const foot='<div class="footer"><span>DND4 · DEATH TO CBLOADER EDITION</span><span>ANCESTRIES / ELF</span></div>';const title='<div class="eyebrow">ANCESTRIES</div><h1>Elf</h1>';
function VariantA(){return `<aside class="rail">${title}${image()}${stats}</aside><div class="body">${traits}${choice}${p1}${p2}</div>${foot}`}
function VariantB(){return `${title}${stats}<div class="hero">${traits}${image()}</div><div class="bottom">${choice}<div class="powers">${p1}${p2}</div></div>${foot}`}
function VariantC(){return `<div class="heading">${title}<span>Wild Step · Group Awareness</span></div>${stats}<div class="left">${traits}${choice}${p1}${p2}</div>${image()}${foot}`}
const variants={A:VariantA,B:VariantB,C:VariantC};const descriptions={A:'A · Portrait sidebar — artwork and attributes form a continuous left rail; all rules read down the right.',B:'B · Illustrated folio — traits sit beside the illustration; a full-width choice band groups both powers below.',C:'C · Table reference — attributes scan across the top; traits and powers form one reading column beside a tall portrait.'};let current=new URLSearchParams(location.search).get('variant')||'A';if(!variants[current])current='A';

function cycle(d){current=['A','B','C'][(Object.keys(variants).indexOf(current)+d+3)%3];render()}document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.querySelector('#picker').onchange=e=>{current=e.target.value;render()};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});window.addEventListener('resize',resize);render();

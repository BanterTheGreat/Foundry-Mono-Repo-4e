<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#e9e7e2}button{font:inherit;cursor:pointer} .stage{background:#191c20;padding:24px;border-radius:12px;min-height:600px}.window{background:#25282d;border:1px solid #494b4f;border-radius:9px;overflow:hidden;box-shadow:0 16px 40px #0005}.title{padding:12px 18px;background:#303338;display:flex;justify-content:space-between;color:#c7c8ca;font-size:12px}.content{padding:22px}h1{font-size:23px;margin:0 0 8px}p{line-height:1.5;color:#adafb5;margin:6px 0 20px}.context{font-size:12px;color:#b9bac1;margin-bottom:16px}.badge{font-size:11px;font-weight:700;padding:4px 7px;background:#314b3d;color:#a5dfb8;border-radius:4px;display:inline-block}.card{background:#2e3238;border:1px solid #444951;border-radius:7px;padding:15px;margin:10px 0}.card h2{font-size:17px;margin:0 0 10px}.facts{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:4px 7px;background:#21252a;border-radius:4px;color:#c5c9d1;font-size:12px}.rules{margin:10px 0 0;color:#d0d2d6;font-size:13px}.foot{border-top:1px solid #42464d;padding:16px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.foot small{margin-right:auto;color:#aeb2b9}.btn{border:1px solid #555b64;background:transparent;color:#e2e4e8;padding:9px 14px;border-radius:5px}.primary{background:#b8d5bd;color:#18291c;border-color:#b8d5bd;font-weight:650}.raw{margin-top:16px;color:#aab0ba;font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;background:#191d22;padding:12px;border-radius:5px;color:#bbc5cf}.switch{display:flex;justify-content:center;align-items:center;gap:16px;margin:18px auto 0;padding:8px;background:#111418;border:1px solid #4a5058;border-radius:30px;max-width:330px}.switch button{background:none;border:0;color:#dfdfdf;padding:5px 10px}.switch span{font-size:12px}.rail{display:grid;grid-template-columns:185px 1fr;gap:20px}.navbtn{display:block;width:100%;text-align:left;padding:13px 10px;background:none;border:0;border-left:3px solid transparent;color:#abb0b8}.navbtn.active{background:#343c38;border-color:#b8d5bd;color:white}.detail{padding:8px 0}dl{display:grid;grid-template-columns:100px 1fr;gap:13px;font-size:13px}dt{color:#9da5b0}dd{margin:0}.matrix{width:100%;border-collapse:collapse;margin:20px 0}.matrix td,.matrix th{text-align:left;padding:14px 9px;border-bottom:1px solid #42464d;font-size:12px}.matrix th{color:#9fa6b1;font-weight:500}.rowname{font-size:14px!important;font-weight:600}.note{background:#303930;border-left:3px solid #91b597;padding:12px;font-size:12px;color:#c9d8cc;margin-top:18px}#state{font-size:12px;color:#b6c3b9;text-align:center;margin:13px 0 0}.eyebrow{font-size:11px;letter-spacing:1.4px;color:#9eb7a4;margin-bottom:9px}@media(max-width:540px){.stage{padding:16px}.content{padding:16px}.rail{grid-template-columns:1fr}.rail nav{display:flex}.navbtn{font-size:11px;padding:9px}.matrix td,.matrix th{padding:10px 4px;font-size:10px}.foot{padding:14px 16px}}
</style></head><body><!-- Throwaway prototype: three ways to review Foundry MCP changes. No live mutations. --><div class="stage"><div class="window"><div class="title"><span>FOUNDRY MCP <span style="color:#838b96"> / Review changes</span></span><span>×</span></div><main id="main"></main><footer class="foot"><small>Nothing saved yet · Review expires in 1:48</small><button class="btn" onclick="act(false)">Cancel</button><button class="btn primary" onclick="act(true)">Add 3 powers</button></footer></div><div class="switch"><button onclick="cycle(-1)" aria-label="Previous design">←</button><span id="label"></span><button onclick="cycle(1)" aria-label="Next design">→</button></div><div id="state">Interactive prototype · No Foundry changes</div></div><script>
const powers=[{name:"Close Burst 1",range:"Close burst 1",type:"closeBurst",size:"1",distance:"1",shape:"Burst",target:"Each creature in the burst"},{name:"Close Blast 3",range:"Close blast 3",type:"closeBlast",size:"3",distance:"3",shape:"Blast",target:"Each creature in the blast"},{name:"Area Burst 1 within 10",range:"Area burst 1 within 10 squares",type:"rangeBurst",size:"1",distance:"10",shape:"Burst",target:"Each creature in the burst"}];
const names=["A · Power cards","B · Master & detail","C · Compact ledger"];let variant=new URLSearchParams(location.search).get("variant")||"A",selected=0;
const header='<div class="eyebrow">TEST JOHN · PLAYER CHARACTER</div><h1>Add three test powers</h1><p>Three new at-will powers for testing area targeting.</p>';
function raw(){return '<details class="raw"><summary>Inspect source data</summary><pre>'+JSON.stringify(powers.map(p=>({name:p.name,system:{rangeType:p.type,area:p.size,rangePower:p.distance,target:p.target,useType:"atwill",actionType:"standard",attack:{isAttack:false},hit:{isDamage:false}}})),null,2)+'</pre></details>'}
function card(p){return '<article class="card"><h2>'+p.name+' <span class="badge" style="float:right">NEW</span></h2><div class="facts"><span class="chip">At-will</span><span class="chip">Standard action</span><span class="chip">'+p.range+'</span></div><div class="rules"><b>Target</b> '+p.target+'</div></article>'}
function render(){let body=header;
if(variant==="A"){body+='<div class="context">3 additions · Existing powers stay as they are</div>'+powers.map(card).join('')+'<div class="note">Targeting only. These powers have no attack or damage rolls.</div>'+raw()}
else if(variant==="B"){let p=powers[selected];body+='<div class="rail"><nav>'+powers.map((p,i)=>'<button class="navbtn '+(i===selected?'active':'')+'" onclick="pick('+i+')"><span style="font-size:10px;color:#9dc7a9">+ NEW POWER</span><br>'+p.name+'</button>').join('')+'</nav><div class="detail"><span class="badge">NEW POWER</span><h2 style="font-size:20px">'+p.name+'</h2><dl><dt>Usage</dt><dd>At-will</dd><dt>Action</dt><dd>Standard</dd><dt>Range</dt><dd>'+p.range+'</dd><dt>Target</dt><dd>'+p.target+'</dd><dt>Attack roll</dt><dd>None</dd><dt>Damage roll</dt><dd>None</dd><dt>Chat card</dt><dd>Automatic</dd></dl><div class="note">No existing power will be replaced.</div></div></div>'+raw()}
else{body+='<div class="context"><span class="badge">+ 3 ADDITIONS</span> &nbsp; 0 edits · 0 removals</div><table class="matrix"><thead><tr><th>New power</th><th>Area</th><th>Range</th><th>Targets</th></tr></thead><tbody>'+powers.map(p=>'<tr><td class="rowname">'+p.name+'</td><td>'+p.shape+' '+p.size+'</td><td>'+(p.type==="rangeBurst"?'10 squares':'Self')+'</td><td>Each creature</td></tr>').join('')+'</tbody></table><div class="card"><b>Shared settings</b><div class="facts" style="margin-top:12px"><span class="chip">At-will</span><span class="chip">Standard action</span><span class="chip">Automatic chat cards</span></div><div class="rules">No attack rolls · No damage rolls</div></div>'+raw()}
document.getElementById('main').innerHTML='<div class="content">'+body+'</div>';document.getElementById('label').textContent=names[variant.charCodeAt(0)-65];document.getElementById('state').textContent='Interactive prototype · Variant '+variant+' · No Foundry changes';console.log({variant,selected,powers})}
function cycle(d){variant=String.fromCharCode(65+(variant.charCodeAt(0)-65+d+3)%3);try{history.replaceState(null,"","?variant="+variant)}catch{}render()}
function pick(i){selected=i;render()}function act(ok){document.getElementById('state').textContent=ok?'Demo: 3 powers added to Test John.':'Demo: cancelled. Nothing saved.'}
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowRight')cycle(1);if(e.key==='ArrowLeft')cycle(-1)});if(!['A','B','C'].includes(variant))variant='A';render();
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:14px system-ui;color:var(--foreground,#eee)}p{color:var(--muted-foreground,#aaa);line-height:1.45}h3{margin:0 0 6px}.controls{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0}label{display:flex;align-items:center;gap:8px}input{width:100px;accent-color:#d3ba7d}button,select{background:var(--secondary,#292d32);color:inherit;border:1px solid var(--border,#555);padding:7px 10px;border-radius:7px;font:inherit}.map{position:relative;overflow:hidden;border-radius:8px}.map img{display:block;width:100%}.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.switch{position:relative;display:flex;align-items:center;gap:12px;width:max-content;margin:16px auto 8px;padding:7px;background:#1e252d;color:#eee;border:1px solid #72716c;border-radius:30px;box-shadow:0 4px 18px #0005}.switch button{border-radius:24px}.state{font:12px monospace;color:var(--muted-foreground,#aaa);margin-top:10px}#description{min-height:40px}button:focus-visible{outline:2px solid gold}

<!-- Throwaway: three diagonal stripe treatments on the user's map; ?variant=A/B/C. -->
<h3>Diagonal stripes instead of solid fills</h3><p>Transparent gaps between fine gold and blue stripes. Same map and soft B borders; no solid colour wash.</p>
<div class="controls"><label>Normal <input id="normal" type="range" min="0" max="60" value="25"><output id="nv"></output></label><label>Long <input id="long" type="range" min="0" max="60" value="20"><output id="lv"></output></label><button id="toggle">Show original</button><label><input id="labels" type="checkbox" checked style="width:auto">Labels</label></div>
<div class="map"><img src="C:/Users/Imre/.t3/userdata/attachments/87c518cc-74a6-4b34-a1ba-09454ba6bec2-bcfb4d70-095c-4ab1-a069-95ab40b0eab6.png" alt="User supplied room map"><svg viewBox="0 0 1307 1049" aria-label="Normal and long range preview">
<defs><pattern id="goldStripes" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V18" stroke="#f5d787" stroke-width="1.5"/></pattern><pattern id="blueStripes" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V18" stroke="#9fc5e4" stroke-width="1.5"/></pattern><mask id="band"><rect x="351" y="18" width="588" height="588" fill="white"/><rect x="519" y="186" width="252" height="252" fill="black"/></mask>
<linearGradient id="warm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5d787" stop-opacity=".7"/><stop offset="1" stop-color="#f5d787"/></linearGradient>
<radialGradient id="edge" r=".7"><stop offset=".3" stop-color="#f5d787" stop-opacity=".3"/><stop offset="1" stop-color="#f5d787"/></radialGradient></defs>
<g id="overlay"><rect id="blue" x="351" y="18" width="588" height="588" fill="#9fc5e4" mask="url(#band)"/><rect id="gold" x="519" y="186" width="252" height="252" fill="#f5d787"/>
<g id="borders" fill="none"><rect class="outer dark" x="351" y="18" width="588" height="588" stroke="#15191b" stroke-width="5" stroke-dasharray="8 6"/><rect class="outer" x="351" y="18" width="588" height="588" stroke="#9fc5e4" stroke-width="2" stroke-dasharray="8 6"/><rect class="inner dark" x="519" y="186" width="252" height="252" stroke="#15191b" stroke-width="5"/><rect class="inner" x="519" y="186" width="252" height="252" stroke="#f5d787" stroke-width="2"/></g>

</svg></div>
<p id="description"></p><div id="state" class="state"></div>
<div class="switch"><button id="prev" aria-label="Previous variant">←</button><span id="name"></span><button id="next" aria-label="Next variant">→</button></div>
<script>
const names=['A · Fine stripes','B · Airy stripes','C · Opposing stripes'],desc=[
'Fine diagonal lines, spaced 18 map pixels apart. Opacity affects the lines only; every gap stays transparent.',
'Wider spacing leaves more artwork untouched. Same thin lines and colours, spaced 30 map pixels apart.',
'Normal and long range slope in opposite directions. This adds a second cue beyond colour without crosshatching either region.'];
const $=s=>document.querySelector(s);let v=Math.max(0,['A','B','C'].indexOf(new URLSearchParams(location.search).get('variant')||'A')),original=false;
function update(){const n=$('#normal').value,l=$('#long').value;$('#nv').textContent=n+'%';$('#lv').textContent=l+'%';$('#gold').setAttribute('fill','url(#goldStripes)');$('#blue').setAttribute('fill','url(#blueStripes)');for(const id of ['#goldStripes','#blueStripes']){$(id).setAttribute('width',v===1?30:18);$(id).setAttribute('height',v===1?30:18);$(id+' path').setAttribute('d','M0 0V'+(v===1?30:18));}$('#blueStripes').setAttribute('patternTransform',v===2?'rotate(-45)':'rotate(45)');$('#gold').setAttribute('opacity',n/100);$('#blue').setAttribute('opacity',l/100);
document.querySelectorAll('.dark').forEach(e=>e.style.display='none');document.querySelectorAll('.inner:not(.dark),.outer:not(.dark)').forEach(e=>{e.setAttribute('stroke-width','1.5');e.setAttribute('opacity','.75')});$('#tags').style.display=$('#labels').checked?'':'none';$('#overlay').style.display=original?'none':'';$('#toggle').textContent=original?'Show stripes':'Show original';$('#name').textContent=names[v];$('#description').textContent=desc[v];$('#state').textContent='PROTOTYPE · '+names[v]+' · normal '+n+'% · long '+l+'% · labels '+($('#labels').checked?'on':'off')+' · '+(original?'original map':'range visible');
try{const u=new URL(location.href);u.searchParams.set('variant',['A','B','C'][v]);history.replaceState({},'',u)}catch{}}
function cycle(d){v=(v+d+3)%3;update()}$('#prev').onclick=()=>cycle(-1);$('#next').onclick=()=>cycle(1);$('#normal').oninput=update;$('#long').oninput=update;$('#labels').onchange=update;$('#toggle').onclick=()=>{original=!original;update()};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});update();
</script></body></html>

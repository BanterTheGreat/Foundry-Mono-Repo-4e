<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font-family:var(--font-sans,Arial);color:var(--foreground,#eee);margin:0;padding-bottom:78px}h2{font-size:18px;margin:0 0 8px}p{font-size:13px;color:var(--muted-foreground,#aaa);line-height:1.5;margin:0 0 18px}.stage{background:#19191d;border-radius:12px;padding:20px;max-width:440px;margin:auto}.caption{font-size:10px;letter-spacing:2px;color:#999;text-transform:uppercase;margin-bottom:12px}.card{--tone:#ed9b9b;--wash:#39292e;background:#28282e;color:#ece8df;border:1px solid #4a4548;border-radius:5px;margin:6px 0;overflow:hidden}.hit{--tone:#9dd5b0;--wash:#25372f}.crit{--tone:#f5d080;--wash:#3d3425}.badge{font:bold 11px Arial;letter-spacing:1px;color:var(--tone);display:inline-block}.meta{font-size:12px;color:#c5beb4}.who{font-size:12px;color:#b6b0a7}.power{font-size:14px;font-weight:bold}.total{font-size:29px;font-weight:800;line-height:1;text-align:center}.total small{font-size:8px;letter-spacing:1px;display:block;margin-top:5px;color:#b6b0a7}.penalty{display:inline-block;font-size:10px;border:1px solid #74645c;border-radius:3px;padding:2px 5px;margin-top:7px;color:#d6c5b9}.a{border-left:5px solid var(--tone);padding:12px}.a .top{display:flex;flex-wrap:wrap;gap:7px;justify-content:space-between;align-items:center;margin-bottom:8px}.a .badge{background:var(--wash);padding:5px 8px;border-radius:3px}.a .line{display:flex;justify-content:space-between;align-items:center}.b{display:grid;grid-template-columns:1fr 64px}.b .main{padding:12px}.b .outcome{font-size:25px;font-weight:900;color:var(--tone);letter-spacing:1px;margin-bottom:7px}.b .score{display:flex;align-items:center;justify-content:center;background:var(--wash);border-left:1px solid #494348}.b .meta{margin-top:5px}.c{display:grid;grid-template-columns:37px 1fr 40px;gap:9px;padding:12px 9px;align-items:center;border:0;border-bottom:1px solid #4a4548;border-radius:0;margin:0;background:transparent}.c .symbol{color:var(--tone);font-size:24px;text-align:center}.c .power{font-size:12px}.c .badge{margin-bottom:5px}.c .total{font-size:23px}.c .who{margin-top:5px;font-size:11px}.switcher{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#eee;color:#18181c;padding:8px;border-radius:40px;box-shadow:0 4px 20px #0006;white-space:nowrap;font-size:12px}.switcher button{border:0;background:#29292e;color:white;border-radius:50%;width:30px;height:30px;cursor:pointer}.notes{max-width:440px;margin:16px auto 0;font-size:12px;line-height:1.5;color:var(--muted-foreground,#aaa)}button:focus-visible{outline:3px solid #75aaff}
</style></head><body><h2 id="title"></h2><p id="desc"></p><div class="stage"><div class="caption">Chat Â· Eldritch Strike</div><div id="cards"></div></div><div class="notes" id="note"></div><div class="switcher"><button onclick="cycle(-1)" aria-label="Previous design">â†</button><span id="label"></span><button onclick="cycle(1)" aria-label="Next design">â†’</button></div><script>
/* Throwaway prototype: three attack-result hierarchies, switchable via ?variant=A/B/C. Sample outcomes only. */
const variants=['A','B','C'];const names=['Outcome badge','Outcome first','Compact combat log'];const descriptions=['Closest to the current card. A colored edge and explicit badge make the result easy to scan; the total stays secondary.','Give the result the most space. A large outcome word leads each card, with the roll total in its own narrow column.','Reduce repeated prose. A symbol column creates a visual rhythm for scanning a busy chat.'];const notes=['Recommended starting point: clear outcomes without making chat cards much taller. The modifier stays separate from the result.','Strongest emphasis on hit or miss. More visual weight per attack, especially when several attacks arrive together.','Densest option. Best for many attacks; explicit labels keep the symbols understandable.'];const data=[['miss','MISS','Ã—',24],['hit','HIT','âœ“',28],['crit','CRITICAL HIT','âœ¦',34]];
let current=variants.indexOf(new URLSearchParams(location.search).get('variant'));if(current<0)current=0;
function render(){const v=variants[current];document.getElementById('title').textContent=v+' Â· '+names[current];document.getElementById('desc').textContent=descriptions[current];document.getElementById('note').textContent=notes[current]+' Prototype only; these use the same example results as your screenshot.';document.getElementById('label').textContent=v+' / 3 Â· '+names[current];document.getElementById('cards').innerHTML=data.map(([kind,label,symbol,total])=>{const score='<div class="total">'+total+'<small>TOTAL</small></div>';const modifier=kind==='miss'?'<div class="penalty">âˆ’2 Prone</div>':'';if(v==='A')return '<div class="card a '+kind+'"><div class="top"><span class="badge">'+symbol+' '+label+'</span><span class="who">Ozyn Valder â†’ Rogal</span></div><div class="line"><div><div class="power">Eldritch Strike</div>'+modifier+'</div>'+score+'</div></div>';if(v==='B')return '<div class="card b '+kind+'"><div class="main"><div class="outcome">'+label+'</div><div class="power">Eldritch Strike</div><div class="meta">Ozyn Valder â†’ Rogal</div>'+modifier+'</div><div class="score">'+score+'</div></div>';return '<div class="card c '+kind+'"><div class="symbol">'+symbol+'</div><div><div class="badge">'+label+'</div><div class="power">Eldritch Strike</div><div class="who">Ozyn Valder â†’ Rogal</div>'+modifier+'</div>'+score+'</div>';}).join('');}
function cycle(n){current=(current+n+3)%3;try{const url=new URL(location.href);url.searchParams.set('variant',variants[current]);history.replaceState(null,'',url);}catch(e){}render();}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowRight')cycle(1);if(e.key==='ArrowLeft')cycle(-1);});render();
</script></body></html>

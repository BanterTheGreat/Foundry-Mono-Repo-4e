<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:var(--foreground,#eee);margin:0;padding-bottom:76px}h2{font-size:19px;margin:0 0 8px}p{font-size:13px;color:var(--muted-foreground,#aaa);line-height:1.5;margin:0 0 16px}.layout{display:flex;gap:28px;align-items:flex-start}.chat{background:#191a1c;padding:16px;border-radius:10px;width:324px;flex-shrink:0}.card{border:1px solid #72736a;border-left:4px solid #a6c6a9;border-radius:5px;background:linear-gradient(110deg,#303835,#29292d);margin-bottom:3px;color:#bcdcc4}.row{display:flex;align-items:center;gap:12px;padding:11px 10px}.name{font-size:13px;font-weight:750;line-height:1.4;flex:1}.sub{font-size:10px;color:#bdbbb0;font-weight:normal;margin-top:4px}.total{text-align:center;min-width:34px}.num{font-family:'Arial Narrow',Arial,sans-serif;font-stretch:condensed;font-size:28px;font-weight:bold;line-height:1}.label{font-size:7px;letter-spacing:1px;color:#c4c1b6;margin-top:5px}.chev{color:#bbb8af}.crit{color:#ebd18b;border-color:#ae9c62;border-left-color:#ebd18b;background:linear-gradient(110deg,#38372c,#29292d)}.miss{color:#dbafaa;border-color:#8c6664;border-left-color:#bd8580;background:linear-gradient(110deg,#39302e,#29292d)}.damage{color:#e6e0d3;border-color:#77756d;border-left-color:#c6b893;background:linear-gradient(110deg,#37352f,#29292d)}button{cursor:pointer;font:inherit}.actions{display:flex;gap:6px;padding:0 10px 10px}.actions button{flex:1;border:1px solid #777367;border-radius:3px;padding:7px 5px;font-size:11px;font-weight:bold;color:#e8e2d6;background:#3b3b38}.actions button:first-child{background:#c1b18c;color:#242522;border-color:#c1b18c}.detail{border-top:1px solid #ffffff16;padding:9px 10px;color:#bbb8ad;font-size:10px}.note{flex:1;min-width:170px;padding-top:6px}.note strong{font-size:13px}.note ul{padding-left:18px;font-size:13px;line-height:1.7;color:var(--muted-foreground,#aaa)}.hero{display:flex;align-items:center;gap:14px;padding:14px 12px}.hero .num{font-size:42px}.type{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#c6b893;margin-bottom:6px}.merge{border-top:1px solid #7b796a;padding:12px 10px;display:flex;align-items:center;gap:10px}.merge .name{font-size:11px}.merge button{border:1px solid #8d8268;background:#c1b18c;color:#252522;border-radius:3px;padding:6px 8px;font-size:10px}.switch{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#e9e5db;color:#202323;box-shadow:0 4px 20px #0006;border-radius:30px;display:flex;align-items:center;padding:5px;gap:8px;white-space:nowrap}.switch button{background:#272d2c;color:white;border:0;border-radius:50%;width:32px;height:32px}.switch span{font-size:12px;min-width:185px;text-align:center}.feedback{font-size:10px;color:#d1c6ac;min-height:12px;margin:8px 0 0}.tag{font-size:10px;letter-spacing:1px;color:var(--muted-foreground,#aaa);margin-bottom:10px}@media(max-width:560px){.layout{flex-direction:column;gap:14px}.chat{width:100%;max-width:340px}.note{padding:0}.note ul{margin-top:8px}}
.damage{margin-top:9px;border-color:#659da7;border-left-color:#8edce9;background:linear-gradient(110deg,#263c44,#292c32);color:#e2f5f6}.damage .num{color:#a6e8f1}.damage .label{color:#a6d9e0}.damage .row{padding-top:9px}.damage-kind{font-size:9px;font-weight:bold;letter-spacing:1.7px;color:#a6e8f1;margin-bottom:5px}.actions button:first-child{background:#91d0da;border-color:#91d0da;color:#182c30}.actions button{background:#30434a;border-color:#66848c}.rail{display:flex;border-top:1px solid #709ca85c;background:#203139;border-radius:0 0 4px 0}.rail button{border:0;background:transparent;color:#c9ecf0;flex:1;padding:9px 5px;font-size:11px;font-weight:bold}.rail button+button{border-left:1px solid #709ca85c}.rail button:hover{background:#44616a}.tool{display:flex;align-items:center;border-top:1px solid #709ca85c;padding:8px 10px;gap:5px}.tool .choice{border:1px solid #617f86;background:#25353c;color:#b9d6dc;font-size:10px;padding:6px 7px}.tool .selected{background:#567e87;color:#fff}.tool .apply{margin-left:auto;border:1px solid #91d0da;background:#91d0da;color:#182c30;border-radius:3px;padding:6px 12px;font-size:11px;font-weight:bold}.rail button:focus-visible,.tool button:focus-visible{outline:2px solid white;outline-offset:-3px}

.damage{--ink:#e9dfce;--edge:#8b8275;--wash:#383632;--footer:#2d2b29;margin-top:9px;color:#eee6d9;border:1px solid var(--edge);border-left:4px solid var(--ink);background:linear-gradient(110deg,var(--wash),#292a30 75%)}.damage .num,.damage .label,.damage-kind{color:var(--ink)}.rail{background:var(--footer);border-color:var(--edge)}.rail button{color:#e8e1d7}.rail button+button{border-color:var(--edge)}.rail button:hover{background:#ffffff12}.band{display:flex;align-items:center;gap:7px;padding:6px 10px;border-bottom:1px solid var(--edge);background:#ffffff05;font-size:10px;font-weight:bold;letter-spacing:1.5px;color:var(--ink)}.glyph{width:13px;height:13px;flex:0 0 13px}.score-tile{border:1px solid var(--edge);border-radius:3px;padding:7px 6px;background:#ffffff05;min-width:53px}.score-tile .label{font-size:8px;letter-spacing:.5px}.result-left{display:flex;gap:11px;align-items:center;padding:12px 10px}.result-left .total{padding-right:11px;border-right:1px solid var(--edge);min-width:68px}.result-left .num{font-size:34px}.result-left .label{font-size:9px}.inline-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink);margin-bottom:4px}.damage.no-rail{border-left-width:1px;border-top:3px solid var(--ink)}.damage .chev{border:0;background:transparent;padding:0;cursor:pointer;font-size:17px}.formula{border-top:1px solid var(--edge);padding:9px 10px;font-size:11px;color:#c5beb3}.palette{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 17px}.palette button{padding:6px 9px;border:1px solid var(--border,#666);border-radius:4px;background:transparent;color:inherit;font-size:11px}.palette button[aria-pressed=true]{background:var(--secondary,#444);outline:1px solid var(--foreground,#ddd)}.micro{font-size:11px}.note p{margin-top:8px}.damage .name{font-size:13px}
.attack-left{display:flex;gap:11px;align-items:center;padding:11px 10px}.attack-left .total{width:68px;flex:0 0 68px;border-right:1px solid #ffffff35;padding-right:11px}.attack-left .label{color:inherit;font-size:9px;font-weight:bold;letter-spacing:.8px}.attack-left .num{font-size:34px}.verdict-top .label{margin:0 0 4px}.verdict-top .num{font-size:29px}.target-first .name{font-size:13px}.context{font-size:10px;color:#c5beb3;margin-top:3px;font-weight:normal}.fumble{color:#dbafaa;border-color:#8c6664;border-left-color:#bd8580;background:linear-gradient(110deg,#39302e,#29292d)}.chip{display:inline-block;font-size:9px;border:1px solid #689b6c;border-radius:3px;padding:2px 4px;margin-top:5px;color:#bdd4b8}.mini-details{padding:8px 10px;border-top:1px solid #ffffff25;font-size:11px;color:#ccc}.card summary{list-style:none;cursor:pointer}.card summary::-webkit-details-marker{display:none}

.verdict-block{flex:0 0 76px;width:76px;padding-right:9px;border-right:1px solid #ffffff30;text-align:center}.verdict{font-size:17px;font-weight:800;line-height:1.2;letter-spacing:.1px}.support-total{font-size:10px;line-height:1.4;color:#bcb9b1;margin-top:6px;font-weight:normal}.attack-left .name{font-size:12px;line-height:1.4}.quiet-score{align-self:center;text-align:center;color:#bcb9b1;flex:0 0 26px}.quiet-score strong{display:block;font-size:14px;font-weight:400}.quiet-score small{display:block;font-size:6px;letter-spacing:.5px;margin-top:2px}.attack-left{gap:9px;min-height:68px}.headline{display:grid;grid-template-columns:auto minmax(0,1fr) 26px 8px;gap:7px;align-items:start}.headline .verdict-block{width:auto;max-width:none;border:0;padding:0;text-align:left}.headline .verdict{font-size:17px;line-height:1.2}.headline .name{padding-top:1px}.headline .quiet-score{align-self:start}.headline .chev{align-self:center}
.fumble .verdict{font-size:14px;letter-spacing:0}
/* One shared result column and type treatment for attacks and damage. */
.attack-left,.result-left{display:grid;grid-template-columns:88px minmax(0,1fr) 10px;gap:10px;padding:11px 10px;align-items:center;min-height:72px}
.verdict-block,.result-left .total{width:auto;min-width:0;max-width:none;flex:initial;padding:0 10px 0 0;border-right:1px solid #ffffff35;text-align:center}
.verdict,.fumble .verdict,.result-left .num{font-family:'Arial Narrow',Arial,sans-serif;font-size:19px;font-weight:600;letter-spacing:0;line-height:1.2}
.support-total,.result-left .label{font-family:Arial,sans-serif;font-size:10px;font-weight:400;letter-spacing:0;line-height:1.4;margin:6px 0 0;color:#bcb9b1}
.attack-left .name,.result-left .name{font-size:12px;font-weight:600;line-height:1.4}.headline .verdict-block{width:auto}.headline .name{padding-top:0}
.support-total{font-size:11px}</style></head><body><div class="tag">THROWAWAY PROTOTYPE · SIMULATED ACTIONS</div><h2 id="title"></h2><p>Long-name check · same layout, spacing and type as the saved version.</p><div class="layout"><div class="chat" id="chat"></div><div class="note" id="note"></div></div><div class="switch"><button id="prev" aria-label="Previous variant">←</button><span id="variant"></span><button id="next" aria-label="Next variant">→</button></div><script>
const keys=['E1'],names=['E1 · Long names'];
let v=new URLSearchParams(location.search).get('variant')||'E1';if(!keys.includes(v))v='E1';
const data=[['HIT',22,'Ekossiggan Of Winter',''],['CRIT',29,'Ekossiggan Of Winter','crit'],['MISS',12,'Ekossiggan Of Winter','miss'],['FUMBLE',8,'Ekossiggan Of Winter','fumble'],['HIT',22,'Ekossiggan Of Winter','']];
function score(n,label){if(label==='DAMAGE')return '<div class="total"><div class="num">'+n+'</div><div class="label">DAMAGE</div></div>';return '<div class="verdict-block"><div class="verdict">'+label+'</div>'+(v==='E1'?'<div class="support-total">Total '+n+'</div>':'')+'</div>'}
function render(){let i=0;document.getElementById('title').textContent=names[i];document.getElementById('variant').textContent=names[i];
document.getElementById('chat').innerHTML=data.map(([verdict,n,target,cls],idx)=>'<div class="card '+cls+'"><details><summary class="attack-left '+(i===2?'headline':'')+'">'+score(n,verdict)+'<div class="name">'+(i===2?target:'Ozyn Valder → '+target)+'<div class="sub">'+(i===2?'Ozyn Valder · ':'')+'Icy End of the Earth</div>'+(idx===4?'<span class="chip">+2 Bless</span>':'')+'</div>'+(i!==0?'<div class="quiet-score"><strong>'+n+'</strong><small>TOTAL</small></div>':'')+'<span class="chev">›</span></summary><div class="mini-details">Preview roll details · total '+n+' · stored outcome '+verdict+'</div></details></div>').join('')+'<div class="card damage"><div class="result-left">'+score(10,'DAMAGE')+'<div class="name">Ozyn Valder<div class="sub">Icy End of the Earth</div></div><span class="chev">›</span></div><div class="rail"><button data-amount="10">Apply Damage</button><button data-amount="5">Half Damage</button></div></div><div class="feedback" id="feedback">Prototype · no attack changes installed</div>';
const descriptions=[
['One shared layout','Attack and damage use the same result-column width, divider, font, weight and context alignment.','The primary value is the verdict for attacks and the amount for damage. The supporting line is the attack total or the DAMAGE label.'],
['Separate result from arithmetic','The left block contains only the verdict. A small total at the far right can be checked when needed.','Clear separation, but the narrower context column wraps longer names.'],
['Read it as a result headline','The verdict and target form the first reading line. Actor and power are quieter beneath; the total sits to the right.','A more sentence-like result, with less of a dashboard-column feel.']
][i];
document.getElementById('note').innerHTML='<strong>Long-name check</strong><p>Ozyn Valder → Ekossiggan Of Winter</p><p>Icy End of the Earth</p><p>The original card width and typography are preserved. Names wrap naturally; the left result column and chevrons stay aligned.</p><p>The final hit includes a modifier chip to show the denser case.</p><p class="micro">State: five attacks · one damage result · no module changes.</p>';
document.querySelectorAll('[data-amount]').forEach(b=>b.onclick=()=>document.getElementById('feedback').textContent='Simulated: apply '+b.dataset.amount+' damage.');
console.log('Attack prototype',v);
}
function cycle(d){v=keys[(keys.indexOf(v)+d+1)%1];try{history.replaceState(null,'','?variant='+v)}catch(e){}render()}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></body></html>

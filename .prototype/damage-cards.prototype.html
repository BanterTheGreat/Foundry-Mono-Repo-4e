<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:var(--foreground,#eee);margin:0;padding-bottom:76px}h2{font-size:19px;margin:0 0 8px}p{font-size:13px;color:var(--muted-foreground,#aaa);line-height:1.5;margin:0 0 16px}.layout{display:flex;gap:28px;align-items:flex-start}.chat{background:#191a1c;padding:16px;border-radius:10px;width:324px;flex-shrink:0}.card{border:1px solid #72736a;border-left:4px solid #a6c6a9;border-radius:5px;background:linear-gradient(110deg,#303835,#29292d);margin-bottom:3px;color:#bcdcc4}.row{display:flex;align-items:center;gap:12px;padding:11px 10px}.name{font-size:13px;font-weight:750;line-height:1.4;flex:1}.sub{font-size:10px;color:#bdbbb0;font-weight:normal;margin-top:4px}.total{text-align:center;min-width:34px}.num{font-family:'Arial Narrow',Arial,sans-serif;font-stretch:condensed;font-size:28px;font-weight:bold;line-height:1}.label{font-size:7px;letter-spacing:1px;color:#c4c1b6;margin-top:5px}.chev{color:#bbb8af}.crit{color:#ebd18b;border-color:#ae9c62;border-left-color:#ebd18b;background:linear-gradient(110deg,#38372c,#29292d)}.miss{color:#dbafaa;border-color:#8c6664;border-left-color:#bd8580;background:linear-gradient(110deg,#39302e,#29292d)}.damage{color:#e6e0d3;border-color:#77756d;border-left-color:#c6b893;background:linear-gradient(110deg,#37352f,#29292d)}button{cursor:pointer;font:inherit}.actions{display:flex;gap:6px;padding:0 10px 10px}.actions button{flex:1;border:1px solid #777367;border-radius:3px;padding:7px 5px;font-size:11px;font-weight:bold;color:#e8e2d6;background:#3b3b38}.actions button:first-child{background:#c1b18c;color:#242522;border-color:#c1b18c}.detail{border-top:1px solid #ffffff16;padding:9px 10px;color:#bbb8ad;font-size:10px}.note{flex:1;min-width:170px;padding-top:6px}.note strong{font-size:13px}.note ul{padding-left:18px;font-size:13px;line-height:1.7;color:var(--muted-foreground,#aaa)}.hero{display:flex;align-items:center;gap:14px;padding:14px 12px}.hero .num{font-size:42px}.type{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#c6b893;margin-bottom:6px}.merge{border-top:1px solid #7b796a;padding:12px 10px;display:flex;align-items:center;gap:10px}.merge .name{font-size:11px}.merge button{border:1px solid #8d8268;background:#c1b18c;color:#252522;border-radius:3px;padding:6px 8px;font-size:10px}.switch{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#e9e5db;color:#202323;box-shadow:0 4px 20px #0006;border-radius:30px;display:flex;align-items:center;padding:5px;gap:8px;white-space:nowrap}.switch button{background:#272d2c;color:white;border:0;border-radius:50%;width:32px;height:32px}.switch span{font-size:12px;min-width:185px;text-align:center}.feedback{font-size:10px;color:#d1c6ac;min-height:12px;margin:8px 0 0}.tag{font-size:10px;letter-spacing:1px;color:var(--muted-foreground,#aaa);margin-bottom:10px}@media(max-width:560px){.layout{flex-direction:column;gap:14px}.chat{width:100%;max-width:340px}.note{padding:0}.note ul{margin-top:8px}}
</style></head><body><div class="tag">THROWAWAY PROTOTYPE · SIMULATED ACTIONS</div><h2 id="title"></h2><p>How should damage belong to the same visual family as attack rolls?</p><div class="layout"><div class="chat" id="chat"></div><div class="note" id="note"></div></div><div class="switch"><button id="prev" aria-label="Previous variant">←</button><span id="variant"></span><button id="next" aria-label="Next variant">→</button></div><script>
const names=['A · Matching card','B · Damage spotlight','C · Combined result'];
const row=(name,n,cls='')=>'<div class="card '+cls+'"><div class="row"><div class="name">Ozyn Valder '+name+'<div class="sub">Dire Radiance</div></div><div class="total"><div class="num">'+n+'</div><div class="label">TOTAL</div></div><span class="chev">›</span></div></div>';
const attacks=()=>row('Hit Badger (5)',22)+row('Critically Hit Badger (1)',29,'crit')+row('Hit Badger (2)',17)+row('Missed Badger (4)',12,'miss')+row('Hit Badger (3)',22);
const actions=()=>'<div class="actions"><button data-amount="10">Apply damage</button><button data-amount="5">Half · 5</button></div>';
let v=new URLSearchParams(location.search).get('variant')||'A';
function render(){let i=Math.max(0,['A','B','C'].indexOf(v));v=['A','B','C'][i];document.getElementById('variant').textContent=names[i];document.getElementById('title').textContent=names[i];let content,notes;
if(v==='A'){content=attacks()+'<div class="card damage"><div class="row"><div class="name">Ozyn Valder deals damage<div class="sub">Dire Radiance</div></div><div class="total"><div class="num">10</div><div class="label">DAMAGE</div></div><span class="chev">›</span></div>'+actions()+'</div>';notes='<strong>Recommended · preserve the rhythm</strong><ul><li>Same border, inset, number alignment and title hierarchy.</li><li>Muted warm accent distinguishes damage from hit, crit and miss.</li><li>Inset actions replace the brown edge-to-edge strip.</li><li>Show the half value before applying it.</li></ul>'}
if(v==='B'){content=attacks()+'<div class="card damage"><div class="row"><div class="name">Ozyn Valder<div class="sub">Dire Radiance</div></div></div><div class="hero"><div class="num">10</div><div><div class="type">Damage</div><div class="sub">Ready to apply</div></div></div>'+actions()+'</div>';notes='<strong>Make damage a distinct next step</strong><ul><li>Larger total becomes the focal point.</li><li>Actor and power move into a quiet header.</li><li>Shared surface and borders keep it related.</li><li>Tradeoff: taller and less like the attack rows.</li></ul>'}
if(v==='C'){content=row('Hit Badger (5)',22)+row('Critically Hit Badger (1)',29,'crit')+row('Hit Badger (2)',17)+row('Missed Badger (4)',12,'miss')+'<div class="card"><div class="row"><div class="name">Ozyn Valder Hit Badger (3)<div class="sub">Dire Radiance</div></div><div class="total"><div class="num">22</div><div class="label">TOTAL</div></div><span class="chev">›</span></div><div class="merge damage"><div class="total"><div class="num">10</div><div class="label">DAMAGE</div></div><div class="name">Damage result<div class="sub">Linked to this attack</div></div><button data-amount="10">Apply</button><button data-amount="5">Half · 5</button></div></div>';notes='<strong>Explore a combined result</strong><ul><li>Damage becomes a second row of its attack.</li><li>Remove repeated actor and power labels.</li><li>Most compact relationship between roll and action.</li><li>Requires reliable attack linkage; shared multi-target rolls need a different grouping.</li></ul>'}
document.getElementById('chat').innerHTML=content+'<div class="feedback" id="feedback">Preview only · no Foundry changes</div>';document.getElementById('note').innerHTML=notes+'<p>Visible state: variant '+v+' · total 10 · half 5 · unapplied. Roll details would expand from the chevron.</p>';document.querySelectorAll('[data-amount]').forEach(b=>b.onclick=()=>document.getElementById('feedback').textContent='Simulated: '+b.dataset.amount+' damage applied.');console.log('Prototype variant',v)}
function cycle(d){v=['A','B','C'][(['A','B','C'].indexOf(v)+d+3)%3];try{history.replaceState(null,'','?variant='+v)}catch(e){}render()}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></body></html>

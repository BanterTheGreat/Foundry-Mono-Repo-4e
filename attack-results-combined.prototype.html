<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#e9e5dc}.stage{max-width:332px;background:#19191c;padding:16px;border-radius:12px;margin:auto}.card{--edge:#df9090;--tint:#493035;display:grid;grid-template-columns:minmax(0,1fr) 74px;min-height:66px;background:#28282c;border:1px solid #655b57;border-left:4px solid var(--edge);border-radius:4px;overflow:hidden;margin-bottom:4px}.card:last-child{margin-bottom:0}.hit{--edge:#93c7a4;--tint:#2d4236}.crit{--edge:#e8c574;--tint:#493e28}.content{padding:11px 7px}.heading{font-family:'Arial Narrow',Arial,sans-serif;font-stretch:condensed;font-size:12px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}.power{font-size:10px;color:#beb6ab;font-weight:600;margin-top:6px}.modifier{font-size:9px;font-weight:bold;border:1px solid #a77a65;border-radius:3px;display:inline-block;padding:3px 5px;margin-top:6px}.score{background:var(--tint);display:flex;align-items:center;justify-content:center;gap:13px;padding:8px 6px}.number{font-family:Impact,'Arial Narrow',sans-serif;font-stretch:condensed;font-size:28px;line-height:1;text-align:center}.total{font:bold 7px Arial;letter-spacing:1px;color:#bfb7ac;margin-top:5px}.chevron{font-size:22px;color:#c4bbae}.note{color:var(--muted-foreground,#999);font:12px/1.5 Arial;max-width:332px;margin:12px auto 0}
</style></head><body><!-- Throwaway prototype: retain existing attack-card hierarchy; add outcome left border and tinted total panel. --><div class="stage"><div class="card"><div class="content"><div class="heading">Ozyn Valder Missed Rogal</div><div class="power">Eldritch Strike</div><div class="modifier">−2 Prone</div></div><div class="score"><div><div class="number">24</div><div class="total">TOTAL</div></div><span class="chevron">›</span></div></div><div class="card hit"><div class="content"><div class="heading">Ozyn Valder Hit Rogal</div><div class="power">Eldritch Strike</div></div><div class="score"><div><div class="number">28</div><div class="total">TOTAL</div></div><span class="chevron">›</span></div></div><div class="card crit"><div class="content"><div class="heading">Ozyn Valder Critically Hit Rogal</div><div class="power">Eldritch Strike</div></div><div class="score"><div><div class="number">34</div><div class="total">TOTAL</div></div><span class="chevron">›</span></div></div></div><div class="note">Muted red for misses, green for hits, gold for critical hits. Existing wording, modifier, total, and chevron stay in place.</div></body></html>
